**\uD6A8\uC775\uC740 \uBCF4\uC774\uAC8C \uB9CC\uB4E4\uC5B4\uC57C \uD310\uC815\uB41C\uB2E4.** "\uC774\uD574\uAC00 \uC26C\uC6CC\uC9C4\uB2E4"\uB294 \uC8FC\uC7A5\uC774 \uC544\uB2C8\uB77C, \uD654\uBA74\uC5D0\uC11C \uBB34\uC5C7\uC774 **\uBCF4\uC774\uAC8C** \uB418\uC5B4 \uC0AC\uC6A9\uC790\uC758 \uACFC\uC5C5(\uC774\uD574\xB7\uBE44\uAD50\xB7\uACB0\uC815\xB7\uACF5\uC720)\uC774 \uBE68\uB77C\uC9C0\uB294\uC9C0\uB97C **\uD6A8\uC775 \uC9C0\uD45C**\uB85C \uC801\uB294\uB2E4(\u2192 L1 S2 \uD6A8\uC775 \uC2DC\uAC01\uD654). \uC608: "3\uCD08 \uC548\uC5D0 \uB0B4 \uC704\uCE58\uB97C \uC548\uB2E4", "\uB2E4\uB978 \uC0AC\uB78C\uACFC \uC5B4\uB514\uAC00 \uB2E4\uB978\uC9C0 \uD55C \uD654\uBA74\uC5D0\uC11C \uBE44\uAD50\uD55C\uB2E4". \`[\uC81C\uC548]\` v0.5

**\u2462\uC774 \uC5C6\uC73C\uBA74 \uB2E4\uB984\uC740 \uB9CC\uB4E0 \uC0AC\uB78C\uC758 \uAC83\uC774\uB2E4.** \uD574\uC11D\uC774 \uD1B5\uC0C1\uACFC \uB2E4\uB974\uAE30\uB9CC \uD558\uACE0 \uC0AC\uC6A9\uC790\uAC00 \uC5BB\uB294 \uAC83\uC774 \uC5C6\uB2E4\uBA74, \uADF8 \uC7AC\uD574\uC11D\uC740 N1(\uCC28\uBCC4\uC744 \uC704\uD55C \uCC28\uBCC4)\uACFC \uAC19\uC740 \uC790\uB9AC\uC5D0 \uC788\uB2E4. \u2462\uC740 L1 S2 \uC7AC\uD574\uC11D \uD45C\uC758 \`\uC0AC\uC6A9\uC790\uAC00 \uC5BB\uB294 \uAC83\` \uCE78\uC73C\uB85C \uD310\uC815\uD55C\uB2E4.

> **\uC0C8\uB85C\uC6C0\uC740 \uC7A5\uC2DD\xB7\uB514\uD14C\uC77C\uC774 \uC544\uB2C8\uB77C UI/UX \uD574\uC11D\uACFC \uC811\uADFC \uBC29\uC2DD\uC5D0\uC11C \uB098\uC628\uB2E4.**

**\u2461\uC758 \uBE44\uAD50 \uB300\uC0C1\uC740 \uAE30\uB85D\uB418\uC5B4 \uC788\uC5B4\uC57C \uD55C\uB2E4.** \uD1B5\uC0C1\uC801 \uD574\uC11D\uC740 L1 S2 \uD328\uD134 \uC7AC\uD574\uC11D\uC5D0\uC11C \uBC18\uB300 \uB300\uC0C1 \uD45C\uAE30 \uD615\uC2DD(\xA74.2)\uC73C\uB85C \uC801\uB294\uB2E4. \uAE30\uB85D\uC774 \uC5C6\uC73C\uBA74 "\uBB34\uC5C7\uACFC \uB2E4\uB978\uAC00"\uC5D0 \uB2F5\uD560 \uC218 \uC5C6\uC73C\uBBC0\uB85C \u2461\uB294 \uD310\uC815 \uBD88\uAC00 \u2014 \uC2E4\uD328\uB85C \uBCF8\uB2E4.

**\u2461\uC758 \uC810\uAC80 \u2014 \uAC77\uC5B4\uB0B4\uAE30.** \uC7A5\uC2DD\xB7\uB514\uD14C\uC77C(\uC9C8\uAC10\xB7\uADF8\uB9BC\uC790\xB7\uC77C\uB7EC\uC2A4\uD2B8\xB7\uC7A5\uC2DD\uC801 \uBAA8\uC158)\uC744 \uAC77\uC5B4\uB0B8 \uC0C1\uD0DC\uC5D0\uC11C\uB3C4 \uD574\uC11D\uC758 \uCC28\uBCC4\uC774 \uC131\uB9BD\uD558\uB294\uC9C0 \uBCF8\uB2E4. \uAC77\uC5B4\uB0B4\uC790 \uD1B5\uC0C1\uC801 \uD574\uC11D\uACFC \uAC19\uC544\uC9C4\uB2E4\uBA74, \uC0C8\uB85C\uC6C0\uC740 \uD574\uC11D\uC774 \uC544\uB2C8\uB77C \uC7A5\uC2DD\uC5D0 \uC788\uC5C8\uB2E4.

\uC774 \uBB38\uC11C\uC5D0 \uC801\uD78C \uB354\uD504\uB86C\uC758 \uAC83\uB4E4 \u2014 \uC774\uB984\uC758 \uC11C\uC0AC("\uB098\uB85C\uBD80\uD130"), 1U\uC640 \uB85C\uACE0 \uD615\uC0C1, \uBE0C\uB79C\uB4DC \uCEEC\uB7EC, airplane\xB7tunnel \u2014 \uC740 **\uC6B0\uB9AC\uAC00 \uC5B4\uB5BB\uAC8C \uD310\uB2E8\uD558\uB294\uAC00**\uB97C \uC815\uD55C\uB2E4. **\uD074\uB77C\uC774\uC5B8\uD2B8 \uACB0\uACFC\uBB3C\uC5D0 \uBB34\uC5C7\uC744 \uADF8\uB9AC\uB294\uAC00**\uB97C \uC815\uD558\uC9C0 \uC54A\uB294\uB2E4.

| \uCE35\uC704 | \uC4F0\uB294 \uACF3 | \uC4F0\uC9C0 \uC54A\uB294 \uACF3 |
|---|---|---|

| \uB354\uD504\uB86C\uC758 \uC5BC\uAD74 (\uB85C\uACE0 \uD615\uC0C1\xB7\uBE0C\uB79C\uB4DC \uCEEC\uB7EC\xB7\uC11C\uC0AC) | \uB354\uD504\uB86C \uC790\uC0AC \uC0B0\uCD9C\uBB3C | **\uD074\uB77C\uC774\uC5B8\uD2B8 \uACB0\uACFC\uBB3C\uC758 \uBAA8\uD2F0\uD504\xB7\uBA54\uD0C0\uD3EC\xB7\uD314\uB808\uD2B8** |

\uACB0\uACFC\uBB3C\uC5D0\uC11C \uB354\uD504\uB86C\uC774 \uBCF4\uC778\uB2E4\uBA74 \uADF8\uAC83\uC740 \uBC29\uBC95\uC774 \uC798 \uC791\uB3D9\uD55C \uD754\uC801\uC774 \uC544\uB2C8\uB77C, \uBC29\uBC95\uC774 \uACB0\uACFC\uBB3C\uC5D0 \uC0C8\uC5B4 \uB098\uAC04 \uAC83\uC774\uB2E4. \uC88B\uC740 \uACB0\uACFC\uBB3C\uC5D0\uC11C \uB354\uD504\uB86C\uC740 **\uD310\uB2E8\uC758 \uC9C8**\uB85C\uB9CC \uB4DC\uB7EC\uB09C\uB2E4(\u2192 N7).

> **\uC6B0\uC120\uC21C\uC704** \u2014 \uD310\uB2E8\uC774 \uBD80\uB52A\uD788\uBA74 **\uC0AC\uC6A9\uC790 \uACBD\uD5D8\uACFC \uC870\uD615 \uC644\uC131\uB3C4\uAC00 \uBC29\uBC95\uB860\uC758 \uD615\uC2DD\uBCF4\uB2E4 \uC55E\uC120\uB2E4.** \uBC29\uBC95\uB860\uC740 \uC88B\uC740 \uB514\uC790\uC778\uC5D0 \uB3C4\uB2EC\uD558\uAE30 \uC704\uD55C \uC7A5\uCE58\uC774\uACE0, \uD615\uC2DD\uC744 \uC9C0\uD0A4\uB290\uB77C \uACB0\uACFC\uAC00 \uB098\uBE60\uC9C0\uBA74 \uD615\uC2DD\uC774 \uD2C0\uB9B0 \uAC83\uC774\uB2E4(\u2192 \xA76.7).`,tunnel:`## 5. Tunnel Effect \u2014 \uD130\uB110

### 5.1 \uC815\uC758

\uC5EC\uD589\uC5D0\uC11C \uC5BB\uC740 \uAC83\uB4E4\uC744 \uB4E4\uACE0 **\uC5B4\uB450\uC6B4 \uD130\uB110\uC5D0 \uC9C4\uC785**\uD55C\uB2E4. \uD130\uB110 \uC548\uC5D0\uC11C \uD0C0\uAC9F\xB7\uBE0C\uB79C\uB4DC \uD2B9\uC131\uACFC \uC18C\uBE44\uC790 \uC774\uC6A9(UX) \uAD00\uC810\uC744 **\uB808\uC774\uC5B4\uB9C1**\uD574, **\uBC1D\uC740 \uCD9C\uAD6C**\uB97C \uCC3E\uB294\uB2E4.

### 5.2 \uD130\uB110\uC774 \uC5B4\uB450\uC6B4 \uC774\uC720

\uC9C4\uC785 \uC2DC\uC810\uC5D0 \uC815\uB2F5\uC774 \uC5C6\uAE30 \uB54C\uBB38\uC774\uB2E4. \uC0AC\uC870\uB97C \uBA87 \uAC1C \uACE8\uB790\uB2E4\uB294 \uAC83\uB9CC\uC73C\uB85C\uB294 \uC544\uBB34\uAC83\uB3C4 \uACB0\uC815\uB418\uC9C0 \uC54A\uB294\uB2E4. \uD130\uB110 \uC548\uC758 \uC791\uC5C5\uC740 **\uB808\uC774\uC5B4\uB97C \uACB9\uCCD0 \uC815\uB2F5\uC758 \uBC94\uC704\uB97C \uC881\uD788\uB294 \uC77C**\uC774\uACE0, \uB808\uC774\uC5B4\uAC00 \uACB9\uCE60\uC218\uB85D \uBC1D\uC544\uC9C4\uB2E4.

\uB808\uC774\uC5B4 3\uC885:

| \uB808\uC774\uC5B4 | \uC9C8\uBB38 | \uC0B0\uCD9C |
|---|---|---|
| \u2460 \uD0C0\uAC9F | \uB204\uAC00 \uBCF4\uB294\uAC00 | \uC5F0\uB839\xB7\uB9E5\uB77D\xB7\uAE30\uAE30\xB7\uC219\uB828\uB3C4 |
| \u2461 \uBE0C\uB79C\uB4DC \uD2B9\uC131 | \uBB34\uC5C7\uC774 \uC774 \uBE0C\uB79C\uB4DC\uB9CC\uC758 \uAC83\uC778\uAC00 | \uD1A4, \uAE08\uC9C0 \uC0AC\uD56D, \uACBD\uC7C1\uC0AC\uC640 \uAC08\uB9AC\uB294 \uC9C0\uC810. \`[\uC81C\uC548]\` \uC5EC\uAE30\uC11C \uBE0C\uB79C\uB4DC\uB294 **\uD074\uB77C\uC774\uC5B8\uD2B8(\uC11C\uBE44\uC2A4)\uC758 \uBE0C\uB79C\uB4DC**\uB2E4 \u2014 \uB354\uD504\uB86C\uC774 \uC544\uB2C8\uB2E4(\xA71.1) |
| \u2462 \uC18C\uBE44\uC790 \uC774\uC6A9(UX) | \uC2E4\uC81C\uB85C \uC5B4\uB5BB\uAC8C \uC4F0\uB294\uAC00 \xB7 \`[\uC81C\uC548]\` \uADF8 \uC21C\uAC04 \uBB34\uC5C7\uC744 \uC6D0\uD558\uB294\uAC00 | \uAD00\uC131\uC801 \uD589\uD0DC, \uC774\uD0C8 \uC9C0\uC810, \uBC18\uBCF5 \uC0AC\uC6A9 \uBE48\uB3C4 \xB7 \`[\uC81C\uC548]\` **\uD575\uC2EC \uC21C\uAC04\uC758 \uB3D9\uAE30\uC640 \uAC10\uC815** \u2014 \uC0AC\uC6A9\uC790\uAC00 \uC774 \uD654\uBA74\uC5D0\uC11C \uC5BB\uACE0 \uC2F6\uC740 \uAC83 |

\uC138 \uB808\uC774\uC5B4\uB97C \uB2E4 \uACB9\uCE58\uC9C0 \uC54A\uC740 \uC0C1\uD0DC\uB85C \uCD9C\uAD6C\uB97C \uC8FC\uC7A5\uD558\uB294 \uAC83\uC740 \uD130\uB110\uC744 \uD1B5\uACFC\uD55C \uAC83\uC774 \uC544\uB2C8\uB77C \uD130\uB110\uC744 \uC6B0\uD68C\uD55C \uAC83\uC774\uB2E4.`,airplane:`### 4.1 \uC815\uC758

\uB2E4\uC591\uD55C \uB514\uC790\uC778 \uCCA0\uD559\uACFC ism\uC744 **\uACBD\uACC4 \uC5C6\uC774 \uC5EC\uD589\uD558\uACE0 \uBBF9\uC2A4**\uD574, **\uADFC\uBCF8 \uC788\uB294 \uD558\uC774\uBE0C\uB9AC\uB4DC**\uB97C \uB9CC\uB4E0\uB2E4.

### 4.2 "\uADFC\uBCF8 \uC788\uB294"\uC774 \uC81C\uC57D\uC774\uB2E4

\uC5EC\uD589\uC740 \uC790\uC720\uB86D\uC9C0\uB9CC \uACB0\uACFC\uBB3C\uC740 \uADFC\uBCF8\uC774 \uC788\uC5B4\uC57C \uD55C\uB2E4. \uC774 \uB450 \uC870\uAC74\uC744 \uB3D9\uC2DC\uC5D0 \uB9CC\uC871\uC2DC\uD0A4\uB294 \uAC83\uC774 airplane effect\uC758 \uC5B4\uB824\uC6B4 \uC9C0\uC810\uC774\uACE0, \uB2E4\uC74C \uC138 \uAC00\uC9C0 \uADDC\uCE59\uC774 \uADF8 \uC870\uAC74\uC744 \uAD6C\uCCB4\uD654\uD55C\uB2E4.

**\uADDC\uCE59 1 \u2014 \uC0AC\uC870\uB294 \uC6D0\uB9AC \uCE35\uC704\uC5D0\uC11C \uAC00\uC838\uC628\uB2E4. \uC2DC\uAC01 \uCE35\uC704\uC5D0\uC11C \uAC00\uC838\uC624\uBA74 \uCF54\uC2A4\uD2AC\uC774 \uB41C\uB2E4.**

|---|---|

| \uB370 \uC2A4\uD2F8\uC758 "\uBD88\uADE0\uB4F1 \uBA74\uC801 \uBE44\uC728\uC5D0\uC11C \uC131\uB9BD\uD558\uB294 \uAE34\uC7A5" | \uC801\xB7\uD669\xB7\uCCAD + \uAD75\uC740 \uAC80\uC815 \uACA9\uC790 |

| \uC77C\uBCF8 \uBBF8\uD559\uC758 "\uC644\uACB0\uC744 \uC720\uBCF4\uD574 \uC218\uC2E0\uC790\uC758 \uCC38\uC5EC\uB97C \uC694\uAD6C" | \uD06C\uB77C\uD504\uD2B8\uC9C0 \uD14D\uC2A4\uCC98 + \uBBF8\uC0C9 \uBC30\uACBD |

\uC2DC\uAC01 \uCE35\uC704\uC5D0\uC11C \uAC00\uC838\uC628 \uAC83\uC740 \uC989\uC2DC \uC778\uC2DD\uB418\uB294 \uC778\uC6A9\uC774 \uB418\uACE0, \uBE0C\uB79C\uB4DC\uC758 \uACE0\uC720\uC131 \uB300\uC2E0 \uBBF8\uC220\uC0AC \uB808\uD37C\uB7F0\uC2A4\uB9CC \uC804\uB2EC\uD55C\uB2E4. \uC774\uAC74 \uC5EC\uD589\uC774 \uC544\uB2C8\uB77C \uBA74\uC138\uC810 \uC1FC\uD551\uC774\uB2E4.

**\uADDC\uCE59 1\uC758 \uC608\uC678 \u2014 \uBBF8\uAC10\uC740 \uD6C4\uBCF4\uB85C \uCC44\uC9D1\uD558\uACE0, \uD544\uC694\uD560 \uB54C\uB9CC \uAC00\uC838\uC628\uB2E4.** (v0.6, \uC9C0\uD64D \uACB0\uC815)

\uC6D0\uB9AC\uB9CC \uAC00\uC838\uC624\uB294 \uAC83\uC774 \uAE30\uBCF8\uAC12\uC774\uB2E4. \uADF8\uB7EC\uB098 \uACB0\uC815\uB860\uC73C\uB85C \uB9C9\uC9C0 \uC54A\uB294\uB2E4. \uC0AC\uC870\uC758 **\uBBF8\uAC10**(\uBE44\uB840\uAC10 \xB7 \uC9C8\uAC10 \xB7 \uD0C0\uC774\uD3EC\uC758 \uD0DC\uB3C4 \xB7 \uC0C9\uC758 \uB17C\uB9AC \xB7 \uD654\uBA74 \uBC00\uB3C4 \xB7 \uADF8\uB9BC\uC758 \uBC29\uC2DD)\uC774 \uACB0\uACFC\uBB3C\uC758 \uCC28\uBCC4\uC744 \uBCF4\uC774\uAC8C \uD558\uB294 \uB370 \uD544\uC694\uD560 \uC218 \uC788\uB2E4. \uADF8 \uD310\uB2E8\uC740 \uC5EC\uD589 \uC911\uC5D0 \uD558\uC9C0 \uC54A\uB294\uB2E4 \u2014 \uC5EC\uD589 \uC2DC\uC810\uC5D0\uB294 \uD0C0\uAC9F\uC774 \uBB34\uC5C7\uC5D0 \uC775\uC219\uD55C\uC9C0, \uACBD\uC7C1 \uACB0\uACFC\uBB3C\uC774 \uC5B4\uB5BB\uAC8C \uBCF4\uC774\uB294\uC9C0 \uBAA8\uB974\uAE30 \uB54C\uBB38\uC774\uB2E4.

## \uC6D0\uCE59
1. \uAD00\uC131\uC740 \uAD6C\uC870\uC5D0\uC11C \uC9C0\uD0A4\uACE0, \uC0C8\uB85C\uC6C0\uC740 \uD574\uC11D\uC5D0\uC11C \uB9CC\uB4E0\uB2E4. \uB0AF\uC120 \uAD6C\uC870\uB97C \uC8FC\uC9C0 \uC54A\uACE0, \uC775\uC219\uD55C \uAD6C\uC870\uB97C \uC0C8\uB85C \uBCF4\uC774\uAC8C \uD55C\uB2E4(\uC790\uBA54\uBDF0).

3. \uC99D\uAC70\uC640 \uC218\uCE58\uB97C \uC9C0\uC5B4\uB0B4\uC9C0 \uC54A\uB294\uB2E4. \uC0AC\uB840\xB7\uC870\uC0AC\xB7\uC778\uC6A9\xB7\uCE58\uC218\uB97C \uB9CC\uB4E4\uC9C0 \uC54A\uB294\uB2E4. \uCD9C\uCC98\uB294 \`\uD329\uD2B8\` \xB7 \`\uBE0C\uB9AC\uD504\` \xB7 \`\uC77C\uBC18 \uAD00\uCC30\` \xB7 \`\uCD94\uB860\` \uC911 \uD558\uB098\uB85C \uC801\uACE0, \uD655\uC778\uC774 \uD544\uC694\uD558\uBA74 \`\uD655\uC778 \uD544\uC694\`\uB85C \uC801\uB294\uB2E4. \uD329\uD2B8\uBD81\uC758 \uC0AC\uC2E4\uC744 \uC4F0\uBA74 \uADF8 \uD329\uD2B8\uC758 id\uB97C \`facts\`\uC5D0 \uC801\uB294\uB2E4. \uD329\uD2B8\uBD81\uC5D0 \uC5C6\uB294 \uC2DC\uC7A5 \xB7 \uD0C0\uAC9F \uC0AC\uC2E4\uC744 \uC0AC\uC2E4\uCC98\uB7FC \uC4F0\uC9C0 \uC54A\uB294\uB2E4.
4. \uC0AC\uC870\uB294 \uADDC\uCE59 \uBAA9\uB85D\uC774 \uC544\uB2C8\uB2E4. \uC2DC\uB300 \uC870\uAC74\uC5D0\uC11C \uB098\uC628 \uD0DC\uB3C4\uC774\uACE0, \uAC19\uC740 \uC0AC\uC870 \uC548\uC5D0\uB3C4 \uAC08\uB798\uC640 \uBAA8\uC21C\uC774 \uC788\uB2E4. "\uD574\uB3C4 \uB418\uB294 \uAC83 / \uD558\uBA74 \uC548 \uB418\uB294 \uAC83"\uC73C\uB85C \uB098\uB204\uC9C0 \uC54A\uB294\uB2E4. \uC5B4\uB290 \uAC08\uB798\uB97C, \uC5B4\uB290 \uCE35(\uD0DC\uB3C4 \xB7 \uC6D0\uB9AC \xB7 \uBC29\uBC95 \xB7 \uD45C\uD604)\uC5D0\uC11C, \uC5BC\uB9C8\uB098 \uC138\uAC8C \uC77D\uC744\uC9C0\uB97C \uC815\uD55C\uB2E4. \uD45C\uD604\uAE4C\uC9C0 \uAC00\uC838\uC62C \uB54C\uB294 \uADF8 \uD45C\uD604\uC774 \uC774 \uACFC\uC81C\uC5D0\uC11C \uC65C \uD544\uC694\uD55C\uC9C0\uB97C \uC4F4\uB2E4.

## \uBB38\uC7A5 \u2014 AI \uB9D0\uD22C\uB97C \uC4F0\uC9C0 \uC54A\uB294\uB2E4
\uC77D\uB294 \uC0AC\uB78C\uC740 \uB514\uC790\uC774\uB108\uC640 \uD074\uB77C\uC774\uC5B8\uD2B8\uB2E4. \uD68C\uC758 \uC790\uB8CC\uC5D0 \uADF8\uB300\uB85C \uBD99\uC5EC\uB3C4 \uC5B4\uC0C9\uD558\uC9C0 \uC54A\uC740 \uB9D0\uB85C \uC4F4\uB2E4.
- **\uC81C\uBAA9 \xB7 \uCEE8\uC149 \xB7 \uBC29\uD5A5\uC740 "\uC218\uB2E8 + \uD6A8\uACFC"\uB85C \uC4F4\uB2E4.** \uBB34\uC5C7\uC744 \uD574\uC11C \uBB34\uC5C7\uC744 \uC5BB\uB294\uC9C0\uAC00 \uD55C\uB208\uC5D0 \uBCF4\uC5EC\uC57C \uD55C\uB2E4.
  - \u2717 "\uC81C\uB3C4\uC758 \uC774\uB984\uC744 \uBC14\uAFD4 \uB9D0 \uAC74\uB128\uB2E4" \u2192 \u2713 "\uCE5C\uADFC\uD55C \uC548\uB0B4 \uBB38\uAD6C\uB85C \uC7AC\uBC29\uBB38 \uC2B5\uAD00 \uC720\uB3C4"
  - \u2717 "\uB05D\uC774 \uBCF4\uC774\uB294 \uD55C \uAF2D\uC9C0" \u2192 \u2713 "\uBD84\uB7C9\uC744 \uBA3C\uC800 \uBCF4\uC5EC \uC918 \uC77D\uAE30 \uBD80\uB2F4 \uC644\uD654"
- **\uB0AF\uC120 \uB9D0\uC744 \uB9CC\uB4E4\uC9C0 \uC54A\uB294\uB2E4.** \uC740\uC720, \uC870\uC5B4, \uC2DC\uC801\uC778 \uD45C\uD604\uC73C\uB85C \uB73B\uC744 \uB20C\uB7EC \uB2F4\uC9C0 \uC54A\uB294\uB2E4. \uC2E4\uBB34\uC5D0\uC11C \uC4F0\uB294 \uB9D0(\uBB38\uAD6C \xB7 \uD654\uBA74 \xB7 \uB3D9\uC120 \xB7 \uC7AC\uBC29\uBB38 \xB7 \uC804\uD658 \xB7 \uBD80\uB2F4)\uB85C \uD47C\uB2E4.
- **\uC124\uBA85\uC5D0 \uC124\uBA85\uC744 \uB367\uBD99\uC774\uC9C0 \uC54A\uB294\uB2E4.** \uAC19\uC740 \uB73B\uC744 \uB2E4\uB978 \uB9D0\uB85C \uD55C \uBC88 \uB354 \uC4F0\uC9C0 \uC54A\uB294\uB2E4. "\uC989", "\uB2E4\uC2DC \uB9D0\uD574", "~\uB77C\uB294 \uB73B\uC774\uB2E4"\uB85C \uC774\uC5B4 \uBD99\uC774\uC9C0 \uC54A\uB294\uB2E4.
- **\uC9E7\uC740 \uB2E8\uC815\uBB38\uC744 \uC904\uC904\uC774 \uB298\uC5B4\uB193\uC9C0 \uC54A\uB294\uB2E4.** "A\uB2E4. B\uB2E4. C\uB2E4."\uCC98\uB7FC \uB73B \uC870\uAC01\uC744 \uB098\uC5F4\uD558\uC9C0 \uB9D0\uACE0, \uC6D0\uC778\uACFC \uACB0\uACFC\uB97C \uD55C \uBB38\uC7A5 \uC548\uC5D0\uC11C \uC787\uB294\uB2E4.
- **\uB300\uAD6C\uC640 \uBC18\uC804\uC73C\uB85C \uBA4B\uC744 \uB0B4\uC9C0 \uC54A\uB294\uB2E4.** "A\uAC00 \uC544\uB2C8\uB77C B\uB2E4", "~\uC740 X\uB85C, ~\uC740 Y\uC5D0\uC11C" \uAC19\uC740 \uD2C0\uC744 \uC4F0\uC9C0 \uC54A\uB294\uB2E4. \uD558\uB824\uB294 \uB9D0\uC744 \uBC14\uB85C \uC4F4\uB2E4.
- \uBB34\uC5C7\uC774 \uB2EC\uB77C\uC9C0\uB294\uC9C0\uB294 \uB204\uAC00 \xB7 \uC5B8\uC81C \xB7 \uC5B4\uB514\uC11C \xB7 \uBB34\uC5C7\uC744 \uD558\uB294\uC9C0\uB85C \uC4F4\uB2E4. "\uC778\uC2DD\uC774 \uAC1C\uC120\uB41C\uB2E4"\uB294 \uC4F0\uC9C0 \uC54A\uB294\uB2E4.

\uD310\uC815 \uAE30\uC900: ${t.criteria}`,l=s?`## \uC0DD\uAC01\uD558\uB294 \uC21C\uC11C \u2014 \uAC74\uB108\uB6F0\uC9C0 \uC54A\uB294\uB2E4
1. **\uC2DC\uB300(origin).** \uC774 \uC0AC\uC870\uB294 \uC5B4\uB5A4 \uC2DC\uB300 \uC870\uAC74\uC5D0\uC11C \uBB34\uC5C7\uC744 \uACAC\uB514\uC9C0 \uBABB\uD574 \uB098\uC654\uB294\uAC00. \uC704\uC758 \uC2DC\uB300 \uC870\uAC74\uACFC \uB124\uAC00 \uC544\uB294 \uC120\uC5B8 \xB7 \uB17C\uC7C1 \xB7 \uC2E4\uD328\uB97C \uC368\uC11C, \uADF8 \uB2F5\uC774 \uC65C \uADF8\uB54C \uD544\uC694\uD588\uB294\uC9C0 \uC774\uD574\uD55C\uB2E4. \uBAA8\uB974\uB294 \uAC83\uC744 \uC9C0\uC5B4\uB0B4\uC9C0 \uC54A\uB294\uB2E4.
2. **\uC9C0\uAE08(parallel).** \uC774 \uC774\uC288\uC5D0\uC11C \uADF8\uB54C\uC640 \uAC19\uC740 \uC555\uB825\uC744 \uCC3E\uB294\uB2E4 \u2014 \uC624\uB298 \uC774 \uBD84\uC57C\uC758 \uC9C0\uBC30\uC801 \uAD00\uC2B5, \uB2F9\uC5F0\uD558\uAC8C \uC5EC\uAE30\uB294 \uC804\uC81C. "\uBE44\uC2B7\uD574 \uBCF4\uC774\uB294 \uAC83"\uC774 \uC544\uB2C8\uB77C "\uAC19\uC740 \uC774\uC720\uB85C \uAC19\uC740 \uBB38\uC81C\uAC00 \uC0DD\uAE30\uB294 \uAC83"\uC774\uC5B4\uC57C \uD55C\uB2E4. \uCC3E\uC9C0 \uBABB\uD558\uBA74 \uADF8 \uC774\uC288\uC5D0\uB294 \uD310\uB2E8\uC744 \uB0B4\uC9C0 \uC54A\uB294\uB2E4.
3. **\uAC08\uB798(strand).** \uC774 \uC0AC\uC870\uB294 \uD55C \uB369\uC5B4\uB9AC\uAC00 \uC544\uB2C8\uB2E4. \uC704\uC758 \uAC08\uB798 \uC911 \uC774 \uC774\uC288\uC5D0 \uB9DE\uB294 \uAC83\uC744 \uACE0\uB974\uACE0 \uC774\uC720\uB97C \uC4F4\uB2E4. \uAC08\uB798\uB9C8\uB2E4 \uB2F5\uC774 \uB2EC\uB77C\uC9C4\uB2E4 \u2014 \uB2E4\uB978 \uAC08\uB798\uC600\uB2E4\uBA74 \uBB34\uC5C7\uC774 \uB2EC\uB790\uC744\uC9C0\uB3C4 \uD55C \uBB38\uC7A5.
4. **\uBAA8\uC21C(paradox).** \uC774 \uC0AC\uC870\uAC00 \uC2A4\uC2A4\uB85C \uD480\uC9C0 \uBABB\uD55C \uBAA8\uC21C\uC774 \uC774 \uC774\uC288\uC5D0\uC11C\uB294 \uC5B4\uB5BB\uAC8C \uB098\uD0C0\uB098\uB294\uAC00. \uD53C\uD558\uC9C0 \uB9D0\uACE0, \uC774 \uACFC\uC81C\uC5D0\uC11C \uADF8 \uBAA8\uC21C\uC744 \uC5B4\uB290 \uCABD\uC73C\uB85C \uAE30\uC6B8\uC77C\uC9C0 \uC815\uD55C\uB2E4.
5. **\uC77D\uAE30(reading).** \uC5EC\uAE30\uAE4C\uC9C0\uB97C \uBC14\uD0D5\uC73C\uB85C \uC774 \uACFC\uC81C\uB97C \uC774 \uC0AC\uC870\uC758 \uB208\uC73C\uB85C \uC790\uC720\uB86D\uAC8C \uC77D\uB294\uB2E4. 3~5\uBB38\uC7A5. \uADDC\uCE59\uC744 \uC801\uC6A9\uD55C \uACB0\uACFC\uAC00 \uC544\uB2C8\uB77C \uD574\uC11D\uC774\uC5B4\uC57C \uD55C\uB2E4.
6. **\uCE35\uACFC \uC138\uAE30(layer \xB7 degree).** \uADF8 \uC77D\uAE30\uB97C \uC5B4\uB290 \uCE35\uC5D0\uC11C \uC4F0\uB294\uAC00 \u2014 ${Ht.join(" \xB7 ")}. \uC5BC\uB9C8\uB098 \uC138\uAC8C \uC4F0\uB294\uAC00(0~1). \uD45C\uD604 \uCE35\uAE4C\uC9C0 \uC4F0\uBA74 \`expression\`\uC5D0 \uC774 \uC0AC\uC870\uC758 \uAC10\uAC01\uC73C\uB85C \uC774 \uACFC\uC81C\uAC00 \uC5B4\uB5BB\uAC8C \uBCF4\uC77C\uC9C0\uB97C \uADF8\uB9B0\uB2E4.
7. **\uB300\uC785(ladder).** \uD604\uC0C1 \u2192 \uC65C \u2192 \uC65C \u2192 \uBCF8\uC9C8\uB85C \uB0B4\uB824\uAC00 \uD310\uB2E8 \uD558\uB098\uB85C \uC881\uD78C\uB2E4.
8. **\uBC14\uAFD4\uCE58\uAE30 \uC2DC\uD5D8(swap).** \uC774 \uD310\uB2E8\uC744 \uB2E4\uB978 \uC0AC\uC870\uC758 \uC774\uB984\uC73C\uB85C \uBC14\uAFD4 \uC368\uB3C4 \uC131\uB9BD\uD558\uB294\uAC00. \uC131\uB9BD\uD558\uBA74 \uC774 \uC0AC\uC870\uC758 \uD310\uB2E8\uC774 \uC544\uB2C8\uB2E4. \uC774 \uC0AC\uC870\uB97C \uBE7C\uBA74 \uBB34\uC5C7\uC774 \uBB34\uB108\uC9C0\uB294\uC9C0 \uC4F4\uB2E4.`:`## \uC0DD\uAC01\uD558\uB294 \uC21C\uC11C \u2014 \uAC74\uB108\uB6F0\uC9C0 \uC54A\uB294\uB2E4
1. \uC6D0\uBB38\uC744 \uC77D\uB294\uB2E4. \uC774 \uAE30\uC900\uC774 \uC65C \uC788\uB294\uC9C0, \uBB34\uC5C7\uC744 \uB9C9\uC73C\uB824\uB294 \uAC83\uC778\uC9C0\uB97C \uBA3C\uC800 \uC774\uD574\uD55C\uB2E4.

3. **\uD1B5\uB150(against).** \uC774 \uAE30\uC900\uC73C\uB85C \uBCF4\uBA74 \uC9C0\uAE08 \uB2E4\uB4E4 \uD558\uB294 \uBC29\uC2DD(\uAE30\uBCF8\uC548)\uC758 \uBB34\uC5C7\uC774 \uD2C0\uB838\uAC70\uB098 \uBE44\uC5B4 \uC788\uB294\uAC00. \uD55C \uBB38\uC7A5.
4. \uBCF8\uC9C8\uC5D0\uC11C \uD310\uB2E8 \uD558\uB098\uB97C \uB04C\uC5B4\uB0B8\uB2E4 \u2014 \uBB34\uC5C7\uC744 \uC9C0\uD0A4\uAC70\uB098 \uBC14\uAFB8\uB294\uAC00.`,o=s?`, "origin": "\uC5B4\uB5A4 \uC2DC\uB300 \uC870\uAC74\uC5D0\uC11C \uBB34\uC5C7 \uB54C\uBB38\uC5D0 \uB098\uC654\uB098", "parallel": "\uC774 \uC774\uC288\uC5D0\uC11C \uAC19\uC740 \uC555\uB825", "strand": "\uACE0\uB978 \uAC08\uB798\uC640 \uC774\uC720, \uB2E4\uB978 \uAC08\uB798\uC600\uB2E4\uBA74 \uB2EC\uB77C\uC9C8 \uC810", "paradox": "\uC0AC\uC870\uC758 \uBAA8\uC21C\uC774 \uC774 \uC774\uC288\uC5D0\uC11C \uB098\uD0C0\uB098\uB294 \uBAA8\uC2B5\uACFC \uAE30\uC6B8\uC77C \uBC29\uD5A5", "reading": "\uC774 \uC0AC\uC870\uC758 \uB208\uC73C\uB85C \uC77D\uC740 \uD574\uC11D 3~5\uBB38\uC7A5", "layer": "${Ht.join("|")}", "degree": 0.0, "expression": "\uD45C\uD604 \uCE35\uC77C \uB54C\uB9CC \u2014 \uC5B4\uB5BB\uAC8C \uBCF4\uC774\uB294\uAC00", "swap": "\uC774 \uC0AC\uC870\uB97C \uBE7C\uBA74 \uBB34\uB108\uC9C0\uB294 \uAC83"`:', "against": "\uC774 \uAE30\uC900\uC73C\uB85C \uBCF8 \uD1B5\uB150\uC758 \uD2C0\uB9B0 \uC810"';return{system:`${$e(e)}

Y-RND`\uB97C \uC4F8 \uB54C\uB294 `ISM-DADA`\uC758 "\uC6B0\uC5F0\uC744 \uC2DC\uC2A4\uD15C\uC5D0 \uB123\uAE30"\uB97C \uCC38\uACE0\uD55C\uB2E4 \u2014 **\uACB0\uACFC\uB9CC \uCDE8\uD5A5\uB300\uB85C \uACE0\uB974\uBA74 \uBB34\uC791\uC704\uAC00 \uC544\uB2C8\uB2E4.** \uADDC\uCE59\uC744 \uBA3C\uC800 \uC815\uD558\uACE0 \uADF8 \uADDC\uCE59\uC774 \uB0B8 \uACB0\uACFC\uB97C \uBC1B\uB294\uB2E4.\n> `RHY-FLOW`\uC758 \uACE1\uC120\uC740 L0 \xA72.2 \uC81C\uC57D 2 \uB300\uC0C1\uC774\uB2E4. `ISM-NOUVEAU`\uC758 "\uAC00\uC18D\xB7\uAC10\uC18D\uC758 \uBE44\uADE0\uC9C8\uC131"\uC774 \uADFC\uAC70\uB85C \uC4F8 \uC218 \uC788\uB294 \uC6D0\uB9AC\uB2E4.\n\n---'},{id:"KH-B6",no:6,name:"\uAD6C\uB3C4",note:"COMP-*",prefixes:["COMP"],items:23,text:'## B-6. \uAD6C\uB3C4 \u2014 `COMP-*`\n\n> `\uAD6C\uB3C4\uB294 \uC0DD\uAC01\uC774\uB098 \uC758\uB3C4\uB97C \uD6A8\uACFC\uC801\uC73C\uB85C \uC804\uB2EC\uD558\uAE30 \uC704\uD574, \uD654\uBA74 \uC548\uC758 \uC694\uC18C\uB97C \uC120\uD0DD\uD558\uACE0 \uBC30\uCE58\uD558\uB294 \uBC29\uC2DD\uC774\uB2E4.`\n> `\uADE0\uD615\xB7\uAC15\uC870\xB7\uB9AC\uB4EC\xB7\uBE44\uB840\uC640 \uAC19\uC740 \uB514\uC790\uC778 \uC6D0\uB9AC\uAC00 \uC790\uC5F0\uC2A4\uB7FD\uAC8C \uAD6C\uD604\uB41C\uB2E4.`\n\n### \uAD6C\uB3C4\uB97C \uB9DE\uCDB0\uC57C \uD558\uB294 5\uAC00\uC9C0 \uC774\uC720 (\uC6D0\uBB38)\n\n1. `\uC2DC\uC120\uC744 \uC720\uB3C4\uD560 \uC218 \uC788\uB2E4.` \u2014 `\uAD6C\uB3C4\uAC00 \uB9CC\uB4E4\uC5B4\uB0B8 \uD750\uB984\uC744 \uB530\uB77C \uC2DC\uC120\uC744 \uC6C0\uC9C1\uC778\uB2E4.`\n2. `\uC815\uBCF4\uC758 \uC6B0\uC120\uC21C\uC704\uB97C \uC815\uB9AC\uD560 \uC218 \uC788\uB2E4.` \u2014 **`\uAD6C\uB3C4\uB294 \uC77C\uC885\uC758 \uC2DC\uAC01\uC801 \uC704\uACC4 \uC2DC\uC2A4\uD15C\uC774\uB2E4.`**\n3. `\uADE0\uD615\uACFC \uC548\uC815\uAC10\uC744 \uB9CC\uB4E4 \uC218 \uC788\uB2E4.` \u2014 `\uADE0\uD615\uC774 \uC7A1\uD788\uBA74 \uD654\uBA74\uC774 \uC548\uC815\uC801\uC73C\uB85C \uBCF4\uC774\uACE0 \uC2E0\uB8B0\uAC00 \uC62C\uB77C\uAC04\uB2E4.`\n4. `\uAC10\uC815\uACFC \uBD84\uC704\uAE30\uB97C \uC804\uB2EC\uD560 \uC218 \uC788\uB2E4.` \u2014 `\uAC19\uC740 \uB300\uC0C1\uC774\uB77C\uB3C4 \uAD6C\uB3C4\uC5D0 \uB530\uB77C \uC644\uC804\uD788 \uB2E4\uB978 \uB290\uB08C\uC774 \uB9CC\uB4E4\uC5B4\uC9C4\uB2E4.`\n5. `\uBA54\uC2DC\uC9C0\uB97C \uB354 \uAC15\uD558\uAC8C \uC804\uB2EC\uD560 \uC218 \uC788\uB2E4.` \u2014 `\uAD6C\uB3C4\uAC00 \uC57D\uD558\uBA74 \uC544\uBB34\uB9AC \uC88B\uC740 \uC774\uBBF8\uC9C0\uB098 \uCF58\uD150\uCE20\uB77C\uB3C4 \uBA85\uD655\uD788 \uC804\uB2EC\uB418\uC9C0 \uC54A\uB294\uB2E4.`\n\n### B-6-1. \uBC29\uD5A5 (Direction) \u2014 4\uC885\n\n| ID | \uAD6C\uB3C4 | \uC2DC\uAC01\uC801 \uD2B9\uC9D5 | `~\uD560 \uB54C \uD6A8\uACFC\uC801\uC774\uB2E4` |\n|---|---|---|---|\n| `COMP-HOR` | \uC218\uD3C9 | `\uAC00\uB85C \uBC29\uD5A5\uC758 \uC815\uC801\uC778 \uD750\uB984\uC73C\uB85C \uCC28\uBD84\uD55C \uADE0\uD615\uAC10` \u26A0\uFE0F`\uACFC\uD558\uBA74 \uB2E8\uC870\uB86D\uAC8C` | \uB113\uC740 \uACF5\uAC04\uAC10\xB7\uCC28\uBD84\uD55C \uBD84\uC704\uAE30, `\uC81C\uD488\uC774\uB098 \uC7A5\uBA74\uC744 \uACFC\uC7A5 \uC5C6\uC774 \uB2F4\uBC31\uD558\uAC8C \uBCF4\uC5EC\uC904 \uB54C` |\n| `COMP-VER` | \uC218\uC9C1 | `\uB192\uC774\uAC10\uACFC \uAE34\uC7A5\uAC10\uC744 \uB9CC\uB4E4\uBA70, \uD654\uBA74\uC744 \uB354\uC6B1 \uAC15\uD558\uACE0 \uB610\uB837\uD558\uAC8C` | `\uC0C1\uC2B9\uD558\uB294 \uC5D0\uB108\uC9C0, \uAC15\uD55C \uC874\uC7AC\uAC10, \uAD8C\uC704 \uC788\uB294 \uBD84\uC704\uAE30` |\n| `COMP-DIA` | \uB300\uAC01\uC120 | `\uC18D\uB3C4\uAC10\uACFC \uAE34\uC7A5\uAC10` `\uC815\uC801\uC778 \uD654\uBA74\uB3C4 \uB354 \uC5ED\uB3D9\uC801\uC73C\uB85C` | `\uC6C0\uC9C1\uC784, \uC5D0\uB108\uC9C0, \uAE34\uC7A5\uAC10, \uC6D0\uADFC\uAC10` `\uB4DC\uB77C\uB9C8\uD2F1\uD55C \uC778\uC0C1` |\n| `COMP-PER` | \uC18C\uC2E4\uC810 | `\uD3C9\uBA74\uC801\uC778 \uD654\uBA74\uC5D0 \uC785\uCCB4\uC801\uC778 \uAE4A\uC774\uAC10` | `\uACF5\uAC04\uC758 \uD655\uC7A5\uAC10\uACFC \uC6D0\uADFC\uAC10` \uC911\uC2EC \uC9D1\uC911 |\n\n### B-6-2. \uD615\uD0DC (Form) \u2014 12\uC885\n\n| ID | \uAD6C\uB3C4 | \uD0A4\uC6 F58\uD150\uCE20\uC640 \uBCC4\uB3C4\uB85C \uCE21\uBA74\uC5D0 \uBCF4\uC870 \uC815\uBCF4\uB098 \uB0B4\uBE44\uAC8C\uC774\uC158\uC744 \uBC30\uCE58` \xB7 `\uACE0\uC815\uD615/\uC811\uC774\uC2DD` | `\uBE14\uB85C\uADF8` `\uB274\uC2A4 \uC0AC\uC774\uD2B8` `\uC1FC\uD551\uBAB0` `\uCEE4\uBBA4\uB2C8\uD2F0` |\n| `LAY-HIER` | \uACC4\uCE35\uC801 Hierarchical | `\uC694\uC18C\uC758 \uC911\uC694\uB3C4\uC5D0 \uB530\uB77C \uD06C\uAE30\uC640 \uC704\uCE58\uB97C \uC790\uC720\uB86D\uAC8C \uBC30\uCE58` | `\uBB34\uC5C7\uC744 \uBA3C\uC800 \uC77D\uC5B4\uC57C \uD560\uC9C0 \uC2DC\uAC01\uC801 \uC6B0\uC120 \uC21C\uC704\uB97C \uC815\uD574\uC900\uB2E4` |\n| `LAY-ASYM` | \uBE44\uB300\uCE6D Asymmetric | `\uC815\uD615\uD654\uB41C \uC911\uC2EC \uCD95\uC744 \uB530\uB974\uC9C0 \uC54A\uACE0 \uC694\uC18C\uC758 \uD06C\uAE30, \uC704\uCE58, \uBC00\uB3C4 \uCC28\uC774\uB97C \uD65C\uC6A9` | `\uD604\uB300\uC801` `\uC5ED\uB3D9\uC131` `\uAC10\uAC01` |\n| `LAY-CARD` | \uCE74\uB4DC\uD615 Card-based | `\uCEE8\uD150\uCE20\uB97C \uC791\uC740 \uBC15\uC2A4 \uB2E8\uC704\uB85C \uB098\uC5F4` | `\uCE74\uB4DC\uD615` `\uBCA4\uB610\uD615` `\uBCBD\uB3CC\uD615` |\n| `LAY-LIST` | \uB9AC\uC2A4\uD2B8\uD615 List | `\uC881\uC740 \uACF5\uAC04\uC5D0 \uB354 \uB9CE\uC740 \uD56D\uBAA9\uC744 \uB2F4\uC744 \uC218 \uC788\uC73C\uBA70` | `\uB274\uC2A4 \uD0C0\uC774\uD2C0, FAQ` |\n| `LAY-Z` | Z \uD328\uD134 | `\uC0AC\uC6A9\uC790\uC758 \uC790\uC5F0\uC2A4\uB7EC\uC6B4 \uC2DC\uC120 \uD750\uB984\uC744 \uBC18\uC601\uD558\uC5EC Z\uC790 \uD615\uD0DC\uB85C` | `\uB79C\uB529 \uD398\uC774\uC9C0` `\uAD11\uACE0 \uBC30\uB108` `\uC571 \uC18C\uAC1C \uD398\uC774\uC9C0` `\uC774\uBCA4\uD2B8 \uD398\uC774\uC9C0` |\n| `LAY-F` | F \uD328\uD134 | `\uC67C\uCABD\uC5D0\uC11C \uC624\uB978\uCABD\uC73C\uB85C \uC77D\uB2E4\uAC00 \uC544\uB798\uB85C \uB0B4\uB824\uAC00\uB294 \uBC29\uC2DD` \xB7 `\uD575\uC2EC \uC815\uBCF4\uB294 \uD2B9\uC815 \uAD6D\uAC00\uB97C \uC81C\uC678\uD558\uACE4 \uAC00\uC7A5 \uC775\uC219\uD558\uACE0 \uC790\uC5F0\uC2A4\uB7EC\uC6B4 \uC704\uCE58\uC778 \uC88C\uC0C1\uB2E8\uC5D0 \uBC30\uCE58\uD55C\uB2E4.` | `\uBE14\uB85C\uADF8` `\uB274\uC2A4 \uAE30\uC0AC` `\uAC80\uC0C9 \uACB0\uACFC` `\uC774\uBA54\uC77C \uB274\uC2A4\uB808\uD130` |\n| `LAY-NOGRID` | \uD0C8 \uADF8\uB9AC\uB4DC Grid-less | `\uC815\uD574\uC9C4 \uACA9\uC790\uC758 \uADDC\uCE59\uC744 \uAE68\uB294 \uBC29\uC2DD` \xB7 `\uC694\uC18C\uB4E4\uC774 \uADF8\uB9AC\uB4DC\uC5D0 \uB9DE\uBB3C\uB9AC\uC9C0 \uC54A\uACE0 \uC790\uC720\uB86D\uAC8C \uB5A0\uB2E4\uB2C8\uAC70\uB098, \uC11C\uB85C \uACB9\uCE58\uAE30\uB3C4 \uD55C\uB2E4.` | `\uBE0C\uB79C\uB4DC \uC0AC\uC774\uD2B8` `\uD3B8\uC9D1 \uB514\uC790\uC778` (\uD328\uC158 \uBE0C\uB79C\uB4DC, \uC2E4\uD5D8\uC801 \uCEA0\uD398\uC778) |\n\n> **`LAY-Z`\xB7`LAY-F`\uAC00 L0 \xA75.2 \uB808\uC774\uC5B4 \u2462(\uC18C\uBE44\uC790 \uC774\uC6A9 \uAD00\uC810)\uC758 \uC720\uC77C\uD55C \uC6D0\uBB38 \uADFC\uAC70\uB2E4.** \uD2B9\uD788 `LAY-F`\uC758 `\uAC00\uC7A5 \uC775\uC219\uD558\uACE0 \uC790\uC5F0\uC2A4\uB7EC\uC6B4 \uC704\uCE58`\uAC00 **\uAD00\uC131\uC801 \uD589\uD0DC**\uC758 \uC6D0\uBB38 \uD45C\uD604\uC5D0 \uAC00\uC7A5 \uAC00\uAE5D\uB2E4. G3 \uD310\uC815 \uC2DC \uCC38\uC870.\n>\n> `LAY-NOGRID`\uB294 `ISM-DECON`\xB7`ISM-POSTMOD`\uC640 \uC9C1\uACB0\uB41C\uB2E4. \uB2E8 L0 \xA77.3 2\uBC88("\uC6D0\uCE59 \uC5C6\uB294 \uD30C\uAD34 \uAE08\uC9C0")\uACFC `ISM-SWISS` \uB450\uACE0 \uC62C \uAC83("\uADF8\uB9AC\uB4DC\uB97C \uAC10\uC625\uC73C\uB85C \uB9CC\uB4E4\uC9C0 \uB9C8\uB77C")\uC744 **\uC591\uCABD \uB2E4** \uC77D\uC5B4\uC57C \uD55C\uB2E4 \u2014 \uADF8\uB9AC\uB4DC\uAC00 \uC5C6\uB294 \uAC83\uACFC \uADF8\uB9AC\uB4DC\uB97C \uAE68\uB294 \uAC83\uC740 \uB2E4\uB974\uB2E4.\n\n---'},{id:"KH-B9",no:9,name:"\uD1A4 \uC564 \uB9E4\uB108",note:"\uBBF9\uC2A4\uC758 \uD2C0",prefixes:[],items:0,text:"## B-9. \uD1A4 \uC564 \uB9E4\uB108 \u2014 \uBBF9\uC2A4\uC758 \uD2C0\n\n> `\uD1A4 \uC564 \uB9E4\uB108\uB294 \uC77C\uAD00\uB41C \uC2DC\uAC01\uC801 \uBD84\uC704\uAE30, \uC2A4\uD0C0\uC77C, \uD0DC\uB3C4\uB97C \uB9D0\uD55C\uB2E4.`\n> `\uCEEC\uB7EC \uD314\uB808\uD2B8, \uC774\uBBF8\uC9C0, \uCE74\uD53C \uB77C\uC774\uD2B8\uAE4C\uC9C0 \uBAA8\uB4E0 \uBA74\uC5D0\uC11C \uD1B5\uC77C\uB41C \uB290\uB08C\uC744 \uC8FC\uB294 \uAC83`\n\n| \uAD6C\uBD84 | \uC6D0\uBB38 \uC815\uC758 | \uAD6C\uC131 |\n|---|---|---|\n| \uD1A4 (Tone) | `\uBE44\uC8FC\uC5BC \uD1A4, \uC5B8\uC5B4\uC801 \uD1A4` | `\uC0C9\uC0C1, \uC11C\uCCB4, \uCE74\uD53C\uB77C\uC774\uD2B8` |\n| \uB9E4\uB108 (Manner) | `\uBA54\uC2DC\uC9C0\uB97C \uD45C\uD604\uD558\uB294 \uADDC\uCE59\uC774\uB098 \uC591\uC2DD` | `\uD1B5\uC77C\uC131, \uC77C\uAD00\uC131` |\n\n\uBAA9\uC801: `\u2018\uBE44\uC8FC\uC5BC \uC694\uC18C\u2019\uC640 \u2018\uCE74\uD53C\uB77C\uC774\uD2B8\u2019\uB85C \uC0AC\uC6A9\uC790\uB4E4\uC5D0\uAC8C  \uC77C\uAD00\uB41C \uC774\uBBF8\uC9C0\uB97C \uAD6C\uC131\uD558\uACE0 \uC804\uB2EC\uD558\uAE30 \uC704\uD568`\n\n### 3\uB2E8\uACC4 \uD504\uB85C\uC138\uC2A4 (\uC6D0\uBB38) \u2014 L1 S0\xB7S2\uC758 \uADFC\uAC70\n\n| \uB2E8\uACC4 | \uC9C8\uBB38 | \uC6D0\uBB38 \uC815\uC758 |\n|---|---|---|\n| \u2460 \uCEE8\uC149 | `\uBB34\uC5C7\uC744 \uB9D0\uD560\uAE4C` | `\uC804\uB2EC\uD558\uB824\uB294 \uC0DD\uAC01\uC744 \uD55C \uBB38\uC7A5\uC73C\uB85C \uC815\uC758\uD558\uACE0 \uC804\uCCB4 \uB514\uC790\uC778\uC758 \uBC29\uD5A5\uC744 \uC815\uD574\uC8FC\uB294 \uC5ED\uD560\uC774\uB2E4.` |\n| \u2461 \uBB34\uB4DC\uBCF4\uB4DC | `\uC5B4\uB5A4 \uB290\uB08C\uC77C\uAE4C` | `\uC544\uC774\uB514\uC5B4\uB97C \uB208\uC73C\uB85C \uBCF4\uC774\uAC8C \uB9CC\uB4DC\uB294 \uBC29\uBC95\uC774\uACE0, \uC124\uBA85\uBCF4\uB2E4\uB294 \uB290\uB08C(Mood)\uB9CC \uC804\uB2EC\uD558\uB294 \uAC83\uC774 \uBAA9\uD45C\uB2E4.` |\n| \u2462 \uD1A4 \uC564 \uB9E4\uB108 | `\uC5B4\uB5BB\uAC8C \uB9CC\uB4E4\uAE4C` | `\uBA54\uC2DC\uC9C0\uAC00 \uC798 \uC804\uB2EC \uB420 \uC218 \uC788\uB3C4\uB85D \uBE44\uC8FC\uC5BC \uC2A4\uD0C0\uC77C, \uD45C\uD604 \uBC29\uC2DD\uC744 \uC815\uC758\uD558\uB294 \uAC83\uC774\uB2E4.` |\n\n> \u2461\uC758 \uC6D0\uBB38\uC5D0 **\uC218\uC9D1\uACFC \uC218\uB834 \uB450 \uB3D9\uC791**\uC774 \uD568\uAED8 \uB4E4\uC5B4 \uC788\uB2E4: `\uBAA8\uB4E0 \uB808\uD37C\uB7F0\uC2A4\uB97C \uD55C\uACF3\uC5D0 \uBAA8\uC544\uB450\uACE0 \uC774\uAC83\uC744 \uC815\uB9AC\uD558\uBA74 \uD1A4 \uC564 \uB9E4\uB108\uB97C \uC815\uD558\uB294 \uACFC\uC815\uC774 \uB41C\uB2E4.`\n\n### 4\uCD95 \uC870\uD569 \uACF5\uC2DD\n\n> `\uD1A4 \uC564 \uB9E4\uB108\uB294 \uCEEC\uB7EC\uC640 \uBB34\uB4DC, \uBE44\uC8FC\uC5BC \uBC0F \uD0C0\uC774\uD3EC \uC2A4\uD0C0\uC77C\uC758 \uC77C\uAD00\uB41C \uC870\uD569\uC744 \uD1B5\uD574 \uB514\uC790\uC778\uC758 \uBD84\uC704\uAE30\uC640 \uAC10\uC815\uC744 \uACB0\uC815\uD55C\uB2E4.`\n\n```\n\uD1A4 \uC564 \uB9E4\uB108 = \uCEEC\uB7EC \xD7 \uBB34\uB4DC \xD7 \uBE44\uC8FC\uC5BC \uC2A4\uD0C0\uC77C \xD7 \uD0C0\uC774\uD3EC \uC2A4\uD0C0\uC77C\n```\n\n### A/B \uBD84\uAE30 \uC608\uC2DC (\uC6D0\uBB38)\n\n\uCEE8\uC149 `\uC2A4\uD2B8\uB9AC\uD2B8 \uBB38\uD654\uC758 \uC5D0\uB108\uC9C0 \uB118\uCE58\uB294 \uC2A4\uD0C0\uC77C`:\n\n| \uC548 | \uC6D0\uBB38 |\n|---|---|\n| A | `\uBE44\uBE44\uB4DC \uCEEC\uB7EC / \uBCFC\uB4DC\uD55C \uC0B0\uC138\uB9AC\uD504 / \uADF8\uB808\uC778 \uD14D\uC2A4\uCCD0 \u2026` |\n| B | `\uB2E4\uD06C \uCEEC\uB7EC / \uADF8\uB798\uD53C\uD2F0 \uC11C\uCCB4 / \uBCBD \uD14D\uC2A4\uCCD0 \u2026` |\n\n---"},{id:"KH-B10",no:10,name:"\uCEEC\uB7EC",note:"COLOR-*",prefixes:["COLOR"],items:19,text:"## B-10. \uCEEC\uB7EC \u2014 `COLOR-*`\n\n### B-10-1. \uC0C9\uC0C1 Hue \u2014 9\uC885\n\n| ID | \uC0C9 | \uC6D0\uBB38 | \uC0B0\uC5C5 |\n|---|---|---|---|\n| `COLOR-RED` | \uBE68\uAC04\uC0C9 | `\uC778\uAC04\uC758 \uAC10\uC815\uC744 \uAC00\uC7A5 \uAC15\uD558\uAC8C \uC790\uADF9\uD558\uB294 \uC0C9.` `\uCC44\uB3C4\uAC00 \uB192\uC744\uC218\uB85D \uAE34\uBC15\uD568\xB7\uC5D0\uB108\uC9C0\xB7\uC2DD\uC695` / `\uCC44\uB3C4\uB97C \uB0AE\uCD98 \uBC84\uAC74\uB514\xB7\uB9C8\uB8EC\uC740 \uACE0\uAE09\uC2A4\uB7EC\uC6C0\uACFC \uC131\uC219\uD568` | `\uC138\uC77C\xB7\uD560\uC778\xB7CTA \uBC84\uD2BC` |\n| `COLOR-ORG` | \uC8FC\uD669\uC0C9 | `\uBE68\uAC15\uC758 \uC5D0\uB108\uC9C0\uC640 \uB178\uB791\uC758 \uBC1D\uC74C\uC744 \uB3D9\uC2DC\uC5D0 \uAC16\uB294 \uC0C9.` `\uACF5\uACA9\uC801\uC774\uC9C0 \uC 9C0 \uC54A\uB2E4. \uC6D0\uBCF8\uC5D0 `VS-DIG` \uACE0\uC720\uC758 \uBB38\uC7A5\uC774 \uC5C6\uC73C\uBBC0\uB85C **\uBCF5\uC6D0\uC774 \uC544\uB2C8\uB77C \uC7AC\uC791\uC131**\uC774\uB2E4. \uC6D0\uBB38 \uD0A4\uC6CC\uB4DC 6\uAC1C(`\uB9E4\uB044\uB7EC\uC6C0` `\uD640\uB85C\uADF8\uB798\uD53D` `\uADF8\uB77C\uB514\uC5B8\uD2B8` `\uAE30\uACC4\uC801` `\uD4E8\uCCD0\uB9AC\uC2A4\uD2F1` `\uAE00\uB798\uC2A4\uBAA8\uD53C\uC998`)\uC5D0\uC11C \uBCF8\uBB38\uACFC \uC0C1\uC138 4\uCD95\uC744 \uCD08\uC548\uC73C\uB85C \uC37C\uB2E4. \uC778\uC6A9 \uD45C\uAE30(\uBC31\uD2F1) \uC5C6\uC774 `[\uD655\uC778 \uD544\uC694]`\uB85C \uB454\uB2E4. \uC6D0\uB9AC \uADFC\uAC70\uB294 `ISM-FUTUR`\uC758 "\uD0C0\uC785\uC744 \uD45C\uD604 \uC7AC\uB8CC\uB85C", "\uB3D9\uC2DC\uC801 \uC9C0\uAC01\uC73C\uB85C \uC7AC\uD3B8"\uC774\uB2E4.\n\n### \uC0C1\uC138 4\uCD95\n\n| ID | \uCEEC\uB7EC | \uAD6C\uC131 | \uD0C0\uC774\uD3EC | \uC0AC\uC9C4\xB7\uC694\uC18C |\n|---|---|---|---|---|\n| `VS-EDI` | `\uBE14\uB799, \uD654\uC774\uD2B8, \uD06C\uB9BC \uB4F1 \uC808\uC81C\uB41C \uC0C9\uAC10` + `\uAC15\uB82C\uD55C \uD3EC\uC778\uD2B8 \uCEEC\uB7EC\uB098 \uB300\uB2F4\uD55C \uC0AC\uC9C4\uC744 \uC804\uB7B5\uC801\uC73C\uB85C \uBC30\uCE58` | `\uC5EC\uBC31\uACFC \uD14D\uC2A4\uD2B8\uC758 \uAD00\uACC4\uB97C \uC138\uBC00\uD558\uAC8C \uC870\uC728\uD558\uC5EC \uD398\uC774\uC9C0 \uC804\uCCB4\uAC00 \uD558\uB098\uC758 \uC644\uC131\uB41C \uC2DC\uAC01\uC801 \uC11C\uC0AC\uB97C \uC774\uB8E8\uB3C4\uB85D` | `\uC138\uB9AC\uD504\uC640 \uC0B0\uC138\uB9AC\uD504 \uC11C\uCCB4\uB97C \uB300\uBE44\uC801\uC73C\uB85C \uD63C\uC6A9\uD558\uBA70, \uD06C\uAE30\xB7\uAD75\uAE30\xB7\uAC04\uACA9\uC758 \uADF9\uC801\uC778 \uCC28\uC774\uB97C \uD1B5\uD574` | `\uAC15\uD55C \uAD6C\uB3C4\uC640 \uBA54\uC2DC\uC9C0\uAC00 \uB2F4\uAE34 \uC774\uBBF8\uC9C0` |\n| `VS-ANA` | `\uADF8\uB77C\uB514\uC5B8\uD2B8, \uB274\uD2B8\uB7F4 \uD1A4, \uD639\uC740 \uAC15\uB82C\uD55C \uB124\uC628 \uCEEC\uB7EC \uB4F1 \uADF8 \uC2DC\uB300\uC758 \uC720\uD589 \uC0C9\uAC10` | `\uBE44\uB300\uCE6D \uB808\uC774\uC544\uC6C3, \uB AC\uC2E4\uAC10 \uC788\uAC8C \uC804\uB2EC\uD560 \uC218 \uC788\uB2E4.`\n\n**\uC81C\uC5B4 \uBCC0\uC218 5\uC885**\n\n| \uBCC0\uC218 | ID | \uC120\uD0DD\uC9C0 |\n|---|---|---|\n| \uC885\uB958 | `LIGHT-NAT` / `LIGHT-ART` | \uC790\uC5F0\uAD11(`\uC2DC\uAC04\uACFC \uB0A0\uC528\uC5D0 \uB530\uB77C`) / \uC778\uACF5 \uC870\uBA85(`\uC644\uC804\uD55C \uD1B5\uC81C` `\uB3D9\uC77C\uD55C \uACB0\uACFC \uBC18\uBCF5 \uAC00\uB2A5`) |\n| \uC131\uC9C8 | `LIGHT-SOFT` / `LIGHT-HARD` / `LIGHT-SPOT` | \uC18C\uD504\uD2B8(`\uBA85\uC554 \uB300\uBE44\uAC00 \uB0AE\uACE0 \uADF8\uB9BC\uC790 \uACBD\uACC4\uAC00 \uBD80\uB4DC\uB7FD\uACE0`) / \uD558\uB4DC(`\uBA85\uC554 \uB300\uBE44\uAC00 \uD06C\uACE0 \uADF8\uB9BC\uC790 \uACBD\uACC4\uAC00 \uB610\uB837\uD558\uB2E4`) / \uC2A4\uD3EC\uD2B8(`\uBD88\uD544\uC694\uD55C \uC815\uBCF4\uB294 \uC5B4\uB460 \uC18D\uC5D0 \uC228\uAE30\uACE0`) |\n| \uBC29\uD5A5 | `LIGHT-DFRONT` `-SIDE` `-PLANE` `-BACK` `-TOP` `-UNDER` | \uC815\uBA74(`\uAE54\uB054\uD568`\u26A0\uFE0F`\uC785\uCCB4\uAC10\uC740 \uB2E4\uC18C \uC57D\uD574\uC9C8 \uC218 \uC788\uB2E4`) / \uCE21\uBA74(`\uB4DC\uB77C\uB9C8\uD2F1` `\uAE4A\uC774\uAC10`) / **\uB300\uAC01\uC120 45\xB0**(`\uAC00\uC7A5 \uC790\uC5F0\uC2A4\uB7FD\uACE0 \uADE0\uD615 \uC788\uAC8C` `\uD65C\uC6A9\uB3C4\uAC00 \uB192\uC740 \uC870\uBA85 \uBC29\uD5A5`) / \uB4B7\uBA74(`\uC678\uACFD\uC120\uACFC \uC2E4\uB8E8\uC5E3\uC744 \uAC15\uC870` `\uC2E0\uBE44\uB85C\uC6C0`) / \uC717\uBA74(`\uAD6C\uC870\uB97C \uB2E8\uB2E8\uD558\uAC8C` `\uBB34\uAC8C\uAC10`) / \uC544\uB7AB\uBA74(`\uBE44\uC77C\uC0C1\uC801\uC774\uACE0 \uB0AF\uC120 \uC778\uC0C1` `\uBD88\uC548` `\uAE30\uAD34\uD568`) |\n| \uBE44\uC728 | `LIGHT-HIKEY` / `LIGHT-LOKEY` | \uD558\uC774 \uD0A4(`\uBC1D\uACE0 \uBD80\uB4DC\uB7EC\uC6B4 \uD1A4` `\uC0B0\uB73B\uD568`) / \uB85C\uC6B0 \uD0A4(`\uAE4A\uC774\uAC10\uACFC \uAE34\uC7A5\uAC10` `\uBB34\uAC8C\uAC10 \uC788\uACE0 \uADF9\uC801\uC778`) |\n| \uC628\uB3C4 | `LIGHT-TWARM` `-NEU` `-COOL` | \uC6DC(`\uB530\uB73B\uD568, \uD3B8\uC548\uD568, \uCE5C\uBC00\uD568`) / \uB274\uD2B8\uB7 ## \uB108\uC758 \uC5ED\uD560 \u2014 \uAE30\uD68D \uD2C0\uB85C \uC815\uB9AC
\uACBD\uC7C1\uC5D0\uC11C \uC774\uAE34 \uC548\uC744 \uAE30\uD68D\uC758 \uD2C0\uB85C \uC815\uB9AC\uD574 Concept Theme\uAE4C\uC9C0 \uB0B8\uB2E4. \uD2C0\uC740 \uCE78\uC774\uB2E4. **\uC0C8\uB85C \uCD94\uB860\uD558\uC9C0 \uC54A\uB294\uB2E4.** \uC544\uB798 \uC7AC\uB8CC\uC640 \uD329\uD2B8\uBD81\uC73C\uB85C \uCE78\uC744 \uCC44\uC6B0\uACE0, \uCE78\uB9C8\uB2E4 \`from\`\uC5D0 \uADFC\uAC70 id(N \xB7 R \xB7 B \xB7 F \xB7 \uD310\uB2E8 id)\uB97C \uC801\uB294\uB2E4.

## \uCE78\uACFC \uD615\uC2DD
- \`jtbd\`: \uD0C0\uAC9F\uC774 \uD574\uACB0\uD558\uB824\uB294 \uC77C. situation(\uC5B4\uB5A4 \uC0C1\uD669\uC5D0\uC11C) \xB7 motivation(\uBB34\uC5C7\uC744 \uD558\uB824\uACE0) \xB7 outcome(\uC5B4\uB5BB\uAC8C \uB418\uAE30\uB97C \uBC14\uB77C\uB098) \uC138 \uBD80\uBD84\uC73C\uB85C \uC4F4\uB2E4.
- \`competition\`: \uADF8 \uC77C\uC744 \uC9C0\uAE08 \uB300\uC2E0 \uD574 \uC8FC\uB294 \uAC83\uB4E4. \uAC19\uC740 \uC5C5\uC885\uB9CC \uBCF4\uC9C0 \uC54A\uB294\uB2E4(\uC2DC\uAC04\uC744 \uB450\uACE0 \uB2E4\uD22C\uB294 \uAC83\uB3C4 \uACBD\uC7C1\uC774\uB2E4). \uAC01\uAC01 who \xB7 does(\uBB34\uC5C7\uC744 \uD574 \uC8FC\uB098) \xB7 gap(\uD574 \uC8FC\uC9C0 \uBABB\uD558\uB294 \uAC83).
- \`positioning\`: \uACBD\uC7C1\uC774 \uC11C \uC788\uB294 \uC790\uB9AC(crowd)\uC640 \uC774 \uC548\uC774 \uC124 \uBE48\uC790\uB9AC(place) \uD55C \uAD6C\uC808, \uADF8\uB9AC\uACE0 \uADF8 \uB458\uC744 \uAC00\uB974\uB294 \uCD95(axis).
- \`ksf\`: \uADF8 \uC790\uB9AC\uC5D0\uC11C \uC774\uAE30\uB824\uBA74 \uBC18\uB4DC\uC2DC \uB418\uC5B4\uC57C \uD558\uB294 \uAC83 2~4\uAC1C. \uC774\uAE34 \uC548\uC774 \uBC1B\uC740 \uACF5\uACA9\uACFC \uACE0\uCE5C \uAC83\uC5D0\uC11C \uAC00\uC838\uC628\uB2E4.
- \`claim\`: Key Claim \uD55C \uBB38\uC7A5 \u2014 \uD0C0\uAC9F\uC5D0\uAC8C \uD558\uB294 \uC57D\uC18D. rtb\uC5D0 \uADF8 \uC57D\uC18D\uC744 \uBBFF\uAC8C \uD558\uB294 \uADFC\uAC70(\uD329\uD2B8 id \uB610\uB294 \uC548\uC758 \uC7A5\uCE58)\uB97C \uC801\uB294\uB2E4.
- \`theme\`: Concept Theme \uD55C \uAD6C\uC808\uACFC \uADF8\uAC83\uC774 \uB098\uC628 \uC774\uC720. \uCC28\uBCC4\uD654\uC758 \uC815\uC758\uB85C \uBCF8\uB2E4 \u2014 \uB2E4\uB974\uAE30\uB9CC \uD55C \uB9D0\uC774 \uC544\uB2C8\uB77C \uD0C0\uAC9F\uC5D0\uAC8C \uC758\uBBF8\uAC00 \uC788\uACE0 \uC774 \uC11C\uBE44\uC2A4\uC5EC\uC57C \uD558\uB294 \uB9D0\uC774\uC5B4\uC57C \uD55C\uB2E4.

## \uADDC\uCE59

C8\uC998\uACFC \uAC08\uB9AC\uB294 \uC9C0\uC810\uC774\uB2E4.","\uC790\uC720\uB85C\uC6B4 \uACE1\uC120 \uB300\uC2E0 \uC6D0\uD638, \uB098\uC120\uCC98\uB7FC \uC790\uB85C \uADF8\uB9B0 \uACE1\uC120\uC744 \uC4F4\uB2E4.","\uD06C\uB86C, \uD50C\uB77C\uC2A4\uD2F1 \uAC19\uC740 \uACF5\uC5C5 \uC7AC\uB8CC\uB97C \uC0C1\uC544, \uACE0\uAE09 \uBAA9\uC7AC\uC640 \uAC19\uC740 \uACE0\uAE09 \uC7AC\uB8CC\uB85C \uC4F4\uB2E4.","\uBC31\uD654\uC810, \uC5EC\uAC1D\uC120, \uC601\uD654\uAD00, \uAD11\uACE0\uB97C \uC815\uC2DD \uB514\uC790\uC778 \uBB34\uB300\uB85C \uBCF8\uB2E4.","\uB300\uC0C1\uC744 \uADF8\uB300\uB85C \uADF8\uB9AC\uC9C0 \uC54A\uB294\uB2E4. \uC724\uACFD\uB9CC \uB0A8\uACA8 \uAE30\uD638\uCC98\uB7FC \uB9CC\uB4E0\uB2E4."]},"ISM-FUTUR":{summary:"\uAE00\uC790\uC758 \uBAA8\uC591, \uD06C\uAE30, \uBC29\uD5A5\uC774 \uADF8 \uC790\uCCB4\uB85C \uB73B\uC744 \uB9CC\uB4E0\uB2E4.",principles:["\uC11C\uCCB4, \uD06C\uAE30, \uAE30\uC6B8\uAE30, \uBC29\uD5A5\uC744 \uACE0\uB974\uB294 \uAC83\uB3C4 \uB0B4\uC6A9\uC774\uB2E4. \uB73B\uC5D0 \uB9DE\uCDB0 \uACE0\uB978\uB2E4.","\uD398\uC774\uC9C0\uB97C \uACE0\uB974\uAC8C \uB9DE\uCD94\uC9C0 \uC54A\uB294\uB2E4. \uAE00\uC758 \uD750\uB984\uC774 \uAE09\uD558\uAC8C \uBC14\uB00C\uBA74 \uC870\uD310\uB3C4 \uBC14\uAFBC\uB2E4.","\uBB38\uC7A5 \uADDC\uCE59\uACFC \uBB38\uC7A5\uBD80\uD638\uB97C \uD480\uACE0 \uAE00\uC790\uC758 \uBC30\uCE58\uB85C \uC77D\uB294 \uC21C\uC11C\uB97C \uB9CC\uB4E0\uB2E4. \uD55C\uB208\uC5D0 \uC5EC\uB7EC \uACF3\uC774 \uAC19\uC774 \uC77D\uD788\uAC8C \uD55C\uB2E4.","\uD45C\uD604\uD558\uB824\uB294 \uB300\uC0C1\uC758 \uB290\uB08C\uACFC \uAE00\uC790 \uBAA8\uC591\uC744 \uB9DE\uCD98\uB2E4. \uD070 \uC18C\uB9AC\uB294 \uD06C\uAC8C, \uBE60\uB978 \uAC83\uC740 \uAE30\uC6B8\uC5EC\uC11C \uC4F4\uB2E4.","\uC885\uC774\uC640 \uCC45\uC758 \uBB3C\uC131\uC744 \uC228\uAE30\uC9C0 \uC54A\uB294\uB2E4. \uCC45\uC744 \uC190\uC5D0 \uC7A1\uD788\uB294 \uBB3C\uAC74\uC73C\uB85C \uB2E4\uB8EC\uB2E4."]},"ISM-DADA":{summary:"\uC0C8\uB85C \uB9CC\uB4E4\uAE30\uBCF4\uB2E4 \uC774\uBBF8 \uC788\uB294 \uAC83\uC744 \uACE8\uB77C\uC11C \uB9DE\uBD80\uB52A\uCE58\uAC8C \uD55C\uB2E4.",principles:["\uC7AC\uB8CC\uB97C \uB9CC\uB4E4\uC9C0 \uC54A\uACE0 \uACE8\uB77C\uC11C \uB098\uB780\uD788 \uB193\uB294\uB2E4. \uACE0\uB974\uACE0 \uB193\uB294 \uC77C\uC774 \uC791\uD488\uC774 \uB41C\uB2E4.","\uC6B0\uC5F0\uACFC \uADDC\uCE59\uC5D0 \uACB0\uC815\uC744 \uC77C\uBD80 \uB9E1\uAE34\uB2E4. \uC791\uAC00 \uCDE8\uD5A5\uB300\uB85C\uB9CC \uB098\uC624\uB294 \uBED4\uD55C \uACB0\uACFC\uB97C \uD53C\uD55C\uB2E4.","\uC778\uC1C4\uBB3C, \uAE00\uC790, \uC0AC\uC9C4\uC5D0\uB294 \uC774\uBBF8 \uC785\uC7A5\uC774 \uB2F4\uACA8 \uC788\uB2E4. \uC798\uB77C\uC11C \uB2E4\uC2DC \uB193\uC73C\uBA74 \uADF8\uAC83\uC774 \uBE44\uD3C9\uC774 \uB41C\uB2E4.","\uC694\uC18C\uB97C \uC5B4\uC6B8\uB9AC\uAC8C \uC11E\uC9C0 \uC54A\uACE0 \uB9DE\uBD80\uB52A\uCE58\uAC8C \uB454\uB2E4. \uB73B\uC740 \uADF8 \uCDA9\uB3CC\uC5D0\uC11C \uB098\uC628\uB2E4.","\uC774\uC5B4 \uBD99\uC778 \uC790\uAD6D\uACFC \uCC22\uAE34 \uC790\uB9AC\uB97C \uC9C0\uC6B0\uC9C0 \uC54A\uACE0 \uBCF4\uC774\uAC8C \uB454\uB2E4."]},"ISM-SUPREM":{summary:"\uB300\uC0C1\uC744 \uADF8\uB9AC\uC9C0 \uC54A\uC744 \uB54C \uD615\uD0DC\uC640 \uC0C9\uC758 \uB290\uB08C\uB9CC \uC804\uB2EC\uD560 \uC218 \uC788\uB2E4.",principles:["\uB300\uC0C1\uC744 \uADF8\uB9AC\uC9C0 \uC54A\uB294\uB2E4. \uD615\uD0DC\uC640 \uC0C9\uB9CC \uB0A8\uAE34\uB2E4.","\uD615\uD0DC\uC5D0 \uC0C1\uC9D5\uC774\uB098 \uC774\uC57C\uAE30\uB97C \uBD99\uC774\uC9C0 \uC54A\uB294\uB2E4. \uC124\uBA85\uC774 \uD544\uC694\uD55C \uD615\uD0DC\uB294 \uC4F0\uC9C0 \uC54A\uB294\uB2E4.","\uAC00\uC7A5 \uC791\uC740 \uB2E8\uC704\uAE4C\uC9C0 \uC904\uC778\uB2E4. \uC904\uC774\uBA74 \uD45C\uD604\uC774 \uC881\uC544\uC9C0\uC9C0 \uC54A\uACE0 \uC0C8 \uCD9C\uBC1C\uC810\uC774 \uC0DD\uAE34\uB2E4.","\uC6D0\uADFC\uBC95\uC744 \uC4F0\uC9C0 \uC54A\uB294\uB2E4. \uD770 \uBC14\uD0D5 \uC704\uC5D0\uC11C \uD06C\uAE30, \uAC01\uB3C4, \uAC70\uB9AC\uB9CC\uC73C\uB85C \uAE4A\uC774\uB97C \uB9CC\uB4E0\uB2E4.","\uD615\uD0DC\uB97C \uBA3C\uC800 \uC815\uD558\uACE0 \uC4F8\uBAA8\uB294 \uB098\uC911\uC5D0 \uCC3E\uB294\uB2E4. \uAD6C\uC131\uC8FC\uC758\uC640 \uAC08\uB9AC\uB294 \uC9C0\uC810\uC774\uB2E4."]},"ISM-CONSTR":{summary:"\uC608\uC220\uAC00\uB97C \uC791\uD488 \uB9CC\uB4DC\uB294 \uC0AC\uB78C\uC774 \uC544\uB2C8\uB77C \uC0AC\uD68C\uC5D0 \uC4F8 \uBB3C\uAC74\uC744 \uC124\uACC4\uD558\uB294 \uC0AC\uB78C\uC73C\uB85C \uBCF8\uB2E4.",principles:["\uC608\uC220\uAC00\uB97C \uC0AC\uD68C\uC5D0 \uC4F8 \uBB3C\uAC74\uC744 \uC124\uACC4\uD558\uB294 \uAE30\uC220\uC790\uB85C \uBCF8\uB2E4.","\uC7AC\uB8CC\uB97C \uB2E4\uB978 \uAC83\uCC98\uB7FC \uAFB8\uBBF8\uC9C0 \uC54A\uB294\uB2E4. \uC7AC\uC9C8\uACFC \uAC00\uACF5\uD55C \uC790\uAD6D\uC744 \uADF8\uB300\uB85C \uB454\uB2E4.","\uBCF4\uAE30 \uC88B\uAC8C \uBC30\uC5F4\uD558\uC9C0 \uC54A\uACE0 \uAD6C\uC870\uC0C1 \uD544\uC694\uD55C \uAC83\uB9CC \uC870\uB9BD\uD55C\uB2E4. \uBE7C\uB3C4 \uBB34\uB108\uC9C0\uC9C0 \uC54A\uB294 \uC694\uC18C\uB294 \uBE80\uB2E4.","\uBAA8\uB4E0 \uD615\uD0DC\uB97C \uBAA9\uC801\uC5D0\uC11C \uC815\uD55C\uB2E4. \uBAA9\uC801\uC744 \uB308 \uC218 \uC5C6\uB294 \uD615\uD0DC\uB294 \uC4F0\uC9C0 \uC54A\uB294\uB2E4.","\uD3EC\uC2A4\uD130, \uCC45, \uC9C1\uBB3C, \uC601\uD654\uCC98\uB7FC \uC0AC\uB78C\uB4E4\uC774 \uC2E4\uC81C\uB85C \uB9CC\uB098\uB294 \uB9E4\uCCB4\uC5D0\uC11C \uC77C\uD55C\uB2E4."]},"ISM-STIJL":{summary:"\uC4F0\uB294 \uC694\uC18C\uB97C \uCD5C\uC18C\uB85C \uC904\uC5EC \uB204\uAD6C\uC5D0\uAC8C\uB098 \uD1B5\uD558\uB294 \uC9C8\uC11C\uB97C \uB0A8\uAE30\uACE0, \uADF8 \uC9C8\uC11C\uB97C \uD68C\uD654, \uAC00\uAD6C, \uAC74\uCD95\uC5D0 \uB611\uAC19\uC774 \uC4F4\uB2E4.",principles:["\uAC1C\uC778\uC801\uC774\uACE0 \uC6B0\uC5F0\uD55C \uBAA8\uC591\uC744 \uAC77\uC5B4 \uB0B4\uACE0 \uBAA8\uB450\uC5D0\uAC8C \uACF5\uD1B5\uB41C \uC9C8\uC11C\uB9CC \uB0A8\uAE34\uB2E4.","\uC4F0\uB294 \uC694\uC18C\uB97C \uCD5C\uC18C\uB85C \uC81C\uD55C\uD55C\uB2E4. \uADF8\uB7EC\uBA74 \uC694\uC18C \uC0AC\uC774\uC758 \uAD00\uACC4\uB9CC\uC73C\uB85C \uD654\uBA74\uC744 \uB9CC\uB4E4\uAC8C \uB41C\uB2E4.","\uB300\uCE6D\uC744 \uC4F0\uC9C0 \uC54A\uB294\uB2E4. \uBE44\uB300\uCE6D\uC778\uB370\uB3C4 \uADE0\uD615\uC774 \uC7A1\uD78C \uC0C1\uD0DC\uB97C \uB9CC\uB4E0\uB2E4.","\uD68C\uD654, \uAC74\uCD95, \uAC00\uAD6C, \uC778\uC1C4\uC5D0 \uAC19\uC740 \uC6D0\uB9AC\uB97C \uC4F4\uB2E4.","\uBA74\uACFC \uC120\uC744 \uC0AC\uBB3C\uC758 \uC724\uACFD\uC73C\uB85C \uC4F0\uC9C0 \uC54A\uACE0 \uACF5\uAC04\uC744 \uB098\uB204\uB294 \uC694\uC18C\uB85C \uC4F4\uB2E4."]},"ISM-BAUHAUS":{summary:"\uC608\uC220\uACFC \uC0B0\uC5C5 \uC0DD\uC0B0\uC744 \uD558\uB098\uB85C \uBCF4\uACE0, \uC870\uD615\uC744 \uAC00\uB974\uCE58\uACE0 \uB418\uD480\uC774\uD560 \uC218 \uC788\uB294 \uCCB4\uACC4\uB85C \uB9CC\uB4E0\uB2E4.",principles:["\uD615\uD0DC\uB97C \uC61B \uC591\uC2DD\uC5D0\uC11C \uAC00\uC838\uC624\uC9C0 \uC54A\uACE0 \uAE30\uB2A5, \uC7AC\uB8CC, \uB9CC\uB4DC\uB294 \uACF5\uC815\uC5D0\uC11C \uC815\uD55C\uB2E4.","\uC608\uC220\uACFC \uAE30\uC220\uC744 \uD55C \uACFC\uC815\uC73C\uB85C \uB2E4\uB8EC\uB2E4.","\uC870\uD615\uC744 \uC7AC\uB2A5\uC774 \uC544\uB2C8\uB77C \uBC30\uC6B8 \uC218 \uC788\uB294 \uAE30\uCD08 \uBB38\uBC95\uC73C\uB85C \uAC00\uB974\uCE5C\uB2E4.","\uB300\uB7C9\uC0DD\uC0B0\uC73C\uB85C \uB9CE\uC740 \uC0AC\uB78C\uC774 \uC4F0\uAC8C \uD55C\uB2E4. \uADF8\uB798\uC11C \uC644\uC131\uD488\uC774 \uC544\uB2C8\uB77C \uACF5\uC7A5\uC5D0\uC11C \uCC0D\uC744 \uC6D0\uD615\uC744 \uB9CC\uB4E0\uB2E4.","\uC7A5\uC2DD\uC744 \uAE08\uC9C0\uD558\uC9C0 \uC54A\uB294\uB2E4. \uC65C \uD544\uC694\uD55C\uC9C0 \uC124\uBA85\uD560 \uC218 \uC788\uB294 \uC7A5\uC2DD\uB9CC \uC4F4\uB2E4."]},"ISM-SWISS":{summary:"\uB514\uC790\uC774\uB108\uC758 \uD45C\uD604\uBCF4\uB2E4 \uC815\uBCF4 \uC804\uB2EC\uC744 \uC55E\uC138\uC6B0\uACE0, \uC124\uBA85\uD560 \uC218 \uC788\uB294 \uADDC\uCE59\uC73C\uB85C \uD654\uBA74\uC744 \uB9CC\uB4E0\uB2E4.",principles:["\uB514\uC790\uC774\uB108\uC758 \uAC1C\uC131\uBCF4\uB2E4 \uC815\uBCF4\uAC00 \uBD84\uBA85\uD558\uAC8C \uC77D\uD788\uB294 \uAC83\uC744 \uC55E\uC138\uC6B4\uB2E4.","\uBAA8\uB4E0 \uACB0\uC815\uC744 \uB098\uC911\uC5D0 \uC124\uBA85\uD560 \uC218 \uC788\uB294 \uADDC\uCE59\uC5D0\uC11C \uB0B8\uB2E4. \uCDE8\uD5A5\uC73C\uB85C \uC815\uD558\uC9C0 \uC54A\uB294\uB2E4.","\uACA9\uC790\uB97C \uBA3C\uC800 \uC9DC\uACE0 \uADF8 \uC704\uC5D0 \uC62C\uB9B0\uB2E4. \uACA9\uC790\uB294 \uBCF4\uC5EC \uC8FC\uB294 \uAC83\uC774 \uC544\uB2C8\uB77C \uD310\uB2E8\uD558\uB294 \uB3C4\uAD6C\uB2E4.","\uB300\uCE6D\uC73C\uB85C \uB9DE\uCD94\uC9C0 \uC54A\uACE0 \uC694\uC18C\uC758 \uBB34\uAC8C\uB97C \uB098\uB220 \uADE0\uD615\uC744 \uC7A1\uB294\uB2E4.","\uD2B9\uC815 \uBB38\uD654\uC758 \uC7A5\uC2DD\uC744 \uB35C\uC5B4 \uB0B4 \uB204\uAD6C\uB098 \uC77D\uC744 \uC218 \uC788\uAC8C \uD55C\uB2E4."]},"ISM-BRUTAL":{summary:"\uBB34\uC5C7\uC73C\uB85C \uB9CC\uB4E4\uC5C8\uACE0 \uC5B4\uB5BB\uAC8C \uC791\uB3D9\uD558\uB294\uC9C0 \uC228\uAE30\uC9C0 \uC54A\uB294\uB2E4. \uCDE8\uD5A5\uC774 \uC544\uB2C8\uB77C \uB9CC\uB4DC\uB294 \uC0AC\uB78C\uC758 \uCC45\uC784\uC73C\uB85C \uBCF8\uB2E4.",principles:["\uC7AC\uB8CC\uB97C \uB2E4\uB978 \uC7AC\uB8CC\uCC98\uB7FC \uBCF4\uC774\uAC8C \uB36E\uC9C0 \uC54A\uB294\uB2E4. \uCF58\uD06C\uB9AC\uD2B8\uB294 \uCF58\uD06C\uB9AC\uD2B8\uB85C \uBCF4\uC774\uAC8C \uB454\uB2E4.","\uAD6C\uC870\uB97C \uAC89\uBA74 \uB4A4\uC5D0 \uAC10\uCD94\uC9C0 \uC54A\uACE0 \uBCF4\uC774\uB294 \uC694\uC18C\uB85C \uC4F4\uB2E4.","\uC5B4\uB5BB\uAC8C \uBCF4\uC774\uB294\uC9C0\uAC00 \uC544\uB2C8\uB77C \uBB34\uC5C7\uC744 \uC228\uAE30\uC9C0 \uC54A\uC558\uB294\uC9C0\uB85C \uD3C9\uAC00\uD55C\uB2E4.","\uC8FC\uC5B4\uC9C4 \uC870\uAC74\uC744 \uACE0\uCCD0\uC57C \uD560 \uACB0\uD568\uC73C\uB85C \uBCF4\uC9C0 \uC54A\uACE0 \uC124\uACC4\uC758 \uCD9C\uBC1C\uC810\uC73C\uB85C \uC4F4\uB2E4.","\uD3B8\uD558\uAC8C \uBCF4\uC774\uB824\uACE0 \uB9E4\uCCB4\uC758 \uAE30\uBCF8 \uAD6C\uC870\uB97C \uAC10\uCD94\uC9C0 \uC54A\uB294\uB2E4. \uC6F9\uC774\uBA74 \uAE30\uBCF8 \uB9C1\uD06C\uC640 \uAE30\uBCF8 \uC591\uC2DD\uC744 \uADF8\uB300\uB85C \uC4F4\uB2E4."]},"ISM-POSTMOD":{summary:"\uC633\uC740 \uC591\uC2DD\uC774 \uD558\uB098\uB77C\uB294 \uC804\uC81C\uB97C \uBC84\uB9AC\uACE0, \uB514\uC790\uC778\uC774 \uBB34\uC5C7\uC744 \uB9D0\uD558\uB294\uC9C0\uB97C \uAE30\uB2A5\uB9CC\uD07C \uC911\uC694\uD558\uAC8C \uB2E4\uB8EC\uB2E4.",principles:["\uD615\uD0DC\uB9CC\uC73C\uB85C\uB294 \uB73B\uC774 \uC0DD\uAE30\uC9C0 \uC54A\uB294\uB2E4. \uCC38\uC870\uC640 \uC778\uC6A9, \uC0AC\uB78C\uB4E4\uC774 \uC544\uB294 \uCF54\uB4DC\uB85C \uB73B\uC744 \uB9CC\uB4E0\uB2E4.","\uBCF5\uC7A1\uD568\uACFC \uBAA8\uC21C\uC744 \uC5C6\uC560\uC9C0 \uC54A\uACE0 \uD45C\uD604 \uC7AC\uB8CC\uB85C \uC4F4\uB2E4.","\uBAA8\uB4E0 \uBB38\uC81C\uC5D0 \uD1B5\uD558\uB294 \uC591\uC2DD\uC740 \uC5C6\uB2E4\uACE0 \uBCF8\uB2E4. \uB9E5\uB77D\uB9C8\uB2E4 \uB2E4\uB974\uAC8C \uD47C\uB2E4.","\uACE0\uAE09\uACFC \uC800\uAE09\uC758 \uAD6C\uBD84\uC744 \uB530\uB974\uC9C0 \uC54A\uB294\uB2E4. \uD0A4\uCE58\uC640 \uB300\uC911\uBB38\uD654\uB97C \uC7AC\uB8CC\uB85C \uC4F4\uB2E4.","\uBB3C\uAC74\uC774 \uBB34\uC5C7\uC744 \uD558\uB294\uC9C0\uC640 \uD568\uAED8 \uBB34\uC5C7\uC744 \uB9D0\uD558\uB294\uC9C0\uB3C4 \uC124\uACC4\uD55C\uB2E4."]},"ISM-DECON":{summary:"\uD574\uCCB4\uB294 \uAE68\uB728\uB9B0 \uBAA8\uC591\uC774 \uC544\uB2C8\uB2E4. \uC774 \uC704\uACC4\uB97C \uB204\uAC00 \uC815\uD588\uB294\uC9C0 \uBB3B\uB294 \uC808\uCC28\uB2E4.",principles:["\uB73B\uC740 \uC694\uC18C \uC0AC\uC774\uC758 \uCC28\uC774\uC640 \uAC04\uACA9\uC5D0\uC11C \uC0DD\uAE34\uB2E4. \uC5EC\uBC31, \uAC04\uACA9, \uD2C0\uC744 \uB73B\uC744 \uB9CC\uB4DC\uB294 \uC694\uC18C\uB85C \uC4F4\uB2E4.","\uB9CC\uB4E0 \uC0AC\uB78C\uC758 \uC758\uB3C4\uB85C \uB73B\uC774 \uB05D\uB098\uC9C0 \uC54A\uB294\uB2E4. \uC77D\uB294 \uC0AC\uB78C\uC774 \uB73B\uC744 \uC644\uC131\uD558\uAC8C \uC790\uB9AC\uB97C \uB0A8\uAE34\uB2E4.","\uC704\uACC4\uB294 \uAD00\uC2B5\uC73C\uB85C \uC815\uD574\uC9C4 \uAC83\uC774\uB2E4. \uB4A4\uC9D1\uC5B4 \uBCF4\uACE0 \uADF8\uB3D9\uC548 \uBB34\uC5C7\uC774 \uAC00\uB824\uC84C\uB294\uC9C0 \uD655\uC778\uD55C\uB2E4.","\uAD6C\uC870\uC758 \uACB0\uD568\uACFC \uBAA8\uC21C\uC744 \uC9C0\uC6B0\uC9C0 \uC54A\uB294\uB2E4. \uADF8 \uAD6C\uC870\uAC00 \uBB34\uC5C7\uC744 \uB2F9\uC5F0\uD558\uAC8C \uC5EC\uACBC\uB294\uC9C0 \uBCF4\uC5EC \uC8FC\uB294 \uC99D\uAC70\uB85C \uC4F4\uB2E4.","\uC870\uAC01\uB0B4\uB294 \uAC83\uB9CC\uC73C\uB85C\uB294 \uD574\uCCB4\uAC00 \uC544\uB2C8\uB2E4. \uC9C8\uBB38\uC744 \uAC70\uCE5C \uACB0\uACFC\uC5EC\uC57C \uD55C\uB2E4."]},"ISM-PUNK":{summary:"\uB3C4\uAD6C\uAC00 \uC2F8\uACE0 \uD754\uD558\uBA74 \uB204\uAD6C\uB098 \uB9CC\uB4E4 \uC218 \uC788\uB2E4. \uAC70\uCE5C \uB9C8\uAC10\uC740 \uADF8 \uC99D\uAC70\uB2E4.",principles:["\uC2F8\uACE0 \uD754\uD55C \uB3C4\uAD6C\uB85C \uB9CC\uB4E0\uB2E4. \uB204\uAD6C\uB098 \uB9CC\uB4E4 \uC218 \uC788\uAC8C \uB41C\uB2E4.","\uB9E4\uB048\uD55C \uC644\uC131\uB3C4\uB294 \uAD8C\uC704\uB97C \uB9CC\uB4E0\uB2E4. \uC77C\uBD80\uB7EC \uAC70\uCE60\uAC8C \uB0A8\uACA8 \uADF8 \uAD8C\uC704\uB97C \uAC70\uBD80\uD55C\uB2E4.","\uC774\uBBF8 \uC788\uB294 \uC774\uBBF8\uC9C0\uB97C \uC798\uB77C \uB2E4\uB978 \uC790\uB9AC\uC5D0 \uB193\uB294\uB2E4. \uC6D0\uB798 \uB73B\uC774 \uB4A4\uC9D1\uD78C\uB2E4.","\uBCF5\uC0AC\uAE30, \uC2A4\uD14C\uC774\uD50C\uB7EC, \uC6B0\uD3B8\uC73C\uB85C \uC9C1\uC811 \uCC0D\uC5B4 \uB3CC\uB9B0\uB2E4. \uAE30\uC874 \uC720\uD1B5\uC744 \uAC70\uCE58\uC9C0 \uC54A\uB294\uB2E4.","\uBE44\uC804\uBB38\uAC00\uAC00 \uB9CC\uB4E0 \uAC83\uCC98\uB7FC \uBCF4\uC774\uAC8C \uB454\uB2E4. \uADF8\uB798\uC57C \uB2E4\uC74C \uC0AC\uB78C\uC774 \uB530\uB77C \uB9CC\uB4E0\uB2E4."]},"ISM-JP":{summary:"\uC801\uAC8C \uC4F0\uB294 \uCDE8\uD5A5\uC774 \uC544\uB2C8\uB2E4. \uC644\uC131\uC744 \uBBF8\uB904 \uB450\uACE0 \uBCF4\uB294 \uC0AC\uB78C\uC774 \uCC44\uC6B0\uAC8C \uD558\uB294 \uC124\uACC4\uB2E4.",principles:["\uBD88\uC644\uC804\uD55C \uBD80\uBD84\uC744 \uACE0\uCE58\uC9C0 \uC54A\uACE0 \uB454\uB2E4. \uC2DC\uAC04\uACFC \uACFC\uC815\uC774 \uC9C0\uB098\uAC04 \uC790\uAD6D\uC73C\uB85C \uC77D\uD78C\uB2E4.","\uBE48 \uACF3\uC744 \uBE44\uC6CC \uB454\uB2E4. \uC694\uC18C \uC0AC\uC774\uC758 \uAC04\uACA9\uC774 \uAD00\uACC4\uB97C \uB9CC\uB4E4\uACE0 \uBCF4\uB294 \uC0AC\uB78C\uC774 \uB73B\uC744 \uCC44\uC6B4\uB2E4.","\uB300\uCE6D\uC73C\uB85C \uB2EB\uC9C0 \uC54A\uACE0 \uBE44\uB300\uCE6D\uC73C\uB85C \uC5F4\uC5B4 \uB454\uB2E4
