## A-99. \uC0AC\uC870 \uAD50\uCC28 \uCC38\uC870 \u2014 \uAC19\uC740 \uBB38\uC81C\uC5D0 \uB2E4\uB978 \uB2F5

\uC5EC\uD589 \uC911 **\uB300\uB9BD\uD558\uB294 \uC0AC\uC870\uB97C \uD568\uAED8 \uACE0\uB97C \uB54C** \uC774 \uD45C\uB97C \uBCF8\uB2E4. \uB300\uB9BD\uC744 \uBAA8\uB974\uACE0 \uC11E\uC73C\uBA74 \uADFC\uBCF8\uC774 \uC0AC\uB77C\uC9C4\uB2E4.

| \uC7C1\uC810 | \uD55C\uCABD | \uBC18\uB300\uCABD |
|---|---|---|
| \uD615\uD0DC\uC758 \uC815\uB2F9\uC131 | \`ISM-SUPREM\` \uC21C\uC218 \uAC10\uAC01 \uADF8 \uC790\uCCB4 | \`ISM-CONSTR\` \uC0AC\uD68C\uC801 \uBAA9\uC801\uC5D0\uC11C \uC5F0\uC5ED |
| \uC7A5\uC2DD | \`ISM-BAUHAUS\` \uC785\uC99D \uB300\uC0C1 | \`ISM-POSTMOD\` \uC758\uBBF8\uC758 \uC0DD\uC0B0 \uC218\uB2E8 ("Less is a bore") |
| \uAC1C\uC131 | \`ISM-SWISS\` \uC815\uBCF4 \uBA85\uB8CC\uD568\uC774 \uAC1C\uC131\uBCF4\uB2E4 \uC6B0\uC120 | \`ISM-POSTMOD\` \uC131\uACA9\uC774 \uAE30\uB2A5\uACFC \uB3D9\uB4F1 |
| \uC644\uC131\uB3C4 | \`ISM-ARTCRAFT\` \uB178\uB3D9\uC758 \uC9C8\uC774 \uACB0\uACFC\uC758 \uC9C8 | \`ISM-PUNK\` \uC644\uC131\uB3C4\uB294 \uAD8C\uC704\uC758 \uC7A5\uCE58 |
| \uC644\uACB0 | \`ISM-STIJL\` \uBCF4\uD3B8\uC801 \uC9C8\uC11C\uC5D0 \uB3C4\uB2EC | \`ISM-JP\` \uC644\uACB0\uC744 \uC720\uBCF4\uD574 \uCC38\uC5EC\uB97C \uC694\uAD6C |
| \uD1B5\uC81C | \`ISM-SWISS\` \uC124\uBA85 \uAC00\uB2A5\uD55C \uADDC\uCE59 | \`ISM-KR\` \uBCC0\uC218\uB97C \uACB0\uACFC\uC758 \uC77C\uBD80\uB85C \uC218\uC6A9 |
| \uADF8\uB9AC\uB4DC | \`ISM-SWISS\` \uBCF4\uC774\uC9C0 \uC54A\uB294 \uAD6C\uC870\uAC00 \uC9C0\uBC30 | \`ISM-DECON\` \uC704\uACC4\uB294 \uAD00\uC2B5\uC801 \uAD6C\uC131\uBB3C, \uB4A4\uC9D1\uC744 \uC218 \uC788\uB2E4 |
| \uB9E4\uCCB4 | \`ISM-NOUVEAU\` \uCD1D\uCCB4\uC608\uC220\uB85C \uD1B5\uD569 | \`ISM-BRUTAL\` \uAE30\uBCF8\uAC12\uC744 \uADF8\uB300\uB85C \uC874\uC911 |

**\uB300\uB9BD\uC744 \uC11E\uB294 \uBC29\uBC95**: \uC801\uC6A9 \uC601\uC5ED\uC744 \uB098\uB208\uB2E4. L0 \xA76.1\uC758 "\uAD00\uC131\uC740 \uAD6C\uC870\uC5D0\uC11C, \uC0C8\uB85C\uC6C0\uC740 \uD574\uC11D\uC5D0\uC11C"\uAC00 \uADF8 \uC804\uD615\uC774\uB2E4 \u2014 \uAD6C\uC870\uC5D0 \`ISM-SWISS\`\xB7\`ISM-BRUTAL\`, \uD574\uC11D\uC5D0 \`ISM-POSTMOD\`\xB7\`ISM-DECON\`.`,summary:"\uD55C\uAD6D \uC804\uD1B5 \uBBF8\uD559\uC740 '\uC790\uC5F0\uC2A4\uB7FD\uACE0 \uC18C\uBC15\uD55C \uAC10\uC131'\uC774 \uC544\uB2C8\uB77C \uC7AC\uB8CC\uC640 \uC190\uC758 \uBCC0\uC218\uB97C \uACB0\uACFC\uC5D0 \uD3EC\uD568\uC2DC\uD0A4\uB294 \uC124\uACC4 \uD0DC\uB3C4\uC640 \uC0C9\uC744 \uC9C8\uC11C\uB85C \uC4F0\uB294 \uCF54\uB4DC \uCCB4\uACC4\uC774\uBA70, \uC774\uB97C '\uBE44\uC560'\uB098 '\uBBFC\uC871 \uC815\uC11C'\uB85C \uD658\uC6D0\uD558\uB294 \uC21C\uAC04 \uC2DD\uBBFC\uAE30 \uD504\uB808\uC784\uC744 \uB418\uBD88\uB7EC\uC628\uB2E4.",principles:["\uAE30\uAD50\uC758 \uBD80\uC7AC\uAC00 \uC544\uB2C8\uB77C '\uAE30\uAD50\uB97C \uC758\uC2DD\uD558\uC9C0 \uC54A\uB294 \uAE30\uAD50'\uB2E4(\uBB34\uAE30\uAD50\uC758 \uAE30\uAD50). \uBAA9\uD45C\uB294 \uC644\uC131\uB3C4\uC758 \uD3EC\uAE30\uAC00 \uC544\uB2C8\uB77C \uC644\uC131\uB3C4\uAC00 \uC758\uB3C4\uB85C \uB4DC\uB7EC\uB098\uC9C0 \uC54A\uB294 \uC0C1\uD0DC\uB2E4","\uACC4\uD68D\uC758 \uBD80\uC7AC\uAC00 \uC544\uB2C8\uB77C '\uACC4\uD68D\uC774 \uACB0\uACFC\uB97C \uC9C0\uBC30\uD558\uC9C0 \uC54A\uAC8C \uD558\uB294 \uACC4\uD68D'\uC774\uB2E4(\uBB34\uACC4\uD68D\uC758 \uACC4\uD68D). \uC7AC\uB8CC\xB7\uC190\xB7\uAC00\uB9C8\uC758 \uBCC0\uC218\uB97C \uC124\uACC4\uC5D0\uC11C \uBC30\uC81C\uD558\uC9C0 \uC54A\uACE0 \uACB0\uACFC\uC758 \uC77C\uBD80\uB85C \uC218\uC6A9\uD55C\uB2E4","\uC0DD\uD65C\uACFC \uC608\uC220\uC774 \uBD84\uD654\uB418\uC9C0 \uC54A\uC740 \uC0C1\uD0DC\uB97C \uAE30\uC900\uC73C\uB85C \uC0BC\uB294\uB2E4 \u2014 \uC4F0\uC784 \uC18D\uC5D0\uC11C \uD615\uD0DC\uB97C \uC5BB\uC740 \uBB3C\uAC74\uC774 \uBBF8\uC758 \uC6D0\uD615\uC774\uBBC0\uB85C \uC2E4\uC6A9\uC758 \uD754\uC801\uC740 \uBBF8\uC758 \uD6FC\uC190\uC774 \uC544\uB2C8\uB77C \uADFC\uAC70\uB2E4","\uADE0\uC81C(\u5747\u9F4A)\uB97C \uBAA9\uD45C\uB85C \uC0BC\uC9C0 \uC54A\uB294\uB2E4 \u2014 \uC815\uC6D0(\u6B63\u5713)\uC5D0\uC11C \uBC97\uC5B4\uB09C \uBCC0\uD615\uC740 \uAE30\uC220 \uBD80\uC871\uC774 \uC544\uB2C8\uB77C \uC190\uACFC \uC7AC\uB8CC\uAC00 \uB0A8\uAE34 \uC2DC\uAC04 \uAE30\uB85D\uC774\uBA70, \uB2EC\uD56D\uC544\uB9AC\uCC98\uB7FC \uB450 \uBC18\uAD6C\uB97C \uC811\uD569\uD574 \uC0DD\uAE30\uB294 \uBE44\uD2C0\uB9BC\uC740 \uD615\uD0DC\uC758 \uC644\uC131\uC5D0 \uC18D\uD55C\uB2E4","\uC0C9\uC740 \uAC10\uAC01\uC774 \uC544\uB2C8\uB77C \uC9C8\uC11C\uC758 \uD45C\uAE30\uB2E4. \uC624\uBC29\uC0C9\uC740 \uCDE8\uD5A5 \uD314\uB808\uD2B8\uAC00 \uC544\uB2C8\uB77C \uC74C\uC591\uC624\uD589\uC758 \uBC29\uC704\xB7\uACC4\uC808\xB7\uAE30\uB2A5\uC744 \uD45C\uAE30\uD558\uB294 \uCF54\uB4DC \uCCB4\uACC4\uB2E4(\uB3D9-\uCCAD-\uBAA9, \uB0A8-\uC801-\uD654, \uC11C-\uBC31-\uAE08, \uBD81-\uD751-\uC218, \uC911\uC559-\uD669-\uD1A0). \uC0C9\uC758 \uC120\uD0DD\uC740 \uACE7 \uC704\uCE58\uC640 \uAD00\uACC4\uC758 \uC120\uC5B8\uC774\uB2E4"],take:["'\uBB34\uACC4\uD68D\uC758 \uACC4\uD68D'\uC744 \uC2DC\uC2A4\uD15C \uC124\uACC4\uB85C \uBC88\uC5ED \u2014 \uBAA8\uB4E0 \uC0C1\uD0DC\uB97C \uADDC\uC815\uD558\uB824 \uD558\uC9C0 \uB9D0\uACE0, \uCF58\uD150\uCE20 \uAE38\uC774\xB7\uC0AC\uC6A9\uC790 \uC785\uB825\xB7\uAE30\uAE30 \uD3ED \uAC19\uC740 \uBCC0\uC218\uB97C \uACB0\uACFC\uC758 \uC77C\uBD80\uB85C \uD5C8\uC6A9\uD558\uB294 \uADDC\uCE59\uC744 \uC9E0\uB2E4(\uACE0\uC815 \uBAA9\uC5C5 \uB300\uC2E0 \uAC00\uBCC0 \uADDC\uCE59 + \uD5C8\uC6A9 \uC624\uCC28 \uC815\uC758). \uD1B5\uC81C \uC2E4\uD328\uAC00 \uC544\uB2C8\uB77C \uD1B5\uC81C \uBC94\uC704\uC758 \uC758\uB3C4\uC801 \uC124\uACC4\uB2E4","\uC5EC\uBC31\uC744 \uC704\uACC4 \uC7A5\uCE58\uB85C \u2014 \uD06C\uAE30\xB7\uAD75\uAE30\xB7\uC0C9\uC73C\uB85C \uAC15\uC870\uB97C \uB9CC\uB4DC\uB294 \uB300\uC2E0 \uC8FC\uBCC0\uC744 \uBE44\uC6CC \uAC15\uC870\uB97C \uB9CC\uB4DC\uB294 \uBC29\uC2DD\uC740 \uC800\uCC44\uB3C4\xB7\uC800\uB300\uBE44 UI\uC5D0\uC11C \uC815\uBCF4\uB7C9\uC744 \uC720\uC9C0\uD558\uBA70 \uC18C\uC74C\uC744 \uC904\uC774\uB294 \uC2E4\uC9C8\uC801 \uAE30\uBC95\uC774\uB2E4",'\uC624\uBC29\uC0C9\uC744 \uD314\uB808\uD2B8\uAC00 \uC544\uB2C8\uB77C \uC2DC\uB9E8\uD2F1 \uCF54\uB4DC\uB85C \uC218\uC6A9 \u2014 \uC0C9\uC744 \uC0C1\uD0DC\xB7\uBC94\uC8FC\xB7\uBC29\uD5A5\uC758 \uD45C\uAE30\uB85C \uC815\uC758\uD558\uB294 \uC2DC\uC2A4\uD15C(\uC2DC\uB9E8\uD2F1 \uCEEC\uB7EC \uD1A0\uD070)\uC740 \uC624\uBC29\uC0C9\uACFC \uB3D9\uD615\uC774\uB2E4. \uCCAD\xB7\uC801\xB7\uD669\xB7\uBC31\xB7\uD751\uC744 \uADF8\uB300\uB85C \uC4F0\uB294 \uAC83\uC774 \uC544\uB2C8\uB77C "\uC0C9\uC740 \uC704\uCE58\uC640 \uAD00\uACC4\uC758 \uC120\uC5B8"\uC774\uB77C\uB294 \uADDC\uCE59\uC744 \uAC00\uC838\uC624\uB294 \uAC83\uC774 \uC804\uC774\uB2E4'],leave:["'\uBE44\uC560\uC758 \uBBF8'\xB7'\uC790\uC5F0\uC2A4\uB7EC\uC6C0' \uD504\uB808\uC784\uC758 \uBB34\uBE44\uD310\uC801 \uACC4\uC2B9 \u2014 \uC57C\uB098\uAE30\uAC00 \uC870\uC120\uBBF8\uB97C \uACE1\uC120\xB7\uBD88\uC548\uC815\uD55C \uD615\uD0DC\xB7\uBC31\uC0C9\xB7\uBE44\uC560\uB85C \uADDC\uC815\uD55C \uAC83\uC740 \uD55C\uC815\uB41C \uB3C4\uC790\uAE30 \uC778\uC0C1\uC73C\uB85C \uBBFC\uC871\uC131\uAE4C\uC9C0 \uB2E8\uC815\uD55C \uC2DD\uBBFC\uAE30 \uC624\uB9AC\uC5D4\uD0C8\uB9AC\uC998\uC774\uB77C\uB294 \uBE44\uD310\uC744 \uBC1B\uB294\uB2E4(\uC624\uBCD1\uC6B1; \uC774\uC778\uBC94 \u300E\uC870\uC120\uC608\uC220\uACFC \uC57C\uB098\uAE30 \uBB34\uB124\uC694\uC2DC\u300F; Kim Brandt, *Kingdom of Beauty*, 2007). \uC57C\uB098\uAE30 \uC790\uC2E0\uB3C4 1930\uB144\uB300 \uC774\uD6C4 '\uC758\uC9C0\uC758 \uBBF8'\uB85C \uC11C\uC220\uC744 \uD655\uC7A5\uD588\uB2E4. \uBC18\uB300\uD3B8\uC758 \uACE0\uC720\uC12D \uAC1C\uB150\uB3C4 \uADF8\uB300\uB85C \uBCF8\uC9C8\uD654\uD558\uBA74 \uC704\uD5D8\uD558\uB2E4. \uB2E8\uC0C9\uD654\uC758 '\uD55C\uAD6D\uC801 \uC815\uC2E0\uC131' \uC11C\uC0AC \uC5ED\uC2DC \uC0C1\uB2F9 \uBD80\uBD84 \uC0AC\uD6C4 \uAD6C\uC131\uB41C \uBE0C\uB79C\uB529\uC774\uB77C\uB294 \uBE44\uD310\uC774 \uC788\uB2E4. '\uD55C(\u6068)', '\uC2AC\uD514\uC758 \uD770\uC0C9', '\uC18C\uBC15\uD55C \uBBFC\uC871' \uB958\uC758 \uCE74\uD53C\uB294 \uB300\uAC1C \uC774 \uD504\uB808\uC784\uC758 \uC794\uC5EC\uBB3C\uC774\uB2E4",`\uAD00\uAD11 \uBE0C\uB85C\uC288\uC5B4 \uD074\uB9AC\uC170 \u2014 \uC624\uBC29\uC0C9\uC744 \uBB34\uB9E5\uB77D 5\uC0C9 \uD314\uB808\uD2B8\uB85C, \uD55C\uC9C0 \uD14D\uC2A4\uCC98\xB7\uAE30\uC640\xB7\uD0DC\uADF9 \uACE1\uC120\uC744 '\uD55C\uAD6D\uC131' \uC2A4\uD2F0\uCEE4\uB85C \uC5B9\uB294 \uBC29\uC2DD. \uC870\uC120 \uBC31\uC790\uC758 \uC808\uC81C\uC640 \uB2E8\uCCAD\uC758 \uACE0\uCC44\uB3C4\uB294 \uC11C\uB85C \uB2E4\uB978 \uACC4\uCE35\xB7\uAE30\uB2A5\xB7\uC2DC\uB300\uC758 \uC0B0\uBB3C\uC774\uACE0 \uD55C \uD654\uBA74\uC5D0 \uD568\uAED8 \uBD99\uC77C \uADFC\uAC70\uAC00 \uC5C6\uB2E4. \uB610 "\uC804\uD1B5 \uC694\uC18C\uB97C \uB123\uC5C8\uB294\uAC00"\uB294 \uAC80\uC99D \uAC00\uB2A5\uD55C \uAE30\uC900\uC774 \uC544\uB2C8\uBBC0\uB85C, \uC804\uC774\uC758 \uC131\uD328\uB294 \uC6D0\uB9AC(\uAC00\uBCC0\uC131 \uC218\uC6A9, \uC5EC\uBC31\uC758 \uC704\uACC4, \uC0C9\uC758 \uCF54\uB4DC\uD654)\uAC00 \uC2DC\uC2A4\uD15C \uADDC\uCE59\uC73C\uB85C \uAD6C\uD604\uB418\uC5C8\uB294\uC9C0\uB85C \uD310\uB2E8\uD55C\uB2E4`]}],De=[{issue:"\uD615\uD0DC\uC758 \uC815\uB2F9\uC131",a:"ISM-SUPREM",aSays:"\uC21C\uC218 \uAC10\uAC01 \uADF8 \uC790\uCCB4",b:"ISM-CONSTR",bSays:"\uC0AC\uD68C\uC801 \uBAA9\uC801\uC5D0\uC11C \uC5F0\uC5ED"},{issue:"\uC7A5\uC2DD",a:"ISM-BAUHAUS",aSays:"\uC785\uC99D \uB300\uC0C1",b:"ISM-POSTMOD",bSays:'\uC758\uBBF8\uC758 \uC0DD\uC0B0 \uC218\uB2E8 ("Less is a bore")'},{issue:"\uAC1C\uC131",a:"ISM-SWISS",aSays:"\uC815\uBCF4 \uBA85\uB8CC\uD568\uC774 \uAC1C\uC131\uBCF4\uB2E4 \uC6B0\uC120",b:"ISM-POSTMOD",bSays:"\uC131\uACA9\uC774 \uAE30\uB2A5\uACFC \uB3D9\uB4F1"},{issue:"\uC644\uC131\uB3C4",a:"ISM-ARTCRAFT",aSays:"\uB178\uB3D9\uC758 \uC9C8\uC774 \uACB0\uACFC\uC758 \uC9C8",b:"ISM-PUNK",bSays:"\uC644\uC131\uB3C4\uB294 \uAD8C\uC704\uC758 \uC7A5\uCE58"},{issue:"\uC644\uACB0",a:"ISM-STIJL",aSays:"\uBCF4\uD3B8\uC801 \uC9C8\uC11C\uC5D0 \uB3C4\uB2EC",b:"ISM-JP",bSays:"\uC644\uACB0\uC744 \uC720\uBCF4\uD574 \uCC38\uC5EC\uB97C \uC694\uAD6C"},{issue:"\uD1B5\uC81C",a:"ISM-SWISS",aSays:"\uC124\uBA85 \uAC00\uB2A5\uD55C \uADDC\uCE59",b:"ISM-KR",bSays:"\uBCC0\uC218\uB97C \uACB0\uACFC\uC758 \uC77C\uBD80\uB85C \uC218\uC6A9"},{issue:"\uADF8\uB9AC\uB4DC",a:"ISM-SWISS",aSays:"\uBCF4\uC774\uC9C0 \uC54A\uB294 \uAD6C\uC870\uAC00 \uC9C0\uBC30",b:"ISM-DECON",bSays:"\uC704\uACC4\uB294 \uAD00\uC2B5\uC801 \uAD6C\uC131\uBB3C, \uB4A4\uC9D1\uC744 \uC218 \uC788\uB2E4"},{issue:"\uB9E4\uCCB4",a:"ISM-NOUVEAU",aSays:"\uCD1D\uCCB4\uC608\uC220\uB85C \uD1B5\uD569",b:"ISM-BRUTAL",bSays:"\uAE30\uBCF8\uAC12\uC744 \uADF8\uB300\uB85C \uC874\uC911"}];var nn={"ID-FROM":`## 1. \uC774\uB984

**THE FROM (\uB354\uD504\uB86C)** \u2014 \uBAA8\uB4E0 Creative\uB294 \uACB0\uAD6D **\uB098\uB85C\uBD80\uD130** \uC2DC\uC791\uB418\uC5B4 \uBC1C\uD604\uB41C\uB2E4.

\uC774\uAC83\uC740 \uC0AC\uBA85\uC774 \uC544\uB2C8\uB77C \uC791\uC5C5 \uBC29\uC2DD\uC758 \uC120\uC5B8\uC774\uB2E4. \uB808\uD37C\uB7F0\uC2A4\uC5D0\uC11C \uC2DC\uC791\uD558\uC9C0 \uC54A\uACE0, \uD2B8\uB80C\uB4DC\uC5D0\uC11C \uC2DC\uC791\uD558\uC9C0 \uC54A\uACE0, \uD310\uB2E8\uD558\uB294 \uC0AC\uB78C\uC5D0\uAC8C\uC11C \uC2DC\uC791\uD55C\uB2E4\uB294 \uB73B\uC774\uB2E4. \uADF8\uB798\uC11C \uC774 \uBC29\uBC95\uB860\uC758 \uBAA8\uB4E0 \uB2E8\uACC4\uC5D0\uB294 "\uB204\uAC00, \uBB34\uC5C7\uC744 \uADFC\uAC70\uB85C \uADF8\uB807\uAC8C \uD310\uB2E8\uD588\uB294\uAC00"\uAC00 \uAE30\uB85D\uB418\uC5B4\uC57C \uD55C\uB2E4.`,"ID-JAMAIS":`### 6.2 \uC790\uBA54\uBDF0(jamais vu)\uC5D0 \uB300\uD558\uC5EC

\uB370\uC790\uBDF0\uAC00 \uB0AF\uC120 \uAC83\uC744 \uC775\uC219\uD558\uAC8C \uB290\uB07C\uB294 \uAC83\uC774\uB77C\uBA74, \uC790\uBA54\uBDF0\uB294 **\uC775\uC219\uD55C \uAC83\uC744 \uCC98\uC74C \uBCF4\uB294 \uAC83\uCC98\uB7FC \uB290\uB07C\uB294 \uAC83**\uC774\uB2E4.

\uC774\uAC83\uC774 \uCD9C\uAD6C \uAE30\uC900\uC758 \uD575\uC2EC\uC778 \uC774\uC720: \uC6B0\uB9AC\uB294 \uC0AC\uC6A9\uC790\uC5D0\uAC8C \uB0AF\uC120 \uAD6C\uC870\uB97C \uC8FC\uC9C0 \uC54A\uB294\uB2E4(G3). \uC6B0\uB9AC\uAC00 \uC8FC\uB294 \uAC83\uC740 **\uC775\uC219\uD55C \uAD6C\uC870\uB97C \uCC98\uC74C \uBCF4\uB294 \uAC83\uCC98\uB7FC \uB9CC\uB4DC\uB294 \uD574\uC11D**\uC774\uB2E4. \uADF8\uB798\uC11C G5\uB294 "\uC0C8\uB85C\uC6B4\uAC00"\uAC00 \uC544\uB2C8\uB77C **"\uC775\uC219\uD55C \uAC83\uC774 \uC0C8\uB85C \uBCF4\uC774\uB294\uAC00"**\uB97C \uBB3B\uB294\uB2E4.

### 6.3 \uD1B5\uB82C\uD568\uC758 \uD310\uC815 \u2014 2\uB2E8 \uD310\uC815

G5\uC758 "\uD1B5\uB82C\uD558\uAC8C"\uB294 \uC815\uB3C4\uAC00 \uC544\uB2C8\uB77C **\uBC29\uD5A5**\uC758 \uAE30\uC900\uC774\uB2E4. \uD0C0\uAC9F\uC774 "\uC608\uC058\uB124"\uB77C\uACE0 \uBC18\uC751\uD558\uBA74 \uD1B5\uB82C\uD558\uC9C0 \uC54A\uB2E4. **"\uC5B4, \uC774\uAC70"**\uB77C\uACE0 \uBC18\uC751\uD558\uBA74 \uD1B5\uB82C\uD558\uB2E4. \uC804\uC790\uB294 \uAC10\uC0C1\uC774\uACE0 \uD6C4\uC790\uB294 \uC778\uC2DD\uC758 \uC804\uD658\uC774\uB2E4.`,"ID-INERTIA":`### 6.1 G3\uACFC G4\uB294 \uC11C\uB85C \uB2F9\uAE34\uB2E4 \u2014 \uC774\uAC8C \uC774 \uBC29\uBC95\uB860\uC758 \uD575\uC2EC \uAE34\uC7A5

\uC0C8\uB85C\uC6C0\uC740 \uAD00\uC131\uC744 \uAC74\uB4DC\uB824\uC11C \uC5BB\uC5B4\uC9C4\uB2E4. \uADF8\uB7F0\uB370 \uAD00\uC131\uC744 \uD574\uCE58\uBA74 \uC548 \uB41C\uB2E4. \uC774 \uB458\uC744 \uB3D9\uC2DC\uC5D0 \uB9CC\uC871\uC2DC\uD0A4\uB294 \uBC29\uBC95\uC740 \uD558\uB098\uBFD0\uC774\uB2E4:

> **\uAD00\uC131\uC740 \uAD6C\uC870\uC5D0\uC11C \uC9C0\uD0A4\uACE0, \uC0C8\uB85C\uC6C0\uC740 \uD574\uC11D\uC5D0\uC11C \uB9CC\uB4E0\uB2E4.**

- \uC9C0\uD0AC \uAC83 \u2014 \uD0D0\uC0C9 \uAD6C\uC870, \uBC84\uD2BC\uC774 \uBC84\uD2BC\uCC98\uB7FC \uBCF4\uC774\uB294 \uAC83, \uC77D\uAE30 \uC21C\uC11C, \uB418\uB3CC\uC544\uAC00\uAE30, \uC811\uADFC\uC131
- \uBC00 \uAC83 \u2014 \uD06C\uB9AC\uC5D0\uC774\uD2F0\uBE0C \uBA54\uD0C0\uD3EC, \uD1A4, \uBAA8\uC158\uC758 \uC131\uACA9, \uD0C0\uC785\uC758 \uD45C\uC815, \uCEEC\uB7EC\uC758 \uD574\uC11D

\uBE0C\uB8E8\uD0C8\uB9AC\uC998\uC774 "\uD50C\uB7AB\uD3FC \uAE30\uBCF8\uAC12\uC744 \uBD80\uB044\uB7EC\uC6CC\uD558\uC9C0 \uB9C8\uB77C"\uB85C \uB3C4\uB2EC\uD55C \uACB0\uB860\uC774 G3\uC774\uACE0, \uBA64\uD53C\uC2A4\uAC00 "\uC81C\uD488\uC758 \uC131\uACA9\uC740 \uAE30\uB2A5\uACFC \uB3D9\uB4F1\uD55C \uC124\uACC4 \uB300\uC0C1"\uC73C\uB85C \uB3C4\uB2EC\uD55C \uACB0\uB860\uC774 G4\uB2E4. \uB458\uC740 \uB300\uB9BD\uD558\uC9C0 \uC54A\uB294\uB2E4 \u2014 \uC801\uC6A9 \uC601\uC5ED\uC774 \uB2E4\uB974\uB2E4.

\`[\uC81C\uC548]\` **G4\uB294 \uC774 \uBB38\uC7A5\uC758 \uD310\uC815 \uD615\uC2DD\uC774\uB2E4.** v0.2\uC758 G4("\uC2DC\uAC01\uC801 \uC0C8\uB85C\uC6C0\uC744 \uC900\uB2E4")\uB294 \uC0C8\uB85C\uC6C0\uC774 \uC5B4\uB514\uC11C \uC624\uB294\uC9C0\uB97C \uBB3B\uC9C0 \uC54A\uC544\uC11C, \uC7A5\uC2DD\uACFC \uB514\uD14C\uC77C\uB85C \uC0C8\uB85C\uC6C0\uC744 \uC0AC\uB294 \uAE38\uC744 \uC5F4\uC5B4\uB450\uC5C8\uB2E4. v0.3\uC758 G4\uB294 \uC0C8\uB85C\uC6C0\uC758 \uCD9C\uCC98\uB97C **\uD574\uC11D**\uC73C\uB85C \uBABB \uBC15\uB294\uB2E4 \u2014 \uAD6C\uC870(\uD328\uD134)\uB294 \uC9C0\uD0A4\uACE0, \uADF8 \uD328\uD134\uC744 \uBCF4\uB294 \uAD00\uC810\uC744 \uBC14\uAFBC\uB2E4.`,"ID-ONEU":`### 2.2 \uC124\uACC4 \uB2E8\uC704\uB85C\uC11C\uC758 1U (\uD655\uC815)

\uB85C\uACE0\uC5D0\uB9CC \uC801\uC6A9\uB418\uB358 \uADDC\uACA9\uC744 **\uBAA8\uB4E0 \uC0B0\uCD9C\uBB3C\uC758 \uC124\uACC4 \uB2E8\uC704\uB85C \uD655\uC7A5\uD55C\uB2E4.** \uADFC\uAC70\uB294 1U \uC790\uCCB4\uC758 \uC758\uBBF8\uB2E4 \u2014 "1 Unit\uC5D0\uC11C \uBAA8\uB4E0 \uAC83\uC774 \uC2DC\uC791\uB41C\uB2E4"\uAC00 \uB85C\uACE0\uC5D0\uB9CC \uD574\uB2F9\uD55C\uB2E4\uBA74 \uADF8\uAC83\uC740 \uB85C\uACE0 \uADDC\uACA9\uC11C\uC774\uACE0, \uBC29\uBC95\uB860\uC774 \uC544\uB2C8\uB2E4.

**\uB2E8, \uC774\uAC83\uC740 \uBAA8\uB4E0 \uC124\uACC4\uC5D0 \uBB34\uC870\uAC74 \uB3C4\uC785\uD558\uB294 \uBD88\uBCC0\uC758 \uC6D0\uCE59\uC774 \uC544\uB2C8\uB2E4.** \uB450 \uBB38\uC7A5\uC774 \uBAA8\uC21C\uB418\uC9C0 \uC54A\uB294 \uC774\uC720\uB294 \uB2E4\uC74C \uAD6C\uBD84\uC5D0 \uC788\uB2E4.

> ### 1U\uB294 \uAC12\uC774 \uC544\uB2C8\uB77C \uBC29\uBC95\uC774\uB2E4.

| | \uACE0\uC815\uB418\uB294 \uAC83 | \uD504\uB85C\uC81D\uD2B8\uAC00 \uC815\uD558\uB294 \uAC83 |
|---|---|---|
| **\uBC29\uBC95** | \uD558\uB098\uC758 \uB2E8\uC704\uB97C \uC815\uD558\uACE0 **\uBAA8\uB4E0 \uCE58\uC218\uB97C \uAC70\uAE30\uC11C \uD30C\uC0DD\uC2DC\uD0A8\uB2E4** | \u2014 |
| **\uAC12** | \u2014 | 1U\uAC00 8px\uC778\uC9C0 4px\uC778\uC9C0 12px\uC778\uC9C0 |

"1 Unit\uC5D0\uC11C \uBAA8\uB4E0 \uAC83\uC774 \uC2DC\uC791\uB41C\uB2E4"\uB294 \uD2B9\uC815 \uC22B\uC790\uC5D0 \uB300\uD55C \uC120\uC5B8\uC774 \uC544\uB2C8\uB77C **\uD30C\uC0DD \uAD6C\uC870\uC5D0 \uB300\uD55C \uC120\uC5B8**\uC774\uB2E4. \uADF8\uB798\uC11C \uAC12\uC774 \uD504\uB85C\uC81D\uD2B8\uB9C8\uB2E4 \uB2EC\uB77C\uB3C4 \uC6D0\uCE59\uC740 \uC720\uC9C0\uB418\uACE0, \uAC12\uC744 \uBE0C\uB79C\uB4DC \uC0C1\uC218\uB85C \uBABB \uBC15\uC9C0 \uC54A\uC544\uB3C4 1U\uB294 \uC791\uB3D9\uD55C\uB2E4.

**\uB530\uB77C\uC11C 1U \uC704\uBC18\uC740 "8px\uC744 \uC548 \uC37C\uB2E4"\uAC00 \uC544\uB2C8\uB77C "\uD30C\uC0DD \uADFC\uAC70\uAC00 \uC5C6\uB2E4"\uB2E4.**

### 2.2.4 1U\uB294 \uBCF4\uC774\uC9C0 \uC54A\uB294 \uBF08\uB300\uB2E4 \`[\uC81C\uC548]\`

> **\uC0AC\uC6A9\uC790\uAC00 1U\uB97C \uC54C\uC544\uBCFC \uC218 \uC788\uB2E4\uBA74 \uC2E4\uD328\uB2E4.**

1U\uB294 \uCE58\uC218\uAC00 \uC5B4\uB514\uC11C \uC654\uB294\uC9C0\uB97C \uC124\uBA85\uD558\uB294 **\uB0B4\uBD80 \uAD6C\uC870**\uB2E4. \uC2A4\uC704\uC2A4 \uADF8\uB9AC\uB4DC\uAC00 "\uBCF4\uC774\uC9C0 \uC54A\uB294 \uBF08\uB300"\uC600\uB358 \uAC83\uCC98\uB7FC(\u2192 \`GRID-*\` \uC6D0\uBB38 \`\uBCF4\uC774\uC9C0 \uC54A\uB294 \uBF08\uB300 \uC5ED\uD560\uC744 \uD568\`), 1U\uB294 \uACB0\uACFC\uBB3C\uC758 \uC9C8\uC11C\uAC10\uC73C\uB85C\uB9CC \uB290\uAEF4\uC838\uC57C \uD558\uACE0 \uD615\uC0C1\uC73C\uB85C \uB4DC\uB7EC\uB098\uC11C\uB294 \uC548 \uB41C\uB2E4.

| 1U\uB97C \uC4F0\uB294 \uBC29\uC2DD | \uD310\uC815 |
|---|---|
| \uAC04\uACA9\xB7\uD0C0\uC785\xB7\uBC18\uACBD\xB7\uADF8\uB9AC\uB4DC\uAC00 \uD55C \uB2E8\uC704\uC5D0\uC11C \uD30C\uC0DD\uB418\uC5B4 \uD654\uBA74\uC774 \uC815\uB3C8\uB418\uC5B4 \uBCF4\uC778\uB2E4 | \uC815\uC0C1 \u2014 \uBF08\uB300 |
| \uC815\uC0AC\uAC01\uD615 \uB2E8\uC704\xB7\uB9C9\uB300 \uC313\uAE30\xB73U/2U/1U \uBE44\uB840\uAC00 \uD654\uBA74\uC758 **\uBAA8\uD2F0\uD504**\uAC00 \uB41C\uB2E4 | **\uC2E4\uD328** \u2014 1U\uC758 \uC0C1\uC9D5\uD654 (N7) |
| 1U \uADDC\uCE59\uC744 \uC9C0\uD0A4\uB290\uB77C \uAC00\uB3C5\uC131\xB7\uC704\uACC4\xB7\uBBF8\uAC10\uC774 \uB098\uBE60\uC9C4\uB2E4 | **\uC2E4\uD328** \u2014 1U \uAC12\uC744 \uBC14\uAFBC\uB2E4. \uBBF8\uAC10\uC744 1U\uC5D0 \uB9DE\uCD94\uC9C0 \uC54A\uB294\uB2E4 (\xA76.7) |

### 2.3 1U\uAC00 \uD558\uB294 \uC77C

1U\uB294 **\uC758\uC0AC\uACB0\uC815 \uBE44\uC6A9\uC744 \uC904\uC774\uB294 \uC7A5\uCE58**\uB2E4. \uAC04\uACA9\uC744 \uB9E4\uBC88 \uD611\uC0C1\uD558\uC9C0 \uC54A\uAE30 \uC704\uD574 \uC874\uC7AC\uD55C\uB2E4. \uADF8\uB798\uC11C 1U\uC758 \uC131\uACF5 \uAE30\uC900\uC740 "\uC544\uB984\uB2E4\uC6B4\uAC00"\uAC00 \uC544\uB2C8\uB77C **"\uC774 \uAC12\uC744 \uC65C \uC37C\uB294\uC9C0 \uC124\uBA85\uD560 \uD544\uC694\uAC00 \uC5C6\uC5B4\uC84C\uB294\uAC00"**\uB2E4.

\uC2A4\uC704\uC2A4 \uC2A4\uD0C0\uC77C\uC774 \uADF8\uB9AC\uB4DC\uB85C \uD55C \uC77C\uC774 \uC815\uD655\uD788 \uC774\uAC83\uC774\uB2E4(\u2192 \`ISM-SWISS\`). \uCC28\uC774\uB294 \uC2A4\uC704\uC2A4\uAC00 **\uADF8\uB9AC\uB4DC\uB97C \uC9DC\uB294 \uBC29\uBC95**\uC744 \uB0A8\uACBC\uB2E4\uBA74, \uC6B0\uB9AC\uB294 **\uD30C\uC0DD\uC758 \uCD9C\uBC1C\uC810\uC774 \uD558\uB098\uC5EC\uC57C \uD55C\uB2E4\uB294 \uADDC\uCE59**\uC744 \uB0A8\uAE34\uB2E4\uB294 \uC810\uC774\uB2E4. \uAC12\uC744 \uACE0\uC815\uD558\uB294 \uAC83\uC774 \uC544\uB2C8\uB77C \uAD6C\uC870\uB97C \uACE0\uC815\uD55C\uB2E4.`,"ID-YELLOW":`### \uB178\uB791\uC758 \uC758\uBBF8

\uC544\uC774\uBD80\uD130 \uB178\uB144\uAE4C\uC9C0 **\uC804 \uC138\uB300**. \uB178\uB144\uC774 \uB418\uBA74 \uB2E4\uC2DC \uC544\uC774\uAC00 \uB41C\uB2E4\uB294 \uC778\uBB38\uC801 \uC758\uBBF8\uB97C \uB2F4\uB294\uB2E4. \uC989 \uB178\uB791\uC740 "\uBC1D\uACE0 \uD65C\uAE30\uCC2C \uC0C9"\uC774 \uC544\uB2C8\uB77C **\uC804 \uC5F0\uB839\uC774 \uC990\uAE38 \uC218 \uC788\uB294 \uB514\uC790\uC778**\uC774\uB77C\uB294 \uD0DC\uB3C4\uC758 \uD45C\uAE30\uB2E4.

**\uC911\uC694 \u2014 \uC624\uD574 \uAE08\uC9C0**: \uCF54\uC5B4 \uCEEC\uB7EC\uB77C\uB294 \uAC83\uC774 "\uD56D\uC0C1 \uC4F4\uB2E4"\uB294 \uB73B\uC740 \uC544\uB2C8\uB2E4. UI/UX\uC5D0\uC11C \uB178\uB791\uC744 \uD56D\uC0C1 \uC4F0\uC9C0 \uC54A\uB294\uB2E4. \uB178\uB791\uC740 **\uBE0C\uB79C\uB4DC\uC758 \uD0DC\uB3C4\uB97C \uC9C0\uC2DC\uD558\uB294 \uC0C9**\uC774\uACE0, \uD654\uBA74\uC5D0 \uBC18\uB4DC\uC2DC \uB4F1\uC7A5\uD574\uC57C \uD558\uB294 \uC0C9\uC774 \uC544\uB2C8\uB2E4.

> \uC774 \uAD6C\uBD84\uC774 \uBB34\uB108\uC9C0\uBA74 \uBAA8\uB4E0 \uC0B0\uCD9C\uBB3C\uC774 \uB178\uB780\uC0C9\uC774 \uB418\uACE0, \uB178\uB791\uC774 \uC758\uBBF8\uD558\uB358 "\uC804 \uC138\uB300"\uB294 \uC0AC\uB77C\uC9C4\uB2E4. \uC0C9\uC740 \uD314\uB808\uD2B8\uAC00 \uC544\uB2C8\uB77C \uCF54\uB4DC\uB2E4 \u2014 \uD55C\uAD6D \uC804\uD1B5 \uBBF8\uD559\uC758 \uC624\uBC29\uC0C9\uC774 \uC815\uD655\uD788 \uAC19\uC740 \uAD6C\uC870\uB2E4(\u2192 \`ISM-KR\`).`,"ID-BENEFIT":`### 6.4 G4\uC758 \uD310\uC815 \u2014 \uB450 \uC870\uAC74 \`[\uC81C\uC548]\`

G4\uB294 \uC138 \uC870\uAC74\uC744 **\uBAA8\uB450** \uD1B5\uACFC\uD574\uC57C \uD55C\uB2E4. (v0.3\uC740 \u2460\u2461\uC758 \uB450 \uC870\uAC74. \`[\uC81C\uC548]\` v0.4\uC5D0\uC11C \u2462 \uCD94\uAC00)

| # | \uC870\uAC74 | \uD310\uC815 \uC9C8\uBB38 |
|---|---|---|
| \u2460 | **\uD328\uD134 \uAC00\uB3C5\uC131** | \uD55C\uB208\uC5D0 \uBB34\uC5C7\uC774\uACE0 \uC5B4\uB5BB\uAC8C \uC4F0\uB294\uC9C0 \uC77D\uD788\uB294\uAC00 |
| \u2461 | **\uD574\uC11D\uC758 \uCC28\uBCC4** | \uD1B5\uC0C1\uC801 \uD574\uC11D\uACFC \uB2E4\uB978 \uAD00\uC810\uC778\uAC00 |

**\uD6A8\uC775\uC740 \uBCF4\uC774\uAC8C \uB9CC\uB4E4\uC5B4\uC57C \uD310\uC815\uB41C\uB2E4.** "\uC774\uD574\uAC00 \uC26C\uC6CC\uC9C4\uB2E4"\uB294 \uC8FC\uC7A5\uC774 \uC544\uB2C8\uB77C, \uD654\uBA74\uC5D0\uC11C \uBB34\uC5C7\uC774 **\uBCF4\uC774\uAC8C** \uB418\uC5B4 \uC0AC\uC6A9\uC790\uC758 \uACFC\uC5C5(\uC774\uD574\xB7\uBE44\uAD50\xB7\uACB0\uC815\xB7\uACF5\uC720)\uC774 \uBE68\uB77C\uC9C0\uB294\uC9C0\uB97C **\uD6A8\uC775 \uC9C0\uD45C**\uB85C \uC801\uB294\uB2E4(\u2192 L1 S2 \uD6A8\uC775 \uC2DC\uAC01\uD654). \uC608: "3\uCD08 \uC548\uC5D0 \uB0B4 \uC704\uCE58\uB97C \uC548\uB2E4", "\uB2E4\uB978 \uC0AC\uB78C\uACFC \uC5B4\uB514\uAC00 \uB2E4\uB978\uC9C0 \uD55C \uD654\uBA74\uC5D0\uC11C \uBE44\uAD50\uD55C\uB2E4". \`[\uC81C\uC548]\` v0.5

**\u2462\uC774 \uC5C6\uC73C\uBA74 \uB2E4\uB984\uC740 \uB9CC\uB4E0 \uC0AC\uB78C\uC758 \uAC83\uC774\uB2E4.** \uD574\uC11D\uC774 \uD1B5\uC0C1\uACFC \uB2E4\uB974\uAE30\uB9CC \uD558\uACE0 \uC0AC\uC6A9\uC790\uAC00 \uC5BB\uB294 \uAC83\uC774 \uC5C6\uB2E4\uBA74, \uADF8 \uC7AC\uD574\uC11D\uC740 N1(\uCC28\uBCC4\uC744 \uC704\uD55C \uCC28\uBCC4)\uACFC \uAC19\uC740 \uC790\uB9AC\uC5D0 \uC788\uB2E4. \u2462\uC740 L1 S2 \uC7AC\uD574\uC11D \uD45C\uC758 \`\uC0AC\uC6A9\uC790\uAC00 \uC5BB\uB294 \uAC83\` \uCE78\uC73C\uB85C \uD310\uC815\uD55C\uB2E4.

> **\uC0C8\uB85C\uC6C0\uC740 \uC7A5\uC2DD\xB7\uB514\uD14C\uC77C\uC774 \uC544\uB2C8\uB77C UI/UX \uD574\uC11D\uACFC \uC811\uADFC \uBC29\uC2DD\uC5D0\uC11C \uB098\uC628\uB2E4.**

**\u2461\uC758 \uBE44\uAD50 \uB300\uC0C1\uC740 \uAE30\uB85D\uB418\uC5B4 \uC788\uC5B4\uC57C \uD55C\uB2E4.** \uD1B5\uC0C1\uC801 \uD574\uC11D\uC740 L1 S2 \uD328\uD134 \uC7AC\uD574\uC11D\uC5D0\uC11C \uBC18\uB300 \uB300\uC0C1 \uD45C\uAE30 \uD615\uC2DD(\xA74.2)\uC73C\uB85C \uC801\uB294\uB2E4. \uAE30\uB85D\uC774 \uC5C6\uC73C\uBA74 "\uBB34\uC5C7\uACFC \uB2E4\uB978\uAC00"\uC5D0 \uB2F5\uD560 \uC218 \uC5C6\uC73C\uBBC0\uB85C \u2461\uB294 \uD310\uC815 \uBD88\uAC00 \u2014 \uC2E4\uD328\uB85C \uBCF8\uB2E4.

**\u2461\uC758 \uC810\uAC80 \u2014 \uAC77\uC5B4\uB0B4\uAE30.** \uC7A5\uC2DD\xB7\uB514\uD14C\uC77C(\uC9C8\uAC10\xB7\uADF8\uB9BC\uC790\xB7\uC77C\uB7EC\uC2A4\uD2B8\xB7\uC7A5\uC2DD\uC801 \uBAA8\uC158)\uC744 \uAC77\uC5B4\uB0B8 \uC0C1\uD0DC\uC5D0\uC11C\uB3C4 \uD574\uC11D\uC758 \uCC28\uBCC4\uC774 \uC131\uB9BD\uD558\uB294\uC9C0 \uBCF8\uB2E4. \uAC77\uC5B4\uB0B4\uC790 \uD1B5\uC0C1\uC801 \uD574\uC11D\uACFC \uAC19\uC544\uC9C4\uB2E4\uBA74, \uC0C8\uB85C\uC6C0\uC740 \uD574\uC11D\uC774 \uC544\uB2C8\uB77C \uC7A5\uC2DD\uC5D0 \uC788\uC5C8\uB2E4.

\uC774 \uBB38\uC11C\uC5D0 \uC801\uD78C \uB354\uD504\uB86C\uC758 \uAC83\uB4E4 \u2014 \uC774\uB984\uC758 \uC11C\uC0AC("\uB098\uB85C\uBD80\uD130"), 1U\uC640 \uB85C\uACE0 \uD615\uC0C1, \uBE0C\uB79C\uB4DC \uCEEC\uB7EC, airplane\xB7tunnel \u2014 \uC740 **\uC6B0\uB9AC\uAC00 \uC5B4\uB5BB\uAC8C \uD310\uB2E8\uD558\uB294\uAC00**\uB97C \uC815\uD55C\uB2E4. **\uD074\uB77C\uC774\uC5B8\uD2B8 \uACB0\uACFC\uBB3C\uC5D0 \uBB34\uC5C7\uC744 \uADF8\uB9AC\uB294\uAC00**\uB97C \uC815\uD558\uC9C0 \uC54A\uB294\uB2E4.

| \uCE35\uC704 | \uC4F0\uB294 \uACF3 | \uC4F0\uC9C0 \uC54A\uB294 \uACF3 |
|---|---|---|

| \uB354\uD504\uB86C\uC758 \uC5BC\uAD74 (\uB85C\uACE0 \uD615\uC0C1\xB7\uBE0C\uB79C\uB4DC \uCEEC\uB7EC\xB7\uC11C\uC0AC) | \uB354\uD504\uB86C \uC790\uC0AC \uC0B0\uCD9C\uBB3C | **\uD074\uB77C\uC774\uC5B8\uD2B8 \uACB0\uACFC\uBB3C\uC758 \uBAA8\uD2F0\uD504\xB7\uBA54\uD0C0\uD3EC\xB7\uD314\uB808\uD2B8** |

\uACB0\uACFC\uBB3C\uC5D0\uC11C \uB354\uD504\uB86C\uC774 \uBCF4\uC778\uB2E4\uBA74 \uADF8\uAC83\uC740 \uBC29\uBC95\uC774 \uC798 \uC791\uB3D9\uD55C \uD754\uC801\uC774 \uC544\uB2C8\uB77C, \uBC29\uBC95\uC774 \uACB0\uACFC\uBB3C\uC5D0 \uC0C8\uC5B4 \uB098\uAC04 \uAC83\uC774\uB2E4. \uC88B\uC740 \uACB0\uACFC\uBB3C\uC5D0\uC11C \uB354\uD504\uB86C\uC740 **\uD310\uB2E8\uC758 \uC9C8**\uB85C\uB9CC \uB4DC\uB7EC\uB09C\uB2E4(\u2192 N7).

> **\uC6B0\uC120\uC21C\uC704** \u2014 \uD310\uB2E8\uC774 \uBD80\uB52A\uD788\uBA74 **\uC0AC\uC6A9\uC790 \uACBD\uD5D8\uACFC \uC870\uD615 \uC644\uC131\uB3C4\uAC00 \uBC29\uBC95\uB860\uC758 \uD615\uC2DD\uBCF4\uB2E4 \uC55E\uC120\uB2E4.** \uBC29\uBC95\uB860\uC740 \uC88B\uC740 \uB514\uC790\uC778\uC5D0 \uB3C4\uB2EC\uD558\uAE30 \uC704\uD55C \uC7A5\uCE58\uC774\uACE0, \uD615\uC2DD\uC744 \uC9C0\uD0A4\uB290\uB77C \uACB0\uACFC\uAC00 \uB098\uBE60\uC9C0\uBA74 \uD615\uC2DD\uC774 \uD2C0\uB9B0 \uAC83\uC774\uB2E4(\u2192 \xA76.7).`,tunnel:`## 5. Tunnel Effect \u2014 \uD130\uB110

### 5.1 \uC815\uC758

\uC5EC\uD589\uC5D0\uC11C \uC5BB\uC740 \uAC83\uB4E4\uC744 \uB4E4\uACE0 **\uC5B4\uB450\uC6B4 \uD130\uB110\uC5D0 \uC9C4\uC785**\uD55C\uB2E4. \uD130\uB110 \uC548\uC5D0\uC11C \uD0C0\uAC9F\xB7\uBE0C\uB79C\uB4DC \uD2B9\uC131\uACFC \uC18C\uBE44\uC790 \uC774\uC6A9(UX) \uAD00\uC810\uC744 **\uB808\uC774\uC5B4\uB9C1**\uD574, **\uBC1D\uC740 \uCD9C\uAD6C**\uB97C \uCC3E\uB294\uB2E4.

### 5.2 \uD130\uB110\uC774 \uC5B4\uB450\uC6B4 \uC774\uC720

\uC9C4\uC785 \uC2DC\uC810\uC5D0 \uC815\uB2F5\uC774 \uC5C6\uAE30 \uB54C\uBB38\uC774\uB2E4. \uC0AC\uC870\uB97C \uBA87 \uAC1C \uACE8\uB790\uB2E4\uB294 \uAC83\uB9CC\uC73C\uB85C\uB294 \uC544\uBB34\uAC83\uB3C4 \uACB0\uC815\uB418\uC9C0 \uC54A\uB294\uB2E4. \uD130\uB110 \uC548\uC758 \uC791\uC5C5\uC740 **\uB808\uC774\uC5B4\uB97C \uACB9\uCCD0 \uC815\uB2F5\uC758 \uBC94\uC704\uB97C \uC881\uD788\uB294 \uC77C**\uC774\uACE0, \uB808\uC774\uC5B4\uAC00 \uACB9\uCE60\uC218\uB85D \uBC1D\uC544\uC9C4\uB2E4.

\uB808\uC774\uC5B4 3\uC885:

| \uB808\uC774\uC5B4 | \uC9C8\uBB38 | \uC0B0\uCD9C |
|---|---|---|
| \u2460 \uD0C0\uAC9F | \uB204\uAC00 \uBCF4\uB294\uAC00 | \uC5F0\uB839\xB7\uB9E5\uB77D\xB7\uAE30\uAE30\xB7\uC219\uB828\uB3C4 |
| \u2461 \uBE0C\uB79C\uB4DC \uD2B9\uC131 | \uBB34\uC5C7\uC774 \uC774 \uBE0C\uB79C\uB4DC\uB9CC\uC758 \uAC83\uC778\uAC00 | \uD1A4, \uAE08\uC9C0 \uC0AC\uD56D, \uACBD\uC7C1\uC0AC\uC640 \uAC08\uB9AC\uB294 \uC9C0\uC810. \`[\uC81C\uC548]\` \uC5EC\uAE30\uC11C \uBE0C\uB79C\uB4DC\uB294 **\uD074\uB77C\uC774\uC5B8\uD2B8(\uC11C\uBE44\uC2A4)\uC758 \uBE0C\uB79C\uB4DC**\uB2E4 \u2014 \uB354\uD504\uB86C\uC774 \uC544\uB2C8\uB2E4(\xA71.1) |
| \u2462 \uC18C\uBE44\uC790 \uC774\uC6A9(UX) | \uC2E4\uC81C\uB85C \uC5B4\uB5BB\uAC8C \uC4F0\uB294\uAC00 \xB7 \`[\uC81C\uC548]\` \uADF8 \uC21C\uAC04 \uBB34\uC5C7\uC744 \uC6D0\uD558\uB294\uAC00 | \uAD00\uC131\uC801 \uD589\uD0DC, \uC774\uD0C8 \uC9C0\uC810, \uBC18\uBCF5 \uC0AC\uC6A9 \uBE48\uB3C4 \xB7 \`[\uC81C\uC548]\` **\uD575\uC2EC \uC21C\uAC04\uC758 \uB3D9\uAE30\uC640 \uAC10\uC815** \u2014 \uC0AC\uC6A9\uC790\uAC00 \uC774 \uD654\uBA74\uC5D0\uC11C \uC5BB\uACE0 \uC2F6\uC740 \uAC83 |

\uC138 \uB808\uC774\uC5B4\uB97C \uB2E4 \uACB9\uCE58\uC9C0 \uC54A\uC740 \uC0C1\uD0DC\uB85C \uCD9C\uAD6C\uB97C \uC8FC\uC7A5\uD558\uB294 \uAC83\uC740 \uD130\uB110\uC744 \uD1B5\uACFC\uD55C \uAC83\uC774 \uC544\uB2C8\uB77C \uD130\uB110\uC744 \uC6B0\uD68C\uD55C \uAC83\uC774\uB2E4.`,airplane:`### 4.1 \uC815\uC758

\uB2E4\uC591\uD55C \uB514\uC790\uC778 \uCCA0\uD559\uACFC ism\uC744 **\uACBD\uACC4 \uC5C6\uC774 \uC5EC\uD589\uD558\uACE0 \uBBF9\uC2A4**\uD574, **\uADFC\uBCF8 \uC788\uB294 \uD558\uC774\uBE0C\uB9AC\uB4DC**\uB97C \uB9CC\uB4E0\uB2E4.

### 4.2 "\uADFC\uBCF8 \uC788\uB294"\uC774 \uC81C\uC57D\uC774\uB2E4

\uC5EC\uD589\uC740 \uC790\uC720\uB86D\uC9C0\uB9CC \uACB0\uACFC\uBB3C\uC740 \uADFC\uBCF8\uC774 \uC788\uC5B4\uC57C \uD55C\uB2E4. \uC774 \uB450 \uC870\uAC74\uC744 \uB3D9\uC2DC\uC5D0 \uB9CC\uC871\uC2DC\uD0A4\uB294 \uAC83\uC774 airplane effect\uC758 \uC5B4\uB824\uC6B4 \uC9C0\uC810\uC774\uACE0, \uB2E4\uC74C \uC138 \uAC00\uC9C0 \uADDC\uCE59\uC774 \uADF8 \uC870\uAC74\uC744 \uAD6C\uCCB4\uD654\uD55C\uB2E4.

**\uADDC\uCE59 1 \u2014 \uC0AC\uC870\uB294 \uC6D0\uB9AC \uCE35\uC704\uC5D0\uC11C \uAC00\uC838\uC628\uB2E4. \uC2DC\uAC01 \uCE35\uC704\uC5D0\uC11C \uAC00\uC838\uC624\uBA74 \uCF54\uC2A4\uD2AC\uC774 \uB41C\uB2E4.**

|---|---|

| \uB370 \uC2A4\uD2F8\uC758 "\uBD88\uADE0\uB4F1 \uBA74\uC801 \uBE44\uC728\uC5D0\uC11C \uC131\uB9BD\uD558\uB294 \uAE34\uC7A5" | \uC801\xB7\uD669\xB7\uCCAD + \uAD75\uC740 \uAC80\uC815 \uACA9\uC790 |

| \uC77C\uBCF8 \uBBF8\uD559\uC758 "\uC644\uACB0\uC744 \uC720\uBCF4\uD574 \uC218\uC2E0\uC790\uC758 \uCC38\uC5EC\uB97C \uC694\uAD6C" | \uD06C\uB77C\uD504\uD2B8\uC9C0 \uD14D\uC2A4\uCC98 + \uBBF8\uC0C9 \uBC30\uACBD |

\uC2DC\uAC01 \uCE35\uC704\uC5D0\uC11C \uAC00\uC838\uC628 \uAC83\uC740 \uC989\uC2DC \uC778\uC2DD\uB418\uB294 \uC778\uC6A9\uC774 \uB418\uACE0, \uBE0C\uB79C\uB4DC\uC758 \uACE0\uC720\uC131 \uB300\uC2E0 \uBBF8\uC220\uC0AC \uB808\uD37C\uB7F0\uC2A4\uB9CC \uC804\uB2EC\uD55C\uB2E4. \uC774\uAC74 \uC5EC\uD589\uC774 \uC544\uB2C8\uB77C \uBA74\uC138\uC810 \uC1FC\uD551\uC774\uB2E4.

**\uADDC\uCE59 1\uC758 \uC608\uC678 \u2014 \uBBF8\uAC10\uC740 \uD6C4\uBCF4\uB85C \uCC44\uC9D1\uD558\uACE0, \uD544\uC694\uD560 \uB54C\uB9CC \uAC00\uC838\uC628\uB2E4.** (v0.6, \uC9C0\uD64D \uACB0\uC815)

\uC6D0\uB9AC\uB9CC \uAC00\uC838\uC624\uB294 \uAC83\uC774 \uAE30\uBCF8\uAC12\uC774\uB2E4. \uADF8\uB7EC\uB098 \uACB0\uC815\uB860\uC73C\uB85C \uB9C9\uC9C0 \uC54A\uB294\uB2E4. \uC0AC\uC870\uC758 **\uBBF8\uAC10**(\uBE44\uB840\uAC10 \xB7 \uC9C8\uAC10 \xB7 \uD0C0\uC774\uD3EC\uC758 \uD0DC\uB3C4 \xB7 \uC0C9\uC758 \uB17C\uB9AC \xB7 \uD654\uBA74 \uBC00\uB3C4 \xB7 \uADF8\uB9BC\uC758 \uBC29\uC2DD)\uC774 \uACB0\uACFC\uBB3C\uC758 \uCC28\uBCC4\uC744 \uBCF4\uC774\uAC8C \uD558\uB294 \uB370 \uD544\uC694\uD560 \uC218 \uC788\uB2E4. \uADF8 \uD310\uB2E8\uC740 \uC5EC\uD589 \uC911\uC5D0 \uD558\uC9C0 \uC54A\uB294\uB2E4 \u2014 \uC5EC\uD589 \uC2DC\uC810\uC5D0\uB294 \uD0C0\uAC9F\uC774 \uBB34\uC5C7\uC5D0 \uC775\uC219\uD55C\uC9C0, \uACBD\uC7C1 \uACB0\uACFC\uBB3C\uC774 \uC5B4\uB5BB\uAC8C \uBCF4\uC774\uB294\uC9C0 \uBAA8\uB974\uAE30 \uB54C\uBB38\uC774\uB2E4.

2. **\uAC19\uC740 \uAD6C\uC870(parallel).** \uC774 \uC774\uC288 \uC548\uC5D0\uC11C \uADF8\uB54C\uC640 \uAC19\uC740 \uAD6C\uC870\uB97C \uAC00\uC9C4 \uAC83\uC744 \uCC3E\uB294\uB2E4 \u2014 \uC624\uB298 \uC774 \uCE74\uD14C\uACE0\uB9AC\uC758 \uC9C0\uBC30\uC801 \uAD00\uC2B5, \uB2F9\uC5F0\uD558\uAC8C \uC5EC\uAE30\uB294 \uC804\uC81C, \uC815\uD574\uC9C4 \uC804\uC220. "\uBE44\uC2B7\uD574 \uBCF4\uC774\uB294 \uAC83"\uC774 \uC544\uB2C8\uB77C "\uAC19\uC740 \uC774\uC720\uB85C \uAC19\uC740 \uBB38\uC81C\uAC00 \uC0DD\uAE30\uB294 \uAC83"\uC774\uC5B4\uC57C \uD55C\uB2E4. \uCC3E\uC9C0 \uBABB\uD558\uBA74 \uADF8 \uC774\uC288\uC5D0\uB294 \uC2E0\uD638\uB97C \uB0B4\uC9C0 \uC54A\uB294\uB2E4.

5. **\uBC14\uAFD4\uCE58\uAE30 \uC2DC\uD5D8(swap).** \uC774 \uD310\uB2E8\uC744 \uB2E4\uB978 \uC0AC\uC870\uC758 \uC774\uB984\uC73C\uB85C \uBC14\uAFD4 \uC368\uB3C4 \uC131\uB9BD\uD558\uB294\uAC00. \uC131\uB9BD\uD558\uBA74 \uADF8 \uC2E0\uD638\uB294 \uC774 \uC0AC\uC870\uC758 \uAC83\uC774 \uC544\uB2C8\uB2E4 \u2014 \uBC84\uB9B0\uB2E4. \uC131\uB9BD\uD558\uC9C0 \uC54A\uB294 \uC774\uC720\uB97C \uC4F4\uB2E4: \uC774 \uC0AC\uC870\uB97C \uBE7C\uBA74 \uBB34\uC5C7\uC774 \uBB34\uB108\uC9C0\uB294\uAC00.

74 \uB41C\uB2E4."],"\uC88B\uC73C\uBA74 \uCC3E\uC544\uC628\uB2E4\uB294 \uD1B5\uB150."),"USAGE-2":Z(["\uAE30\uC874 \uC774\uC6A9\uC790\uB294 \uB9E4\uBC88 \uAC19\uC740 \uC790\uB9AC\uC5D0 \uC549\uB294\uB2E4.","\uC790\uB9AC\uC640 \uC815\uC219\uC774 \uC624\uB294 \uC774\uC720\uC758 \uC804\uBD80\uC774\uAE30 \uB54C\uBB38\uC774\uB2E4.","\uC800\uB141\uC5D0 \uC0AC\uB78C\uC774 \uB298\uBA74 \uC790\uB9AC\uBD80\uD130 \uBD88\uC548\uD574\uC9C4\uB2E4.","\uC774\uB4E4\uC5D0\uAC8C \uD65C\uC131\uD654\uB294 \uC790\uB9AC\uB97C \uC783\uC744 \uC218 \uC788\uB2E4\uB294 \uC2E0\uD638\uB2E4."],"\uC774\uC6A9\uC790\uAC00 \uB298\uBA74 \uBAA8\uB450\uC5D0\uAC8C \uC88B\uB2E4\uB294 \uD1B5\uB150."),"JP-1":je(["\uCC45\uC740 \uCC98\uC74C\uBD80\uD130 \uB05D\uAE4C\uC9C0 \uB2E4 \uB0B4\uB193\uC778 \uCC44 \uC11C\uAC00\uC5D0 \uC788\uB2E4.","\uC644\uACB0\uB41C \uAC83\uC744 \uD1B5\uC9F8\uB85C \uAC74\uB124\uB294 \uAC83\uC774 \uCE5C\uC808\uC774\uB77C \uC5EC\uACA8\uC11C\uB2E4.","\uD1B5\uC9F8\uB85C \uBC1B\uC740 \uC0AC\uB78C\uC740 \uCC44\uC6B8 \uAC83\uC774 \uC5C6\uC5B4 \uBD80\uB2F4\uB9CC \uBC1B\uB294\uB2E4.","\uC77C\uBD80\uB9CC \uB0B4\uB193\uC73C\uBA74 \uB098\uBA38\uC9C0\uB97C \uAD81\uAE08\uD574\uD558\uB294 \uC77C\uC774 \uC77D\uB294 \uC0AC\uB78C\uC758 \uBAAB\uC774 \uB41C\uB2E4."],"\uC644\uACB0\uACFC \uB300\uCE6D\uC744 \uC88B\uC740 \uAC83\uC73C\uB85C \uBCF8 \uBBF8\uAC10\uC5D0 \uB9DE\uC11C, \uBE44\uC6CC \uB450\uC5B4\uC57C \uBC1B\uB294 \uC0AC\uB78C\uC774 \uCC38\uC5EC\uD55C\uB2E4\uACE0 \uBCF4\uC558\uB2E4.","\uB3C4\uC11C\uAD00\uC774 \uCC45 \uC804\uCCB4\uB97C \uC644\uACB0\uB41C \uCC44\uB85C \uAC74\uB124\uACE0 \uC774\uC6A9\uC790\uB294 \uBC1B\uAE30\uB9CC \uD558\uB294 \uAD6C\uC870.","\uB2E4\uC2DC \uC77D\uB294\uB2E4",'\uBC14\uC6B0\uD558\uC6B0\uC2A4\uB098 \uC2A4\uC704\uC2A4 \uC2A4\uD0C0\uC77C\uB85C \uBC14\uAFB8\uBA74 "\uBD84\uB7C9\uC744 \uC904\uC5EC \uBA85\uB8CC\uD558\uAC8C"\uAC00 \uB418\uC5B4, \uB0A8\uACA8 \uB454 \uAC83\uC774 \uB2E4\uC2DC \uC624\uAC8C \uD55C\uB2E4\uB294 \uD310\uB2E8\uC774 \uC0AC\uB77C\uC9C4\uB2E4.'),"JP-2":je(["\uCEA0\uD398\uC778\uC740 \uCCAB \uBC29\uBB38\uC744 \uB04C\uC5B4\uB0B4\uB294 \uAC15\uD55C \uC778\uC0C1\uC5D0 \uD798\uC744 \uC4F4\uB2E4.","\uC131\uACFC\uB97C \uCCAB \uBC18\uC751\uC73C\uB85C \uC7AC\uAE30 \uB54C\uBB38\uC774\uB2E4.","\uCCAB\uC778\uC0C1\uC774 \uAC15\uD560\uC218\uB85D \uB450 \uBC88\uC9F8 \uBC29\uBB38\uC740 \uC2F1\uAC70\uC6CC\uC9C4\uB2E4.","\uB4E4\uB974\uB294 \uACF3\uC774 \uB418\uB824\uBA74 \uBC18\uBCF5\uD560\uC218\uB85D \uD3B8\uD574\uC838\uC57C \uD55C\uB2E4."],"\uC989\uAC01\uC801\uC778 \uB2E8\uB9DB\uC744 \uAC70\uBD80\uD558\uACE0, \uBC18\uBCF5\uD574\uC11C \uC4F0\uB294 \uB3D9\uC548 \uB4DC\uB7EC\uB098\uB294 \uAC83\uC744 \uC88B\uC740 \uAC83\uC73C\uB85C \uBCF4\uC558\uB2E4.","\uCCAB \uBC29\uBB38 \uC218\uB85C \uC131\uACFC\uB97C \uC7AC\uB294 \uD65C\uC131\uD654 \uCEA0\uD398\uC778\uC758 \uAD00\uC2B5.","\uC9C0\uD0A8\uB2E4","\uD3EC\uC2A4\uD2B8\uBAA8\uB354\uB2C8\uC998\uC73C\uB85C \uBC14\uAFB8\uBA74 \uAC15\uD55C \uC131\uACA9\uC744 \uC55E\uC138\uC6B0\uB294 \uD310\uB2E8\uC774 \uB418\uC5B4 \uBC18\uB300 \uACB0\uB860\uC774 \uB09C\uB2E4."),"STIJL-1":je(["\uC5ED\xB7\uACE8\uBAA9\xB7\uB3C4\uC11C\uAD00\uC758 \uCEA0\uD398\uC778\uBB3C\uC774 \uC81C\uAC01\uAC01 \uB9CC\uB4E4\uC5B4\uC9C4\uB2E4.","\uB9E4\uCCB4\uB9C8\uB2E4 \uB530\uB85C \uCD5C\uC801\uD654\uD558\uAE30 \uB54C\uBB38\uC774\uB2E4.","\uC5B4\uD718\uAC00 \uB298\uC218\uB85D \uC11C\uB85C\uC758 \uAD00\uACC4\uAC00 \uBCF4\uC774\uC9C0 \uC54A\uB294\uB2E4.","\uC5B4\uD718\uB97C \uC904\uC5EC\uC57C \uC811\uC810\uB4E4\uC774 \uD558\uB098\uC758 \uCEA0\uD398\uC778\uC73C\uB85C \uC77D\uD78C\uB2E4."],"\uAC1C\uBCC4\uC801\uC774\uACE0 \uC6B0\uC5F0\uD55C \uC678\uAD00\uC744 \uAC77\uC5B4\uB0B4\uACE0, \uCD5C\uC18C \uC5B4\uD718\uC758 \uAD00\uACC4\uB9CC\uC73C\uB85C \uC9C8\uC11C\uC5D0 \uC774\uB974\uB824 \uD588\uB2E4.","\uB9E4\uCCB4\uBCC4\uB85C \uB2E4\uB978 \uBB38\uBC95\uC744 \uC4F0\uB294 \uACF5\uACF5 \uCEA0\uD398\uC778\uC758 \uAD00\uC2B5.","\uB35C\uC5B4\uB0B8\uB2E4","\uD3EC\uC2A4\uD2B8\uBAA8\uB354\uB2C8\uC998\uC73C\uB85C \uBC14\uAFB8\uBA74 \uB9E5\uB77D\uB9C8\uB2E4 \uB2E4\uB978 \uB17C\uB9AC\uB97C \uC4F0\uC790\uB294 \uBC18\uB300 \uD310\uB2E8\uC774 \uB41C\uB2E4."),"BRUTAL-1":je(["\uC77D\uC744\uAC70\uB9AC\uB294 \uC5BC\uB9C8\uB098 \uAC78\uB9AC\uB294\uC9C0 \uC54C\uB824 \uC8FC\uC9C0 \uC54A\uB294\uB2E4.","\uBD84\uB7C9\uC744 \uBC1D\uD788\uBA74 \uB35C \uB9E4\uB825\uC801\uC73C\uB85C \uBCF4\uC77C\uAE4C \uBD10 \uAC10\uCD98\uB2E4.","\uAC10\uCD98 \uBB34\uAC8C\uB294 \uC77D\uB294 \uC0AC\uB78C\uC774 \uC2DC\uC791\uD55C \uB4A4\uC5D0 \uCE58\uB978\uB2E4.","\uAC78\uB9AC\uB294 \uC2DC\uAC04\uC744 \uB4DC\uB7EC\uB0B4\uB294 \uAC83\uC774 \uC77D\uB294 \uC0AC\uB78C\uC744 \uC874\uC911\uD558\uB294 \uBC29\uC2DD\uC774\uB2E4."],"\uB9C8\uAC10\uC73C\uB85C \uAD6C\uC870\uC640 \uC7AC\uB8CC\uB97C \uAC00\uB9AC\uB294 \uAD00\uD589\uC5D0 \uB9DE\uC11C, \uBB34\uC5C7\uC73C\uB85C \uB9CC\uB4E4\uC5B4\uC84C\uB294\uC9C0 \uC228\uAE30\uC9C0 \uC54A\uB294 \uAC83\uC744 \uC724\uB9AC\uB85C \uBCF4\uC558\uB2E4.","\uBD84\uB7C9\uACFC \uC18C\uC694 \uC2DC\uAC04\uC744 \uD45C\uC9C0 \uB4A4\uC5D0 \uAC10\uCD94\uB294 \uAD00\uD589.","\uB2E4\uC2DC \uC77D\uB294\uB2E4","\uC77C\uBCF8 \uBBF8\uD559\uC73C\uB85C \uBC14\uAFB8\uBA74 \uB35C \uBCF4\uC5EC \uC8FC\uC790\uB294 \uD310\uB2E8\uC774 \uB418\uC5B4, \uBD84\uB7C9\uC744 \uB4DC\uB7EC\uB0B8\uB2E4\uB294 \uACB0\uB860\uACFC \uBC18\uB300\uAC00 \uB41C\uB2E4."),"BRUTAL-2":je(["\uCC98\uC74C \uC628 \uC0AC\uB78C\uC740 \uC5B4\uB514\uC11C \uC870\uC6A9\uD788 \uD574\uC57C \uD558\uB294\uC9C0 \uBAA8\uB978\uB2E4.","\uACF5\uAC04\uC758 \uADDC\uCE59\uC774 \uC548\uB0B4\uBB38 \uB4A4\uC5D0 \uC228\uC5B4 \uC788\uC5B4\uC11C\uB2E4.","\uADDC\uCE59\uC744 \uBAA8\uB974\uB294 \uC0AC\uB78C\uC774 \uBA3C\uC800 \uADDC\uCE59\uC744 \uC5B4\uAE34\uB2E4.","\uADDC\uCE59\uC744 \uACF5\uAC04\uC5D0 \uADF8\uB300\uB85C \uB4DC\uB7EC\uB0B4\uC57C \uB450 \uC774\uC6A9\uC790\uAC00 \uBD80\uB52A\uD788\uC9C0 \uC54A\uB294\uB2E4."],"\uC791\uB3D9 \uBC29\uC2DD\uC744 \uB9E4\uB044\uB7FD\uAC8C \uAC00\uB9AC\uB294 \uB300\uC2E0 \uADF8\uB300\uB85C \uBCF4\uC5EC \uC8FC\uB294 \uAC83\uC774 \uC2E0\uB8B0\uB97C \uB9CC\uB4E0\
