- **\uAE30\uB2A5\uC8FC\uC758\uB97C \uCD95\uC18C \uC9C0\uC0C1\uC8FC\uC758\uB85C \uC624\uB3C5**\uD574 \uC0AC\uC6A9\uC790\uAC00 \uD544\uC694\uB85C \uD558\uB294 \uC548\uB0B4\xB7\uB808\uC774\uBE14\xB7\uD53C\uB4DC\uBC31\uAE4C\uC9C0 '\uBD88\uD544\uC694\uD55C \uC7A5\uC2DD'\uC73C\uB85C \uC81C\uAC70\uD558\uAE30

**\uC694\uC57D** \uC608\uC220\uACFC \uC0B0\uC5C5 \uC0DD\uC0B0\uC740 \uD558\uB098\uC774\uBA70, \uC870\uD615\uC740 \uCC9C\uC7AC\uC758 \uC601\uC5ED\uC774 \uC544\uB2C8\uB77C \uAC00\uB974\uCE58\uACE0 \uC7AC\uC0DD\uC0B0\uD560 \uC218 \uC788\uB294 \uCCB4\uACC4\uB2E4.`,summary:"\uC608\uC220\uACFC \uC0B0\uC5C5 \uC0DD\uC0B0\uC740 \uD558\uB098\uC774\uBA70, \uC870\uD615\uC740 \uCC9C\uC7AC\uC758 \uC601\uC5ED\uC774 \uC544\uB2C8\uB77C \uAC00\uB974\uCE58\uACE0 \uC7AC\uC0DD\uC0B0\uD560 \uC218 \uC788\uB294 \uCCB4\uACC4\uB2E4.",principles:["\uD615\uD0DC\uB294 \uBB3C\uB824\uBC1B\uC740 \uC591\uC2DD\uC774 \uC544\uB2C8\uB77C \uAE30\uB2A5\xB7\uC7AC\uB8CC\xB7\uC81C\uC791 \uACF5\uC815\uC5D0\uC11C \uB3C4\uCD9C\uB41C\uB2E4","\uC608\uC220\uACFC \uAE30\uC220\uC740 \uB300\uB9BD\uD558\uC9C0 \uC54A\uB294\uB2E4 \u2014 \uD558\uB098\uC758 \uD1B5\uC77C\uCCB4\uB2E4","\uC870\uD615 \uB2A5\uB825\uC740 \uD0C0\uACE0\uB09C \uC7AC\uB2A5\uC774 \uC544\uB2C8\uB77C \uAC00\uB974\uCE60 \uC218 \uC788\uB294 \uAE30\uCD08 \uBB38\uBC95\uC774\uB2E4 (Vorkurs\uC758 \uC804\uC81C)","\uC88B\uC740 \uB514\uC790\uC778\uC740 \uB300\uB7C9\uC0DD\uC0B0\uC744 \uD1B5\uD574 \uB2E4\uC218\uC5D0\uAC8C \uB3C4\uB2EC\uD574\uC57C \uD55C\uB2E4 \u2014 \uADF8\uB798\uC11C \uC791\uC5C5\uC758 \uBAA9\uD45C\uB294 \uC644\uC131\uD488\uC774 \uC544\uB2C8\uB77C \uC0B0\uC5C5\uC6A9 \uD504\uB85C\uD1A0\uD0C0\uC785\uC774\uB2E4","\uADFC\uAC70\uB97C \uC124\uBA85\uD560 \uC218 \uC5C6\uB294 \uC7A5\uC2DD\uC740 \uC815\uB2F9\uD558\uC9C0 \uC54A\uB2E4 \u2014 \uC7A5\uC2DD\uC740 \uAE08\uC9C0 \uB300\uC0C1\uC774 \uC544\uB2C8\uB77C \uC785\uC99D \uB300\uC0C1\uC774\uB2E4"],take:["\uB514\uC790\uC778 \uC2DC\uC2A4\uD15C\uC758 \uC9C4\uC9DC \uC0B0\uCD9C\uBB3C\uC740 \uD654\uBA74\uC774 \uC544\uB2C8\uB77C \uC7AC\uC0DD\uC0B0 \uAC00\uB2A5\uD55C \uD504\uB85C\uD1A0\uD0C0\uC785\uC774\uB2E4 \u2014 \uCEF4\uD3EC\uB10C\uD2B8\uB97C 1\uD68C\uC6A9 \uC2DC\uC548\uC774 \uC544\uB2C8\uB77C \uC591\uC0B0 \uBD80\uD488\uC73C\uB85C \uC124\uACC4","\uC870\uD615 \uD310\uB2E8\uC744 \uAC00\uB974\uCE60 \uC218 \uC788\uB294 \uBB38\uBC95\uC73C\uB85C \uBB38\uC11C\uD654\uD558\uB77C \u2014 \uD1A0\uD070\xB7\uC2A4\uCF00\uC77C\xB7\uAC04\uACA9 \uADDC\uCE59\uC740 \uD604\uB300\uC758 Vorkurs\uB2E4. \uAC1C\uC778 \uAC10\uAC01\uC5D0 \uC758\uC874\uD558\uB294 \uD300\uC740 \uD655\uC7A5\uB418\uC9C0 \uC54A\uB294\uB2E4",'\uBAA8\uB4E0 \uC7A5\uC2DD \uC694\uC18C\uC5D0 "\uC774\uAC83\uC740 \uBB34\uC5C7\uC744 \uD574\uACB0\uD558\uB294\uAC00"\uB97C \uBB3B\uB294\uB2E4 \u2014 \uC0AD\uC81C\uAC00 \uC544\uB2C8\uB77C \uC785\uC99D\uC758 \uAE30\uC900\uC744 \uB450\uB294 \uAC83\uC774 \uD575\uC2EC'],leave:["\uC6D0\xB7\uC0BC\uAC01\uD615\xB73\uC6D0\uC0C9\uC774\uB77C\uB294 \uD45C\uBA74 \uC5B4\uD718\uB9CC \uAC00\uC838\uC640 \uC81C\uC791 \uACF5\uC815\uACFC\uC758 \uC5F0\uACB0\uC744 \uBE7C\uBC84\uB9AC\uAE30 \u2014 1920\uB144\uB300 \uCF54\uC2A4\uD504\uB808\uAC00 \uB41C\uB2E4","\uAE30\uB2A5\uC8FC\uC758\uB97C \uCD95\uC18C \uC9C0\uC0C1\uC8FC\uC758\uB85C \uC624\uB3C5\uD574 \uC0AC\uC6A9\uC790\uAC00 \uD544\uC694\uB85C \uD558\uB294 \uC548\uB0B4\xB7\uB808\uC774\uBE14\xB7\uD53C\uB4DC\uBC31\uAE4C\uC9C0 '\uBD88\uD544\uC694\uD55C \uC7A5\uC2DD'\uC73C\uB85C \uC81C\uAC70\uD558\uAE30"]},{id:"ISM-SWISS",family:"airplane",name:"\uC2A4\uC704\uC2A4 \uC2A4\uD0C0\uC77C",card:`## \`ISM-SWISS\` \xB7 \uC2A4\uC704\uC2A4 \uC2A4\uD0C0\uC77C / \uAD6D\uC81C \uD0C0\uC774\uD3EC\uADF8\uB798\uD53C \uC591\uC2DD

> **\uC790\uC8FC \uD2C0\uB9AC\uB294 \uBD80\uBD84**: **12\uC774\uB77C\uB294 \uC22B\uC790\uB294 \uBB90\uB7EC-\uBE0C\uB85C\uD06C\uB9CC\uC758 \uAC83\uC774 \uC544\uB2C8\uB2E4.** \uADF8\uB294 4\xB75\xB76\xB78 \uD544\uB4DC \uB4F1 \uAC00\uBCC0 \uBAA8\uB4C8\uC744 \uB2E4\uB918\uACE0, 12\uC5F4\uC740 2\xB73\xB74\xB76\uC73C\uB85C \uB098\uB258\uB294 \uBD84\uD560 \uD3B8\uC758 \uB54C\uBB38\uC5D0 960 \uADF8\uB9AC\uB4DC\xB7Bootstrap \uACC4\uC5F4\uC5D0\uC11C \uC6F9 \uAD00\uD589\uC73C\uB85C \uAD73\uC740 \uAC83\uC774\uB2E4. \uADF8\uAC00 \uB0A8\uAE34 \uAC83\uC740 \uC22B\uC790\uAC00 \uC544\uB2C8\uB77C **"\uC5F4 \uC218\uB294 \uCF58\uD150\uCE20\uC758 \uBD84\uD560 \uC694\uAD6C\uC5D0\uC11C \uC5ED\uC0B0\uD55C\uB2E4"**\uB294 \uBC29\uBC95\uC774\uB2E4. (\u2192 L1 S3)

**\uAC00\uC838\uC62C \uAC83**
- \uADF8\uB9AC\uB4DC\uB294 \uC0B0\uCD9C\uBB3C\uC774 \uC544\uB2C8\uB77C **\uC758\uC0AC\uACB0\uC815 \uBE44\uC6A9\uC744 \uC904\uC774\uB294 \uB3C4\uAD6C**\uB2E4 \u2014 \uC5F4 \uC218\uC640 \uAC04\uACA9\uC744 \uBA3C\uC800 \uD655\uC815\uD558\uBA74 \uB9E4 \uD654\uBA74\uB9C8\uB2E4 \uC7AC\uD611\uC0C1\uD560 \uC77C\uC774 \uC0AC\uB77C\uC9C4\uB2E4 (\u2192 1U\uAC00 \uD558\uB294 \uC77C\uACFC \uB3D9\uC77C)
- \uB808\uC774\uC544\uC6C3 \uD310\uB2E8\uC744 **\uC124\uBA85 \uAC00\uB2A5\uD55C \uADDC\uCE59\uC73C\uB85C \uD658\uC6D0** \u2014 \uB9AC\uBDF0\uC5D0\uC11C "\uC774\uAC8C \uB354 \uC608\uC058\uB2E4"\uAC00 "\uC774 \uADDC\uCE59\uC758 \uBA87 \uBC88\uC9F8 \uD56D\uBAA9"\uC73C\uB85C \uBC14\uB00C\uBA74 \uD300 \uADDC\uBAA8\uC640 \uBB34\uAD00\uD558\uAC8C \uD488\uC9C8\uC774 \uC720\uC9C0\uB41C\uB2E4
- \uACC4\uCE35\uC740 \uC7A5\uC2DD\uC774 \uC544\uB2C8\uB77C \uD06C\uAE30\xB7\uBB34\uAC8C\xB7\uC704\uCE58\uC758 \uBC30\uBD84\uC73C\uB85C \uB9CC\uB4E0\uB2E4 \u2014 \uC0C9\uACFC \uD6A8\uACFC\uB97C \uC4F0\uAE30 \uC804\uC5D0 \uD0C0\uC785 \uC2A4\uCF00\uC77C\uACFC \uC5EC\uBC31\uC73C\uB85C \uC11C\uC5F4\uC744 \uB05D\uB0B8\uB2E4

**\uB450\uACE0 \uC62C \uAC83**
- **\uADF8\uB9AC\uB4DC\uB97C \uAC10\uC625\uC73C\uB85C \uB9CC\uB4E4\uAE30** \u2014 \uBAA8\uB4E0 \uC694\uC18C\uB97C \uC5F4\uC5D0 \uB9DE\uCD94\uB290\uB77C \uC758\uB3C4\uC801 \uD30C\uAD34(\uBE0C\uB808\uC774\uD06C\uC544\uC6C3)\uB97C \uC783\uACE0, \uC815\uBCF4 \uBC00\uB3C4\uAC00 \uB2E4\uB978 \uB300\uC2DC\uBCF4\uB4DC\xB7\uC5D0\uB514\uD130\uC5D0\uAE4C\uC9C0 \uC7A1\uC9C0 \uD310\uC9DC\uAE30\uB97C \uAC15\uC694
- **'\uC911\uB9BD\uC131'\uC744 \uBB34\uD45C\uC815\uACFC \uD63C\uB3D9\uD558\uAE30** \u2014 Helvetica\uC640 \uB109\uB109\uD55C \uC5EC\uBC31\uB9CC\uC73C\uB85C \uB05D\uB0B8 \uD654\uBA74\uC740 \uAC1D\uAD00\uC801\uC778 \uAC83\uC774 \uC544\uB2C8\uB77C **\uBE0C\uB79C\uB4DC\uAC00 \uC5C6\uB294 \uAC83**\uC774\uBA70, 2026\uB144 \uC2DC\uC7A5\uC5D0\uC11C\uB294 \uCC28\uBCC4\uD654 \uC2E4\uD328\uB85C \uC9C1\uACB0\uB41C\uB2E4 (\u2192 L0 \xA77.2)

**\uC694\uC57D** \uB514\uC790\uC778\uC740 \uC790\uAE30\uD45C\uD604\uC774 \uC544\uB2C8\uB77C \uAC80\uC99D \uAC00\uB2A5\uD55C \uCCB4\uACC4\uB97C \uD1B5\uD574 \uC815\uBCF4\uB97C \uBA85\uB8CC\uD558\uAC8C \uC804\uB2EC\uD558\uB294 \uC9C1\uC5C5\uC801 \uC2E4\uCC9C\uC774\uB2E4.`,summary:"\uB514\uC790\uC778\uC740 \uC790\uAE30\uD45C\uD604\uC774 \uC544\uB2C8\uB77C \uAC80\uC99D \uAC00\uB2A5\uD55C \uCCB4\uACC4\uB97C \uD1B5\uD574 \uC815\uBCF4\uB97C \uBA85\uB8CC\uD558\uAC8C \uC804\uB2EC\uD558\uB294 \uC9C1\uC5C5\uC801 \uC2E4\uCC9C\uC774\uB2E4.",principles:["\uC815\uBCF4\uC758 \uBA85\uB8CC\uD568\uC774 \uB514\uC790\uC774\uB108\uC758 \uAC1C\uC131\uBCF4\uB2E4 \uC6B0\uC120\uD55C\uB2E4 \u2014 \uD45C\uD604\uC774 \uC544\uB2C8\uB77C \uC804\uB2EC\uC774 \uBAA9\uC801\uC774\uB2E4 (Sachlichkeit)","\uBAA8\uB4E0 \uC870\uD615 \uACB0\uC815\uC740 \uC0AC\uD6C4\uC5D0 \uC124\uBA85 \uAC00\uB2A5\uD55C \uADDC\uCE59\uC5D0\uC11C \uB098\uC640\uC57C \uD55C\uB2E4 \u2014 \uCDE8\uD5A5\uC774 \uC544\uB2C8\uB77C \uB17C\uC99D","\uBCF4\uC774\uC9C0 \uC54A\uB294 \uAD6C\uC870\uAC00 \uBCF4\uC774\uB294 \uBAA8\uB4E0 \uAC83\uC744 \uC9C0\uBC30\uD55C\uB2E4 \u2014 \uADF8\uB9AC\uB4DC\uB294 \uACB0\uACFC\uBB3C\uC774 \uC544\uB2C8\uB77C \uD310\uB2E8\uC758 \uB3C4\uAD6C\uB2E4","\uADE0\uD615\uC740 \uB300\uCE6D\uC774 \uC544\uB2C8\uB77C \uC2DC\uAC01\uC801 \uBB34\uAC8C\uC758 \uBC30\uBD84\uC73C\uB85C \uC131\uB9BD\uD55C\uB2E4","\uBCF4\uD3B8\uC801 \uAC00\uB3C5\uC131\uC740 \uBB38\uD654\uC801 \uC7A5\uC2DD\uC744 \uB35C\uC5B4\uB0C4\uC73C\uB85C\uC368 \uC5BB\uC5B4\uC9C4\uB2E4"],take:["\uADF8\uB9AC\uB4DC\uB294 \uC0B0\uCD9C\uBB3C\uC774 \uC544\uB2C8\uB77C \uC758\uC0AC\uACB0\uC815 \uBE44\uC6A9\uC744 \uC904\uC774\uB294 \uB3C4\uAD6C\uB2E4 \u2014 \uC5F4 \uC218\uC640 \uAC04\uACA9\uC744 \uBA3C\uC800 \uD655\uC815\uD558\uBA74 \uB9E4 \uD654\uBA74\uB9C8\uB2E4 \uC7AC\uD611\uC0C1\uD560 \uC77C\uC774 \uC0AC\uB77C\uC9C4\uB2E4",'\uB808\uC774\uC544\uC6C3 \uD310\uB2E8\uC744 \uC124\uBA85 \uAC00\uB2A5\uD55C \uADDC\uCE59\uC73C\uB85C \uD658\uC6D0 \u2014 \uB9AC\uBDF0\uC5D0\uC11C "\uC774\uAC8C \uB354 \uC608\uC058\uB2E4"\uAC00 "\uC774 \uADDC\uCE59\uC758 \uBA87 \uBC88\uC9F8 \uD56D\uBAA9"\uC73C\uB85C \uBC14\uB00C\uBA74 \uD300 \uADDC\uBAA8\uC640 \uBB34\uAD00\uD558\uAC8C \uD488\uC9C8\uC774 \uC720\uC9C0\uB41C\uB2E4',"\uACC4\uCE35\uC740 \uC7A5\uC2DD\uC774 \uC544\uB2C8\uB77C \uD06C\uAE30\xB7\uBB34\uAC8C\xB7\uC704\uCE58\uC758 \uBC30\uBD84\uC73C\uB85C \uB9CC\uB4E0\uB2E4 \u2014 \uC0C9\uACFC \uD6A8\uACFC\uB97C \uC4F0\uAE30 \uC804\uC5D0 \uD0C0\uC785 \uC2A4\uCF00\uC77C\uACFC \uC5EC\uBC31\uC73C\uB85C \uC11C\uC5F4\uC744 \uB05D\uB0B8\uB2E4"],leave:["\uADF8\uB9AC\uB4DC\uB97C \uAC10\uC625\uC73C\uB85C \uB9CC\uB4E4\uAE30 \u2014 \uBAA8\uB4E0 \uC694\uC18C\uB97C \uC5F4\uC5D0 \uB9DE\uCD94\uB290\uB77C \uC758\uB3C4\uC801 \uD30C\uAD34(\uBE0C\uB808\uC774\uD06C\uC544\uC6C3)\uB97C \uC783\uACE0, \uC815\uBCF4 \uBC00\uB3C4\uAC00 \uB2E4\uB978 \uB300\uC2DC\uBCF4\uB4DC\xB7\uC5D0\uB514\uD130\uC5D0\uAE4C\uC9C0 \uC7A1\uC9C0 \uD310\uC9DC\uAE30\uB97C \uAC15\uC694","'\uC911\uB9BD\uC131'\uC744 \uBB34\uD45C\uC815\uACFC \uD63C\uB3D9\uD558\uAE30 \u2014 Helvetica\uC640 \uB109\uB109\uD55C \uC5EC\uBC31\uB9CC\uC73C\uB85C \uB05D\uB0B8 \uD654\uBA74\uC740 \uAC1D\uAD00\uC801\uC778 \uAC83\uC774 \uC544\uB2C8\uB77C \uBE0C\uB79C\uB4DC\uAC00 \uC5C6\uB294 \uAC83\uC774\uBA70, 2026\uB144 \uC2DC\uC7A5\uC5D0\uC11C\uB294 \uCC28\uBCC4\uD654 \uC2E4\uD328\uB85C \uC9C1\uACB0\uB41C\uB2E4"]},{id:"ISM-BRUTAL",family:"airplane",name:"\uBE0C\uB8E8\uD0C8\uB9AC\uC998",card:`## \`ISM-BRUTAL\` \xB7 \uBE0C\uB8E8\uD0C8\uB9AC\uC998 (Brutalism) \u2014 2\uB2E8\uACC4

\uC6A9\uC5B4 \uACC4\uBCF4: Asplund 'nybrutalism'(1950) \u2192 Smithson 'new brutalism'(1953) \u2192 **Banham \u300CThe New Brutalism\u300D(1955)** \uC73C\uB85C \uAC1C\uB150 \uD655\uB9BD
> \uC790\uC8FC \uD2C0\uB9AC\uB294 \uBD80\uBD84: Banham\uC740 \uC6A9\uC5B4\uB97C **\uB9CC\uB4E0 \uAC83\uC774 \uC544\uB2C8\uB77C \uB300\uC911\uD654**\uD588\uB2E4.

**\uC778\uBB3C**: Le Corbusier \xB7 Alison & Peter Smithson \xB7 Reyner Banham \xB7 Denys Lasdun \xB7 Pascal Deville \xB7 David Bryant Copeland

**\uC6D0\uB9AC**
- \uC7AC\uB8CC\uB294 \uC790\uC2E0\uC758 \uBCF8\uC131\uC744 \uC228\uAE30\uC9C0 \uC54A\uB294\uB2E4 \u2014 \uB9C8\uAC10\uC740 \uB2E4\uB978 \uAC83\uC744 \uD749\uB0B4\uB0B4\uAE30 \uC704\uD55C \uAC83\uC774 \uC544\uB2C8\uB2E4
- \uAD6C\uC870\uB294 \uD45C\uD53C \uB4A4\uC5D0 \uAC10\uCD9C \uB300\uC0C1\uC774 \uC544\uB2C8\uB77C \uADF8 \uC790\uCCB4\uAC00 \uD45C\uD604\uC758 \uB0B4\uC6A9\uC774\uB2E4
- **\uC815\uC9C1\uD568\uC740 \uCDE8\uD5A5\uC758 \uBB38\uC81C\uAC00 \uC544\uB2C8\uB77C \uC724\uB9AC\uC758 \uBB38\uC81C\uB2E4** (Banham\uC758 *ethic, not aesthetic*) \u2014 \uADF8\uB798\uC11C \uBE0C\uB8E8\uD0C8\uB9AC\uC998\uC740 '\uC5B4\uB5BB\uAC8C \uBCF4\uC774\uB294\uAC00'\uAC00 \uC544\uB2C8\uB77C **'\uBB34\uC5C7\uC744 \uC228\uAE30\uC9C0 \uC54A\uB294\uAC00'**\uB85C \uD310\uC815\uB41C\uB2E4
- \uC788\uB294 \uADF8\uB300\uB85C(as found)\uB294 \uADF9\uBCF5\uD574\uC57C \uD560 \uACB0\uD568\uC774 \uC544\uB2C8\uB77C \uC124\uACC4\uC758 \uCD9C\uBC1C \uC870\uAC74\uC774\uB2E4
- \uD3B8\uC548\uD568\uC740 \uC9C4\uC2E4\uBCF4\uB2E4 \uC55E\uC11C\uC9C0 \uC54A\uB294\uB2E4 \u2014 \uB9E4\uCCB4\uC758 \uAE30\uBCF8 \uAD6C\uC870\uB97C \uAC10\uCD94\uC9C0 \uC54A\uB294 \uAC83\uC774 \uB354 \uC815\uC9C1\uD55C \uD0DC\uB3C4\uB2E4 (2\uAE30\uC758 \uD575\uC2EC)

**\uC2DC\uAC01** (\uCC38\uACE0\uC6A9)
- 1\uAE30: \uAC70\uD478\uC9D1 \uBAA9\uB9AC\uAC00 \uB0A8\uC740 \uB178\uCD9C \uCF58\uD06C\uB9AC\uD2B8 / \uAC70\uB300\uD55C \uB9E4\uC2A4\uC640 \uCE94\uD2F8\uB808\uBC84 / \uC124\uBE44\xB7\uB3D9\uC120\xB7\uAD6C\uC870\uC758 \uC678\uBD80 \uB178\uCD9C
- 2\uAE30: HTML \uAE30\uBCF8\uAC12\uACFC \uC2DC\uC2A4\uD15C \uD3F0\uD2B8 / \uD30C\uB780 \uBC11\uC904 \uB9C1\uD06C / \uD615\uAD11\xB7\uC6D0\uC0C9 \uCDA9\uB3CC / \uAD75\uC740 \uAC80\uC815 \uD14C\uB450\uB9AC\uC640 \uC624\uD504\uC14B \uD558\uB4DC \uC100\uB3C4(neubrutalism) / \uADF8\uB9AC\uB4DC \uC704\uBC18

**\uB300\uD45C\uC791** Unit\xE9 d'habitation \uB9C8\uB974\uC138\uC720(Le Corbusier, 1952) \xB7 Hunstanton School(Smithson, 1954) \xB7 Boston City Hall(1968) \xB7 Royal National Theatre(Lasdun, 1976) / **2\uAE30**: Craigslist\xB7Hacker News, brutalist-web.design(Copeland)

**\uAC00\uC838\uC62C \uAC83**
- **\uD50C\uB7AB\uD3FC\uC758 \uAE30\uBCF8\uAC12\uC744 \uBD80\uB044\uB7EC\uC6CC\uD558\uC9C0 \uB9C8\uB77C** \u2014 \uB124\uC774\uD2F0\uBE0C \uD3FC \uCEE8\uD2B8\uB864, \uBC11\uC904 \uB9C1\uD06C, \uC2E4\uC81C \uC2A4\uD06C\uB864, \uC791\uB3D9\uD558\uB294 \uB4A4\uB85C\uAC00\uAE30. Copeland\uC758 \uADDC\uCE59\uC740 \uC804\uBD80 "\uBE0C\uB77C\uC6B0\uC800\uAC00 \uC774\uBBF8 \uC798 \uD558\uB294 \uC77C\uC744 \uB2E4\uC2DC \uBC1C\uBA85\uD574 \uB9DD\uCE58\uC9C0 \uB9D0\uB77C"\uB85C \uD658\uC6D0\uB418\uACE0, \uC774\uAC83\uC774 \uC811\uADFC\uC131\xB7\uC131\uB2A5 \uC2E4\uBB34\uC640 \uADF8\uB300\uB85C \uC77C\uCE58\uD55C\uB2E4 (\u2192 **L0 G3\uC758 \uC9C1\uC811 \uADFC\uAC70**)
- **\uC131\uB2A5\uACFC \uC815\uC9C1\uD568\uC740 \uAC19\uC740 \uC6D0\uB9AC\uC758 \uB450 \uC5BC\uAD74** \u2014 \uD3F0\uD2B8\xB7\uC774\uBBF8\uC9C0\xB7\uC560\uB2C8\uBA54\uC774\uC158\uC73C\uB85C \uB36E\uC5B4 \uAC00\uB9B0 \uBB34\uAC8C\uB294 \uACB0\uAD6D \uC0AC\uC6A9\uC790\uAC00 \uC9C0\uBD88\uD55C\uB2E4. "\uC131\uB2A5\uC740 \uAE30\uB2A5\uC774\uB2E4"
- \uC2DC\uC2A4\uD15C\uC758 \uC791\uB3D9\uC744 \uBCF4\uC5EC\uC8FC\uB294 \uAC83\uC774 \uC2E0\uB8B0\uB97C \uB9CC\uB4E0\uB2E4 \u2014 \uB85C\uB529 \uC0C1\uD0DC\xB7\uB370\uC774\uD130 \uCD9C\uCC98\xB7\uCC98\uB9AC \uB2E8\uACC4\uB97C \uB9E4\uB044\uB7FD\uAC8C \uAC10\uCD94\uB294 \uB300\uC2E0 \uB178\uCD9C. **AI\xB7\uC790\uB3D9\uD654 \uC81C\uD488\uC5D0\uC11C \uD2B9\uD788 \uC624\uD574\uB97C \uC904\uC778\uB2E4**

**\uB450\uACE0 \uC62C \uAC83**
- **\uC724\uB9AC\uB97C \uC2A4\uD0C0\uC77C\uB85C \uC624\uB3C5\uD558\uAE30** \u2014 \uAD75\uC740 \uAC80\uC815 \uD14C\uB450\uB9AC\xB7\uD615\uAD11 \uB178\uB791\xB7\uD558\uB4DC \uC100\uB3C4\uB9CC \uAC00\uC838\uC624\uB294 neubrutalism\uC740 Banham\uC774 \uBA85\uC2DC\uC801\uC73C\uB85C \uAC70\uBD80\uD55C \uADF8 '\uBBF8\uD559\uD654'\uB2E4. \uBE0C\uB8E8\uD0C8\uB9AC\uC998 \uC678\uD53C\uB97C \uB450\uB978 \uCC44 \uB2E4\uD06C \uD328\uD134\uACFC \uBB34\uAC70\uC6B4 \uBC88\uB4E4\uC744 \uADF8\uB300\uB85C \uB450\uBA74 \uC6D0\uB9AC\uC640 \uC815\uBC18\uB300\uC5D0 \uB3C4\uB2EC\uD55C\uB2E4
- **\uBD88\uCE5C\uC808\uC744 \uC815\uC9C1\uC73C\uB85C \uCC29\uAC01\uD558\uAE30** \u2014 \uC800\uB300\uBE44, \uC791\uC740 \uD0C0\uAE43, \uD78C\uD2B8 \uC5C6\uB294 \uC778\uD130\uB799\uC158\uC740 '\uC9C4\uC2E4\uD55C UI'\uAC00 \uC544\uB2C8\uB77C \uC811\uADFC\uC131 \uC704\uBC18\uC774\uB2E4. \uC811\uADFC\uC131\uC740 \uBE0C\uB8E8\uD0C8\uB9AC\uC998\uC774 \uBA74\uC81C\uBC1B\uB294 \uD56D\uBAA9\uC774 \uC544\uB2C8\uB77C '\uC0AC\uC6A9\uC790 \uC874\uC911'\uC774\uB77C\uB294 \uADF8 \uC6D0\uB9AC\uC758 \uC2DC\uD5D8\uB300\uB2E4

**\uC694\uC57D** \uBB34\uC5C7\uC73C\uB85C \uB9CC\uB4E4\uC5B4\uC84C\uACE0 \uC5B4\uB5BB\uAC8C \uC791\uB3D9\uD558\uB294\uC9C0\uB97C \uC228\uAE30\uC9C0 \uC54A\uB294 \uAC83\uC740 \uCDE8\uD5A5\uC774 \uC544\uB2C8\uB77C \uB9CC\uB4DC\uB294 \uC0AC\uB78C\uC758 \uC724\uB9AC\uC801 \uCC45\uBB34\uB2E4.`,summary:"\uBB34\uC5C7\uC73C\uB85C \uB9CC\uB4E4\uC5B4\uC84C\uACE0 \uC5B4\uB5BB\uAC8C \uC791\uB3D9\uD558\uB294\uC9C0\uB97C \uC228\uAE30\uC9C0 \uC54A\uB294 \uAC83\uC740 \uCDE8\uD5A5\uC774 \uC544\uB2C8\uB77C \uB9CC\uB4DC\uB294 \uC0AC\uB78C\uC758 \uC724\uB9AC\uC801 \uCC45\uBB34\uB2E4.",principles:["\uC7AC\uB8CC\uB294 \uC790\uC2E0\uC758 \uBCF8\uC131\uC744 \uC228\uAE30\uC9C0 \uC54A\uB294\uB2E4 \u2014 \uB9C8\uAC10\uC740 \uB2E4\uB978 \uAC83\uC744 \uD749\uB0B4\uB0B4\uAE30 \uC704\uD55C \uAC83\uC774 \uC544\uB2C8\uB2E4","\uAD6C\uC870\uB294 \uD45C\uD53C \uB4A4\uC5D0 \uAC10\uCD9C \uB300\uC0C1\uC774 \uC544\uB2C8\uB77C \uADF8 \uC790\uCCB4\uAC00 \uD45C\uD604\uC758 \uB0B4\uC6A9\uC774\uB2E4","\uC815\uC9C1\uD568\uC740 \uCDE8\uD5A5\uC758 \uBB38\uC81C\uAC00 \uC544\uB2C8\uB77C \uC724\uB9AC\uC758 \uBB38\uC81C\uB2E4 (Banham\uC758 *ethic, not aesthetic*) \u2014 \uADF8\uB798\uC11C \uBE0C\uB8E8\uD0C8\uB9AC\uC998\uC740 '\uC5B4\uB5BB\uAC8C \uBCF4\uC774\uB294\uAC00'\uAC00 \uC544\uB2C8\uB77C '\uBB34\uC5C7\uC744 \uC228\uAE30\uC9C0 \uC54A\uB294\uAC00'\uB85C \uD310\uC815\uB41C\uB2E4","\uC788\uB294 \uADF8\uB300\uB85C(as found)\uB294 \uADF9\uBCF5\uD574\uC57C \uD560 \uACB0\uD568\uC774 \uC544\uB2C8\uB77C \uC124\uACC4\uC758 \uCD9C\uBC1C \uC870\uAC74\uC774\uB2E4","\uD3B8\uC548\uD568\uC740 \uC9C4\uC2E4\uBCF4\uB2E4 \uC55E\uC11C\uC9C0 \uC54A\uB294\uB2E4 \u2014 \uB9E4\uCCB4\uC758 \uAE30\uBCF8 \uAD6C\uC870\uB97C \uAC10\uCD94\uC9C0 \uC54A\uB294 \uAC83\uC774 \uB354 \uC815\uC9C1\uD55C \uD0DC\uB3C4\uB2E4 (2\uAE30\uC758 \uD575\uC2EC)"],take:['\uD50C\uB7AB\uD3FC\uC758 \uAE30\uBCF8\uAC12\uC744 \uBD80\uB044\uB7EC\uC6CC\uD558\uC9C0 \uB9C8\uB77C \u2014 \uB124\uC774\uD2F0\uBE0C \uD3FC \uCEE8\uD2B8\uB864, \uBC11\uC904 \uB9C1\uD06C, \uC2E4\uC81C \uC2A4\uD06C\uB864, \uC791\uB3D9\uD558\uB294 \uB4A4\uB85C\uAC00\uAE30. Copeland\uC758 \uADDC\uCE59\uC740 \uC804\uBD80 "\uBE0C\uB77C\uC6B0\uC800\uAC00 \uC774\uBBF8 \uC798 \uD558\uB294 \uC77C\uC744 \uB2E4\uC2DC \uBC1C\uBA85\uD574 \uB9DD\uCE58\uC9C0 \uB9D0\uB77C"\uB85C \uD658\uC6D0\uB418\uACE0, \uC774\uAC83\uC774 \uC811\uADFC\uC131\xB7\uC131\uB2A5 \uC2E4\uBB34\uC640 \uADF8\uB300\uB85C \uC77C\uCE58\uD55C\uB2E4','\uC131\uB2A5\uACFC \uC815\uC9C1\uD568\uC740 \uAC19\uC740 \uC6D0\uB9AC\uC758 \uB450 \uC5BC\uAD74 \u2014 \uD3F0\uD2B8\xB7\uC774\uBBF8\uC9C0\xB7\uC560\uB2C8\uBA54\uC774\uC158\uC73C\uB85C \uB36E\uC5B4 \uAC00\uB9B0 \uBB34\uAC8C\uB294 \uACB0\uAD6D \uC0AC\uC6A9\uC790\uAC00 \uC9C0\uBD88\uD55C\uB2E4. "\uC131\uB2A5\uC740 \uAE30\uB2A5\uC774\uB2E4"',"\uC2DC\uC2A4\uD15C\uC758 \uC791\uB3D9\uC744 \uBCF4\uC5EC\uC8FC\uB294 \uAC83\uC774 \uC2E0\uB8B0\uB97C \uB9CC\uB4E0\uB2E4 \u2014 \uB85C\uB529 \uC0C1\uD0DC\xB7\uB370\uC774\uD130 \uCD9C\uCC98\xB7\uCC98\uB9AC \uB2E8\uACC4\uB97C \uB9E4\uB044\uB7FD\uAC8C \uAC10\uCD94\uB294 \uB300\uC2E0 \uB178\uCD9C. AI\xB7\uC790\uB3D9\uD654 \uC81C\uD488\uC5D0\uC11C \uD2B9\uD788 \uC624\uD574\uB97C \uC904\uC778\uB2E4"],leave:["\uC724\uB9AC\uB97C \uC2A4\uD0C0\uC77C\uB85C \uC624\uB3C5\uD558\uAE30 \u2014 \uAD75\uC740 \uAC80\uC815 \uD14C\uB450\uB9AC\xB7\uD615\uAD11 \uB178\uB791\xB7\uD558\uB4DC \uC100\uB3C4\uB9CC \uAC00\uC838\uC624\uB294 neubrutalism\uC740 Banham\uC774 \uBA85\uC2DC\uC801\uC73C\uB85C \uAC70\uBD80\uD55C \uADF8 '\uBBF8\uD559\uD654'\uB2E4. \uBE0C\uB8E8\uD0C8\uB9AC\uC998 \uC678\uD53C\uB97C \uB450\uB978 \uCC44 \uB2E4\uD06C \uD328\uD134\uACFC \uBB34\uAC70\uC6B4 \uBC88\uB4E4\uC744 \uADF8\uB300\uB85C \uB450\uBA74 \uC6D0\uB9AC\uC640 \uC815\uBC18\uB300\uC5D0 \uB3C4\uB2EC\uD55C\uB2E4","\uBD88\uCE5C\uC808\uC744 \uC815\uC9C1\uC73C\uB85C \uCC29\uAC01\uD558\uAE30 \u2014 \uC800\uB300\uBE44, \uC791\uC740 \uD0C0\uAE43, \uD78C\uD2B8 \uC5C6\uB294 \uC778\uD130\uB799\uC158\uC740 '\uC9C4\uC2E4\uD55C UI'\uAC00 \uC544\uB2C8\uB77C \uC811\uADFC\uC131 \uC704\uBC18\uC774\uB2E4. \uC811\uADFC\uC131\uC740 \uBE0C\uB8E8\uD0C8\uB9AC\uC998\uC774 \uBA74\uC81C\uBC1B\uB294 \uD56D\uBAA9\uC774 \uC544\uB2C8\uB77C '\uC0AC\uC6A9\uC790 \uC874\uC911'\uC774\uB77C\uB294 \uADF8 \uC6D0\uB9AC\uC758 \uC2DC\uD5D8\uB300\uB2E4"]},{id:"ISM-POSTMOD",family:"airplane",name:"\uD3EC\uC2A4\uD2B8\uBAA8\uB354\uB2C8\uC998",card:`## \`ISM-POSTMOD\` \xB7 \uD3EC\uC2A4\uD2B8\uBAA8\uB354\uB2C8\uC998 / \uBA64\uD53C\uC2A4 (Postmodernism / Memphis)

**\uB2F4\uB860 1966\u20131990s** (Venturi \u300EComplexity and Contradiction\u300F) \xB7 **\uBA64\uD53C\uC2A4 1980.12\u20131987** \uBC00\uB77C\uB178
\uADF8\uB798\uD53D \uD655\uC7A5: 1980\uB144\uB300 \uB274\uC6E8\uC774\uBE0C(Greiman) \u2192 1990\uB144\uB300 \uADF8\uB7F0\uC9C0 \uD0C0\uC774\uD3EC(Carson)

**\uC778\uBB3C**: Ettore Sottsass \xB7 Robert Venturi \xB7 Michele De Lucchi \xB7 April Greiman \xB7 David Carson

**\uC6D0\uB9AC**
- \uC758\uBBF8\uB294 \uD615\uD0DC\uC5D0\uC11C \uC790\uB3D9\uC73C\uB85C \uBC1C\uC0DD\uD558\uC9C0 \uC54A\uB294\uB2E4 \u2014 **\uCC38\uC870, \uC778\uC6A9, \uBB38\uD654\uC801 \uCF54\uB4DC\uC5D0\uC11C \uBC1C\uC0DD\uD55C\uB2E4**
- \uBCF5\uC7A1\uC131\uACFC \uBAA8\uC21C\uC740 \uD574\uACB0\uD574\uC57C \uD560 \uC124\uACC4 \uC2E4\uD328\uAC00 \uC544\uB2C8\uB77C \uD45C\uD604\uC758 \uC790\uC6D0\uC774\uB2E4 ("Less is a bore")
- \uBAA8\uB4E0 \uBB38\uC81C\uC5D0 \uD1B5\uD558\uB294 \uB2E8 \uD558\uB098\uC758 \uBCF4\uD3B8 \uC591\uC2DD\uC774\uB77C\uB294 \uC804\uC81C\uB97C \uAC70\uBD80\uD55C\uB2E4 \u2014 \uB9E5\uB77D\uACFC \uB2E4\uC6D0\uC131\uC774 \uC55E\uC120\uB2E4
- \uACE0\uAE09/\uC800\uAE09\uC758 \uCDE8\uD5A5 \uC704\uACC4\uB294 \uC790\uC5F0\uC774 \uC544\uB2C8\uB77C \uBC1C\uBA85\uB41C \uC81C\uB3C4\uB2E4 \u2014 \uD0A4\uCE58\uC640 \uB300\uC911\uBB38\uD654\uB294 \uC815\uB2F9\uD55C \uC7AC\uB8CC\uB2E4
- **\uC0AC\uBB3C\uC740 \uC4F0\uC774\uAE30\uB9CC \uD558\uB294 \uAC83\uC774 \uC544\uB2C8\uB77C \uB9D0\uD558\uAE30\uB3C4 \uD55C\uB2E4** \u2014 '\uBB34\uC5C7\uC744 \uB9D0\uD558\uB294\uAC00'\uAC00 '\uBB34\uC5C7\uC744 \uD558\uB294\uAC00'\uC640 \uB3D9\uB4F1\uD55C \uC124\uACC4 \uB300\uC0C1\uC774\uB2E4

**\uC2DC\uAC01** (\uCC38\uACE0\uC6A9) \uD615\uAD11\xB7\uD30C\uC2A4\uD154 \uCDA9\uB3CC \uB2E4\uC0C9 / \uAE30\uD558 \uB3C4\uD615\uC758 \uC784\uC758\uC801 \uC801\uCE35(\uD1A0\uD15C) / \uD50C\uB77C\uC2A4\uD2F1 \uB77C\uBBF8\uB124\uC774\uD2B8\xB7\uD14C\uB77C\uC870 \uB4F1 '\uAC00\uC9DC' \uC7AC\uB8CC\uC758 \uB2F9\uB2F9\uD55C \uC0AC\uC6A9 / \uD0C0\uC774\uD3EC\uC758 \uCD95 \uC774\uD0C8\xB7\uC790\uAC04 \uD30C\uAD34\xB7\uB808\uC774\uC5B4 \uC911\uCCA9 / \uC800\uD574\uC0C1\uB3C4 \uBE44\uD2B8\uB9F5\uC744 \uC9C8\uAC10\uC73C\uB85C \uB178\uCD9C

**\uB300\uD45C\uC791** Carlton \uCC45\uC7A5(Sottsass, 1981) \xB7 \u300CDoes It Make Sense?\u300D(Greiman, 1986, MoMA) \xB7 \u300ERay Gun\u300F(Carson, 1992\u201395) \xB7 \u300EThe End of Print\u300F(1995)

**\uAC00\uC838\uC62C \uAC83**
- **\uC81C\uD488\uC758 \uC131\uACA9(personality)\uC740 \uAE30\uB2A5\uACFC \uB3D9\uB4F1\uD55C \uC124\uACC4 \uB300\uC0C1\uC774\uB2E4** \u2014 \uD1A4\xB7\uB9C8\uC774\uD06C\uB85C\uCE74\uD53C\xB7\uBAA8\uC158\uC758 \uC131\uACA9\xB7\uC77C\uB7EC\uC2A4\uD2B8 \uC2A4\uD0C0\uC77C\uC740 \uB098\uC911\uC5D0 \uC5B9\uB294 \uC7A5\uC2DD\uC774 \uC544\uB2C8\uB77C \uBB34\uC5C7\uC744 \uC758\uBBF8\uD558\uB294 \uC81C\uD488\uC778\uC9C0 \uACB0\uC815\uD558\uB294 \uCE35\uC704\uB2E4. **\uAE30\uB2A5 \uB3D9\uB4F1\uC131\uC774 \uD754\uD55C 2026\uB144 \uC2DC\uC7A5\uC5D0\uC11C \uCC28\uBCC4\uD654\uB294 \uB300\uBD80\uBD84 \uC5EC\uAE30\uC11C \uBC1C\uC0DD\uD55C\uB2E4** (\u2192 **L0 G4\uC758 \uC9C1\uC811 \uADFC\uAC70**)
- \uD558\uB098\uC758 \uB514\uC790\uC778 \uC2DC\uC2A4\uD15C\uC774 \uBAA8\uB4E0 \uB9E5\uB77D\uC5D0 \uCD5C\uC801\uC774\uB77C\uB294 \uAC00\uC815\uC744 \uC758\uC2EC\uD558\uB77C \u2014 \uB9C8\uCF00\uD305 \uC0AC\uC774\uD2B8\xB7\uC628\uBCF4\uB529\xB7\uACE0\uBC00\uB3C4 \uD234\uC740 \uC11C\uB85C \uB2E4\uB978 \uC870\uD615 \uB17C\uB9AC\uB97C \uC694\uAD6C\uD560 \uC218 \uC788\uACE0, \uC774\uB294 \uC2DC\uC2A4\uD15C\uC758 \uC2E4\uD328\uAC00 \uC544\uB2C8\uB77C \uB2E4\uC6D0\uC131\uC758 \uC815\uC0C1\uC801 \uADC0\uACB0\uC774\uB2E4
- **\uC0C8 \uB9E4\uCCB4\uC758 '\uACB0\uD568'\uC744 \uC9C8\uAC10\uC73C\uB85C \uC804\uD658** \u2014 Greiman\uC774 \uC800\uD574\uC0C1\uB3C4 \uBE44\uD2B8\uB9F5\uC73C\uB85C, Carson\uC774 \uC778\uC1C4 \uC0AC\uACE0\uB85C \uD588\uB358 \uC77C\uC744 \uC624\uB298\uC740 AI \uC0DD\uC131\uBB3C\uC758 \uBD88\uC644\uC804\uC131\uC774\uB098 \uC2E4\uC2DC\uAC04 \uB370\uC774\uD130\uC758 \uB178\uC774\uC988\uB85C \uD560 \uC218 \uC788\uB2E4

**\uB450\uACE0 \uC62C \uAC83**
- **'\uBB34\uC5C7\uC5D0 \uBC18\uB300\uD558\uB294\uAC00'\uAC00 \uC5C6\uB294 \uC0C1\uD0DC\uC5D0\uC11C \uD615\uD0DC\uB9CC \uBE4C\uB9AC\uAE30** \u2014 \uBA64\uD53C\uC2A4\uB3C4 Carson\uB3C4 \uC9C0\uBC30\uC801 \uADDC\uBC94(\uBAA8\uB354\uB2C8\uC998\xB7\uC2A4\uC704\uC2A4 \uADF8\uB9AC\uB4DC)\uC744 \uC815\uD655\uD788 \uACA8\uB208 \uBC18\uC791\uC6A9\uC774\uC5C8\uACE0, \uD45C\uC801\uC774 \uC5C6\uC73C\uBA74 \uB0A8\uB294 \uAC83\uC740 \uC8FC\uC7A5 \uC5C6\uB294 \uC18C\uC74C\uACFC 3\uB144 \uB4A4 \uCD0C\uC2A4\uB7EC\uC6CC\uC9C0\uB294 \uD2B8\uB80C\uB4DC \uAECD\uB370\uAE30\uB2E4 (\u2192 **L0 N5\uC758 \uC9C1\uC811 \uADFC\uAC70**)
- \uAC00\uB3C5\uC131\xB7\uD559\uC2B5 \uAC00\uB2A5\uC131\uC744 \uC2E4\uD5D8\uC758 \uBE44\uC6A9\uC73C\uB85C \uC9C0\uBD88\uD558\uAE30 \u2014 \uC7A1\uC9C0 \uD55C \uAD8C\uC740 \uB3C5\uC790\uAC00 \uD574\uB3C5\uC744 \uC990\uAE38 \uC218 \uC788\uC9C0\uB9CC, **\uACB0\uC81C\xB7\uC124\uC815\xB7\uC5D0\uB7EC \uBCF5\uAD6C \uD654\uBA74**\uC5D0\uC11C \uAC19\uC740 \uD30C\uAD34\uB294 \uC774\uD0C8\uB960\uACFC \uC811\uADFC\uC131 \uC2E4\uD328\uB85C \uC9C1\uACB0\uB41C\uB2E4

**\uC694\uC57D** \uB514\uC790\uC778\uC758 \uC784\uBB34\uB294 \uAE30\uB2A5\uC758 \uC21C\uC218\uD55C \uD574\uACB0\uC774 \uC544\uB2C8\uB77C \uC758\uBBF8\uB97C \uB9D0\uD558\uB294 \uAC83\uC774\uBA70, \uB2E8 \uD558\uB098\uC758 \uC62C\uBC14\uB978 \uC591\uC2DD\uC774 \uC788\uB2E4\uB294 \uC804\uC81C \uC790\uCCB4\uAC00 \uD2C0\uB838\uB2E4.`,summary:"\uB514\uC790\uC778\uC758 \uC784\uBB34\uB294 \uAE30\uB2A5\uC758 \uC21C\uC218\uD55C \uD574\uACB0\uC774 \uC544\uB2C8\uB77C \uC758\uBBF8\uB97C \uB9D0\uD558\uB294 \uAC83\uC774\uBA70, \uB2E8 \uD558\uB098\uC758 \uC62C\uBC14\uB978 \uC591\uC2DD\uC774 \uC788\uB2E4\uB294 \uC804\uC81C \uC790\uCCB4\uAC00 \uD2C0\uB838\uB2E4.",principles:["\uC758\uBBF8\uB294 \uD615\uD0DC\uC5D0\uC11C \uC790\uB3D9\uC73C\uB85C \uBC1C\uC0DD\uD558\uC9C0 \uC54A\uB294\uB2E4 \u2014 \uCC38\uC870, \uC778\uC6A9, \uBB38\uD654\uC801 \uCF54\uB4DC\uC5D0\uC11C \uBC1C\uC0DD\uD55C\uB2E4",'\uBCF5\uC7A1\uC131\uACFC \uBAA8\uC21C\uC740 \uD574\uACB0\uD574\uC57C \uD560 \uC124\uACC4 \uC2E4\uD328\uAC00 \uC544\uB2C8\uB77C \uD45C\uD604\uC758 \uC790\uC6D0\uC774\uB2E4 ("Less is a bore")',"\uBAA8\uB4E0 \uBB38\uC81C\uC5D0 \uD1B5\uD558\uB294 \uB2E8 \uD558\uB098\uC758 \uBCF4\uD3B8 \uC591\uC2DD\uC774\uB77C\uB294 \uC804\uC81C\uB97C \uAC70\uBD80\uD55C\uB2E4 \u2014 \uB9E5\uB77D\uACFC \uB2E4\uC6D0\uC131\uC774 \uC55E\uC120\uB2E4","\uACE0\uAE09/\uC800\uAE09\uC758 \uCDE8\uD5A5 \uC704\uACC4\uB294 \uC790\uC5F0\uC774 \uC544\uB2C8\uB77C \uBC1C\uBA85\uB41C \uC81C\uB3C4\uB2E4 \u2014 \uD0A4\uCE58\uC640 \uB300\uC911\uBB38\uD654\uB294 \uC815\uB2F9\uD55C \uC7AC\uB8CC\uB2E4","\uC0AC\uBB3C\uC740 \uC4F0\uC774\uAE30\uB9CC \uD558\uB294 \uAC83\uC774 \uC544\uB2C8\uB77C \uB9D0\uD558\uAE30\uB3C4 \uD55C\uB2E4 \u2014 '\uBB34\uC5C7\uC744 \uB9D0\uD558\uB294\uAC00'\uAC00 '\uBB34\uC5C7\uC744 \uD558\uB294\uAC00'\uC640 \uB3D9\uB4F1\uD55C \uC124\uACC4 \uB300\uC0C1\uC774\uB2E4"],take:["\uC81C\uD488\uC758 \uC131\uACA9(personality)\uC740 \uAE30\uB2A5\uACFC \uB3D9\uB4F1\uD55C \uC124\uACC4 \uB300\uC0C1\uC774\uB2E4 \u2014 \uD1A4\xB7\uB9C8\uC774\uD06C\uB85C\uCE74\uD53C\xB7\uBAA8\uC158\uC758 \uC131\uACA9\xB7\uC77C\uB7EC\uC2A4\uD2B8 \uC2A4\uD0C0\uC77C\uC740 \uB098\uC911\uC5D0 \uC5B9\uB294 \uC7A5\uC2DD\uC774 \uC544\uB2C8\uB77C \uBB34\uC5C7\uC744 \uC758\uBBF8\uD558\uB294 \uC81C\uD488\uC778\uC9C0 \uACB0\uC815\uD558\uB294 \uCE35\uC704\uB2E4. \uAE30\uB2A5 \uB3D9\uB4F1\uC131\uC774 \uD754\uD55C 2026\uB144 \uC2DC\uC7A5\uC5D0\uC11C \uCC28\uBCC4\uD654\uB294 \uB300\uBD80\uBD84 \uC5EC\uAE30\uC11C \uBC1C\uC0DD\uD55C\uB2E4","\uD558\uB098\uC758 \uB514\uC790\uC778 \uC2DC\uC2A4\uD15C\uC774 \uBAA8\uB4E0 \uB9E5\uB77D\uC5D0 \uCD5C\uC801\uC774\uB77C\uB294 \uAC00\uC815\uC744 \uC758\uC2EC\uD558\uB77C \u2014 \uB9C8\uCF00\uD305 \uC0AC\uC774\uD2B8\xB7\uC628\uBCF4\uB529\xB7\uACE0\uBC00\uB3C4 \uD234\uC740 \uC11C\uB85C \uB2E4\uB978 \uC870\uD615 \uB17C\uB9AC\uB97C \uC694\uAD6C\uD560 \uC218 \uC788\uACE0, \uC774\uB294 \uC2DC\uC2A4\uD15C\uC758 \uC2E4\uD328\uAC00 \uC544\uB2C8\uB77C \uB2E4\uC6D0\uC131\uC758 \uC815\uC0C1\uC801 \uADC0\uACB0\uC774\uB2E4","\uC0C8 \uB9E4\uCCB4\uC758 '\uACB0\uD568'\uC744 \uC9C8\uAC10\uC73C\uB85C \uC804\uD658 \u2014 Greiman\uC774 \uC800\uD574\uC0C1\uB3C4 \uBE44\uD2B8\uB9F5\uC73C\uB85C, Carson\uC774 \uC778\uC1C4 \uC0AC\uACE0\uB85C \uD588\uB358 \uC77C\uC744 \uC624\uB298\uC740 AI \uC0DD\uC131\uBB3C\uC758 \uBD88\uC644\uC804\uC131\uC774\uB098 \uC2E4\uC2DC\uAC04 \uB370\uC774\uD130\uC758 \uB178\uC774\uC988\uB85C \uD560 \uC218 \uC788\uB2E4"],leave:["'\uBB34\uC5C7\uC5D0 \uBC18\uB300\uD558\uB294\uAC00'\uAC00 \uC5C6\uB294 \uC0C1\uD0DC\uC5D0\uC11C \uD615\uD0DC\uB9CC \uBE4C\uB9AC\uAE30 \u2014 \uBA64\uD53C\uC2A4\uB3C4 Carson\uB3C4 \uC9C0\uBC30\uC801 \uADDC\uBC94(\uBAA8\uB354\uB2C8\uC998\xB7\uC2A4\uC704\uC2A4 \uADF8\uB9AC\uB4DC)\uC744 \uC815\uD655\uD788 \uACA8\uB208 \uBC18\uC791\uC6A9\uC774\uC5C8\uACE0, \uD45C\uC801\uC774 \uC5C6\uC73C\uBA74 \uB0A8\uB294 \uAC83\uC740 \uC8FC\uC7A5 \uC5C6\uB294 \uC18C\uC74C\uACFC 3\uB144 \uB4A4 \uCD0C\uC2A4\uB7EC\uC6CC\uC9C0\uB294 \uD2B8\uB80C\uB4DC \uAECD\uB370\uAE30\uB2E4","\uAC00\uB3C5\uC131\xB7\uD559\uC2B5 \uAC00\uB2A5\uC131\uC744 \uC2E4\uD5D8\uC758 \uBE44\uC6A9\uC73C\uB85C \uC9C0\uBD88\uD558\uAE30 \u2014 \uC7A1\uC9C0 \uD55C \uAD8C\uC740 \uB3C5\uC790\uAC00 \uD574\uB3C5\uC744 \uC990\uAE38 \uC218 \uC788\uC9C0\uB9CC, \uACB0\uC81C\xB7\uC124\uC815\xB7\uC5D0\uB7EC \uBCF5\uAD6C \uD654\uBA74\uC5D0\uC11C \uAC19\uC740 \uD30C\uAD34\uB294 \uC774\uD0C8\uB960\uACFC \uC811\uADFC\uC131 \uC2E4\uD328\uB85C \uC9C1\uACB0\uB41C\uB2E4"]},{id:"ISM-DECON",family:"airplane",name:"\uD574\uCCB4\uC8FC\uC758",card:`## \`ISM-DECON\` \xB7 \uD574\uCCB4\uC8FC\uC758 (Deconstructivism)

**\uCCA0\uD559 1967**(Derrida \u300E\uADF8\uB77C\uB9C8\uD1A8\uB85C\uC9C0\u300F) \u2192 **\uADF8\uB798\uD53D \uC218\uC6A9 1978\u20131995**(Cranbrook) \u2192 **\uAC74\uCD95 \uACF5\uC778 1988**(MoMA \u3008Deconstructivist Architecture\u3009)

**\uC778\uBB3C**: Jacques Derrida \xB7 Katherine McCoy(Cranbrook \uACF5\uB3D9\uC8FC\uC784 1971\u201395) \xB7 P. Scott Makela \xB7 Peter Eisenman \xB7 Zaha Hadid

**\uC6D0\uB9AC**
- \uC758\uBBF8\uB294 \uD615\uD0DC \uC548\uC5D0 \uB2F4\uAE30\uC9C0 \uC54A\uACE0 **\uD615\uD0DC\uB4E4\uC758 \uCC28\uC774\uC640 \uAC04\uACA9\uC5D0\uC11C \uBC1C\uC0DD**\uD55C\uB2E4 \u2192 \uC5EC\uBC31\xB7\uAC04\uACA9\xB7\uD2C0\uC740 \uC7A5\uC2DD\uC774 \uC544\uB2C8\uB77C \uC758\uBBF8\uC758 \uC0DD\uC0B0 \uC7A5\uCE58\uB2E4
- \uC800\uC790\uC758 \uC758\uB3C4\uAC00 \uCD5C\uC885 \uC758\uBBF8\uB97C \uD655\uC815\uD558\uC9C0 \uBABB\uD55C\uB2E4. \uC77D\uB294 \uD589\uC704\uAC00 \uC758\uBBF8\uB97C \uC644\uC131\uD558\uBBC0\uB85C **\uB3C5\uC790\uB294 \uC218\uC2E0\uC790\uAC00 \uC544\uB2C8\uB77C \uACF5\uB3D9\uC0DD\uC0B0\uC790**\uB2E4
- **\uC704\uACC4\uB294 \uC790\uC5F0\uC801 \uC9C8\uC11C\uAC00 \uC544\uB2C8\uB77C \uAD00\uC2B5\uC801 \uAD6C\uC131\uBB3C\uC774\uB2E4** \u2014 \uB530\uB77C\uC11C \uB4A4\uC9D1\uC744 \uC218 \uC788\uACE0, \uB4A4\uC9D1\uC5B4 \uBCF4\uBA74 \uADF8 \uC704\uACC4\uAC00 \uBB34\uC5C7\uC744 \uC5B5\uC555\uD588\uB294\uC9C0 \uB4DC\uB7EC\uB09C\uB2E4
- \uAD6C\uC870\uC758 \uACB0\uD568\xB7\uAE34\uC7A5\xB7\uBAA8\uC21C\uC740 \uC81C\uAC70\uD560 \uC624\uB958\uAC00 \uC544\uB2C8\uB77C \uADF8 \uAD6C\uC870\uAC00 \uBB34\uC5C7\uC744 \uC804\uC81C\uD588\uB294\uC9C0 \uBCF4\uC5EC\uC8FC\uB294 \uC99D\uAC70\uB2E4
- **\uD574\uCCB4\uB294 \uACB0\uACFC\uBB3C\uC758 \uC0C1\uD0DC\uAC00 \uC544\uB2C8\uB77C \uC9C8\uBB38\uC758 \uC808\uCC28\uB2E4.** \uD615\uC2DD\uC801 \uD30C\uD3B8\uD654 \uC790\uCCB4\uB294 \uD574\uCCB4\uAC00 \uC544\uB2C8\uB2E4

**\uC2DC\uAC01** (\uCC38\uACE0\uC6A9) \uBC18\uD22C\uBA85 \uB808\uC774\uC5B4 \uC911\uCCA9 / \uAE30\uC900\uC120\xB7\uACA9\uC790 \uC774\uD0C8 \uD14D\uC2A4\uD2B8 / \uD55C \uD654\uBA74 \uC548\uC758 \uBCF5\uC218 \uB3C5\uD574 \uACBD\uB85C / \uC11C\uCCB4 \uD63C\uD569\xB7\uD558\uC774\uBE0C\uB9AC\uB4DC \uAE00\uC790\uCCB4 / \uBE44\uC9C1\uAD50 \uC0AC\uC120 \uCD95

**\uB300\uD45C\uC791** \u300CThe Graduate Program in Design\u300D \uD3EC\uC2A4\uD130(McCoy, 1989) \xB7 \uC11C\uCCB4 Dead History(Makela, Emigre, 1990) \xB7 Vitra Fire Station(Hadid, 1991\u201393) \xB7 Wexner Center(Eisenman, 1989)

**\uAC00\uC838\uC62C \uAC83**
- **\uC778\uD130\uD398\uC774\uC2A4 \uC704\uACC4\uB294 '\uC790\uC5F0\uC2A4\uB7EC\uC6C0'\uC774 \uC544\uB2C8\uB77C \uC120\uD0DD\uC774\uB2E4** \u2014 \uBB34\uC5C7\uC744 \uD06C\uAC8C, \uBA3C\uC800 \uBCF4\uC5EC\uC8FC\uB294\uC9C0\uAC00 \uACE7 \uC8FC\uC7A5\uC774\uB2E4. \uC704\uACC4\uB97C \uB4A4\uC9D1\uC740 \uD504\uB85C\uD1A0\uD0C0\uC785\uC744 \uB9CC\uB4E4\uC5B4 \uBCF4\uBA74 \uADF8 \uD654\uBA74\uC774 \uB204\uAD6C\uC758 \uC774\uD574\uB97C \uC804\uC81C\uD588\uB294\uC9C0 \uB4DC\uB7EC\uB09C\uB2E4
- \uC0AC\uC6A9\uC790\uB97C \uC758\uBBF8\uC758 \uACF5\uB3D9\uC0DD\uC0B0\uC790\uB85C \uC124\uACC4 \u2014 \uC77D\uB294 \uC21C\uC11C\uB97C \uD558\uB098\uB85C \uAC15\uC81C\uD558\uC9C0 \uC54A\uACE0 \uBCF5\uC218 \uC9C4\uC785\uC810\uC744 \uD5C8\uC6A9. \uB2E8 **\uC804\uD658 \uACFC\uC5C5 \uACBD\uB85C\uAC00 \uC544\uB2CC \uD0D0\uC0C9\xB7\uC5D0\uB514\uD1A0\uB9AC\uC5BC \uC601\uC5ED\uC5D0\uB9CC** \uC801\uC6A9
- **\uC5EC\uBC31\xB7\uAC04\uACA9\xB7\uAD6C\uBD84\uC120\xB7\uD504\uB808\uC784\uC744 \uCF58\uD150\uCE20\uC640 \uB3D9\uAE09\uC758 \uC124\uACC4 \uB300\uC0C1\uC73C\uB85C** \u2014 \uC2A4\uD398\uC774\uC2F1 \uD1A0\uD070\uC740 \uC7A5\uC2DD \uBCC0\uC218\uAC00 \uC544\uB2C8\uB77C \uC758\uBBF8 \uBCC0\uC218\uB2E4

**\uB450\uACE0 \uC62C \uAC83**
- \uD574\uCCB4\uB97C '\uC5B4\uAE0B\uB0A8\xB7\uC911\uCCA9\xB7\uC0AC\uC120'\uC758 **\uC2DC\uAC01 \uB808\uC2DC\uD53C\uB85C \uCD95\uC18C**\uD558\uAE30 \u2014 1990\uB144\uB300\uC5D0 \uC2E4\uC81C\uB85C \uC77C\uC5B4\uB09C \uC77C\uC774\uACE0, Ellen Lupton\uC774 "\uBE44\uD310\uC801 \uBC29\uBC95\uC774 \uC0C1\uD488\uD654\uB41C ism\uC774 \uB418\uC5C8\uB2E4"\uACE0 \uC9C0\uC801\uD55C \uC9C0\uC810\uC774\uB2E4. \uADFC\uAC70 \uC5C6\uB294 \uD30C\uD3B8\uD654\uB294 \uD574\uCCB4\uAC00 \uC544\uB2C8\uB77C \uADF8\uB0E5 \uC77D\uAE30 \uC5B4\uB824\uC6B4 \uD654\uBA74\uC774\uB2E4
- \uC811\uADFC\uC131 \uBD95\uAD34 \u2014 \uB300\uBE44\xB7\uCD08\uC810 \uC21C\uC11C\xB7\uC2A4\uD06C\uB9B0\uB9AC\uB354 \uC77D\uAE30 \uC21C\uC11C\xB7\uD0A4\uBCF4\uB4DC \uD0D0\uC0C9\uC740 '\uC2E4\uD5D8'\uC758 \uBA85\uBD84\uC73C\uB85C \uBA74\uC81C\uB418\uC9C0 \uC54A\uB294\uB2E4

**\uC694\uC57D** \uD574\uCCB4\uB294 \uC2DC\uAC01 \uC591\uC2DD\uC774 \uC544\uB2C8\uB77C "\uC774 \uC704\uACC4\uB294 \uB204\uAC00 \uC815\uD588\uB294\uAC00"\uB97C \uBB3B\uB294 \uC808\uCC28\uB2E4.`,summary:'\uD574\uCCB4\uB294 \uC2DC\uAC01 \uC591\uC2DD\uC774 \uC544\uB2C8\uB77C "\uC774 \uC704\uACC4\uB294 \uB204\uAC00 \uC815\uD588\uB294\uAC00"\uB97C \uBB3B\uB294 \uC808\uCC28\uB2E4.',principles:["\uC758\uBBF8\uB294 \uD615\uD0DC \uC548\uC5D0 \uB2F4\uAE30\uC9C0 \uC54A\uACE0 \uD615\uD0DC\uB4E4\uC758 \uCC28\uC774\uC640 \uAC04\uACA9\uC5D0\uC11C \uBC1C\uC0DD\uD55C\uB2E4 \u2192 \uC5EC\uBC31\xB7\uAC04\uACA9\xB7\uD2C0\uC740 \uC7A5\uC2DD\uC774 \uC544\uB2C8\uB77C \uC758\uBBF8\uC758 \uC0DD\uC0B0 \uC7A5\uCE58\uB2E4","\uC800\uC790\uC758 \uC758\uB3C4\uAC00 \uCD5C\uC885 \uC758\uBBF8\uB97C \uD655\uC815\uD558\uC9C0 \uBABB\uD55C\uB2E4. \uC77D\uB294 \uD589\uC704\uAC00 \uC758\uBBF8\uB97C \uC644\uC131\uD558\uBBC0\uB85C \uB3C5\uC790\uB294 \uC218\uC2E0\uC790\uAC00 \uC544\uB2C8\uB77C \uACF5\uB3D9\uC0DD\uC0B0\uC790\uB2E4","\uC704\uACC4\uB294 \uC790\uC5F0\uC801 \uC9C8\uC11C\uAC00 \uC544\uB2C8\uB77C \uAD00\uC2B5\uC801 \uAD6C\uC131\uBB3C\uC774\uB2E4 \u2014 \uB530\uB77C\uC11C \uB4A4\uC9D1\uC744 \uC218 \uC788\uACE0, \uB4A4\uC9D1\uC5B4 \uBCF4\uBA74 \uADF8 \uC704\uACC4\uAC00 \uBB34\uC5C7\uC744 \uC5B5\uC555\uD588\uB294\uC9C0 \uB4DC\uB7EC\uB09C\uB2E4","\uAD6C\uC870\uC758 \uACB0\uD568\xB7\uAE34\uC7A5\xB7\uBAA8\uC21C\uC740 \uC81C\uAC70\uD560 \uC624\uB958\uAC00 \uC544\uB2C8\uB77C \uADF8 \uAD6C\uC870\uAC00 \uBB34\uC5C7\uC744 \uC804\uC81C\uD588\uB294\uC9C0 \uBCF4\uC5EC\uC8FC\uB294 \uC99D\uAC70\uB2E4","\uD574\uCCB4\uB294 \uACB0\uACFC\uBB3C\uC758 \uC0C1\uD0DC\uAC00 \uC544\uB2C8\uB77C \uC9C8\uBB38\uC758 \uC808\uCC28\uB2E4. \uD615\uC2DD\uC801 \uD30C\uD3B8\uD654 \uC790\uCCB4\uB294 \uD574\uCCB4\uAC00 \uC544\uB2C8\uB2E4"],take:["\uC778\uD130\uD398\uC774\uC2A4 \uC704\uACC4\uB294 '\uC790\uC5F0\uC2A4\uB7EC\uC6C0'\uC774 \uC544\uB2C8\uB77C \uC120\uD0DD\uC774\uB2E4 \u2014 \uBB34\uC5C7\uC744 \uD06C\uAC8C, \uBA3C\uC800 \uBCF4\uC5EC\uC8FC\uB294\uC9C0\uAC00 \uACE7 \uC8FC\uC7A5\uC774\uB2E4. \uC704\uACC4\uB97C \uB4A4\uC9D1\uC740 \uD504\uB85C\uD1A0\uD0C0\uC785\uC744 \uB9CC\uB4E4\uC5B4 \uBCF4\uBA74 \uADF8 \uD654\uBA74\uC774 \uB204\uAD6C\uC758 \uC774\uD574\uB97C \uC804\uC81C\uD588\uB294\uC9C0 \uB4DC\uB7EC\uB09C\uB2E4","\uC0AC\uC6A9\uC790\uB97C \uC758\uBBF8\uC758 \uACF5\uB3D9\uC0DD\uC0B0\uC790\uB85C \uC124\uACC4 \u2014 \uC77D\uB294 \uC21C\uC11C\uB97C \uD558\uB098\uB85C \uAC15\uC81C\uD558\uC9C0 \uC54A\uACE0 \uBCF5\uC218 \uC9C4\uC785\uC810\uC744 \uD5C8\uC6A9. \uB2E8 \uC804\uD658 \uACFC\uC5C5 \uACBD\uB85C\uAC00 \uC544\uB2CC \uD0D0\uC0C9\xB7\uC5D0\uB514\uD1A0\uB9AC\uC5BC \uC601\uC5ED\uC5D0\uB9CC \uC801\uC6A9","\uC5EC\uBC31\xB7\uAC04\uACA9\xB7\uAD6C\uBD84\uC120\xB7\uD504\uB808\uC784\uC744 \uCF58\uD150\uCE20\uC640 \uB3D9\uAE09\uC758 \uC124\uACC4 \uB300\uC0C1\uC73C\uB85C \u2014 \uC2A4\uD398\uC774\uC2F1 \uD1A0\uD070\uC740 \uC7A5\uC2DD \uBCC0\uC218\uAC00 \uC544\uB2C8\uB77C \uC758\uBBF8 \uBCC0\uC218\uB2E4"],leave:[`\uD574\uCCB4\uB97C '\uC5B4\uAE0B\uB0A8\xB7\uC911\uCCA9\xB7\uC0AC\uC120'\uC758 \uC2DC\uAC01 \uB808\uC2DC\uD53C\uB85C \uCD95\uC18C\uD558\uAE30 \u2014 1990\uB144\uB300\uC5D0 \uC2E4\uC81C\uB85C \uC77C\uC5B4\uB09C \uC77C\uC774\uACE0, Ellen Lupton\uC774 "\uBE44\uD310\uC801 \uBC29\uBC95\uC774 \uC0C1\uD488\uD654\uB41C ism\uC774 \uB418\uC5C8\uB2E4"\uACE0 \uC9C0\uC801\uD55C \uC9C0\uC810\uC774\uB2E4. \uADFC\uAC70 \uC5C6\uB294 \uD30C\uD3B8\uD654\uB294 \uD574\uCCB4\uAC00 \uC544\uB2C8\uB77C \uADF8\uB0E5 \uC77D\uAE30 \uC5B4\uB824\uC6B4 \uD654\uBA74\uC774\uB2E4`,"\uC811\uADFC\uC131 \uBD95\uAD34 \u2014 \uB300\uBE44\xB7\uCD08\uC810 \uC21C\uC11C\xB7\uC2A4\uD06C\uB9B0\uB9AC\uB354 \uC77D\uAE30 \uC21C\uC11C\xB7\uD0A4\uBCF4\uB4DC \uD0D0\uC0C9\uC740 '\uC2E4\uD5D8'\uC758 \uBA85\uBD84\uC73C\uB85C \uBA74\uC81C\uB418\uC9C0 \uC54A\uB294\uB2E4"]},{id:"ISM-PUNK",family:"airplane",name:"\uD391\uD06C",card:`## \`ISM-PUNK\` \xB7 \uD391\uD06C / DIY (Punk graphics & DIY)

**1976\u20131980\uB144\uB300 \uCD08** (\uC601\uAD6D \uD391\uD06C \uC815\uC810 1976\u201379) \xB7 \uC601\uAD6D \uB7F0\uB358\xB7\uB9E8\uCCB4\uC2A4\uD130 \u2192 \uBBF8\uAD6D

**\uC778\uBB3C**: Jamie Reid \xB7 Malcolm McLaren \xB7 Mark Perry(\u300ESniffin' Glue\u300F) \xB7 Linder Sterling \xB7 Gee Vaucher

**\uC6D0\uB9AC**
- **\uC0DD\uC0B0 \uC218\uB2E8\uC758 \uC811\uADFC\uC131\uC774 \uD45C\uD604\uC758 \uC790\uACA9\uC744 \uACB0\uC815\uD55C\uB2E4** \u2014 \uB3C4\uAD6C\uAC00 \uC2F8\uACE0 \uD754\uD558\uBA74 \uB204\uAD6C\uB098 \uBC1C\uD654\uC790\uAC00 \uB41C\uB2E4
- \uC644\uC131\uB3C4\uB294 \uAD8C\uC704\uC758 \uC7A5\uCE58\uB2E4. \uAC70\uCE5C \uB9C8\uAC10\uC740 \uC2E4\uD328\uC758 \uD754\uC801\uC774 \uC544\uB2C8\uB77C \uADF8 \uAD8C\uC704\uB97C \uAC70\uBD80\uD55C \uC99D\uAC70\uB2E4
- \uAE30\uC131 \uC774\uBBF8\uC9C0\uB294 \uC18C\uC720\uBB3C\uC774 \uC544\uB2C8\uB77C \uC7AC\uB8CC\uB2E4 \u2014 \uC9C0\uBC30\uC801 \uC774\uBBF8\uC9C0\uB97C \uC798\uB77C \uBB38\uB9E5\uC744 \uBC14\uAFB8\uBA74 **\uC6D0\uB798 \uC758\uBBF8\uAC00 \uC2A4\uC2A4\uB85C\uB97C \uBC30\uBC18\uD55C\uB2E4** (\uC0C1\uD669\uC8FC\uC758 d\xE9tournement)
- \uB9E4\uCCB4\uAC00 \uACE7 \uBA54\uC2DC\uC9C0\uB2E4 \u2014 \uBCF5\uC0AC\uAE30\xB7\uC2A4\uD14C\uC774\uD50C\uB7EC\xB7\uC6B0\uD3B8\uC740 \uAE30\uC131 \uBC30\uAE09 \uAD6C\uC870\uB97C \uC6B0\uD68C\uD558\uB294 \uC815\uCE58\uC801 \uC120\uD0DD\uC774\uB2E4
- \uBE44\uC804\uBB38\uC131\uACFC \uC775\uBA85\uC131\uC740 \uACB0\uD568\uC774 \uC544\uB2C8\uB77C \uC811\uADFC\uAD8C\uC758 \uD655\uC7A5\uC774\uB2E4 \u2014 **\uC544\uB9C8\uCD94\uC5B4\uAC00 \uB9CC\uB4E0 \uAC83\uCC98\uB7FC \uBCF4\uC5EC\uC57C \uB2E4\uC74C \uC0AC\uB78C\uC774 \uB530\uB77C \uB9CC\uB4E0\uB2E4**

**\uC2DC\uAC01** (\uCC38\uACE0\uC6A9) \uBAB8\uAC12\uC694\uAD6C\uC11C(ransom note) \uB808\uD130\uB9C1 / \uBCF5\uC0AC\uAE30 \uC5F4\uD654 \u2014 \uACE0\uB300\uBE44\xB7\uB9DD\uC810 \uAE68\uC9D0 / \uD615\uAD11 \uB370\uC774\uAE00\uB85C 1~2\uB3C4 \uC778\uC1C4 / \uB178\uCD9C\uB41C \uAC00\uC704\uC120\uACFC \uD14C\uC774\uD504 / \uD0C0\uC790\uAE30 \uBCF8\uBB38 + \uB9E4\uC9C1\uD39C \uD5E4\uB4DC\uB77C\uC778 / \uC815\uB82C \uBB34\uC2DC

**\uB300\uD45C\uC791** \u3008God Save the Queen\u3009(Reid, 1977) \xB7 \u300ENever Mind the Bollocks\u300F(Reid, 1977) \xB7 \u300ESniffin' Glue\u300F 1\u201312\uD638(Perry, 1976\u201377) \xB7 \u3008Orgasm Addict\u3009(Sterling\xB7Garrett, 1977, MoMA)

> \uC790\uC8FC \uD2C0\uB9AC\uB294 \uBD80\uBD84: "\uC138 \uAC1C\uC758 \uCF54\uB4DC\uB97C \uBC30\uC6E0\uB2E4, \uC774\uC81C \uBC34\uB4DC\uB97C \uB9CC\uB4E4\uC5B4\uB77C"\uB294 \u300ESniffin' Glue\u300F\uAC00 \uC544\uB2C8\uB77C Tony Moon\uC758 \uD32C\uC9C4 \u300ESideburns\u300F 1\uD638(1977.1) \uCD9C\uCC98.

**\uAC00\uC838\uC62C \uAC83**
- **\uC81C\uC791 \uB3C4\uAD6C\uB97C \uACF5\uAC1C\uD558\uBA74 \uCC38\uC5EC\uAC00 \uB298\uC5B4\uB09C\uB2E4** \u2014 \uD15C\uD50C\uB9BF\xB7\uCEF4\uD3EC\uB10C\uD2B8\xB7\uC5D0\uC14B\uC744 \uD300 \uC678\uBD80\uAE4C\uC9C0 \uAC1C\uBC29\uD558\uB294 \uAC83\uC774 \uD391\uD06C\uC758 \uC2E4\uC9C8\uC801 \uACC4\uC2B9\uC774\uB2E4. \uB514\uC790\uC778 \uC2DC\uC2A4\uD15C\uC758 "\uB204\uAD6C\uB098 \uB9CC\uB4E4 \uC218 \uC788\uAC8C"\uB294 \uBBF8\uD559\uC774 \uC544\uB2C8\uB77C \uC815\uCE58\uB2E4
- \uB2E4\uB4EC\uC9C0 \uC54A\uC740 \uC0C1\uD0DC\uB97C \uC758\uB3C4\uC801\uC73C\uB85C \uB0A8\uACA8 \uC2E0\uB8B0\uB97C \uC5BB\uB294 \uAD6C\uAC04 \u2014 \uC190\uAE00\uC528, \uC9C1\uC811 \uCC0D\uC740 \uC0AC\uC9C4, \uC218\uC815 \uC774\uB825 \uB178\uCD9C\uC774 \uACFC\uC789 \uB80C\uB354\uB9C1\uB41C \uD654\uBA74\uBCF4\uB2E4 \uC9C4\uC815\uC131\uC744 \uC804\uB2EC\uD55C\uB2E4 (\uCEE4\uBBA4\uB2C8\uD2F0\xB7\uACF5\uC9C0\xB7\uC0AC\uB0B4 \uB3C4\uAD6C)
- **\uC81C\uC57D\uC744 \uC120\uC5B8\uC801\uC73C\uB85C \uC0AC\uC6A9** \u2014 2\uC0C9, \uB2E8\uC77C \uC11C\uCCB4, \uC2DC\uC2A4\uD15C \uD3F0\uD2B8 \uAC19\uC740 \uC790\uAE30\uBD80\uACFC \uC81C\uC57D\uC740 \uC18D\uB3C4\uC640 \uC77C\uAD00\uC131\uC744 \uB3D9\uC2DC\uC5D0 \uC5BB\uB294 \uC2E4\uBB34 \uC804\uB7B5\uC774\uB2E4

**\uB450\uACE0 \uC62C \uAC83**
- '\uD391\uD06C \uB8E9'\uB9CC \uCC28\uC6A9\uD574 \uB300\uAE30\uC5C5 \uCEA0\uD398\uC778\uC5D0 \uC4F0\uAE30 \u2014 \uC6D0\uB798\uC758 \uBC18\uAD8C\uC704 \uC8FC\uC7A5\uC774 \uD310\uB9E4 \uC7A5\uCE58\uB85C \uC5ED\uC804\uB41C\uB2E4. 1977\uB144\uC758 \uACF5\uACA9 \uB300\uC0C1\uC774 \uC815\uD655\uD788 \uADF8 \uAD6C\uC870\uC600\uB2E4\uB294 \uC810\uC5D0\uC11C \uC790\uAE30\uBAA8\uC21C\uC774\uB2E4
- **\uAC70\uCE60\uAE30\uB97C '\uC644\uC131\uB3C4 \uBA74\uC81C'\uC758 \uC54C\uB9AC\uBC14\uC774\uB85C \uC4F0\uAE30** \u2014 \uC2E4\uC81C \uD391\uD06C \uC778\uC1C4\uBB3C\uC758 \uAC70\uCE60\uAE30\uB294 \uBE44\uC6A9\xB7\uAC80\uC5F4\xB7\uBC30\uAE09\uC774\uB77C\uB294 \uC2E4\uC81C \uC81C\uC57D\uC758 \uACB0\uACFC\uC600\uACE0, \uC81C\uC57D \uC5C6\uC774 \uD749\uB0B4\uB0B8 \uAC70\uCE60\uAE30\uB294 \uADF8\uB0E5 \uB0AE\uC740 \uD488\uC9C8\uC774\uB2E4

**\uC694\uC57D** \uB3C4\uAD6C\uAC00 \uC2F8\uACE0 \uD754\uD558\uBA74 \uB204\uAD6C\uB098 \uBC1C\uD654\uC790\uAC00 \uB418\uBA70, \uAC70\uCE5C \uB9C8\uAC10\uC740 \uADF8 \uC811\uADFC\uAD8C\uC758 \uC99D\uAC70\uB2E4.`,summary:"\uB3C4\uAD6C\uAC00 \uC2F8\uACE0 \uD754\uD558\uBA74 \uB204\uAD6C\uB098 \uBC1C\uD654\uC790\uAC00 \uB418\uBA70, \uAC70\uCE5C \uB9C8\uAC10\uC740 \uADF8 \uC811\uADFC\uAD8C\uC758 \uC99D\uAC70\uB2E4.",principles:["\uC0DD\uC0B0 \uC218\uB2E8\uC758 \uC811\uADFC\uC131\uC774 \uD45C\uD604\uC758 \uC790\uACA9\uC744 \uACB0\uC815\uD55C\uB2E4 \u2014 \uB3C4\uAD6C\uAC00 \uC2F8\uACE0 \uD754\uD558\uBA74 \uB204\uAD6C\uB098 \uBC1C\uD654\uC790\uAC00 \uB41C\uB2E4","\uC644\uC131\uB3C4\uB294 \uAD8C\uC704\uC758 \uC7A5\uCE58\uB2E4. \uAC70\uCE5C \uB9C8\uAC10\uC740 \uC2E4\uD328\uC758 \uD754\uC801\uC774 \uC544\uB2C8\uB77C \uADF8 \uAD8C\uC704\uB97C \uAC70\uBD80\uD55C \uC99D\uAC70\uB2E4","\uAE30\uC131 \uC774\uBBF8\uC9C0\uB294 \uC18C\uC720\uBB3C\uC774 \uC544\uB2C8\uB77C \uC7AC\uB8CC\uB2E4 \u2014 \uC9C0\uBC30\uC801 \uC774\uBBF8\uC9C0\uB97C \uC798\uB77C \uBB38\uB9E5\uC744 \uBC14\uAFB8\uBA74 \uC6D0\uB798 \uC758\uBBF8\uAC00 \uC2A4\uC2A4\uB85C\uB97C \uBC30\uBC18\uD55C\uB2E4 (\uC0C1\uD669\uC8FC\uC758 d\xE9tournement)","\uB9E4\uCCB4\uAC00 \uACE7 \uBA54\uC2DC\uC9C0\uB2E4 \u2014 \uBCF5\uC0AC\uAE30\xB7\uC2A4\uD14C\uC774\uD50C\uB7EC\xB7\uC6B0\uD3B8\uC740 \uAE30\uC131 \uBC30\uAE09 \uAD6C\uC870\uB97C \uC6B0\uD68C\uD558\uB294 \uC815\uCE58\uC801 \uC120\uD0DD\uC774\uB2E4","\uBE44\uC804\uBB38\uC131\uACFC \uC775\uBA85\uC131\uC740 \uACB0\uD568\uC774 \uC544\uB2C8\uB77C \uC811\uADFC\uAD8C\uC758 \uD655\uC7A5\uC774\uB2E4 \u2014 \uC544\uB9C8\uCD94\uC5B4\uAC00 \uB9CC\uB4E0 \uAC83\uCC98\uB7FC \uBCF4\uC5EC\uC57C \uB2E4\uC74C \uC0AC\uB78C\uC774 \uB530\uB77C \uB9CC\uB4E0\uB2E4"],take:['\uC81C\uC791 \uB3C4\uAD6C\uB97C \uACF5\uAC1C\uD558\uBA74 \uCC38\uC5EC\uAC00 \uB298\uC5B4\uB09C\uB2E4 \u2014 \uD15C\uD50C\uB9BF\xB7\uCEF4\uD3EC\uB10C\uD2B8\xB7\uC5D0\uC14B\uC744 \uD300 \uC678\uBD80\uAE4C\uC9C0 \uAC1C\uBC29\uD558\uB294 \uAC83\uC774 \uD391\uD06C\uC758 \uC2E4\uC9C8\uC801 \uACC4\uC2B9\uC774\uB2E4. \uB514\uC790\uC778 \uC2DC\uC2A4\uD15C\uC758 "\uB204\uAD6C\uB098 \uB9CC\uB4E4 \uC218 \uC788\uAC8C"\uB294 \uBBF8\uD559\uC774 \uC544\uB2C8\uB77C \uC815\uCE58\uB2E4',"\uB2E4\uB4EC\uC9C0 \uC54A\uC740 \uC0C1\uD0DC\uB97C \uC758\uB3C4\uC801\uC73C\uB85C \uB0A8\uACA8 \uC2E0\uB8B0\uB97C \uC5BB\uB294 \uAD6C\uAC04 \u2014 \uC190\uAE00\uC528, \uC9C1\uC811 \uCC0D\uC740 \uC0AC\uC9C4, \uC218\uC815 \uC774\uB825 \uB178\uCD9C\uC774 \uACFC\uC789 \uB80C\uB354\uB9C1\uB41C \uD654\uBA74\uBCF4\uB2E4 \uC9C4\uC815\uC131\uC744 \uC804\uB2EC\uD55C\uB2E4 (\uCEE4\uBBA4\uB2C8\uD2F0\xB7\uACF5\uC9C0\xB7\uC0AC\uB0B4 \uB3C4\uAD6C)","\uC81C\uC57D\uC744 \uC120\uC5B8\uC801\uC73C\uB85C \uC0AC\uC6A9 \u2014 2\uC0C9, \uB2E8\uC77C \uC11C\uCCB4, \uC2DC\uC2A4\uD15C \uD3F0\uD2B8 \uAC19\uC740 \uC790\uAE30\uBD80\uACFC \uC81C\uC57D\uC740 \uC18D\uB3C4\uC640 \uC77C\uAD00\uC131\uC744 \uB3D9\uC2DC\uC5D0 \uC5BB\uB294 \uC2E4\uBB34 \uC804\uB7B5\uC774\uB2E4"],leave:["'\uD391\uD06C \uB8E9'\uB9CC \uCC28\uC6A9\uD574 \uB300\uAE30\uC5C5 \uCEA0\uD398\uC778\uC5D0 \uC4F0\uAE30 \u2014 \uC6D0\uB798\uC758 \uBC18\uAD8C\uC704 \uC8FC\uC7A5\uC774 \uD310\uB9E4 \uC7A5\uCE58\uB85C \uC5ED\uC804\uB41C\uB2E4. 1977\uB144\uC758 \uACF5\uACA9 \uB300\uC0C1\uC774 \uC815\uD655\uD788 \uADF8 \uAD6C\uC870\uC600\uB2E4\uB294 \uC810\uC5D0\uC11C \uC790\uAE30\uBAA8\uC21C\uC774\uB2E4","\uAC70\uCE60\uAE30\uB97C '\uC644\uC131\uB3C4 \uBA74\uC81C'\uC758 \uC54C\uB9AC\uBC14\uC774\uB85C \uC4F0\uAE30 \u2014 \uC2E4\uC81C \uD391\uD06C \uC778\uC1C4\uBB3C\uC758 \uAC70\uCE60\uAE30\uB294 \uBE44\uC6A9\xB7\uAC80\uC5F4\xB7\uBC30\uAE09\uC774\uB77C\uB294 \uC2E4\uC81C \uC81C\uC57D\uC758 \uACB0\uACFC\uC600\uACE0, \uC81C\uC57D \uC5C6\uC774 \uD749\uB0B4\uB0B8 \uAC70\uCE60\uAE30\uB294 \uADF8\uB0E5 \uB0AE\uC740 \uD488\uC9C8\uC774\uB2E4"]},{id:"ISM-JP",family:"airplane",name:"\uC77C\uBCF8 \uBBF8\uD559",card:`## \`ISM-JP\` \xB7 \uC77C\uBCF8 \uBBF8\uD559 (\u65E5\u672C\u306E\u7F8E\u610F\u8B58)

**\uACE0\uC804 \uD615\uC131 14\u201316C**(\uBB34\uB85C\uB9C8\uCE58 \uB2E4\uB3C4) \u2192 **\uADFC\uB300 \uC774\uB860\uD654 1920\u201330s** \u2192 **\uC804\uD6C4 \uADF8\uB798\uD53D \uBC88\uC5ED 1950s\u2013\uD604\uC7AC** \xB7 \uC77C\uBCF8(\uC911\uAD6D \uC120\uC885\xB7\uB3C4\uAD50 \uACBD\uC720)

**\uC778\uBB3C**: \u5343\u5229\u4F11(1522\u201391) \xB7 \u8C37\u5D0E\u6F64\u4E00\u90CE(\u300E\u9670\u7FF3\u793C\u8B83\u300F 1933) \xB7 \u4E80\u5009\u96C4\u7B56(1915\u201397) \xB7 \u7530\u4E2D\u4E00\u5149(1930\u20132002) \xB7 \u539F\u7814\u54C9(1958\u2013 )
\uC774\uB860 \uBC30\uACBD: \u67F3\u5B97\u60A6\uC758 \u6C11\u85DD(1926)\uC640 \u6E0B\u3044 \uC774\uB860\uD654 \xB7 \u4E45\u677E\u771F\u4E00\uC758 \uC120 \uC608\uC220 7\uC131\uACA9 \xB7 \u78EF\u5D0E\u65B0\uC758 \u3008MA: Space-Time in Japan\u3009(1978)

**\uC6D0\uB9AC**
- **\uBD88\uC644\uC804\uD568\uC740 \uACB0\uD568\uC774 \uC544\uB2C8\uB77C \uC2DC\uAC04\uACFC \uACFC\uC815\uC758 \uC99D\uAC70\uB2E4.** \uC644\uACB0\uB41C \uAC83\uC740 \uB354 \uBCC0\uD560 \uC5EC\uC9C0\uAC00 \uC5C6\uC73C\uBBC0\uB85C \uC624\uD788\uB824 \uBE48\uC57D\uD558\uB2E4 (\u4F98\xB7\u5BC2)
- **\uBE44\uC5B4 \uC788\uC74C\uC740 \uACB0\uD54D\uC774 \uC544\uB2C8\uB77C \uC6A9\uAE30(\u5BB9\u5668)\uB2E4.** \u9593(ma)\uC740 \uC0AC\uBB3C \uC0AC\uC774\uC758 \uBE48 \uACF3\uC774 \uC544\uB2C8\uB77C \uC0AC\uBB3C\uC744 \uAD00\uACC4 \uB9FA\uAC8C \uD558\uB294 \uC2DC\uAC04-\uACF5\uAC04 \uB2E8\uC704\uC774\uACE0, \uC758\uBBF8\uB294 \uADF8 \uACF5\uBC31\uC5D0\uC11C \uC218\uC2E0\uC790\uAC00 \uCC44\uC6B4\uB2E4
- \uB300\uCE6D\uC740 \uC644\uACB0\uC744 \uC120\uC5B8\uD558\uACE0 **\uBE44\uB300\uCE6D(\u4E0D\u5747\u6589)\uC740 \uBBF8\uC644\uC744 \uB0A8\uAE34\uB2E4.** \uBBF8\uC644\uC740 \uBCF4\uB294 \uC0AC\uB78C\uC758 \uCC38\uC5EC\uB97C \uC694\uAD6C\uD558\uBBC0\uB85C \uBE44\uB300\uCE6D\uC774 \uB354 \uB9CE\uC740 \uAD00\uACC4\uB97C \uB9CC\uB4E0\uB2E4
- **\uC88B\uC740 \uAC83\uC740 \uCC98\uC74C\uC5D0 \uB2E4 \uBCF4\uC5EC\uC8FC\uC9C0 \uC54A\uB294\uB2E4.** \u6E0B\u3044\uB294 \uB5AB\uC740\uB9DB\uC5D0\uC11C \uC628 \uB9D0\uB85C, \uC989\uAC01\uC801 \uB2E8\uB9DB\uC744 \uAC70\uBD80\uD558\uACE0 \uBC18\uBCF5 \uC0AC\uC6A9 \uC18D\uC5D0\uC11C \uC758\uBBF8\uB97C \uB4DC\uB7EC\uB0B4\uB294 \uC124\uACC4 \uC6D0\uCE59\uC774\uB2E4
- \uADF8\uB9BC\uC790\uC640 \uC5B4\uB460\uC740 \uBE5B\uC758 \uBD80\uC7AC\uAC00 \uC544\uB2C8\uB77C \uB3C5\uB9BD\uC801 \uB9E4\uCCB4\uB2E4 \u2014 \uC18C\uC7AC\uC758 \uAE4A\uC774\uB294 \uB35C \uBE44\uCD9C \uB54C \uB4DC\uB7EC\uB09C\uB2E4 (\u8C37\u5D0E)

**\uC2DC\uAC01** (\uCC38\uACE0\uC6A9) \uC5EC\uBC31\uC774 \uC8FC\uC694 \uAD6C\uC131 \uC694\uC18C, \uC624\uD504\uC13C\uD130 \uBC30\uCE58 / \uC7AC\uB8CC \uC9C8\uAC10\uACFC \uACBD\uB144 \uBCC0\uD654 \uB178\uCD9C / \uC800\uCC44\uB3C4 \uAE30\uC870 + \uADF9\uC18C\uC218 \uAC15\uC870\uC0C9 / \uBE44\uB300\uCE6D \uADE0\uD615\uACFC \uD640\uC218 \uAD6C\uC131 / \uBE0C\uB79C\uB4DC \uB9C8\uD06C\uC758 \uC758\uB3C4\uC801 \uCD5C\uC18C\uD654

**\uB300\uD45C\uC791** 1964 \uB3C4\uCFC4\uC62C\uB9BC\uD53D \uC5E0\uBE14\uB7FC(\u4E80\u5009, 1961) \xB7 \u300CNihon Buyo\u300D \uD3EC\uC2A4\uD130(\u7530\u4E2D, 1981, MoMA) \xB7 \uBB34\uC778\uC591\uD488 \uCD9C\uBC94(1980.12, \u300C\u308F\u3051\u3042\u3063\u3066\u3001\u5B89\u3044\u300D) \xB7 \uBB34\uC778\uC591\uD488 \u3008\uC9C0\uD3C9\uC120\u3009 \uCEA0\uD398\uC778(\u539F, 2003)

**\uAC00\uC838\uC62C \uAC83**
- **\uC5EC\uBC31\uC744 '\uB0A8\uB294 \uACF5\uAC04'\uC774 \uC544\uB2C8\uB77C '\uC758\uBBF8\uB97C \uB2F4\uB294 \uC6A9\uAE30'\uB85C \uC124\uACC4** \u2014 \uC2A4\uD398\uC774\uC2F1 \uC2A4\uCF00\uC77C\uC744 \uC815\uBCF4 \uC704\uACC4\uC640 \uB3D9\uAE09\uC758 \uACB0\uC815\uC73C\uB85C \uCDE8\uAE09\uD558\uACE0, \uBC00\uB3C4\uB97C \uB0AE\uCD94\uB294 \uB300\uC2E0 **\uADF8 \uACF5\uBC31\uC5D0 \uBB34\uC5C7\uC744 \uCC44\uC6B0\uAC8C \uD560\uC9C0 \uC815\uC758**\uD55C\uB2E4
- **\uBE0C\uB79C\uB4DC\uB97C \uC8FC\uC7A5\uC774 \uC544\uB2C8\uB77C \uADF8\uB987\uC73C\uB85C \uC124\uC815** \u2014 \uB85C\uACE0\xB7\uCEEC\uB7EC \uB178\uCD9C\uC744 \uC904\uC774\uACE0 \uC0AC\uC6A9\uC790\uC758 \uCF58\uD150\uCE20\xB7\uB9E5\uB77D\uC774 \uD654\uBA74\uC758 \uC8FC\uC778\uACF5\uC774 \uB418\uAC8C \uD558\uBA74 \uBE0C\uB79C\uB4DC\uB294 '\uD0DC\uB3C4'\uB85C \uC778\uC2DD\uB41C\uB2E4
- **\u6E0B\u3044\uB97C \uC131\uB2A5 \uC608\uC0B0\uC73C\uB85C \uBC88\uC5ED** \u2014 \uCCAB \uD654\uBA74\uC758 \uC784\uD329\uD2B8\uB97C \uC904\uC774\uACE0 10\uD68C\xB7100\uD68C \uC0AC\uC6A9 \uC2DC\uC758 \uB9C8\uCC30 \uAC10\uC18C\uC5D0 \uB9AC\uC18C\uC2A4\uB97C \uBC30\uBD84\uD55C\uB2E4. \uBAA8\uC158\uACFC \uB9C8\uC774\uD06C\uB85C\uC778\uD130\uB799\uC158\uC758 \uAC10\uC1E0\uB294 \uCDE8\uD5A5\uC774 \uC544\uB2C8\uB77C \uC774 \uC6D0\uB9AC\uC758 \uAD6C\uD604\uC774\uB2E4

**\uB450\uACE0 \uC62C \uAC83**
- **\uC624\uB9AC\uC5D4\uD0C8\uB9AC\uC998/\uD074\uB9AC\uC170** \u2014 \u4F98\u5BC2\uB294 \uBCF8\uB798 \uBCC4\uAC1C \uAC1C\uB150\uC778 \u4F98\uC640 \u5BC2\uC758 \uADFC\uB300\uC801 \uBCF5\uD569\uC5B4\uC774\uACE0, \uC11C\uAD6C \uC720\uD1B5\uC740 Leonard Koren(1994) \uC774\uD6C4 \uAE09\uC99D\uD588\uB2E4. \u6E0B\u3044\uC758 \uC11C\uAD6C \uD655\uC0B0\uC740 \u300EHouse Beautiful\u300F(1960) \uD2B9\uC9D1\uC774 \uACC4\uAE30\uC600\uB2E4. \uC989 **'\uC804\uD1B5'\uC73C\uB85C \uC544\uB294 \uD615\uD0DC \uC0C1\uB2F9 \uBD80\uBD84\uC774 20\uC138\uAE30 \uC218\uCD9C\uC6A9 \uD328\uD0A4\uC9D5\uC774\uB2E4.** \uB0A1\uC740 \uD14D\uC2A4\uCC98 + \uD06C\uB798\uD504\uD2B8\uC9C0 + \uBBF8\uC0C9 \uBC30\uACBD\uC744 \uC5B9\uB294 \uAC83\uC740 \uC640\uBE44\uC0AC\uBE44\uAC00 \uC544\uB2C8\uB77C \uC640\uBE44\uC0AC\uBE44\uC758 \uC0C1\uD488 \uC774\uBBF8\uC9C0\uB97C \uBCF5\uC81C\uD558\uB294 \uAC83\uC774\uB2E4
- **'\uBBF8\uB2C8\uBA40 = \uC77C\uBCF8\uC801'\uC774\uB77C\uB294 \uB4F1\uCE58** \u2014 \uBB34\uC778\uC591\uD488\uC758 \uC5EC\uBC31\uC740 \uBBF8\uD559\uC801 \uCDE8\uD5A5\uC774 \uC544\uB2C8\uB77C \uC6D0\uAC00\xB7\uC720\uD1B5\xB7\uBE44\uBE0C\uB79C\uB4DC \uC804\uB7B5\uC758 \uACB0\uACFC\uB2E4. \uC6B0\uD0A4\uC694\uC5D0\xB7\uAC04\uD310\xB7\uC5D0\uB3C4 \uC0C1\uC5C5 \uC778\uC1C4\uAC00 \uBCF4\uC5EC\uC8FC\uB4EF \uC77C\uBCF8 \uC2DC\uAC01 \uBB38\uD654\uC5D0\uB294 \uACE0\uBC00\uB3C4\xB7\uACE0\uCC44\uB3C4 \uACC4\uBCF4\uAC00 \uD568\uAED8 \uC874\uC7AC\uD55C\uB2E4. \uADFC\uAC70 \uC5C6\uB294 \uC5EC\uBC31\uC740 \uC815\uBCF4 \uBD80\uC871\uC774\uBA70, '\uC77C\uBCF8\uC801 \uBCF8\uC9C8'\uC744 \uC0C1\uC815\uD558\uB294 \uB2C8\uD63C\uC9C4\uB860\uC801 \uC11C\uC220\uC740 \uD559\uACC4\uC5D0\uC11C \uC758\uC2EC\uBC1B\uB294 \uD504\uB808\uC784\uC774\uB2E4

**\uC694\uC57D** \uD575\uC2EC\uC740 '\uC801\uAC8C \uC4F0\uB294 \uCDE8\uD5A5'\uC774 \uC544\uB2C8\uB77C **\uC644\uACB0\uC744 \uC720\uBCF4\uD574 \uC218\uC2E0\uC790\uC758 \uCC38\uC5EC\uB97C \uC694\uAD6C\uD558\uB294 \uC124\uACC4**\uC774\uBA70, \uC5EC\uBC31\xB7\uBE44\uB300\uCE6D\xB7\uB5AB\uC740\uB9DB\uC740 \uBAA8\uB450 \uADF8 \uC720\uBCF4\uC758 \uAE30\uC220\uC774\uB2E4.`,summary:"\uD575\uC2EC\uC740 '\uC801\uAC8C \uC4F0\uB294 \uCDE8\uD5A5'\uC774 \uC544\uB2C8\uB77C \uC644\uACB0\uC744 \uC720\uBCF4\uD574 \uC218\uC2E0\uC790\uC758 \uCC38\uC5EC\uB97C \uC694\uAD6C\uD558\uB294 \uC124\uACC4\uC774\uBA70, \uC5EC\uBC31\xB7\uBE44\uB300\uCE6D\xB7\uB5AB\uC740\uB9DB\uC740 \uBAA8\uB450 \uADF8 \uC720\uBCF4\uC758 \uAE30\uC220\uC774\uB2E4.",principles:["\uBD88\uC644\uC804\uD568\uC740 \uACB0\uD568\uC774 \uC544\uB2C8\uB77C \uC2DC\uAC04\uACFC \uACFC\uC815\uC758 \uC99D\uAC70\uB2E4. \uC644\uACB0\uB41C \uAC83\uC740 \uB354 \uBCC0\uD560 \uC5EC\uC9C0\uAC00 \uC5C6\uC73C\uBBC0\uB85C \uC624\uD788\uB824 \uBE48\uC57D\uD558\uB2E4 (\u4F98\xB7\u5BC2)","\uBE44\uC5B4 \uC788\uC74C\uC740 \uACB0\uD54D\uC774 \uC544\uB2C8\uB77C \uC6A9\uAE30(\u5BB9\u5668)\uB2E4. \u9593(ma)\uC740 \uC0AC\uBB3C \uC0AC\uC774\uC758 \uBE48 \uACF3\uC774 \uC544\uB2C8\uB77C \uC0AC\uBB3C\uC744 \uAD00\uACC4 \uB9FA\uAC8C \uD558\uB294 \uC2DC\uAC04-\uACF5\uAC04 \uB2E8\uC704\uC774\uACE0, \uC758\uBBF8\uB294 \uADF8 \uACF5\uBC31\uC5D0\uC11C \uC218\uC2E0\uC790\uAC00 \uCC44\uC6B4\uB2E4","\uB300\uCE6D\uC740 \uC644\uACB0\uC744 \uC120\uC5B8\uD558\uACE0 \uBE44\uB300\uCE6D(\u4E0D\u5747\u6589)\uC740 \uBBF8\uC644\uC744 \uB0A8\uAE34\uB2E4. \uBBF8\uC644\uC740 \uBCF4\uB294 \uC0AC\uB78C\uC758 \uCC38\uC5EC\uB97C \uC694\uAD6C\uD558\uBBC0\uB85C \uBE44\uB300\uCE6D\uC774 \uB354 \uB9CE\uC740 \uAD00\uACC4\uB97C \uB9CC\uB4E0\uB2E4","\uC88B\uC740 \uAC83\uC740 \uCC98\uC74C\uC5D0 \uB2E4 \uBCF4\uC5EC\uC8FC\uC9C0 \uC54A\uB294\uB2E4. \u6E0B\u3044\uB294 \uB5AB\uC740\uB9DB\uC5D0\uC11C \uC628 \uB9D0\uB85C, \uC989\uAC01\uC801 \uB2E8\uB9DB\uC744 \uAC70\uBD80\uD558\uACE0 \uBC18\uBCF5 \uC0AC\uC6A9 \uC18D\uC5D0\uC11C \uC758\uBBF8\uB97C \uB4DC\uB7EC\uB0B4\uB294 \uC124\uACC4 \uC6D0\uCE59\uC774\uB2E4","\uADF8\uB9BC\uC790\uC640 \uC5B4\uB460\uC740 \uBE5B\uC758 \uBD80\uC7AC\uAC00 \uC544\uB2C8\uB77C \uB3C5\uB9BD\uC801 \uB9E4\uCCB4\uB2E4 \u2014 \uC18C\uC7AC\uC758 \uAE4A\uC774\uB294 \uB35C \uBE44\uCD9C \uB54C \uB4DC\uB7EC\uB09C\uB2E4 (\u8C37\u5D0E)"],take:["\uC5EC\uBC31\uC744 '\uB0A8\uB294 \uACF5\uAC04'\uC774 \uC544\uB2C8\uB77C '\uC758\uBBF8\uB97C \uB2F4\uB294 \uC6A9\uAE30'\uB85C \uC124\uACC4 \u2014 \uC2A4\uD398\uC774\uC2F1 \uC2A4\uCF00\uC77C\uC744 \uC815\uBCF4 \uC704\uACC4\uC640 \uB3D9\uAE09\uC758 \uACB0\uC815\uC73C\uB85C \uCDE8\uAE09\uD558\uACE0, \uBC00\uB3C4\uB97C \uB0AE\uCD94\uB294 \uB300\uC2E0 \uADF8 \uACF5\uBC31\uC5D0 \uBB34\uC5C7\uC744 \uCC44\uC6B0\uAC8C \uD560\uC9C0 \uC815\uC758\uD55C\uB2E4","\uBE0C\uB79C\uB4DC\uB97C \uC8FC\uC7A5\uC774 \uC544\uB2C8\uB77C \uADF8\uB987\uC73C\uB85C \uC124\uC815 \u2014 \uB85C\uACE0\xB7\uCEEC\uB7EC \uB178\uCD9C\uC744 \uC904\uC774\uACE0 \uC0AC\uC6A9\uC790\uC758 \uCF58\uD150\uCE20\xB7\uB9E5\uB77D\uC774 \uD654\uBA74\uC758 \uC8FC\uC778\uACF5\uC774 \uB418\uAC8C \uD558\uBA74 \uBE0C\uB79C\uB4DC\uB294 '\uD0DC\uB3C4'\uB85C \uC778\uC2DD\uB41C\uB2E4","\u6E0B\u3044\uB97C \uC131\uB2A5 \uC608\uC0B0\uC73C\uB85C \uBC88\uC5ED \u2014 \uCCAB \uD654\uBA74\uC758 \uC784\uD329\uD2B8\uB97C \uC904\uC774\uACE0 10\uD68C\xB7100\uD68C \uC0AC\uC6A9 \uC2DC\uC758 \uB9C8\uCC30 \uAC10\uC18C\uC5D0 \uB9AC\uC18C\uC2A4\uB97C \uBC30\uBD84\uD55C\uB2E4. \uBAA8\uC158\uACFC \uB9C8\uC774\uD06C\uB85C\uC778\uD130\uB799\uC158\uC758 \uAC10\uC1E0\uB294 \uCDE8\uD5A5\uC774 \uC544\uB2C8\uB77C \uC774 \uC6D0\uB9AC\uC758 \uAD6C\uD604\uC774\uB2E4"],leave:["\uC624\uB9AC\uC5D4\uD0C8\uB9AC\uC998/\uD074\uB9AC\uC170 \u2014 \u4F98\u5BC2\uB294 \uBCF8\uB798 \uBCC4\uAC1C \uAC1C\uB150\uC778 \u4F98\uC640 \u5BC2\uC758 \uADFC\uB300\uC801 \uBCF5\uD569\uC5B4\uC774\uACE0, \uC11C\uAD6C \uC720\uD1B5\uC740 Leonard Koren(1994) \uC774\uD6C4 \uAE09\uC99D\uD588\uB2E4. \u6E0B\u3044\uC758 \uC11C\uAD6C \uD655\uC0B0\uC740 \u300EHouse Beautiful\u300F(1960) \uD2B9\uC9D1\uC774 \uACC4\uAE30\uC600\uB2E4. \uC989 '\uC804\uD1B5'\uC73C\uB85C \uC544\uB294 \uD615\uD0DC \uC0C1\uB2F9 \uBD80\uBD84\uC774 20\uC138\uAE30 \uC218\uCD9C\uC6A9 \uD328\uD0A4\uC9D5\uC774\uB2E4. \uB0A1\uC740 \uD14D\uC2A4\uCC98 + \uD06C\uB798\uD504\uD2B8\uC9C0 + \uBBF8\uC0C9 \uBC30\uACBD\uC744 \uC5B9\uB294 \uAC83\uC740 \uC640\uBE44\uC0AC\uBE44\uAC00 \uC544\uB2C8\uB77C \uC640\uBE44\uC0AC\uBE44\uC758 \uC0C1\uD488 \uC774\uBBF8\uC9C0\uB97C \uBCF5\uC81C\uD558\uB294 \uAC83\uC774\uB2E4","'\uBBF8\uB2C8\uBA40 = \uC77C\uBCF8\uC801'\uC774\uB77C\uB294 \uB4F1\uCE58 \u2014 \uBB34\uC778\uC591\uD488\uC758 \uC5EC\uBC31\uC740 \uBBF8\uD559\uC801 \uCDE8\uD5A5\uC774 \uC544\uB2C8\uB77C \uC6D0\uAC00\xB7\uC720\uD1B5\xB7\uBE44\uBE0C\uB79C\uB4DC \uC804\uB7B5\uC758 \uACB0\uACFC\uB2E4. \uC6B0\uD0A4\uC694\uC5D0\xB7\uAC04\uD310\xB7\uC5D0\uB3C4 \uC0C1\uC5C5 \uC778\uC1C4\uAC00 \uBCF4\uC5EC\uC8FC\uB4EF \uC77C\uBCF8 \uC2DC\uAC01 \uBB38\uD654\uC5D0\uB294 \uACE0\uBC00\uB3C4\xB7\uACE0\uCC44\uB3C4 \uACC4\uBCF4\uAC00 \uD568\uAED8 \uC874\uC7AC\uD55C\uB2E4. \uADFC\uAC70 \uC5C6\uB294 \uC5EC\uBC31\uC740 \uC815\uBCF4 \uBD80\uC871\uC774\uBA70, '\uC77C\uBCF8\uC801 \uBCF8\uC9C8'\uC744 \uC0C1\uC815\uD558\uB294 \uB2C8\uD63C\uC9C4\uB860\uC801 \uC11C\uC220\uC740 \uD559\uACC4\uC5D0\uC11C \uC758\uC2EC\uBC1B\uB294 \uD504\uB808\uC784\uC774\uB2E4"]},{id:"ISM-KR",family:"airplane",name:"\uD55C\uAD6D \uC804\uD1B5 \uBBF8\uD559",card:`## \`ISM-KR\` \xB7 \uD55C\uAD6D \uC804\uD1B5 \uBBF8\uD559

**\uC870\uD615 \uC804\uD1B5**: \uBD84\uCCAD\uC0AC\uAE30 15\u201316C \xB7 \uBC31\uC790 \uB2EC\uD56D\uC544\uB9AC 17C\uB9D0\u201318C\uC911 \xB7 **\uC774\uB860\uD654**: 1920s(\uC57C\uB098\uAE30) \u2192 1940s(\uACE0\uC720\uC12D) \u2192 1978(\uAE40\uC6D0\uC6A9) \xB7 **\uB3D9\uC2DC\uB300 \uBC88\uC5ED**: 1980s\u2013\uD604\uC7AC

**\uC778\uBB3C**: **\uACE0\uC720\uC12D**(1905\u201344, \uD55C\uAD6D \uCD5C\uCD08 \uADFC\uB300 \uBBF8\uC220\uC0AC\uD559\uC790) \xB7 \uC57C\uB098\uAE30 \uBB34\uB124\uC694\uC2DC(1889\u20131961, \uB17C\uC7C1\uC801) \xB7 \uCD5C\uC21C\uC6B0(1916\u201384) \xB7 \uAE40\uC6D0\uC6A9(1922\u201393) \xB7 \uC548\uC0C1\uC218(1952\u2013 )

**\uC6D0\uB9AC**
- **\uAE30\uAD50\uC758 \uBD80\uC7AC\uAC00 \uC544\uB2C8\uB77C '\uAE30\uAD50\uB97C \uC758\uC2DD\uD558\uC9C0 \uC54A\uB294 \uAE30\uAD50'\uB2E4**(\uBB34\uAE30\uAD50\uC758 \uAE30\uAD50). \uBAA9\uD45C\uB294 \uC644\uC131\uB3C4\uC758 \uD3EC\uAE30\uAC00 \uC544\uB2C8\uB77C \uC644\uC131\uB3C4\uAC00 \uC758\uB3C4\uB85C \uB4DC\uB7EC\uB098\uC9C0 \uC54A\uB294 \uC0C1\uD0DC\uB2E4
- **\uACC4\uD68D\uC758 \uBD80\uC7AC\uAC00 \uC544\uB2C8\uB77C '\uACC4\uD68D\uC774 \uACB0\uACFC\uB97C \uC9C0\uBC30\uD558\uC9C0 \uC54A\uAC8C \uD558\uB294 \uACC4\uD68D'\uC774\uB2E4**(\uBB34\uACC4\uD68D\uC758 \uACC4\uD68D). \uC7AC\uB8CC\xB7\uC190\xB7\uAC00\uB9C8\uC758 \uBCC0\uC218\uB97C \uC124\uACC4\uC5D0\uC11C \uBC30\uC81C\uD558\uC9C0 \uC54A\uACE0 \uACB0\uACFC\uC758 \uC77C\uBD80\uB85C \uC218\uC6A9\uD55C\uB2E4
- \uC0DD\uD65C\uACFC \uC608\uC220\uC774 \uBD84\uD654\uB418\uC9C0 \uC54A\uC740 \uC0C1\uD0DC\uB97C \uAE30\uC900\uC73C\uB85C \uC0BC\uB294\uB2E4 \u2014 \uC4F0\uC784 \uC18D\uC5D0\uC11C \uD615\uD0DC\uB97C \uC5BB\uC740 \uBB3C\uAC74\uC774 \uBBF8\uC758 \uC6D0\uD615\uC774\uBBC0\uB85C **\uC2E4\uC6A9\uC758 \uD754\uC801\uC740 \uBBF8\uC758 \uD6FC\uC190\uC774 \uC544\uB2C8\uB77C \uADFC\uAC70\uB2E4**
- \uADE0\uC81C(\u5747\u9F4A)\uB97C \uBAA9\uD45C\uB85C \uC0BC\uC9C0 \uC54A\uB294\uB2E4 \u2014 \uC815\uC6D0(\u6B63\u5713)\uC5D0\uC11C \uBC97\uC5B4\uB09C \uBCC0\uD615\uC740 \uAE30\uC220 \uBD80\uC871\uC774 \uC544\uB2C8\uB77C \uC190\uACFC \uC7AC\uB8CC\uAC00 \uB0A8\uAE34 \uC2DC\uAC04 \uAE30\uB85D\uC774\uBA70, \uB2EC\uD56D\uC544\uB9AC\uCC98\uB7FC \uB450 \uBC18\uAD6C\uB97C \uC811\uD569\uD574 \uC0DD\uAE30\uB294 \uBE44\uD2C0\uB9BC\uC740 \uD615\uD0DC\uC758 \uC644\uC131\uC5D0 \uC18D\uD55C\uB2E4
- **\uC0C9\uC740 \uAC10\uAC01\uC774 \uC544\uB2C8\uB77C \uC9C8\uC11C\uC758 \uD45C\uAE30\uB2E4.** \uC624\uBC29\uC0C9\uC740 \uCDE8\uD5A5 \uD314\uB808\uD2B8\uAC00 \uC544\uB2C8\uB77C \uC74C\uC591\uC624\uD589\uC758 \uBC29\uC704\xB7\uACC4\uC808\xB7\uAE30\uB2A5\uC744 \uD45C\uAE30\uD558\uB294 **\uCF54\uB4DC \uCCB4\uACC4**\uB2E4(\uB3D9-\uCCAD-\uBAA9, \uB0A8-\uC801-\uD654, \uC11C-\uBC31-\uAE08, \uBD81-\uD751-\uC218, \uC911\uC559-\uD669-\uD1A0). \uC0C9\uC758 \uC120\uD0DD\uC740 \uACE7 \uC704\uCE58\uC640 \uAD00\uACC4\uC758 \uC120\uC5B8\uC774\uB2E4

**\uC2DC\uAC01** (\uCC38\uACE0\uC6A9) \uC5EC\uBC31\uACFC \uD654\uC81C\xB7\uB099\uAD00\uB9CC\uC73C\uB85C \uC7A1\uB294 \uADE0\uD615(\uBB38\uC778\uD654) / \uC720\uBC31\xB7\uC124\uBC31 \uB4F1 \uB2E8\uC0C9 \uC548\uC758 \uBBF8\uC138\uD55C \uC0C9\uC628\uB3C4 \uCC28 / \uADC0\uC584\xB7\uB364\uBC99 \uC790\uAD6D\uCC98\uB7FC \uB3C4\uAD6C \uADA4\uC801\uC774 \uB0A8\uC740 \uD45C\uBA74(\uBD84\uCCAD) / \uBC30\uD758\uB9BC\uAE30\uB465\xB7\uBC84\uC120\uCF54\uC758 \uD55C \uBC29\uD5A5 \uAE34 \uACE1\uC120 / \uC815\uC6D0\uC5D0\uC11C \uBC97\uC5B4\uB09C \uC724\uACFD\uACFC \uC811\uD569\uC120 / \uC624\uBC29\uC815\uC0C9\uC758 \uACE0\uCC44\uB3C4 \uB300\uBE44(\uB2E8\uCCAD\xB7\uC0C9\uB3D9\xB7\uBCF4\uC790\uAE30)

**\uB300\uD45C\uC791** \uBC31\uC790 \uB2EC\uD56D\uC544\uB9AC(17C\uB9D0\u201318C\uC911, \uB450 \uBC18\uAD6C \uC811\uD569, 40cm \uC774\uC0C1 \uD604\uC874 \uC57D 20\uC810) \xB7 \uBD84\uCCAD\uC0AC\uAE30(15\u201316C, \uC0C1\uAC10\xB7\uC778\uD654\xB7\uC870\uD654\xB7\uCCA0\uD654\xB7\uADC0\uC584\xB7\uB364\uBC99) \xB7 \uB2E8\uCCAD\uACFC \uC0C9\uB3D9\xB7\uC624\uBC29\uB0AD \xB7 \uC548\uC0C1\uC218\uCCB4(1985, \uD55C\uAE00 \uB124\uBAA8\uD2C0 \uC804\uC81C \uD574\uCCB4)

**\uAC00\uC838\uC62C \uAC83**
- **'\uBB34\uACC4\uD68D\uC758 \uACC4\uD68D'\uC744 \uC2DC\uC2A4\uD15C \uC124\uACC4\uB85C \uBC88\uC5ED** \u2014 \uBAA8\uB4E0 \uC0C1\uD0DC\uB97C \uADDC\uC815\uD558\uB824 \uD558\uC9C0 \uB9D0\uACE0, \uCF58\uD150\uCE20 \uAE38\uC774\xB7\uC0AC\uC6A9\uC790 \uC785\uB825\xB7\uAE30\uAE30 \uD3ED \uAC19\uC740 \uBCC0\uC218\uB97C \uACB0\uACFC\uC758 \uC77C\uBD80\uB85C \uD5C8\uC6A9\uD558\uB294 \uADDC\uCE59\uC744 \uC9E0\uB2E4(\uACE0\uC815 \uBAA9\uC5C5 \uB300\uC2E0 **\uAC00\uBCC0 \uADDC\uCE59 + \uD5C8\uC6A9 \uC624\uCC28 \uC815\uC758**). \uD1B5\uC81C \uC2E4\uD328\uAC00 \uC544\uB2C8\uB77C \uD1B5\uC81C \uBC94\uC704\uC758 \uC758\uB3C4\uC801 \uC124\uACC4\uB2E4
- **\uC5EC\uBC31\uC744 \uC704\uACC4 \uC7A5\uCE58\uB85C** \u2014 \uD06C\uAE30\xB7\uAD75\uAE30\xB7\uC0C9\uC73C\uB85C \uAC15\uC870\uB97C \uB9CC\uB4DC\uB294 \uB300\uC2E0 \uC8FC\uBCC0\uC744 \uBE44\uC6CC \uAC15\uC870\uB97C \uB9CC\uB4DC\uB294 \uBC29\uC2DD\uC740 \uC800\uCC44\uB3C4\xB7\uC800\uB300\uBE44 UI\uC5D0\uC11C \uC815\uBCF4\uB7C9\uC744 \uC720\uC9C0\uD558\uBA70 \uC18C\uC74C\uC744 \uC904\uC774\uB294 \uC2E4\uC9C8\uC801 \uAE30\uBC95\uC774\uB2E4
- **\uC624\uBC29\uC0C9\uC744 \uD314\uB808\uD2B8\uAC00 \uC544\uB2C8\uB77C \uC2DC\uB9E8\uD2F1 \uCF54\uB4DC\uB85C \uC218\uC6A9** \u2014 \uC0C9\uC744 \uC0C1\uD0DC\xB7\uBC94\uC8FC\xB7\uBC29\uD5A5\uC758 \uD45C\uAE30\uB85C \uC815\uC758\uD558\uB294 \uC2DC\uC2A4\uD15C(\uC2DC\uB9E8\uD2F1 \uCEEC\uB7EC \uD1A0\uD070)\uC740 \uC624\uBC29\uC0C9\uACFC \uB3D9\uD615\uC774\uB2E4. \uCCAD\xB7\uC801\xB7\uD669\xB7\uBC31\xB7\uD751\uC744 \uADF8\uB300\uB85C \uC4F0\uB294 \uAC83\uC774 \uC544\uB2C8\uB77C **"\uC0C9\uC740 \uC704\uCE58\uC640 \uAD00\uACC4\uC758 \uC120\uC5B8"\uC774\uB77C\uB294 \uADDC\uCE59**\uC744 \uAC00\uC838\uC624\uB294 \uAC83\uC774 \uC804\uC774\uB2E4 (\u2192 L0 \xA73 \uB178\uB791\uC758 \uC9C0\uC704\uC640 \uAC19\uC740 \uAD6C\uC870)

**\uB450\uACE0 \uC62C \uAC83**
- **'\uBE44\uC560\uC758 \uBBF8'\xB7'\uC790\uC5F0\uC2A4\uB7EC\uC6C0' \uD504\uB808\uC784\uC758 \uBB34\uBE44\uD310\uC801 \uACC4\uC2B9** \u2014 \uC57C\uB098\uAE30\uAC00 \uC870\uC120\uBBF8\uB97C \uACE1\uC120\xB7\uBD88\uC548\uC815\uD55C \uD615\uD0DC\xB7\uBC31\uC0C9\xB7\uBE44\uC560\uB85C \uADDC\uC815\uD55C \uAC83\uC740 \uD55C\uC815\uB41C \uB3C4\uC790\uAE30 \uC778\uC0C1\uC73C\uB85C \uBBFC\uC871\uC131\uAE4C\uC9C0 \uB2E8\uC815\uD55C \uC2DD\uBBFC\uAE30 \uC624\uB9AC\uC5D4\uD0C8\uB9AC\uC998\uC774\uB77C\uB294 \uBE44\uD310\uC744 \uBC1B\uB294\uB2E4(\uC624\uBCD1\uC6B1; \uC774\uC778\uBC94 \u300E\uC870\uC120\uC608\uC220\uACFC \uC57C\uB098\uAE30 \uBB34\uB124\uC694\uC2DC\u300F; Kim Brandt, *Kingdom of Beauty*, 2007). \uC57C\uB098\uAE30 \uC790\uC2E0\uB3C4 1930\uB144\uB300 \uC774\uD6C4 '\uC758\uC9C0\uC758 \uBBF8'\uB85C \uC11C\uC220\uC744 \uD655\uC7A5\uD588\uB2E4. \uBC18\uB300\uD3B8\uC758 \uACE0\uC720\uC12D \uAC1C\uB150\uB3C4 \uADF8\uB300\uB85C \uBCF8\uC9C8\uD654\uD558\uBA74 \uC704\uD5D8\uD558\uB2E4. \uB2E8\uC0C9\uD654\uC758 '\uD55C\uAD6D\uC801 \uC815\uC2E0\uC131' \uC11C\uC0AC \uC5ED\uC2DC \uC0C1\uB2F9 \uBD80\uBD84 \uC0AC\uD6C4 \uAD6C\uC131\uB41C \uBE0C\uB79C\uB529\uC774\uB77C\uB294 \uBE44\uD310\uC774 \uC788\uB2E4. **'\uD55C(\u6068)', '\uC2AC\uD514\uC758 \uD770\uC0C9', '\uC18C\uBC15\uD55C \uBBFC\uC871' \uB958\uC758 \uCE74\uD53C\uB294 \uB300\uAC1C \uC774 \uD504\uB808\uC784\uC758 \uC794\uC5EC\uBB3C\uC774\uB2E4**
- **\uAD00\uAD11 \uBE0C\uB85C\uC288\uC5B4 \uD074\uB9AC\uC170** \u2014 \uC624\uBC29\uC0C9\uC744 \uBB34\uB9E5\uB77D 5\uC0C9 \uD314\uB808\uD2B8\uB85C, \uD55C\uC9C0 \uD14D\uC2A4\uCC98\xB7\uAE30\uC640\xB7\uD0DC\uADF9 \uACE1\uC120\uC744 '\uD55C\uAD6D\uC131' \uC2A4\uD2F0\uCEE4\uB85C \uC5B9\uB294 \uBC29\uC2DD. **\uC870\uC120 \uBC31\uC790\uC758 \uC808\uC81C\uC640 \uB2E8\uCCAD\uC758 \uACE0\uCC44\uB3C4\uB294 \uC11C\uB85C \uB2E4\uB978 \uACC4\uCE35\xB7\uAE30\uB2A5\xB7\uC2DC\uB300\uC758 \uC0B0\uBB3C\uC774\uACE0 \uD55C \uD654\uBA74\uC5D0 \uD568\uAED8 \uBD99\uC77C \uADFC\uAC70\uAC00 \uC5C6\uB2E4.** \uB610 "\uC804\uD1B5 \uC694\uC18C\uB97C \uB123\uC5C8\uB294\uAC00"\uB294 \uAC80\uC99D \uAC00\uB2A5\uD55C \uAE30\uC900\uC774 \uC544\uB2C8\uBBC0\uB85C, \uC804\uC774\uC758 \uC131\uD328\uB294 \uC6D0\uB9AC(\uAC00\uBCC0\uC131 \uC218\uC6A9, \uC5EC\uBC31\uC758 \uC704\uACC4, \uC0C9\uC758 \uCF54\uB4DC\uD654)\uAC00 **\uC2DC\uC2A4\uD15C \uADDC\uCE59\uC73C\uB85C \uAD6C\uD604\uB418\uC5C8\uB294\uC9C0**\uB85C \uD310\uB2E8\uD55C\uB2E4

**\uC694\uC57D** \uD55C\uAD6D \uC804\uD1B5 \uBBF8\uD559\uC740 '\uC790\uC5F0\uC2A4\uB7FD\uACE0 \uC18C\uBC15\uD55C \uAC10\uC131'\uC774 \uC544\uB2C8\uB77C **\uC7AC\uB8CC\uC640 \uC190\uC758 \uBCC0\uC218\uB97C \uACB0\uACFC\uC5D0 \uD3EC\uD568\uC2DC\uD0A4\uB294 \uC124\uACC4 \uD0DC\uB3C4**\uC640 **\uC0C9\uC744 \uC9C8\uC11C\uB85C \uC4F0\uB294 \uCF54\uB4DC \uCCB4\uACC4**\uC774\uBA70, \uC774\uB97C '\uBE44\uC560'\uB098 '\uBBFC\uC871 \uC815\uC11C'\uB85C \uD658\uC6D0\uD558\uB294 \uC21C\uAC04 \uC2DD\uBBFC\uAE30 \uD504\uB808\uC784\uC744 \uB418\uBD88\uB7EC\uC628\uB2E4.
