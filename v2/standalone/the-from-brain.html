<!DOCTYPE html>
<html lang="ko">
<head>
<!-- THE FROM BRAIN 2.0.0-alpha.1 · 자동 생성(scripts/build-single.mjs) — 직접 고치지 않는다 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE FROM BRAIN</title>
<link rel="icon" href="data:,">
<style>
/* THE FROM BRAIN — DESIGN.md 를 따른다.
 * 더프롬 아이덴티티는 보이지 않는 뼈대에만 둔다: 1U = 8px에서 파생한 간격·크기, 왼쪽 정렬, 직각의 판.
 * 눈에 보이는 형상은 뇌다 — 원은 뉴런(노드)을 가리킬 때만 쓴다.
 * 색은 셋: 홀로그램의 찬 흰색 · 수렴의 노랑 · 긴장의 빨강. 한 가지 세계(어두운 계기판)로 고정한다.
 */
@font-face {
  font-family: 'Pretendard';
  src: url('../../src/renderer/fonts/PretendardVariable.woff2') format('woff2-variations');
  font-weight: 45 920;
  font-display: swap;
}

:root {
  color-scheme: dark;
  --u: 8px;
  --ground: #08090B;
  --surface: #0D0F12;
  --surface-2: #14171B;
  --holo: #CFE3F2;
  --text: #E6EEF4;
  --text-2: rgba(230, 238, 244, .74);
  --mute: rgba(230, 238, 244, .5);
  --line: rgba(207, 227, 242, .14);
  --line-2: rgba(207, 227, 242, .3);
  --yellow: #FFD200;
  --red: #E85E53;
  --red-soft: #F2938A;
  --blue: #9EA3E3;
  --green: #62C2A2;
  --font: 'Pretendard', 'Pretendard Variable', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace;
  /* UI 스케일 — 1.5U · 1.75U · 2U · 2.25U · 2.75U (core.md §2.2.5) */
  --t-cap: 12px; --t-sub: 14px; --t-body: 16px; --t-lead: 18px; --t-head: 22px;
  --panel: calc(var(--u) * 58);
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--text); font-family: var(--font); font-size: var(--t-sub); line-height: 20px; -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; border-radius: 0; }
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
::selection { background: var(--yellow); color: var(--ground); }
:focus-visible { outline: 2px solid var(--yellow); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
[hidden] { display: none !important; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--line-2); }
::-webkit-scrollbar-track { background: transparent; }

.app { height: 100%; display: grid; grid-template-rows: calc(var(--u) * 7) minmax(0, 1fr); }

/* ---------- 상단 ---------- */
.top { display: flex; align-items: center; gap: calc(var(--u) * 3); padding: 0 calc(var(--u) * 2); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: calc(var(--u) * 1.5); white-space: nowrap; }
.brand strong { font-size: var(--t-sub); font-weight: 800; letter-spacing: .08em; }
.mark { width: calc(var(--u) * 2.25); height: calc(var(--u) * 2.4); fill: var(--text); flex: none; }
.ver { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; color: var(--mute); text-transform: uppercase; }
.proj { display: flex; align-items: center; gap: var(--u); min-width: 0; flex: 1; }
.proj select { min-width: 0; max-width: calc(var(--u) * 36); flex: 0 1 auto; height: calc(var(--u) * 4); background: var(--ground); color: var(--text); border: 1px solid var(--line-2); padding: 0 var(--u); }
.run { display: flex; align-items: center; gap: calc(var(--u) * 1.5); margin-left: auto; white-space: nowrap; }
.status { font-family: var(--mono); font-size: 11px; letter-spacing: .06em; color: var(--mute); font-variant-numeric: tabular-nums; }
.status.live { color: var(--yellow); }

.btn { height: calc(var(--u) * 4); padding: 0 calc(var(--u) * 1.5); border: 1px solid var(--line-2); background: transparent; color: var(--text); cursor: pointer; font-weight: 600; font-size: var(--t-sub); white-space: nowrap; }
.btn:hover { background: rgba(207, 227, 242, .09); border-color: var(--holo); }
.btn[disabled] { opacity: .4; cursor: default; }
.btn.sm { height: calc(var(--u) * 3.5); padding: 0 var(--u); font-size: var(--t-cap); }
.btn.solid { background: var(--text); border-color: var(--text); color: var(--ground); }
.btn.solid:hover { background: #fff; }
.btn.danger { border-color: var(--red); color: var(--red-soft); }
.btn.go { background: var(--yellow); border-color: var(--yellow); color: var(--ground); font-weight: 800; padding: 0 calc(var(--u) * 2.5); }
.btn.go:hover { background: #ffdc33; border-color: #ffdc33; }

/* ---------- 본문 ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 1fr) var(--panel); min-height: 0; }
.universe { position: relative; min-height: 0; min-width: 0; overflow: hidden; }
.universe canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.hud { position: absolute; font-size: var(--t-cap); line-height: 16px; pointer-events: none; }
.hud > * { pointer-events: auto; }
.stats { top: calc(var(--u) * 2); left: calc(var(--u) * 2); right: calc(var(--u) * 2); display: flex; flex-wrap: wrap; gap: var(--u) calc(var(--u) * 4); font-variant-numeric: tabular-nums; }
.stats div { display: flex; flex-direction: column; gap: calc(var(--u) * .25); border-left: 1px solid var(--line-2); padding-left: calc(var(--u) * 1.25); }
.stats b { font-size: var(--t-head); line-height: 26px; font-weight: 600; letter-spacing: .01em; }
.stats .hot { border-left-color: var(--yellow); }
.stats .hot b { color: var(--yellow); }
.stats span { color: var(--mute); font-size: 11px; }
.stats .hint { border-left: 0; padding-left: 0; justify-content: flex-end; }
.notice { top: calc(var(--u) * 10.5); left: calc(var(--u) * 2); display: flex; align-items: center; gap: calc(var(--u) * 1.5); background: var(--yellow); color: var(--ground); padding: var(--u) calc(var(--u) * 1.5); font-size: var(--t-sub); font-weight: 600; max-width: calc(100% - var(--u) * 4); }
.notice .btn { background: var(--ground); color: var(--text); border-color: var(--ground); }
.tip { left: calc(var(--u) * 2); bottom: calc(var(--u) * 9); max-width: min(calc(var(--u) * 54), calc(100% - var(--u) * 4)); background: rgba(13, 15, 18, .92); color: var(--text); padding: calc(var(--u) * 1.5); font-size: var(--t-sub); line-height: 20px; border: 1px solid var(--line-2); border-left: 2px solid var(--yellow); }
.tip small { display: block; font-family: var(--mono); color: var(--mute); font-size: 11px; margin-bottom: calc(var(--u) * .5); }
.tools { left: calc(var(--u) * 2); right: calc(var(--u) * 2); bottom: calc(var(--u) * 2); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--u) calc(var(--u) * 2); }
.legend { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .5) calc(var(--u) * 2); color: var(--mute); font-size: 11px; }
.legend li { display: flex; align-items: center; gap: calc(var(--u) * .75); }
.k { width: 9px; height: 9px; display: inline-block; border-radius: 50%; }
.k-lens { background: var(--holo); box-shadow: 0 0 0 2px var(--ground), 0 0 0 3px rgba(207, 227, 242, .5); }
.k-signal { width: 6px; height: 6px; background: var(--holo); }
.k-issue { border: 1.5px solid var(--holo); background: radial-gradient(var(--holo) 0 28%, transparent 30%); }
.k-insight { background: var(--yellow); box-shadow: 0 0 8px rgba(255, 210, 0, .7); }
.e { width: calc(var(--u) * 2.5); height: 0; display: inline-block; border-top: 1px solid rgba(207, 227, 242, .6); }
.e-tension { border-top: 1.5px dashed var(--red); }
.toggles { display: flex; align-items: center; gap: calc(var(--u) * 1.5); color: var(--text-2); }
.toggles label { display: flex; align-items: center; gap: calc(var(--u) * .5); cursor: pointer; }
.toggles input { accent-color: var(--yellow); margin: 0; }
.sq { width: calc(var(--u) * 4); height: calc(var(--u) * 4); background: rgba(8, 9, 11, .7); border: 1px solid var(--line-2); color: var(--text); cursor: pointer; font-size: var(--t-body); line-height: 1; }
.sq.wide { width: auto; padding: 0 var(--u); font-size: var(--t-cap); }
.sq:hover { background: rgba(207, 227, 242, .1); }

/* ---------- 패널 ---------- */
.panel { display: grid; grid-template-rows: auto minmax(0, 1fr); border-left: 1px solid var(--line); min-height: 0; min-width: 0; background: var(--surface); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.tabs button { height: calc(var(--u) * 6); background: none; border: 0; border-bottom: 2px solid transparent; cursor: pointer; font-weight: 600; color: var(--mute); text-align: left; padding: 0 calc(var(--u) * 2); }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--yellow); }
.tabs button .n { font-family: var(--mono); font-size: 11px; margin-left: calc(var(--u) * .75); color: var(--yellow); }
.body { overflow: auto; padding: calc(var(--u) * 3) calc(var(--u) * 2) calc(var(--u) * 8); display: flex; flex-direction: column; gap: calc(var(--u) * 4); }

.sec { display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); }
.sec > h2 { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .12em; color: var(--mute); padding-bottom: var(--u); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: var(--u); }
.sec > h2 small { font-family: var(--font); font-weight: 500; letter-spacing: 0; font-size: 11px; }
.lead { font-size: var(--t-head); line-height: 32px; font-weight: 700; text-wrap: balance; }
.lead em { font-style: normal; color: var(--yellow); white-space: nowrap; }
.note { color: var(--text-2); font-size: var(--t-sub); line-height: 22px; }
.note.small, .small { font-size: var(--t-cap); line-height: 18px; color: var(--mute); }
.banner { background: var(--surface-2); padding: calc(var(--u) * 1.5); border-left: 2px solid var(--holo); font-size: var(--t-sub); color: var(--text-2); }
.banner.warn { border-left-color: var(--red); }
.row { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; }
.grow { flex: 1; min-width: 0; }

.field { display: flex; flex-direction: column; gap: calc(var(--u) * .5); min-width: 0; }
.field > span { font-size: var(--t-cap); font-weight: 600; color: var(--mute); }
.field input[type="text"], .field input[type="password"], .field textarea, .field select {
  width: 100%; border: 1px solid var(--line); background: var(--ground); color: var(--text); padding: var(--u); font-size: var(--t-sub); line-height: 20px; min-width: 0; }
.field textarea { resize: vertical; min-height: calc(var(--u) * 7); }
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--yellow); outline: 0; }
.field ::placeholder { color: rgba(230, 238, 244, .3); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(var(--u) * 1.5); }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: calc(var(--u) * 1.5); }
.check { display: flex; align-items: center; gap: calc(var(--u) * .75); font-size: var(--t-cap); font-weight: 600; cursor: pointer; }
.check input { accent-color: var(--yellow); margin: 0; }

.chip { display: inline-flex; align-items: center; height: calc(var(--u) * 2.5); padding: 0 calc(var(--u) * .75); font-size: 11px; font-weight: 600; border: 1px solid var(--line-2); color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.fill { background: var(--text); border-color: var(--text); color: var(--ground); font-family: var(--mono); }
.chip.y { background: var(--yellow); border-color: var(--yellow); color: var(--ground); }
.chip.red { border-color: var(--red); color: var(--red-soft); }
.chip.identity { border-color: var(--holo); color: var(--text); }
.chip.airplane { border-color: var(--blue); color: var(--blue); }
.chip.tunnel { border-color: var(--green); color: var(--green); }
.chip.ghost { border-color: var(--line); color: var(--mute); }
.chip.warn { border-color: var(--red); color: var(--red); }
.chip.pick { background: none; cursor: pointer; }
.chip.pick:hover { border-color: var(--yellow); color: var(--text); }
.chip.pick.y { background: var(--yellow); color: var(--ground); }
.chip.rec { border-style: dashed; }
.tag-add { height: calc(var(--u) * 2.5); border: 1px solid var(--line); background: var(--ground); color: var(--mute); font-size: 11px; padding: 0 calc(var(--u) * .5); }
.lead.sm { font-size: var(--t-lead); line-height: 28px; }
.views { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); }
.view { background: var(--surface-2); padding: calc(var(--u) * 2); display: flex; flex-direction: column; gap: var(--u); min-width: 0; }
.view h3 { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .12em; color: var(--yellow); }
.view.off h3 { color: var(--mute); }
.id { font-family: var(--mono); font-size: 11px; color: var(--mute); }

.card { border: 1px solid var(--line); padding: calc(var(--u) * 2); display: flex; flex-direction: column; gap: calc(var(--u) * 1.5); background: var(--surface-2); min-width: 0; }
.card.root { border-left: 2px solid var(--holo); }
.card .head { display: flex; align-items: center; gap: var(--u); flex-wrap: wrap; }
.card .head .x { margin-left: auto; }
.link { background: none; border: 0; padding: 0; cursor: pointer; text-align: left; color: inherit; text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.link:hover { text-decoration-color: var(--yellow); color: var(--text); }

/* 인사이트 */
.insight { border: 1px solid var(--line); background: var(--surface-2); }
.insight.on { border-color: rgba(255, 210, 0, .55); }
.insight.flag { border-color: var(--red); }
.insight > button.open { width: 100%; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: calc(var(--u) * 1.5); padding: calc(var(--u) * 2); background: none; border: 0; text-align: left; cursor: pointer; align-items: start; }
.insight > button.open:hover h3 { color: var(--yellow); }
.insight .no { width: calc(var(--u) * 3.5); height: calc(var(--u) * 3.5); border-radius: 50%; background: var(--yellow); color: var(--ground); display: grid; place-items: center; font-family: var(--mono); font-weight: 700; font-size: var(--t-cap); box-shadow: 0 0 14px rgba(255, 210, 0, .45); }
.insight.flag .no { background: var(--red); color: #fff; box-shadow: none; }
.insight h3 { font-size: var(--t-lead); line-height: 26px; font-weight: 700; text-wrap: balance; }
.insight .one { margin-top: calc(var(--u) * .5); color: var(--text-2); line-height: 22px; }
.insight .more { padding: 0 calc(var(--u) * 2) calc(var(--u) * 2); display: flex; flex-direction: column; gap: calc(var(--u) * 2.5); }
.cover { display: flex; gap: 2px; height: calc(var(--u) * .5); }
.cover i { display: block; height: 100%; }
.cover .identity { background: var(--holo); } .cover .airplane { background: var(--blue); } .cover .tunnel { background: var(--green); }
.cover-key { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .5) calc(var(--u) * 1.5); font-size: var(--t-cap); color: var(--mute); margin-top: var(--u); font-variant-numeric: tabular-nums; }
.cover-key strong { color: var(--text); }
.chain { display: flex; flex-direction: column; }
.chain li { display: grid; grid-template-columns: calc(var(--u) * 3) minmax(0, 1fr); gap: var(--u); padding: calc(var(--u) * 1.25) 0; border-top: 1px solid var(--line); }
.chain li:first-child { border-top: 0; }
.chain .step { width: calc(var(--u) * 2.25); height: calc(var(--u) * 2.25); border-radius: 50%; background: var(--yellow); color: var(--ground); font-family: var(--mono); font-size: 10.5px; font-weight: 700; display: grid; place-items: center; margin-top: 1px; }
.chain .step.dim { background: none; border: 1px solid var(--line-2); color: var(--mute); }
.chain .meta { display: flex; flex-wrap: wrap; gap: calc(var(--u) * .75); align-items: center; margin-top: calc(var(--u) * .75); }
.kv { display: grid; grid-template-columns: calc(var(--u) * 12) minmax(0, 1fr); gap: calc(var(--u) * 1.25) calc(var(--u) * 1.5); }
.kv dt { font-size: var(--t-cap); font-weight: 600; color: var(--mute); padding-top: 1px; }
.kv dd { color: var(--text-2); }
.kv dd strong { color: var(--text); }
.tension { border-left: 2px solid var(--red); padding: var(--u) calc(var(--u) * 1.5); background: rgba(232, 94, 83, .08); color: var(--text-2); }
.tension b { display: block; font-family: var(--mono); font-size: 11px; color: var(--red-soft); margin-bottom: calc(var(--u) * .5); }
.list { display: flex; flex-direction: column; }
.list > li { padding: calc(var(--u) * 1.25) 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: calc(var(--u) * .5); min-width: 0; color: var(--text-2); }
.list > li:first-child { border-top: 0; }
.bullets { color: var(--text-2); display: flex; flex-direction: column; gap: calc(var(--u) * .75); }
.bullets li { padding-left: calc(var(--u) * 1.5); position: relative; }
.bullets li::before { content: ''; position: absolute; left: 0; top: 8px; width: 4px; height: 4px; border-radius: 50%; background: var(--holo); }
.bars { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--u) calc(var(--u) * 1.5); align-items: center; font-size: var(--t-cap); color: var(--text-2); font-variant-numeric: tabular-nums; }
.bars .track { height: calc(var(--u) * .5); background: var(--line); }
.bars .track i { display: block; height: 100%; background: var(--holo); }
.edge-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--u); align-items: start; }
.edge-row .ctl { display: flex; flex-wrap: wrap; gap: var(--u); align-items: center; margin-top: var(--u); }
.edge-row select { height: calc(var(--u) * 3.5); border: 1px solid var(--line-2); background: var(--ground); color: var(--text); padding: 0 calc(var(--u) * .5); font-size: var(--t-cap); }
input[type="range"] { accent-color: var(--yellow); width: calc(var(--u) * 12); }
details > summary { cursor: pointer; font-weight: 600; padding: var(--u) 0; color: var(--text-2); }
details[open] > summary { margin-bottom: var(--u); }
.steps li { display: grid; grid-template-columns: calc(var(--u) * 3) minmax(0, 1fr); gap: var(--u); padding: calc(var(--u) * 1.25) 0; border-top: 1px solid var(--line); }
.steps li:first-child { border-top: 0; }
.steps b { font-family: var(--mono); color: var(--yellow); }

.toast { position: fixed; left: 50%; bottom: calc(var(--u) * 3); transform: translateX(-50%); background: var(--surface-2); color: var(--text); padding: calc(var(--u) * 1.5) calc(var(--u) * 2); font-size: var(--t-sub); max-width: min(calc(var(--u) * 70), calc(100% - var(--u) * 4)); z-index: 10; border: 1px solid var(--line-2); border-left: 2px solid var(--yellow); }
.toast.err { border-left-color: var(--red); }

/* ---------- 좁은 화면 ---------- */
@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-rows: auto auto; }
  .top { flex-wrap: wrap; padding: var(--u) calc(var(--u) * 2); gap: var(--u) calc(var(--u) * 2); }
  .ver { display: none; }
  .proj { order: 3; flex-basis: 100%; }
  .proj select { flex: 1; max-width: none; }
  .stage { grid-template-columns: minmax(0, 1fr); }
  .universe { height: 68vh; min-height: 420px; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .body { overflow: visible; }
  .legend { display: none; }
  .stats { gap: var(--u) calc(var(--u) * 2); }
  .stats b { font-size: var(--t-lead); line-height: 22px; }
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 420px) { .views { grid-template-columns: minmax(0, 1fr); } .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } .kv { grid-template-columns: minmax(0, 1fr); gap: calc(var(--u) * .25) 0; } .kv dd { margin-bottom: var(--u); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 30 32" aria-hidden="true"><rect width="30" height="10"/><rect y="11" width="20" height="10"/><rect y="22" width="10" height="10"/></svg>
      <strong>THE FROM BRAIN</strong>
      <span class="ver">FREATIVE 2.0 alpha</span>
    </div>
    <div class="proj">

**\uAC00\uC838\uC62C \uAC83**
- **\uC120\uC758 \uC6B4\uB3D9\uC744 \uBAA8\uC158 \uC6D0\uB9AC\uB85C \uBC88\uC5ED**\uD55C\uB2E4 \u2014 whiplash line\uC758 \uBCF8\uC9C8\uC740 \uACE1\uC120 \uBAA8\uC591\uC774 \uC544\uB2C8\uB77C \uAC00\uC18D\xB7\uAC10\uC18D\uC758 \uBE44\uADE0\uC9C8\uC131\uC774\uB2E4. \uC774\uC9D5 \uCEE4\uBE0C \uC124\uACC4\uC758 \uADFC\uAC70\uAC00 \uB41C\uB2E4 (\uC120\uD615 \uC774\uC9D5 \uAC70\uBD80)
- \uD558\uB098\uC758 \uC124\uACC4 \uC758\uC9C0\uB97C \uC81C\uD488 \uCD5C\uB9D0\uB2E8\uAE4C\uC9C0 \uAD00\uCCA0\uD55C\uB2E4 \u2014 \uD1A0\uC2A4\uD2B8\xB7\uBE48 \uC0C1\uD0DC\xB7\uC5D0\uB7EC \uCE74\uD53C\xB7\uB85C\uB529 \uC778\uB514\uCF00\uC774\uD130\uAE4C\uC9C0. \uC544\uB974\uB204\uBCF4\uC758 \uC9C4\uC9DC \uAE09\uC9C4\uC131\uC740 \uBB38\uC190\uC7A1\uC774\uAE4C\uC9C0 \uC124\uACC4\uD588\uB2E4\uB294 \uC810\uC774\uB2E4
- \uB9E4\uCCB4 \uBB3C\uC131\uC5D0\uC11C \uD615\uD0DC\uB97C \uC5BB\uB294\uB2E4 \u2014 Horta\uAC00 \uCCA0\uC758 \uC778\uC7A5\uB825\uC5D0\uC11C \uD615\uD0DC\uB97C \uC5BB\uC740 \uAC83\uCC98\uB7FC, \uC2A4\uD06C\uB864\xB7\uD638\uBC84\xB7\uAC00\uBCC0 \uD3F0\uD2B8 \uAC19\uC740 \uC6F9 \uACE0\uC720 \uC131\uB2A5\uC5D0\uC11C \uB3C4\uCD9C\uD55C\uB2E4

**\uB450\uACE0 \uC62C \uAC83**
- **\uAC00\uB3C5\uC131** \u2014 \uC544\uB974\uB204\uBCF4 \uB808\uD130\uB9C1\uC740 \uD55C \uB2E8\uC5B4 \uADDC\uBAA8\uC758 \uD3EC\uC2A4\uD130\uC6A9\uC774\uB2E4. \uBCF8\uBB38\xB7UI \uB77C\uBCA8\xB7\uB370\uC774\uD130 \uD14C\uC774\uBE14\uC5D0 \uC4F0\uBA74 \uD310\uB3C5\uC131\uC774 \uBB34\uB108\uC9C0\uACE0, **\uD55C\uAE00 \uC870\uD569\uD615 \uAD6C\uC870\uC5D0\uC11C\uB294 \uACE1\uC120 \uBCC0\uD615 \uC2DC \uC790\uC18C \uAD6C\uBD84\uC774 \uBA3C\uC800 \uD30C\uAD34\uB41C\uB2E4**
- \uACE1\uC120 SVG \uC7A5\uC2DD + \uC138\uB9AC\uD504 \uCEE4\uC2A4\uD140 \uB85C\uACE0 \uC870\uD569 \u2014 \uC989\uC2DC '\uBE48\uD2F0\uC9C0 \uD654\uC7A5\uD488 \uBE0C\uB79C\uB529' \uD074\uB9AC\uC170\uB2E4. \uC544\uB974\uB204\uBCF4\uC758 \uACE1\uC120\uC740 \uAD6C\uC870 \uBD80\uC7AC\uC600\uAE30 \uB54C\uBB38\uC5D0 \uC815\uB2F9\uD588\uB2E4

**\uC694\uC57D** \uC0C8 \uC2DC\uB300\uB294 \uACFC\uAC70 \uC591\uC2DD\uC744 \uC778\uC6A9\uD558\uB294 \uB300\uC2E0 \uC790\uC5F0\uC758 \uC0DD\uC131 \uC6D0\uB9AC\uC640 \uC0C8 \uC7AC\uB8CC\uC758 \uC131\uB2A5\uC5D0\uC11C \uC790\uAE30 \uD615\uD0DC\uB97C \uBC1C\uBA85\uD574\uC57C \uD55C\uB2E4.`,summary:"\uC0C8 \uC2DC\uB300\uB294 \uACFC\uAC70 \uC591\uC2DD\uC744 \uC778\uC6A9\uD558\uB294 \uB300\uC2E0 \uC790\uC5F0\uC758 \uC0DD\uC131 \uC6D0\uB9AC\uC640 \uC0C8 \uC7AC\uB8CC\uC758 \uC131\uB2A5\uC5D0\uC11C \uC790\uAE30 \uD615\uD0DC\uB97C \uBC1C\uBA85\uD574\uC57C \uD55C\uB2E4.",principles:["\uC21C\uC218\uBBF8\uC220\uACFC \uC751\uC6A9\uBBF8\uC220\uC758 \uC704\uACC4\uB97C \uD3D0\uAE30\uD55C\uB2E4 \u2014 \uD3EC\uC2A4\uD130\xB7\uAC00\uAD6C\xB7\uC190\uC7A1\uC774\uB294 \uD68C\uD654\uBCF4\uB2E4 \uC5F4\uB4F1\uD558\uC9C0 \uC54A\uB2E4","\uC790\uC5F0\uC740 \uBAA8\uBC29 \uB300\uC0C1\uC774 \uC544\uB2C8\uB77C \uD615\uD0DC \uC0DD\uC131 \uC6D0\uB9AC\uB2E4. \uC2DD\uBB3C\uC758 \uC131\uC7A5 \uB17C\uB9AC(\uBD84\uAE30\xB7\uAE34\uC7A5\xB7\uBE44\uB300\uCE6D)\uB97C \uAD6C\uC870 \uC6D0\uB9AC\uB85C \uBC88\uC5ED\uD55C\uB2E4","\uAC74\uCD95\xB7\uAC00\uAD6C\xB7\uC870\uBA85\xB7\uD65C\uC790\xB7\uC190\uC7A1\uC774\uAE4C\uC9C0 \uD558\uB098\uC758 \uC124\uACC4 \uC758\uC9C0 \uC544\uB798 \uB454\uB2E4 (\uCD1D\uCCB4\uC608\uC220)","\uC5ED\uC0AC\uC8FC\uC758 \uC591\uC2DD \uC778\uC6A9\uC744 \uAE08\uC9C0\uD55C\uB2E4 \u2014 \uD604\uB300\uB294 \uC790\uAE30 \uC2DC\uB300\uC758 \uD615\uD0DC\uB97C \uC2A4\uC2A4\uB85C \uBC1C\uBA85\uD574\uC57C \uD55C\uB2E4","\uC0C8 \uC7AC\uB8CC(\uCCA0\xB7\uD310\uC720\uB9AC)\uC758 \uAD6C\uC870\uC801 \uC131\uB2A5\uC744 \uC228\uAE30\uC9C0 \uC54A\uACE0 \uADF8 \uC131\uB2A5\uC5D0\uC11C \uD615\uD0DC\uB97C \uC5BB\uB294\uB2E4"],take:["\uC120\uC758 \uC6B4\uB3D9\uC744 \uBAA8\uC158 \uC6D0\uB9AC\uB85C \uBC88\uC5ED\uD55C\uB2E4 \u2014 whiplash line\uC758 \uBCF8\uC9C8\uC740 \uACE1\uC120 \uBAA8\uC591\uC774 \uC544\uB2C8\uB77C \uAC00\uC18D\xB7\uAC10\uC18D\uC758 \uBE44\uADE0\uC9C8\uC131\uC774\uB2E4. \uC774\uC9D5 \uCEE4\uBE0C \uC124\uACC4\uC758 \uADFC\uAC70\uAC00 \uB41C\uB2E4 (\uC120\uD615 \uC774\uC9D5 \uAC70\uBD80)","\uD558\uB098\uC758 \uC124\uACC4 \uC758\uC9C0\uB97C \uC81C\uD488 \uCD5C\uB9D0\uB2E8\uAE4C\uC9C0 \uAD00\uCCA0\uD55C\uB2E4 \u2014 \uD1A0\uC2A4\uD2B8\xB7\uBE48 \uC0C1\uD0DC\xB7\uC5D0\uB7EC \uCE74\uD53C\xB7\uB85C\uB529 \uC778\uB514\uCF00\uC774\uD130\uAE4C\uC9C0. \uC544\uB974\uB204\uBCF4\uC758 \uC9C4\uC9DC \uAE09\uC9C4\uC131\uC740 \uBB38\uC190\uC7A1\uC774\uAE4C\uC9C0 \uC124\uACC4\uD588\uB2E4\uB294 \uC810\uC774\uB2E4","\uB9E4\uCCB4 \uBB3C\uC131\uC5D0\uC11C \uD615\uD0DC\uB97C \uC5BB\uB294\uB2E4 \u2014 Horta\uAC00 \uCCA0\uC758 \uC778\uC7A5\uB825\uC5D0\uC11C \uD615\uD0DC\uB97C \uC5BB\uC740 \uAC83\uCC98\uB7FC, \uC2A4\uD06C\uB864\xB7\uD638\uBC84\xB7\uAC00\uBCC0 \uD3F0\uD2B8 \uAC19\uC740 \uC6F9 \uACE0\uC720 \uC131\uB2A5\uC5D0\uC11C \uB3C4\uCD9C\uD55C\uB2E4"],leave:["\uAC00\uB3C5\uC131 \u2014 \uC544\uB974\uB204\uBCF4 \uB808\uD130\uB9C1\uC740 \uD55C \uB2E8\uC5B4 \uADDC\uBAA8\uC758 \uD3EC\uC2A4\uD130\uC6A9\uC774\uB2E4. \uBCF8\uBB38\xB7UI \uB77C\uBCA8\xB7\uB370\uC774\uD130 \uD14C\uC774\uBE14\uC5D0 \uC4F0\uBA74 \uD310\uB3C5\uC131\uC774 \uBB34\uB108\uC9C0\uACE0, \uD55C\uAE00 \uC870\uD569\uD615 \uAD6C\uC870\uC5D0\uC11C\uB294 \uACE1\uC120 \uBCC0\uD615 \uC2DC \uC790\uC18C \uAD6C\uBD84\uC774 \uBA3C\uC800 \uD30C\uAD34\uB41C\uB2E4","\uACE1\uC120 SVG \uC7A5\uC2DD + \uC138\uB9AC\uD504 \uCEE4\uC2A4\uD140 \uB85C\uACE0 \uC870\uD569 \u2014 \uC989\uC2DC '\uBE48\uD2F0\uC9C0 \uD654\uC7A5\uD488 \uBE0C\uB79C\uB529' \uD074\uB9AC\uC170\uB2E4. \uC544\uB974\uB204\uBCF4\uC758 \uACE1\uC120\uC740 \uAD6C\uC870 \uBD80\uC7AC\uC600\uAE30 \uB54C\uBB38\uC5D0 \uC815\uB2F9\uD588\uB2E4"]},{id:"ISM-DECO",family:"airplane",name:"\uC544\uB974\uB370\uCF54",card:`## \`ISM-DECO\` \xB7 \uC544\uB974\uB370\uCF54 (Art Deco)

**1910\uB144\uB300 \uCD08\u20131939** (\uC804\uC131\uAE30 1925\u201335) \xB7 \uD504\uB791\uC2A4 \uD30C\uB9AC \u2192 \uB274\uC695
\uC6A9\uC5B4\uB294 1960\uB144\uB300 \uC18C\uAE09 \uC815\uCC29(Bevis Hillier, 1968)

**\uC778\uBB3C**: \xC9mile-Jacques Ruhlmann \xB7 A. M. Cassandre \xB7 Ren\xE9 Lalique \xB7 William Van Alen

**\uC6D0\uB9AC**
- \uAE30\uACC4 \uC2DC\uB300\uC758 \uC815\uBC00\uC131\uACFC \uC18D\uB3C4\uB97C \uCC2C\uBBF8\uD558\uB418, **\uAE30\uACC4\uC5D0 \uC7A5\uC2DD\uC744 \uD3EC\uAE30\uD558\uC9C0 \uC54A\uB294\uB2E4** \u2014 \uBAA8\uB354\uB2C8\uC998\uACFC \uAC08\uB77C\uC9C0\uB294 \uACB0\uC815\uC801 \uC9C0\uC810
- \uAE30\uD558\uD559\uC774 \uD615\uD0DC\uC758 \uADDC\uBC94\uC774\uB2E4. \uC720\uAE30\uC801 \uACE1\uC120\uC744 \uAE30\uD558\uD559\uC801\uC73C\uB85C \uADDC\uC728\uB41C \uACE1\uC120(\uC6D0\uD638\xB7\uB098\uC120)\uC73C\uB85C \uB300\uCCB4\uD55C\uB2E4
- \uB7ED\uC154\uB9AC\uC640 \uC0B0\uC5C5 \uC0DD\uC0B0\uC740 \uC591\uB9BD\uD55C\uB2E4 \u2014 \uD06C\uB86C\xB7\uBCA0\uC774\uD074\uB77C\uC774\uD2B8\uB97C \uC0C1\uC544\xB7\uC790\uB2E8\uACFC \uB3D9\uB4F1\uD55C \uACE0\uAE09\uC7AC\uB85C \uCDE8\uAE09
- \uD604\uB300\uC131\uC740 \uB300\uC911\uC5D0\uAC8C \uD310\uB9E4\uB418\uB294 \uAC83\uC774\uB2E4 \u2014 \uBC31\uD654\uC810\xB7\uC5EC\uAC1D\uC120\xB7\uC601\uD654\uAD00\xB7\uAD11\uACE0\uB97C \uC815\uB2F9\uD55C \uB514\uC790\uC778 \uBB34\uB300\uB85C \uC2B9\uC778
- \uD615\uD0DC\uB294 \uC555\uCD95\uB418\uACE0 \uC591\uC2DD\uD654\uB418\uC5B4\uC57C \uD55C\uB2E4 \u2014 \uC7AC\uD604\uC774 \uC544\uB2C8\uB77C **\uAE30\uD638\uD654**. \uBCF8\uC9C8\uC801 \uC2E4\uB8E8\uC5E3\uB9CC \uB0A8\uAE34\uB2E4

**\uC2DC\uAC01** (\uCC38\uACE0\uC6A9) \uACC4\uB2E8\uC2DD(ziggurat) \uC2E4\uB8E8\uC5E3\xB7\uC120\uBC84\uC2A4\uD2B8\xB7\uC170\uBE0C\uB7F0 / \uAC15\uD55C \uB300\uCE6D\uCD95\uACFC \uBC18\uBCF5 \uB9AC\uB4EC / \uAE30\uD558\uD559\uC801 \uC0B0\uC138\uB9AC\uD504 \uB300\uBB38\uC790, \uB113\uC740 \uC790\uAC04 / \uAE08\xB7\uC740\xB7\uD06C\uB86C \uBA54\uD0C8\uB9AD + \uADF9\uB2E8\uC801 \uBA85\uC554 \uB300\uBE44 / \uADF8\uB77C\uB370\uC774\uC158 \uB300\uC2E0 \uB2E8\uACC4\uD654\uB41C \uBA74 \uBD84\uD560

**\uB300\uD45C\uC791** Chrysler Building(Van Alen, 1928\u201330) \xB7 \u300CNormandie\u300D \uD3EC\uC2A4\uD130(Cassandre, 1935) \xB7 Bifur \uD65C\uC790\uCCB4(Cassandre, 1929)

**\uAC00\uC838\uC62C \uAC83**
- **\uAE30\uD558\uD559\uC801 \uADDC\uC728\uC744 \uC2DC\uC2A4\uD15C\uC758 \uADFC\uAC70\uB85C** \u2014 \uC544\uB974\uB370\uCF54\uC758 \uD615\uD0DC\uB294 \uC790\uC758\uC801\uC774\uC9C0 \uC54A\uACE0 \uC6D0\uD638\xB7\uC815\uB2E4\uAC01\uD615\xB7\uC815\uC218\uBE44\uB85C \uC791\uB3C4 \uAC00\uB2A5\uD588\uB2E4. \uC2A4\uD398\uC774\uC2F1 \uC2A4\uCF00\uC77C\xB7\uCF54\uB108 \uBC18\uACBD\xB7\uC544\uC774\uCF58 \uADF8\uB9AC\uB4DC\uB97C \uB3D9\uC77C\uD55C \uC791\uB3C4 \uADDC\uCE59\uC5D0\uC11C \uB3C4\uCD9C\uD558\uBA74 \uAC19\uC740 \uB0B4\uC801 \uD544\uC5F0\uC131\uC744 \uC5BB\uB294\uB2E4 (\u2192 1U \uCCB4\uACC4\uC758 \uC5ED\uC0AC\uC801 \uC120\uB840)
- **\uAE30\uD638\uD654(\uC555\uCD95)\uB97C \uC815\uBCF4 \uC124\uACC4 \uC6D0\uB9AC\uB85C** \u2014 Cassandre\uAC00 \uC5EC\uAC1D\uC120\uC744 \uBC43\uBA38\uB9AC \uD558\uB098\uB85C \uC555\uCD95\uD55C \uBC29\uC2DD\uC740 \uC544\uC774\uCF58\xB7\uC77C\uB7EC\uC2A4\uD2B8\xB7\uB370\uC774\uD130 \uC2DC\uAC01\uD654\uC758 \uCD94\uC0C1 \uC218\uC900 \uACB0\uC815 \uC6D0\uB9AC\uB85C \uC9C1\uC811 \uC804\uC774\uB41C\uB2E4: \uC778\uC2DD\uC5D0 \uD544\uC694\uD55C \uCD5C\uC18C \uC2E4\uB8E8\uC5E3\uB9CC \uB0A8\uAE34\uB2E4
- \uC2E0\uC18C\uC7AC\uB97C \uC704\uACC4 \uC5C6\uC774 \uB2E4\uB8E8\uB294 \uD0DC\uB3C4 \u2014 \uB2E4\uD06C\uBAA8\uB4DC\xB7\uAC00\uBCC0 \uD3F0\uD2B8\xB7\uBC18\uD22C\uBA85 \uB808\uC774\uC5B4\xB7\uD585\uD2F1\uC744 \uC784\uC2DC\uBC29\uD3B8\uC774 \uC544\uB2C8\uB77C \uC77C\uAE09 \uD45C\uD604 \uC7AC\uB8CC\uB85C \uD3B8\uC785

**\uB450\uACE0 \uC62C \uAC83**
- '\uAC1C\uCE20\uBE44 \uD15C\uD50C\uB9BF' \u2014 \uAE08\uC0C9 \uADF8\uB77C\uB370\uC774\uC158 + \uC120\uBC84\uC2A4\uD2B8 + \uC640\uC774\uB4DC \uD2B8\uB798\uD0B9 \uB300\uBB38\uC790 \uC138\uD2B8\uB294 \uC2DC\uB300 \uCF54\uC2A4\uD2AC\uC774 \uB418\uACE0 1920\uB144\uB300\uB77C\uB294 \uC2DC\uB300 \uAE30\uD638\uB9CC \uC804\uB2EC\uD55C\uB2E4
- \uB300\uBB38\uC790\xB7\uC640\uC774\uB4DC \uD2B8\uB798\uD0B9 \uAC15\uD589 \u2014 \uC544\uB974\uB370\uCF54 \uC870\uD310\uC740 \uC9E7\uC740 \uACE0\uC720\uBA85\uC0AC \uC804\uC6A9\uC774\uB2E4. **\uD55C\uAE00\uC5D0\uB294 \uB300\uBB38\uC790 \uAC1C\uB150\uC774 \uC5C6\uC5B4 \uC790\uAC04 \uD655\uB300\uB9CC \uB0A8\uACE0 \uB2E8\uC5B4 \uACBD\uACC4\uAC00 \uD750\uB824\uC9C4\uB2E4**

**\uC694\uC57D** \uD604\uB300\uC131\uC740 \uC7A5\uC2DD\uC744 \uBC84\uB824\uC11C\uAC00 \uC544\uB2C8\uB77C \uC7A5\uC2DD\uC744 \uAE30\uD558\uD559\uC73C\uB85C \uADDC\uC728\uD558\uACE0 \uB300\uC911 \uC0C1\uC5C5\uC758 \uBB34\uB300\uC5D0 \uC62C\uB824\uC11C \uC131\uCDE8\uB41C\uB2E4.`,summary:"\uD604\uB300\uC131\uC740 \uC7A5\uC2DD\uC744 \uBC84\uB824\uC11C\uAC00 \uC544\uB2C8\uB77C \uC7A5\uC2DD\uC744 \uAE30\uD558\uD559\uC73C\uB85C \uADDC\uC728\uD558\uACE0 \uB300\uC911 \uC0C1\uC5C5\uC758 \uBB34\uB300\uC5D0 \uC62C\uB824\uC11C \uC131\uCDE8\uB41C\uB2E4.",principles:["\uAE30\uACC4 \uC2DC\uB300\uC758 \uC815\uBC00\uC131\uACFC \uC18D\uB3C4\uB97C \uCC2C\uBBF8\uD558\uB418, \uAE30\uACC4\uC5D0 \uC7A5\uC2DD\uC744 \uD3EC\uAE30\uD558\uC9C0 \uC54A\uB294\uB2E4 \u2014 \uBAA8\uB354\uB2C8\uC998\uACFC \uAC08\uB77C\uC9C0\uB294 \uACB0\uC815\uC801 \uC9C0\uC810","\uAE30\uD558\uD559\uC774 \uD615\uD0DC\uC758 \uADDC\uBC94\uC774\uB2E4. \uC720\uAE30\uC801 \uACE1\uC120\uC744 \uAE30\uD558\uD559\uC801\uC73C\uB85C \uADDC\uC728\uB41C \uACE1\uC120(\uC6D0\uD638\xB7\uB098\uC120)\uC73C\uB85C \uB300\uCCB4\uD55C\uB2E4","\uB7ED\uC154\uB9AC\uC640 \uC0B0\uC5C5 \uC0DD\uC0B0\uC740 \uC591\uB9BD\uD55C\uB2E4 \u2014 \uD06C\uB86C\xB7\uBCA0\uC774\uD074\uB77C\uC774\uD2B8\uB97C \uC0C1\uC544\xB7\uC790\uB2E8\uACFC \uB3D9\uB4F1\uD55C \uACE0\uAE09\uC7AC\uB85C \uCDE8\uAE09","\uD604\uB300\uC131\uC740 \uB300\uC911\uC5D0\uAC8C \uD310\uB9E4\uB418\uB294 \uAC83\uC774\uB2E4 \u2014 \uBC31\uD654\uC810\xB7\uC5EC\uAC1D\uC120\xB7\uC601\uD654\uAD00\xB7\uAD11\uACE0\uB97C \uC815\uB2F9\uD55C \uB514\uC790\uC778 \uBB34\uB300\uB85C \uC2B9\uC778","\uD615\uD0DC\uB294 \uC555\uCD95\uB418\uACE0 \uC591\uC2DD\uD654\uB418\uC5B4\uC57C \uD55C\uB2E4 \u2014 \uC7AC\uD604\uC774 \uC544\uB2C8\uB77C \uAE30\uD638\uD654. \uBCF8\uC9C8\uC801 \uC2E4\uB8E8\uC5E3\uB9CC \uB0A8\uAE34\uB2E4"],take:["\uAE30\uD558\uD559\uC801 \uADDC\uC728\uC744 \uC2DC\uC2A4\uD15C\uC758 \uADFC\uAC70\uB85C \u2014 \uC544\uB974\uB370\uCF54\uC758 \uD615\uD0DC\uB294 \uC790\uC758\uC801\uC774\uC9C0 \uC54A\uACE0 \uC6D0\uD638\xB7\uC815\uB2E4\uAC01\uD615\xB7\uC815\uC218\uBE44\uB85C \uC791\uB3C4 \uAC00\uB2A5\uD588\uB2E4. \uC2A4\uD398\uC774\uC2F1 \uC2A4\uCF00\uC77C\xB7\uCF54\uB108 \uBC18\uACBD\xB7\uC544\uC774\uCF58 \uADF8\uB9AC\uB4DC\uB97C \uB3D9\uC77C\uD55C \uC791\uB3C4 \uADDC\uCE59\uC5D0\uC11C \uB3C4\uCD9C\uD558\uBA74 \uAC19\uC740 \uB0B4\uC801 \uD544\uC5F0\uC131\uC744 \uC5BB\uB294\uB2E4","\uAE30\uD638\uD654(\uC555\uCD95)\uB97C \uC815\uBCF4 \uC124\uACC4 \uC6D0\uB9AC\uB85C \u2014 Cassandre\uAC00 \uC5EC\uAC1D\uC120\uC744 \uBC43\uBA38\uB9AC \uD558\uB098\uB85C \uC555\uCD95\uD55C \uBC29\uC2DD\uC740 \uC544\uC774\uCF58\xB7\uC77C\uB7EC\uC2A4\uD2B8\xB7\uB370\uC774\uD130 \uC2DC\uAC01\uD654\uC758 \uCD94\uC0C1 \uC218\uC900 \uACB0\uC815 \uC6D0\uB9AC\uB85C \uC9C1\uC811 \uC804\uC774\uB41C\uB2E4: \uC778\uC2DD\uC5D0 \uD544\uC694\uD55C \uCD5C\uC18C \uC2E4\uB8E8\uC5E3\uB9CC \uB0A8\uAE34\uB2E4","\uC2E0\uC18C\uC7AC\uB97C \uC704\uACC4 \uC5C6\uC774 \uB2E4\uB8E8\uB294 \uD0DC\uB3C4 \u2014 \uB2E4\uD06C\uBAA8\uB4DC\xB7\uAC00\uBCC0 \uD3F0\uD2B8\xB7\uBC18\uD22C\uBA85 \uB808\uC774\uC5B4\xB7\uD585\uD2F1\uC744 \uC784\uC2DC\uBC29\uD3B8\uC774 \uC544\uB2C8\uB77C \uC77C\uAE09 \uD45C\uD604 \uC7AC\uB8CC\uB85C \uD3B8\uC785"],leave:["'\uAC1C\uCE20\uBE44 \uD15C\uD50C\uB9BF' \u2014 \uAE08\uC0C9 \uADF8\uB77C\uB370\uC774\uC158 + \uC120\uBC84\uC2A4\uD2B8 + \uC640\uC774\uB4DC \uD2B8\uB798\uD0B9 \uB300\uBB38\uC790 \uC138\uD2B8\uB294 \uC2DC\uB300 \uCF54\uC2A4\uD2AC\uC774 \uB418\uACE0 1920\uB144\uB300\uB77C\uB294 \uC2DC\uB300 \uAE30\uD638\uB9CC \uC804\uB2EC\uD55C\uB2E4","\uB300\uBB38\uC790\xB7\uC640\uC774\uB4DC \uD2B8\uB798\uD0B9 \uAC15\uD589 \u2014 \uC544\uB974\uB370\uCF54 \uC870\uD310\uC740 \uC9E7\uC740 \uACE0\uC720\uBA85\uC0AC \uC804\uC6A9\uC774\uB2E4. \uD55C\uAE00\uC5D0\uB294 \uB300\uBB38\uC790 \uAC1C\uB150\uC774 \uC5C6\uC5B4 \uC790\uAC04 \uD655\uB300\uB9CC \uB0A8\uACE0 \uB2E8\uC5B4 \uACBD\uACC4\uAC00 \uD750\uB824\uC9C4\uB2E4"]},{id:"ISM-FUTUR",family:"airplane",name:"\uC774\uD0C8\uB9AC\uC544 \uBBF8\uB798\uC8FC\uC758",card:`## \`ISM-FUTUR\` \xB7 \uC774\uD0C8\uB9AC\uC544 \uBBF8\uB798\uC8FC\uC758 (Italian Futurism)

**1909\u20131944** (\uADF8\uB798\uD53D \uD575\uC2EC\uAE30 1912\u201330) \xB7 \uC774\uD0C8\uB9AC\uC544 \uBC00\uB77C\uB178, \uC120\uC5B8\uC740 \uD30C\uB9AC \u300ELe Figaro\u300F 1\uBA74(1909.2.20)

**\uC778\uBB3C**: F. T. Marinetti \xB7 Ardengo Soffici \xB7 Fortunato Depero \xB7 Giacomo Balla \xB7 Umberto Boccioni

**\uC6D0\uB9AC**
- \uD65C\uC790\uB294 \uC758\uBBF8\uC758 \uC911\uB9BD\uC801 \uC6B4\uBC18\uCCB4\uAC00 \uC544\uB2C8\uB77C **\uC758\uBBF8\uB97C \uC0DD\uC0B0\uD558\uB294 \uBB3C\uC9C8**\uC774\uB2E4 \u2014 \uC11C\uCCB4\xB7\uD06C\uAE30\xB7\uAE30\uC6B8\uAE30\xB7\uBC29\uD5A5\uC758 \uC120\uD0DD \uC790\uCCB4\uAC00 \uB0B4\uC6A9\uC774\uB2E4 (1913 '\uD0C0\uC774\uD3EC\uADF8\uB798\uD53C \uD601\uBA85' \uC120\uC5B8)
- \uD398\uC774\uC9C0\uC758 '\uD0C0\uC774\uD3EC\uADF8\uB798\uD53C\uC801 \uC870\uD654'\uB97C \uD3D0\uAE30\uD55C\uB2E4 \u2014 \uC870\uD654\uB294 \uC815\uC801\uC774\uBBC0\uB85C \uBB38\uCCB4\uC758 \uAE09\uBCC0\uC744 \uBC30\uBC18\uD55C\uB2E4
- \uD1B5\uC0AC\xB7\uAD6C\uB450\uC810\xB7\uC6B4\uC728\uC744 \uCCA0\uD3D0\uD55C\uB2E4 (parole in libert\xE0) \u2014 **\uACF5\uAC04 \uBC30\uCE58\uAC00 \uD1B5\uC0AC\uB97C \uB300\uCCB4\uD55C\uB2E4.** \uC120\uD615 \uB3C5\uC11C\uB97C \uB3D9\uC2DC\uC801 \uC9C0\uAC01\uC73C\uB85C \uAD50\uCCB4
- \uD45C\uD604 \uB300\uC0C1\uC758 \uAC10\uAC01\uC801 \uC131\uC9C8\uACFC \uD65C\uC790\uC758 \uC2DC\uAC01\uC801 \uC131\uC9C8\uC744 \uC77C\uCE58\uC2DC\uD0A8\uB2E4
- \uB9E4\uCCB4 \uBB3C\uC131\uC744 \uC740\uD3D0\uD558\uC9C0 \uC54A\uACE0 \uACF5\uACA9\uC801\uC73C\uB85C \uB178\uCD9C\uD55C\uB2E4 \u2014 \uCC45\uC740 \uC77D\uD788\uB294 \uD22C\uBA85\uD55C \uCC3D\uC774 \uC544\uB2C8\uB77C \uB9CC\uC838\uC9C0\uB294 \uC0AC\uBB3C\uC774\uB2E4

**\uC2DC\uAC01** (\uCC38\uACE0\uC6A9) \uB2E4\uC911 \uC11C\uCCB4\xB7\uB2E4\uC911 \uD06C\uAE30 \uD63C\uC7AC / \uAE30\uC900\uC120(baseline) \uD3D0\uAE30, \uB300\uAC01\xB7\uC218\uC9C1\xB7\uD68C\uC804 \uBC30\uCE58 / \uC218\uD559 \uAE30\uD638\xB7\uC22B\uC790\uB97C \uB2E8\uC5B4\uC640 \uB3D9\uB4F1\uD558\uAC8C \uD3B8\uC785 / \uC758\uC131\uC5B4\uC758 \uC2DC\uAC01\uC801 \uC99D\uD3ED / \uAE08\uC18D \uBCFC\uD2B8 \uC81C\uBCF8 \uB4F1 \uBB3C\uB9AC\uC801 \uD30C\uAD34

**\uAC00\uC838\uC62C \uAC83**
- **\uD0C0\uC785\uC744 \uD45C\uD604 \uC7AC\uB8CC\uB85C \uB2E4\uB8E8\uB294 \uD0DC\uB3C4** \u2014 \uAC00\uBCC0 \uD3F0\uD2B8\uC758 weight/width/slant \uCD95, \uC2A4\uD06C\uB864 \uC5F0\uB3D9 \uD0C0\uC785 \uBCC0\uD615\uC740 \uBBF8\uB798\uC8FC\uC758\uAC00 \uB0A9\uD65C\uC790\uB85C \uD558\uB824\uB358 \uAC83\uC744 \uC2E4\uD589 \uAC00\uB2A5\uD558\uAC8C \uB9CC\uB4E0 \uB3C4\uAD6C\uB2E4. '\uC758\uBBF8\uC640 \uC2DC\uAC01 \uD615\uC2DD\uC758 \uC77C\uCE58'\uAC00 \uC0AC\uC6A9 \uADFC\uAC70\uAC00 \uB41C\uB2E4
- \uC120\uD615 \uB3C5\uC11C\uB97C **\uB3D9\uC2DC\uC801 \uC9C0\uAC01\uC73C\uB85C \uC7AC\uD3B8**\uD558\uB294 \uC124\uACC4 \u2014 \uB300\uC2DC\uBCF4\uB4DC\xB7\uB77C\uC774\uBE0C \uB370\uC774\uD130\xB7\uC2E4\uC2DC\uAC04 \uD611\uC5C5 \uD654\uBA74\uC740 \uBCF8\uC9C8\uC801\uC73C\uB85C parole in libert\xE0\uC758 \uC870\uAC74(\uB3D9\uC2DC\uC131\xB7\uBE44\uC120\uD615)\uC5D0 \uB193\uC778\uB2E4. \uC21C\uCC28 \uBB38\uC11C \uBAA8\uB378\uC744 \uAC15\uC81C\uD558\uC9C0 \uC54A\uACE0 \uACF5\uAC04 \uBC30\uCE58\uAC00 \uAD00\uACC4\uB97C \uC11C\uC220\uD558\uAC8C \uD55C\uB2E4
- \uB9E4\uCCB4 \uBB3C\uC131\uC758 \uB178\uCD9C \u2014 \uB85C\uB529\xB7\uB808\uC774\uD134\uC2DC\xB7\uC624\uD504\uB77C\uC778\xB7\uC2A4\uD2B8\uB9AC\uBC0D\uC744 \uC228\uAE30\uACE0 '\uB9E4\uB044\uB7EC\uC6B4 \uC885\uC774'\uB97C \uD749\uB0B4\uB0B4\uC9C0 \uC54A\uB294\uB2E4

**\uB450\uACE0 \uC62C \uAC83**
- **\uAC00\uB3C5\uC131\xB7\uC811\uADFC\uC131 \uB3D9\uC2DC \uBD95\uAD34** \u2014 \uAE30\uC900\uC120 \uD3D0\uAE30\xB7\uB2E4\uC911 \uC11C\uCCB4\xB7\uD68C\uC804 \uD14D\uC2A4\uD2B8\uB294 \uC2A4\uD06C\uB9B0\uB9AC\uB354 \uC77D\uAE30 \uC21C\uC11C\uB97C \uD30C\uAD34\uD558\uACE0 \uB300\uBE44\xB7\uB9AC\uD50C\uB85C\uC6B0 \uC694\uAC74\uACFC \uC815\uBA74 \uCDA9\uB3CC\uD55C\uB2E4. \uD45C\uD604\uC801 \uD0C0\uC785\uC740 \uD788\uC5B4\uB85C\xB7\uD0C0\uC774\uD2C0\uC5D0 **\uACA9\uB9AC**\uD558\uACE0 \uBCF8\uBB38\xB7\uD3FC\xB7\uB0B4\uBE44\uAC8C\uC774\uC158\uC740 \uBCF4\uD638\uD55C\uB2E4
- **\uBBF8\uB798\uC8FC\uC758\uB97C \uBE0C\uB79C\uB4DC \uC11C\uC0AC\uB85C \uC4F0\uB294 \uAC83** \u2014 \uC804\uC7C1\uC744 "\uC138\uACC4\uC758 \uC720\uC77C\uD55C \uC704\uC0DD"\uC73C\uB85C \uCC2C\uBBF8\uD558\uACE0 \uC774\uD0C8\uB9AC\uC544 \uD30C\uC2DC\uC998\uACFC \uC2E4\uC81C\uB85C \uACB0\uD569\uD55C \uC6B4\uB3D9\uC774\uB2E4. \uC2DC\uAC01 \uC5B8\uC5B4 \uCC28\uC6A9\uC740 \uAC00\uB2A5\uD558\uB098 '\uBBF8\uB798\uC8FC\uC758 \uC815\uC2E0'\uC744 \uB0B4\uC138\uC6B0\uB294 \uAC83\uC740 \uC5ED\uC0AC\uC801\uC73C\uB85C \uC704\uD5D8\uD55C \uC778\uC6A9\uC774\uB2E4

**\uC694\uC57D** \uD65C\uC790\uB294 \uC758\uBBF8\uB97C \uB2F4\uB294 \uADF8\uB987\uC774 \uC544\uB2C8\uB77C \uC758\uBBF8\uB97C \uB9CC\uB4DC\uB294 \uBB3C\uC9C8\uC774\uB2E4.`,summary:"\uD65C\uC790\uB294 \uC758\uBBF8\uB97C \uB2F4\uB294 \uADF8\uB987\uC774 \uC544\uB2C8\uB77C \uC758\uBBF8\uB97C \uB9CC\uB4DC\uB294 \uBB3C\uC9C8\uC774\uB2E4.",principles:["\uD65C\uC790\uB294 \uC758\uBBF8\uC758 \uC911\uB9BD\uC801 \uC6B4\uBC18\uCCB4\uAC00 \uC544\uB2C8\uB77C \uC758\uBBF8\uB97C \uC0DD\uC0B0\uD558\uB294 \uBB3C\uC9C8\uC774\uB2E4 \u2014 \uC11C\uCCB4\xB7\uD06C\uAE30\xB7\uAE30\uC6B8\uAE30\xB7\uBC29\uD5A5\uC758 \uC120\uD0DD \uC790\uCCB4\uAC00 \uB0B4\uC6A9\uC774\uB2E4 (1913 '\uD0C0\uC774\uD3EC\uADF8\uB798\uD53C \uD601\uBA85' \uC120\uC5B8)","\uD398\uC774\uC9C0\uC758 '\uD0C0\uC774\uD3EC\uADF8\uB798\uD53C\uC801 \uC870\uD654'\uB97C \uD3D0\uAE30\uD55C\uB2E4 \u2014 \uC870\uD654\uB294 \uC815\uC801\uC774\uBBC0\uB85C \uBB38\uCCB4\uC758 \uAE09\uBCC0\uC744 \uBC30\uBC18\uD55C\uB2E4","\uD1B5\uC0AC\xB7\uAD6C\uB450\uC810\xB7\uC6B4\uC728\uC744 \uCCA0\uD3D0\uD55C\uB2E4 (parole in libert\xE0) \u2014 \uACF5\uAC04 \uBC30\uCE58\uAC00 \uD1B5\uC0AC\uB97C \uB300\uCCB4\uD55C\uB2E4. \uC120\uD615 \uB3C5\uC11C\uB97C \uB3D9\uC2DC\uC801 \uC9C0\uAC01\uC73C\uB85C \uAD50\uCCB4","\uD45C\uD604 \uB300\uC0C1\uC758 \uAC10\uAC01\uC801 \uC131\uC9C8\uACFC \uD65C\uC790\uC758 \uC2DC\uAC01\uC801 \uC131\uC9C8\uC744 \uC77C\uCE58\uC2DC\uD0A8\uB2E4","\uB9E4\uCCB4 \uBB3C\uC131\uC744 \uC740\uD3D0\uD558\uC9C0 \uC54A\uACE0 \uACF5\uACA9\uC801\uC73C\uB85C \uB178\uCD9C\uD55C\uB2E4 \u2014 \uCC45\uC740 \uC77D\uD788\uB294 \uD22C\uBA85\uD55C \uCC3D\uC774 \uC544\uB2C8\uB77C \uB9CC\uC838\uC9C0\uB294 \uC0AC\uBB3C\uC774\uB2E4"],take:["\uD0C0\uC785\uC744 \uD45C\uD604 \uC7AC\uB8CC\uB85C \uB2E4\uB8E8\uB294 \uD0DC\uB3C4 \u2014 \uAC00\uBCC0 \uD3F0\uD2B8\uC758 weight/width/slant \uCD95, \uC2A4\uD06C\uB864 \uC5F0\uB3D9 \uD0C0\uC785 \uBCC0\uD615\uC740 \uBBF8\uB798\uC8FC\uC758\uAC00 \uB0A9\uD65C\uC790\uB85C \uD558\uB824\uB358 \uAC83\uC744 \uC2E4\uD589 \uAC00\uB2A5\uD558\uAC8C \uB9CC\uB4E0 \uB3C4\uAD6C\uB2E4. '\uC758\uBBF8\uC640 \uC2DC\uAC01 \uD615\uC2DD\uC758 \uC77C\uCE58'\uAC00 \uC0AC\uC6A9 \uADFC\uAC70\uAC00 \uB41C\uB2E4","\uC120\uD615 \uB3C5\uC11C\uB97C \uB3D9\uC2DC\uC801 \uC9C0\uAC01\uC73C\uB85C \uC7AC\uD3B8\uD558\uB294 \uC124\uACC4 \u2014 \uB300\uC2DC\uBCF4\uB4DC\xB7\uB77C\uC774\uBE0C \uB370\uC774\uD130\xB7\uC2E4\uC2DC\uAC04 \uD611\uC5C5 \uD654\uBA74\uC740 \uBCF8\uC9C8\uC801\uC73C\uB85C parole in libert\xE0\uC758 \uC870\uAC74(\uB3D9\uC2DC\uC131\xB7\uBE44\uC120\uD615)\uC5D0 \uB193\uC778\uB2E4. \uC21C\uCC28 \uBB38\uC11C \uBAA8\uB378\uC744 \uAC15\uC81C\uD558\uC9C0 \uC54A\uACE0 \uACF5\uAC04 \uBC30\uCE58\uAC00 \uAD00\uACC4\uB97C \uC11C\uC220\uD558\uAC8C \uD55C\uB2E4","\uB9E4\uCCB4 \uBB3C\uC131\uC758 \uB178\uCD9C \u2014 \uB85C\uB529\xB7\uB808\uC774\uD134\uC2DC\xB7\uC624\uD504\uB77C\uC778\xB7\uC2A4\uD2B8\uB9AC\uBC0D\uC744 \uC228\uAE30\uACE0 '\uB9E4\uB044\uB7EC\uC6B4 \uC885\uC774'\uB97C \uD749\uB0B4\uB0B4\uC9C0 \uC54A\uB294\uB2E4"],leave:["\uAC00\uB3C5\uC131\xB7\uC811\uADFC\uC131 \uB3D9\uC2DC \uBD95\uAD34 \u2014 \uAE30\uC900\uC120 \uD3D0\uAE30\xB7\uB2E4\uC911 \uC11C\uCCB4\xB7\uD68C\uC804 \uD14D\uC2A4\uD2B8\uB294 \uC2A4\uD06C\uB9B0\uB9AC\uB354 \uC77D\uAE30 \uC21C\uC11C\uB97C \uD30C\uAD34\uD558\uACE0 \uB300\uBE44\xB7\uB9AC\uD50C\uB85C\uC6B0 \uC694\uAC74\uACFC \uC815\uBA74 \uCDA9\uB3CC\uD55C\uB2E4. \uD45C\uD604\uC801 \uD0C0\uC785\uC740 \uD788\uC5B4\uB85C\xB7\uD0C0\uC774\uD2C0\uC5D0 \uACA9\uB9AC\uD558\uACE0 \uBCF8\uBB38\xB7\uD3FC\xB7\uB0B4\uBE44\uAC8C\uC774\uC158\uC740 \uBCF4\uD638\uD55C\uB2E4",`\uBBF8\uB798\uC8FC\uC758\uB97C \uBE0C\uB79C\uB4DC \uC11C\uC0AC\uB85C \uC4F0\uB294 \uAC83 \u2014 \uC804\uC7C1\uC744 "\uC138\uACC4\uC758 \uC720\uC77C\uD55C \uC704\uC0DD"\uC73C\uB85C \uCC2C\uBBF8\uD558\uACE0 \uC774\uD0C8\uB9AC\uC544 \uD30C\uC2DC\uC998\uACFC \uC2E4\uC81C\uB85C \uACB0\uD569\uD55C \uC6B4\uB3D9\uC774\uB2E4. \uC2DC\uAC01 \uC5B8\uC5B4 \uCC28\uC6A9\uC740 \uAC00\uB2A5\uD558\uB098 '\uBBF8\uB798\uC8FC\uC758 \uC815\uC2E0'\uC744 \uB0B4\uC138\uC6B0\uB294 \uAC83\uC740 \uC5ED\uC0AC\uC801\uC73C\uB85C \uC704\uD5D8\uD55C \uC778\uC6A9\uC774\uB2E4`]},{id:"ISM-DADA",family:"airplane",name:"\uB2E4\uB2E4",card:`## \`ISM-DADA\` \xB7 \uB2E4\uB2E4 (Dada)

**1916\u20131924** \xB7 \uC2A4\uC704\uC2A4 \uCDE8\uB9AC\uD788(Cabaret Voltaire, 1916.2.5) \u2192 \uBCA0\uB97C\uB9B0\xB7\uD558\uB178\uBC84\xB7\uB274\uC695\xB7\uD30C\uB9AC
\uADF8\uB798\uD53D\xB7\uD0C0\uC774\uD3EC \uC2E4\uD5D8\uC758 \uC911\uC2EC\uC740 \uBCA0\uB97C\uB9B0

**\uC778\uBB3C**: Tristan Tzara \xB7 Hugo Ball \xB7 Raoul Hausmann \xB7 Hannah H\xF6ch \xB7 John Heartfield \xB7 Kurt Schwitters

**\uC6D0\uB9AC**
- \uC608\uC220\uC758 \uC815\uB2F9\uC131\uC740 \uC804\uD1B5\uC774\uB098 \uC219\uB828\uC774 \uC544\uB2C8\uB77C **\uC120\uD0DD\uACFC \uBC30\uCE58**\uC5D0\uC11C \uB098\uC628\uB2E4 \u2014 \uC7AC\uB8CC\uB97C \uB9CC\uB4E4\uC9C0 \uC54A\uACE0 \uACE0\uB974\uACE0 \uBCD1\uCE58\uD558\uB294 \uD589\uC704\uAC00 \uC800\uC791\uC774 \uB41C\uB2E4
- **\uC6B0\uC5F0\uACFC \uADDC\uCE59\uC758 \uC758\uB3C4\uC801 \uB3C4\uC785** \u2014 \uC791\uAC00\uC758 \uCDE8\uD5A5\uC744 \uBD80\uBD84\uC801\uC73C\uB85C \uC2DC\uC2A4\uD15C\uC5D0 \uC591\uB3C4\uD574 \uC608\uCE21 \uAC00\uB2A5\uD55C \uC870\uD615\uC744 \uD30C\uAD34\uD55C\uB2E4
- \uB9E4\uCCB4\uB294 \uC911\uB9BD\uC801 \uC804\uB2EC\uC790\uAC00 \uC544\uB2C8\uB2E4 \u2014 \uC778\uC1C4\uBB3C\xB7\uD65C\uC790\xB7\uC0AC\uC9C4\uC740 \uC774\uBBF8 \uC774\uB370\uC62C\uB85C\uAE30\uB97C \uC2E4\uC5B4 \uB098\uB974\uBBC0\uB85C, \uC808\uB2E8\xB7\uC7AC\uBC30\uCE58\uAC00 \uACE7 \uBE44\uD3C9\uC774\uB2E4
- \uC758\uBBF8\uB294 \uD1B5\uD569\uC774 \uC544\uB2C8\uB77C **\uCDA9\uB3CC\uC5D0\uC11C \uBC1C\uC0DD**\uD55C\uB2E4 (\uBABD\uD0C0\uC8FC \uC6D0\uB9AC)
- \uBC18(\u53CD)\uCD1D\uCCB4\uC131 \u2014 \uC774\uC74C\uC0C8\uC640 \uD30C\uC5F4\uC744 \uC9C0\uC6B0\uC9C0 \uC54A\uACE0 \uB4DC\uB7EC\uB0B8\uB2E4

**\uC2DC\uAC01** (\uCC38\uACE0\uC6A9) \uD06C\uAE30\xB7\uAD75\uAE30\xB7\uC11C\uCCB4\uAC00 \uB4A4\uC11E\uC778 \uB2E4\uC911 \uD65C\uC790 \uC870\uD310 / \uD65C\uD310 \uC778\uC1C4\uC18C \uAE30\uC131 \uC7AC\uACE0(\uC190 \uD45C\uC2DC\xB7\uAD18\uC120\xB7\uC22B\uC790)\uC758 \uC870\uD615 \uC0AC\uC6A9 / \uC798\uB9B0 \uAC00\uC7A5\uC790\uB9AC\uB97C \uC228\uAE30\uC9C0 \uC54A\uB294 \uD3EC\uD1A0\uBAAC\uD0C0\uC8FC / \uADF8\uB9AC\uB4DC \uC5C6\uB294 \uBE44\uB300\uCE6D \uC0B0\uD3EC / \uD751\uBC31 + \uC2A4\uD3FF \uCEEC\uB7EC 1\uC810

**\uB300\uD45C\uC791** \u300CCut with the Kitchen Knife\u2026\u300D(H\xF6ch, 1919\u201320) \xB7 \u300EDer Dada\u300F(Hausmann, 1919\u201320) \xB7 \u300EMerz\u300F(Schwitters, 1923\u201332)

**\uAC00\uC838\uC62C \uAC83**
- **\uD050\uB808\uC774\uC158\xB7\uC7AC\uBC30\uCE58\uB97C \uB514\uC790\uC778 \uD589\uC704\uB85C \uC778\uC815**\uD558\uAE30 \u2014 \uC0DD\uC131\uD615 \uC774\uBBF8\uC9C0\xB7\uC2A4\uD1A1\xB7\uAE30\uC131 UI \uD328\uD134\uC774 \uB118\uCE58\uB294 \uD658\uACBD\uC5D0\uC11C **\uBB34\uC5C7\uC744 \uACE0\uB974\uACE0 \uBB34\uC5C7\uACFC \uBD99\uC774\uB290\uB0D0\uAC00 \uC2E4\uC81C \uC800\uC791\uC758 \uC9C0\uC810**\uC774\uB2E4
- \uC758\uB3C4\uC801 \uC81C\uC57D\uACFC \uC6B0\uC5F0\uC744 \uC2DC\uC2A4\uD15C\uC5D0 \uB123\uAE30 \u2014 \uC81C\uB108\uB808\uC774\uD2F0\uBE0C \uBCC0\uC8FC\xB7\uB79C\uB364 \uC2DC\uB4DC\xB7\uADDC\uCE59 \uAE30\uBC18 \uB808\uC774\uC544\uC6C3\uC73C\uB85C \uB514\uC790\uC774\uB108\uC758 \uC2B5\uAD00\uC801 \uCDE8\uD5A5\uC744 \uAE68\uB294 \uC7A5\uCE58\uB97C \uD504\uB85C\uC138\uC2A4\uC5D0 \uBA85\uC2DC\uC801\uC73C\uB85C \uBC30\uCE58
- \uB9E4\uCCB4 \uBE44\uD3C9\uC801 \uD0DC\uB3C4 \u2014 \uB2E4\uD06C\uD328\uD134\xB7\uC54C\uACE0\uB9AC\uC998 \uD53C\uB4DC\xB7\uAD11\uACE0 \uD3EC\uB9F7 \uB4F1 '\uC911\uB9BD\uCC98\uB7FC \uBCF4\uC774\uB294' \uAD00\uC2B5\uC744 \uC7AC\uB8CC\uB85C \uBCF4\uACE0 \uC758\uC2EC\uD558\uB294 \uC2DC\uC120

**\uB450\uACE0 \uC62C \uAC83**
- \uBA85\uD655\uD55C \uBE44\uD310 \uB300\uC0C1 \uC5C6\uC774 \uD615\uC2DD\uB9CC \uBE4C\uB9AC\uAE30 \u2014 '\uC5B4\uC9C0\uB7EC\uC6B4 \uCF5C\uB77C\uC8FC \uC2A4\uD0C0\uC77C'\uC774\uB77C\uB294 \uC7A5\uC2DD\uC73C\uB85C \uC804\uB77D\uD558\uACE0, \uAE30\uB2A5\uC801 \uC81C\uD488 UI\uC5D0\uC11C\uB294 \uADF8\uB0E5 \uC0AC\uC6A9\uC131 \uC2E4\uD328\uAC00 \uB41C\uB2E4 (\u2192 L0 N5)
- \uC6B0\uC5F0\uC744 \uC6D0\uB9AC\uB85C \uB3C4\uC785\uD588\uB2E4\uBA74\uC11C **\uACB0\uACFC\uB9CC \uCDE8\uD5A5\uB300\uB85C \uACE0\uB974\uB294 \uAC83** \u2014 \uC2DC\uC2A4\uD15C\uC744 \uB9CC\uB4E0 \uAC83\uC774 \uC544\uB2C8\uB77C \uD749\uB0B4\uB9CC \uB0B8 \uAC83\uC774\uB2E4

**\uC694\uC57D** \uC608\uC220\uC740 \uBB34\uC5C7\uC744 \uB9CC\uB4DC\uB290\uB0D0\uAC00 \uC544\uB2C8\uB77C \uAE30\uC874 \uBB38\uD654\uC758 \uD30C\uD3B8\uC744 \uC5B4\uB5BB\uAC8C \uACE0\uB974\uACE0 \uCDA9\uB3CC\uC2DC\uD0A4\uB290\uB0D0\uC758 \uBB38\uC81C\uB2E4.`,summary:"\uC608\uC220\uC740 \uBB34\uC5C7\uC744 \uB9CC\uB4DC\uB290\uB0D0\uAC00 \uC544\uB2C8\uB77C \uAE30\uC874 \uBB38\uD654\uC758 \uD30C\uD3B8\uC744 \uC5B4\uB5BB\uAC8C \uACE0\uB974\uACE0 \uCDA9\uB3CC\uC2DC\uD0A4\uB290\uB0D0\uC758 \uBB38\uC81C\uB2E4.",principles:["\uC608\uC220\uC758 \uC815\uB2F9\uC131\uC740 \uC804\uD1B5\uC774\uB098 \uC219\uB828\uC774 \uC544\uB2C8\uB77C \uC120\uD0DD\uACFC \uBC30\uCE58\uC5D0\uC11C \uB098\uC628\uB2E4 \u2014 \uC7AC\uB8CC\uB97C \uB9CC\uB4E4\uC9C0 \uC54A\uACE0 \uACE0\uB974\uACE0 \uBCD1\uCE58\uD558\uB294 \uD589\uC704\uAC00 \uC800\uC791\uC774 \uB41C\uB2E4","\uC6B0\uC5F0\uACFC \uADDC\uCE59\uC758 \uC758\uB3C4\uC801 \uB3C4\uC785 \u2014 \uC791\uAC00\uC758 \uCDE8\uD5A5\uC744 \uBD80\uBD84\uC801\uC73C\uB85C \uC2DC\uC2A4\uD15C\uC5D0 \uC591\uB3C4\uD574 \uC608\uCE21 \uAC00\uB2A5\uD55C \uC870\uD615\uC744 \uD30C\uAD34\uD55C\uB2E4","\uB9E4\uCCB4\uB294 \uC911\uB9BD\uC801 \uC804\uB2EC\uC790\uAC00 \uC544\uB2C8\uB2E4 \u2014 \uC778\uC1C4\uBB3C\xB7\uD65C\uC790\xB7\uC0AC\uC9C4\uC740 \uC774\uBBF8 \uC774\uB370\uC62C\uB85C\uAE30\uB97C \uC2E4\uC5B4 \uB098\uB974\uBBC0\uB85C, \uC808\uB2E8\xB7\uC7AC\uBC30\uCE58\uAC00 \uACE7 \uBE44\uD3C9\uC774\uB2E4","\uC758\uBBF8\uB294 \uD1B5\uD569\uC774 \uC544\uB2C8\uB77C \uCDA9\uB3CC\uC5D0\uC11C \uBC1C\uC0DD\uD55C\uB2E4 (\uBABD\uD0C0\uC8FC \uC6D0\uB9AC)","\uBC18(\u53CD)\uCD1D\uCCB4\uC131 \u2014 \uC774\uC74C\uC0C8\uC640 \uD30C\uC5F4\uC744 \uC9C0\uC6B0\uC9C0 \uC54A\uACE0 \uB4DC\uB7EC\uB0B8\uB2E4"],take:["\uD050\uB808\uC774\uC158\xB7\uC7AC\uBC30\uCE58\uB97C \uB514\uC790\uC778 \uD589\uC704\uB85C \uC778\uC815\uD558\uAE30 \u2014 \uC0DD\uC131\uD615 \uC774\uBBF8\uC9C0\xB7\uC2A4\uD1A1\xB7\uAE30\uC131 UI \uD328\uD134\uC774 \uB118\uCE58\uB294 \uD658\uACBD\uC5D0\uC11C \uBB34\uC5C7\uC744 \uACE0\uB974\uACE0 \uBB34\uC5C7\uACFC \uBD99\uC774\uB290\uB0D0\uAC00 \uC2E4\uC81C \uC800\uC791\uC758 \uC9C0\uC810\uC774\uB2E4","\uC758\uB3C4\uC801 \uC81C\uC57D\uACFC \uC6B0\uC5F0\uC744 \uC2DC\uC2A4\uD15C\uC5D0 \uB123\uAE30 \u2014 \uC81C\uB108\uB808\uC774\uD2F0\uBE0C \uBCC0\uC8FC\xB7\uB79C\uB364 \uC2DC\uB4DC\xB7\uADDC\uCE59 \uAE30\uBC18 \uB808\uC774\uC544\uC6C3\uC73C\uB85C \uB514\uC790\uC774\uB108\uC758 \uC2B5\uAD00\uC801 \uCDE8\uD5A5\uC744 \uAE68\uB294 \uC7A5\uCE58\uB97C \uD504\uB85C\uC138\uC2A4\uC5D0 \uBA85\uC2DC\uC801\uC73C\uB85C \uBC30\uCE58","\uB9E4\uCCB4 \uBE44\uD3C9\uC801 \uD0DC\uB3C4 \u2014 \uB2E4\uD06C\uD328\uD134\xB7\uC54C\uACE0\uB9AC\uC998 \uD53C\uB4DC\xB7\uAD11\uACE0 \uD3EC\uB9F7 \uB4F1 '\uC911\uB9BD\uCC98\uB7FC \uBCF4\uC774\uB294' \uAD00\uC2B5\uC744 \uC7AC\uB8CC\uB85C \uBCF4\uACE0 \uC758\uC2EC\uD558\uB294 \uC2DC\uC120"],leave:["\uBA85\uD655\uD55C \uBE44\uD310 \uB300\uC0C1 \uC5C6\uC774 \uD615\uC2DD\uB9CC \uBE4C\uB9AC\uAE30 \u2014 '\uC5B4\uC9C0\uB7EC\uC6B4 \uCF5C\uB77C\uC8FC \uC2A4\uD0C0\uC77C'\uC774\uB77C\uB294 \uC7A5\uC2DD\uC73C\uB85C \uC804\uB77D\uD558\uACE0, \uAE30\uB2A5\uC801 \uC81C\uD488 UI\uC5D0\uC11C\uB294 \uADF8\uB0E5 \uC0AC\uC6A9\uC131 \uC2E4\uD328\uAC00 \uB41C\uB2E4","\uC6B0\uC5F0\uC744 \uC6D0\uB9AC\uB85C \uB3C4\uC785\uD588\uB2E4\uBA74\uC11C \uACB0\uACFC\uB9CC \uCDE8\uD5A5\uB300\uB85C \uACE0\uB974\uB294 \uAC83 \u2014 \uC2DC\uC2A4\uD15C\uC744 \uB9CC\uB4E0 \uAC83\uC774 \uC544\uB2C8\uB77C \uD749\uB0B4\uB9CC \uB0B8 \uAC83\uC774\uB2E4"]},{id:"ISM-SUPREM",family:"airplane",name:"\uC808\uB300\uC8FC\uC758",card:`## \`ISM-SUPREM\` \xB7 \uC808\uB300\uC8FC\uC758 (Suprematism)

**1915\u20131923** \xB7 \uB7EC\uC2DC\uC544 \uD398\uD2B8\uB85C\uADF8\uB77C\uB4DC \u2192 \uBE44\uD15D\uC2A4\uD06C\xB7UNOVIS

**\uC778\uBB3C**: Kazimir Malevich \xB7 El Lissitzky \xB7 Olga Rozanova \xB7 Lyubov Popova \xB7 Lazar Khidekel

**\uC6D0\uB9AC**
- \uD68C\uD654\uB294 \uC7AC\uD604\uC758 \uC758\uBB34\uC5D0\uC11C \uC644\uC804\uD788 \uD574\uBC29\uB41C\uB2E4 \u2014 \uB300\uC0C1 \uC5C6\uB294(\uBE44\uB300\uC0C1) \uC870\uD615\uB9CC\uC774 \uC21C\uC218\uD55C \uC870\uD615\uC801 \uAC10\uAC01\uC744 \uC804\uB2EC\uD55C\uB2E4
- **\uC21C\uC218\uD55C \uAC10\uAC01\uC758 \uC6B0\uC704** \u2014 \uD615\uD0DC\uC758 \uC815\uB2F9\uC131\uC740 \uC0C1\uC9D5\uC774\uB098 \uC11C\uC0AC\uAC00 \uC544\uB2C8\uB77C \uAC10\uAC01 \uADF8 \uC790\uCCB4\uC5D0 \uC788\uB2E4. \uD574\uC11D\uC774 \uD544\uC694\uD55C \uD615\uD0DC\uB294 \uC774\uBBF8 \uC624\uC5FC\uB41C \uD615\uD0DC\uB2E4
- **\uD658\uC6D0\uC740 \uBE48\uACE4\uC774 \uC544\uB2C8\uB77C \uD68D\uB4DD\uC774\uB2E4** \u2014 \uCD5C\uC18C \uB2E8\uC704\uB85C \uB0B4\uB824\uAC00\uB294 \uAC83\uC774 \uD45C\uD604 \uBC94\uC704\uC758 \uCD95\uC18C\uAC00 \uC544\uB2C8\uB77C \uC0C8 \uC2DC\uC791\uC810\uC758 \uD655\uBCF4\uB2E4
- \uACF5\uAC04\uC740 \uC6D0\uADFC\uBC95\uC774 \uC544\uB2C8\uB77C **\uAD00\uACC4**\uB85C \uB9CC\uB4E4\uC5B4\uC9C4\uB2E4 \u2014 \uBB34\uC911\uB825\xB7\uBB34\uBC29\uD5A5\uC758 \uD770 \uBC14\uB2E5 \uC704\uC5D0\uC11C \uD06C\uAE30\xB7\uAC01\uB3C4\xB7\uAC70\uB9AC\uB9CC\uC73C\uB85C \uAE4A\uC774\uAC00 \uBC1C\uC0DD\uD55C\uB2E4
- \uD615\uD0DC\uB294 \uC2E4\uC6A9\uC744 \uC55E\uC120\uB2E4 \u2014 \uC4F8\uBAA8\uB294 \uB098\uC911\uC5D0 \uB530\uB77C\uC624\uB294 \uD30C\uC0DD\uBB3C\uC774\uB2E4 (\uAD6C\uC131\uC8FC\uC758\uC640 \uAC08\uB9AC\uB294 \uC9C0\uC810)

**\uC2DC\uAC01** (\uCC38\uACE0\uC6A9) \uC21C\uC218 \uAE30\uD558 \uB3C4\uD615\uB9CC / \uD770 \uBC14\uB2E5\uC5D0 \uBD80\uC720, \uC9C0\uD3C9\uC120\xB7\uC911\uB825 \uC5C6\uC74C / \uBE44\uB300\uCE6D \uC0AC\uC120 \uBC30\uCE58 / \uD751\xB7\uBC31\xB7\uC801 \uC911\uC2EC\uC758 \uADF9\uB3C4\uB85C \uC81C\uD55C\uB41C \uD314\uB808\uD2B8 / \uC694\uC18C\uC758 \uC0C1\uB300\uC801 \uD06C\uAE30 \uCC28\uC774\uAC00 \uC720\uC77C\uD55C \uC704\uACC4 \uC7A5\uCE58

**\uB300\uD45C\uC791** \u300CBlack Square\u300D(Malevich, 1915 \u2014 \uBCF8\uC778\uC740 1913 \uC8FC\uC7A5) \xB7 \u300CWhite on White\u300D(1918) \xB7 \u300EArchitectons\u300F \uC5F0\uC791(1923\u201327)

**\uAC00\uC838\uC62C \uAC83**
- **\uD658\uC6D0\uC744 \uCD9C\uBC1C\uC810\uC774 \uC544\uB2C8\uB77C \uAC80\uC99D \uC808\uCC28\uB85C \uC4F0\uAE30** \u2014 \uC694\uC18C\uB97C \uBE7C\uBA74\uC11C \uBB34\uC5C7\uC774 \uB0A8\uC544\uB3C4 \uAE30\uB2A5\uD558\uB294\uC9C0 \uD655\uC778\uD55C\uB2E4 (\uBBF8\uB2C8\uBA40 \uC2A4\uD0C0\uC77C\uC774 \uC544\uB2C8\uB77C \uC808\uCC28\uB85C\uC11C\uC758 \uD658\uC6D0)
- \uBC14\uB2E5(\uCE94\uBC84\uC2A4)\uC744 \uC18C\uADF9\uC801 \uBC30\uACBD\uC774 \uC544\uB2C8\uB77C **\uBB34\uD55C \uACF5\uAC04**\uC73C\uB85C \uB2E4\uB8E8\uAE30 \u2014 \uC5EC\uBC31\uC744 '\uBE48 \uACF3'\uC774 \uC544\uB2C8\uB77C \uAD00\uACC4\uAC00 \uC131\uB9BD\uD558\uB294 \uB2A5\uB3D9\uC801 \uB9E4\uC9C8\uB85C \uC124\uACC4. \uB109\uB109\uD55C \uD654\uC774\uD2B8\uC2A4\uD398\uC774\uC2A4 \uC704 \uBD80\uC720\uD558\uB294 \uCE74\uB4DC \uB808\uC774\uC544\uC6C3\uC758 \uC774\uB860\uC801 \uADFC\uAC70
- **\uAC01\uB3C4\uC640 \uC0C1\uB300 \uD06C\uAE30\uB9CC\uC73C\uB85C \uC704\uACC4\uB97C \uB9CC\uB4DC\uB294 \uD6C8\uB828** \u2014 \uC0C9\xB7\uADF8\uB9BC\uC790\xB7\uD14C\uB450\uB9AC \uC5C6\uC774 \uD06C\uAE30\xB7\uAC04\uACA9\xB7\uAE30\uC6B8\uAE30\uB9CC\uC73C\uB85C \uC2DC\uC120 \uC21C\uC11C\uB97C \uC124\uACC4

**\uB450\uACE0 \uC62C \uAC83**
- **\uBE44\uAE30\uB2A5\uC131** \u2014 \uC808\uB300\uC8FC\uC758\uB294 \uBA85\uC2DC\uC801\uC73C\uB85C \uBE44\uAE30\uB2A5\uC801\uC774\uB2E4. UI\uC5D0 \uADF8\uB300\uB85C \uC774\uC2DD\uD558\uBA74 '\uC544\uB984\uB2F5\uC9C0\uB9CC \uBB34\uC5C7\uC744 \uB20C\uB7EC\uC57C \uD558\uB294\uC9C0 \uBAA8\uB974\uB294 \uD654\uBA74'\uC774 \uB41C\uB2E4. affordance\uB97C \uC0AD\uC81C\uD55C \uD658\uC6D0\uC740 \uC808\uB300\uC8FC\uC758\uAC00 \uC544\uB2C8\uB77C \uC0AC\uC6A9\uC131 \uACB0\uD568\uC774\uB2E4 (\u2192 L0 G3)
- \uAC80\uC815 \uC815\uC0AC\uAC01\uD615\xB7\uC0AC\uC120 \uB3C4\uD615\uC744 \uC7A5\uC2DD \uBAA8\uD2F0\uD504\uB85C \uC4F0\uAE30 \u2014 \uAECD\uB370\uAE30\uC758 \uC778\uC6A9\uC774\uB2E4. \uC9C4\uC9DC \uACC4\uC2B9\uC740 "\uBB34\uC5C7\uC744 \uC9C0\uC6B8 \uC218 \uC788\uB294\uAC00"\uB77C\uB294 \uC9C8\uBB38 \uCABD\uC5D0 \uC788\uB2E4

**\uC694\uC57D** \uD68C\uD654\uAC00 \uC138\uACC4\uB97C \uC7AC\uD604\uD560 \uC758\uBB34\uB97C \uBC84\uB9B4 \uB54C \uBE44\uB85C\uC18C \uC21C\uC218\uD55C \uC870\uD615\uC801 \uAC10\uAC01\uC744 \uC804\uB2EC\uD560 \uC218 \uC788\uB2E4.`,summary:"\uD68C\uD654\uAC00 \uC138\uACC4\uB97C \uC7AC\uD604\uD560 \uC758\uBB34\uB97C \uBC84\uB9B4 \uB54C \uBE44\uB85C\uC18C \uC21C\uC218\uD55C \uC870\uD615\uC801 \uAC10\uAC01\uC744 \uC804\uB2EC\uD560 \uC218 \uC788\uB2E4.",principles:["\uD68C\uD654\uB294 \uC7AC\uD604\uC758 \uC758\uBB34\uC5D0\uC11C \uC644\uC804\uD788 \uD574\uBC29\uB41C\uB2E4 \u2014 \uB300\uC0C1 \uC5C6\uB294(\uBE44\uB300\uC0C1) \uC870\uD615\uB9CC\uC774 \uC21C\uC218\uD55C \uC870\uD615\uC801 \uAC10\uAC01\uC744 \uC804\uB2EC\uD55C\uB2E4","\uC21C\uC218\uD55C \uAC10\uAC01\uC758 \uC6B0\uC704 \u2014 \uD615\uD0DC\uC758 \uC815\uB2F9\uC131\uC740 \uC0C1\uC9D5\uC774\uB098 \uC11C\uC0AC\uAC00 \uC544\uB2C8\uB77C \uAC10\uAC01 \uADF8 \uC790\uCCB4\uC5D0 \uC788\uB2E4. \uD574\uC11D\uC774 \uD544\uC694\uD55C \uD615\uD0DC\uB294 \uC774\uBBF8 \uC624\uC5FC\uB41C \uD615\uD0DC\uB2E4","\uD658\uC6D0\uC740 \uBE48\uACE4\uC774 \uC544\uB2C8\uB77C \uD68D\uB4DD\uC774\uB2E4 \u2014 \uCD5C\uC18C \uB2E8\uC704\uB85C \uB0B4\uB824\uAC00\uB294 \uAC83\uC774 \uD45C\uD604 \uBC94\uC704\uC758 \uCD95\uC18C\uAC00 \uC544\uB2C8\uB77C \uC0C8 \uC2DC\uC791\uC810\uC758 \uD655\uBCF4\uB2E4","\uACF5\uAC04\uC740 \uC6D0\uADFC\uBC95\uC774 \uC544\uB2C8\uB77C \uAD00\uACC4\uB85C \uB9CC\uB4E4\uC5B4\uC9C4\uB2E4 \u2014 \uBB34\uC911\uB825\xB7\uBB34\uBC29\uD5A5\uC758 \uD770 \uBC14\uB2E5 \uC704\uC5D0\uC11C \uD06C\uAE30\xB7\uAC01\uB3C4\xB7\uAC70\uB9AC\uB9CC\uC73C\uB85C \uAE4A\uC774\uAC00 \uBC1C\uC0DD\uD55C\uB2E4","\uD615\uD0DC\uB294 \uC2E4\uC6A9\uC744 \uC55E\uC120\uB2E4 \u2014 \uC4F8\uBAA8\uB294 \uB098\uC911\uC5D0 \uB530\uB77C\uC624\uB294 \uD30C\uC0DD\uBB3C\uC774\uB2E4 (\uAD6C\uC131\uC8FC\uC758\uC640 \uAC08\uB9AC\uB294 \uC9C0\uC810)"],take:["\uD658\uC6D0\uC744 \uCD9C\uBC1C\uC810\uC774 \uC544\uB2C8\uB77C \uAC80\uC99D \uC808\uCC28\uB85C \uC4F0\uAE30 \u2014 \uC694\uC18C\uB97C \uBE7C\uBA74\uC11C \uBB34\uC5C7\uC774 \uB0A8\uC544\uB3C4 \uAE30\uB2A5\uD558\uB294\uC9C0 \uD655\uC778\uD55C\uB2E4 (\uBBF8\uB2C8\uBA40 \uC2A4\uD0C0\uC77C\uC774 \uC544\uB2C8\uB77C \uC808\uCC28\uB85C\uC11C\uC758 \uD658\uC6D0)","\uBC14\uB2E5(\uCE94\uBC84\uC2A4)\uC744 \uC18C\uADF9\uC801 \uBC30\uACBD\uC774 \uC544\uB2C8\uB77C \uBB34\uD55C \uACF5\uAC04\uC73C\uB85C \uB2E4\uB8E8\uAE30 \u2014 \uC5EC\uBC31\uC744 '\uBE48 \uACF3'\uC774 \uC544\uB2C8\uB77C \uAD00\uACC4\uAC00 \uC131\uB9BD\uD558\uB294 \uB2A5\uB3D9\uC801 \uB9E4\uC9C8\uB85C \uC124\uACC4. \uB109\uB109\uD55C \uD654\uC774\uD2B8\uC2A4\uD398\uC774\uC2A4 \uC704 \uBD80\uC720\uD558\uB294 \uCE74\uB4DC \uB808\uC774\uC544\uC6C3\uC758 \uC774\uB860\uC801 \uADFC\uAC70","\uAC01\uB3C4\uC640 \uC0C1\uB300 \uD06C\uAE30\uB9CC\uC73C\uB85C \uC704\uACC4\uB97C \uB9CC\uB4DC\uB294 \uD6C8\uB828 \u2014 \uC0C9\xB7\uADF8\uB9BC\uC790\xB7\uD14C\uB450\uB9AC \uC5C6\uC774 \uD06C\uAE30\xB7\uAC04\uACA9\xB7\uAE30\uC6B8\uAE30\uB9CC\uC73C\uB85C \uC2DC\uC120 \uC21C\uC11C\uB97C \uC124\uACC4"],leave:["\uBE44\uAE30\uB2A5\uC131 \u2014 \uC808\uB300\uC8FC\uC758\uB294 \uBA85\uC2DC\uC801\uC73C\uB85C \uBE44\uAE30\uB2A5\uC801\uC774\uB2E4. UI\uC5D0 \uADF8\uB300\uB85C \uC774\uC2DD\uD558\uBA74 '\uC544\uB984\uB2F5\uC9C0\uB9CC \uBB34\uC5C7\uC744 \uB20C\uB7EC\uC57C \uD558\uB294\uC9C0 \uBAA8\uB974\uB294 \uD654\uBA74'\uC774 \uB41C\uB2E4. affordance\uB97C \uC0AD\uC81C\uD55C \uD658\uC6D0\uC740 \uC808\uB300\uC8FC\uC758\uAC00 \uC544\uB2C8\uB77C \uC0AC\uC6A9\uC131 \uACB0\uD568\uC774\uB2E4",'\uAC80\uC815 \uC815\uC0AC\uAC01\uD615\xB7\uC0AC\uC120 \uB3C4\uD615\uC744 \uC7A5\uC2DD \uBAA8\uD2F0\uD504\uB85C \uC4F0\uAE30 \u2014 \uAECD\uB370\uAE30\uC758 \uC778\uC6A9\uC774\uB2E4. \uC9C4\uC9DC \uACC4\uC2B9\uC740 "\uBB34\uC5C7\uC744 \uC9C0\uC6B8 \uC218 \uC788\uB294\uAC00"\uB77C\uB294 \uC9C8\uBB38 \uCABD\uC5D0 \uC788\uB2E4']},{id:"ISM-CONSTR",family:"airplane",name:"\uB7EC\uC2DC\uC544 \uAD6C\uC131\uC8FC\uC758",card:`## \`ISM-CONSTR\` \xB7 \uB7EC\uC2DC\uC544 \uAD6C\uC131\uC8FC\uC758 (Russian Constructivism)

**1915\u20131934** (\uC774\uB860 \uD655\uB9BD 1921, \uBAA8\uC2A4\uD06C\uBC14 \uC81C1 \uAD6C\uC131\uC8FC\uC758\uC790 \uC791\uC5C5\uADF8\uB8F9) \xB7 \uB7EC\uC2DC\uC544 \uBAA8\uC2A4\uD06C\uBC14(INKhUK\xB7VKhUTEMAS)

**\uC778\uBB3C**: Alexander Rodchenko \xB7 Varvara Stepanova \xB7 El Lissitzky \xB7 Vladimir Tatlin \xB7 Aleksei Gan \xB7 Gustav Klutsis

**\uC6D0\uB9AC**
- **\uC608\uC220\uAC00\uB294 \uC0DD\uC0B0\uC790\uB2E4** \u2014 \uC791\uD488\uC744 \uB9CC\uB4DC\uB294 \uC0AC\uB78C\uC774 \uC544\uB2C8\uB77C \uC0AC\uD68C\uC801 \uC720\uC6A9\uC131\uC744 \uAC00\uC9C4 \uC0AC\uBB3C\uC744 \uC124\uACC4\uD558\uB294 \uAE30\uC220\uC790\uB85C \uC790\uAE30\uB97C \uC7AC\uC815\uC758\uD55C\uB2E4
- **\uC7AC\uB8CC\uC758 \uC815\uC9C1\uC131(faktura)** \u2014 \uC7AC\uB8CC\uB294 \uB2E4\uB978 \uBB34\uC5C7\uCC98\uB7FC \uBCF4\uC774\uB3C4\uB85D \uC704\uC7A5\uB418\uC9C0 \uC54A\uACE0 \uBB3C\uC131\uACFC \uAC00\uACF5 \uD754\uC801\uC744 \uADF8\uB300\uB85C \uB4DC\uB7EC\uB0B8\uB2E4
- **\uAD6C\uCD95(konstruktsiia)\uC774 \uAD6C\uC131(composition)\uC744 \uB300\uCCB4\uD55C\uB2E4** \u2014 \uBCF4\uAE30 \uC88B\uAC8C \uBC30\uC5F4\uD558\uB294 \uAC83\uC774 \uC544\uB2C8\uB77C \uAD6C\uC870\uC801 \uD544\uC5F0\uC131\uC5D0 \uB530\uB77C \uC870\uB9BD\uD55C\uB2E4. **\uC81C\uAC70\uD574\uB3C4 \uBB34\uB108\uC9C0\uC9C0 \uC54A\uB294 \uC694\uC18C\uB294 \uC789\uC5EC\uB2E4**
- \uBAA9\uC801\uC758\uC2DD\uC131(tektonika) \u2014 \uBAA8\uB4E0 \uC870\uD615 \uACB0\uC815\uC740 \uBAA9\uC801\uC5D0\uC11C \uC5F0\uC5ED\uB418\uC5B4\uC57C \uD558\uBA70, \uBAA9\uC801 \uC5C6\uB294 \uD615\uD0DC\uB294 \uC815\uB2F9\uD654\uB418\uC9C0 \uC54A\uB294\uB2E4
- \uC608\uC220\uC758 \uC790\uC728\uC131 \uAC70\uBD80 \u2014 \uB300\uC911\uC774 \uC2E4\uC81C\uB85C \uB9CC\uB098\uB294 \uB9E4\uCCB4(\uD3EC\uC2A4\uD130\xB7\uCC45\xB7\uC9C1\uBB3C\xB7\uC601\uD654)\uB97C \uC77C\uCC28 \uBB34\uB300\uB85C \uC0BC\uB294\uB2E4

**\uC2DC\uAC01** (\uCC38\uACE0\uC6A9) \uC0AC\uC120 \uCD95 \uAD6C\uC131 / \uC801\xB7\uD751\xB7\uBC31 \uC0BC\uC0C9, \uBA74\uC801 \uBE44\uC728\uC774 \uC704\uACC4 \uC7A5\uCE58 / \uC0B0\uC138\uB9AC\uD504 \uB300\uBB38\uC790\xB7\uAD75\uC740 \uC6E8\uC774\uD2B8\xB7\uADF9\uB2E8\uC801 \uD06C\uAE30 \uB300\uBE44 / \uAD75\uC740 \uAD18\uC120\uACFC \uD654\uC0B4\uD45C\xB7\uC6D0 / \uD3EC\uD1A0\uBAAC\uD0C0\uC8FC + \uD65C\uC790 / \uADF9\uB2E8\uC801 \uC0AC\uC9C4 \uC575\uAE00(rakursy)

**\uB300\uD45C\uC791** \u300C\uBD89\uC740 \uC410\uAE30\uB85C \uBC31\uAD70\uC744 \uCCD0\uB77C\u300D(Lissitzky, 1919) \xB7 Lengiz \uCD9C\uD310\uC0AC \uD3EC\uC2A4\uD130(Rodchenko, 1924) \xB7 \u300EDlia golosa\u300F \uBD81\uB514\uC790\uC778(Lissitzky, 1923)

**\uAC00\uC838\uC62C \uAC83**
- **\uAD6C\uCD95 \uB17C\uB9AC\uB85C\uC11C\uC758 \uB514\uC790\uC778 \uC2DC\uC2A4\uD15C** \u2014 \uCEF4\uD3EC\uB10C\uD2B8\uAC00 \uCDE8\uD5A5\uC774 \uC544\uB2C8\uB77C \uAD6C\uC870\uC801 \uD544\uC5F0\uC131\uC5D0\uC11C \uC815\uC758\uB418\uACE0, **\uC81C\uAC70\uD574\uB3C4 \uBB34\uB108\uC9C0\uC9C0 \uC54A\uB294 \uC694\uC18C\uB294 \uC0AD\uC81C \uB300\uC0C1\uC73C\uB85C \uD310\uC815**\uD558\uB294 \uADDC\uC728. \uB514\uC790\uC778 \uD1A0\uD070\xB7\uC544\uD1A0\uBBF9 \uB514\uC790\uC778\uC758 \uC0AC\uC0C1\uC801 \uC120\uC870
- \uB9E4\uCCB4 \uBB3C\uC131\uC758 \uC815\uC9C1\uD55C \uB178\uCD9C \u2014 \uB514\uC9C0\uD138 \uC81C\uD488\uC744 \uC885\uC774\xB7\uBB3C\uCCB4\uB85C \uC704\uC7A5\uD558\uC9C0 \uC54A\uACE0 \uC2A4\uD06C\uB9B0\xB7\uC2A4\uD06C\uB864\xB7\uB85C\uB529\xB7\uC0C1\uD0DC \uBCC0\uD654\uB77C\uB294 \uB9E4\uCCB4 \uACE0\uC720 \uC18D\uC131\uC744 \uB4DC\uB7EC\uB0B8\uB2E4 (\uC2A4\uD050\uC5B4\uBAA8\uD53C\uC998\uC758 \uBC18\uB300\uD3B8)
- **\uBAA9\uC801\uC5D0\uC11C \uC5F0\uC5ED\uD558\uB294 \uC870\uD615 \uACB0\uC815** \u2014 \uBAA8\uB4E0 \uC2DC\uAC01\uC801 \uC120\uD0DD\uC5D0 "\uC774 \uD654\uBA74\uC774 \uB2EC\uC131\uD574\uC57C \uD560 \uD589\uB3D9\uC740 \uBB34\uC5C7\uC778\uAC00"\uB97C \uC694\uAD6C\uD558\uB294 \uAC80\uC99D \uC2B5\uAD00 (\u2192 L0 N2)

**\uB450\uACE0 \uC62C \uAC83**
- \uC0AC\uC120\xB7\uC801\uD751\uBC31\xB7\uAD75\uC740 \uC0B0\uC138\uB9AC\uD504 \uD45C\uBA74 \u2014 \uD601\uBA85\uC801 \uC120\uB3D9\uC774\uB77C\uB294 \uD2B9\uC815 \uBAA9\uC801\uC758 \uC0B0\uBB3C\uC774\uB2E4. \uBAA9\uC801 \uC5C6\uC774 \uAC00\uC838\uC624\uBA74 '\uC18C\uBE44\uC5D0\uD2B8 \uD3EC\uC2A4\uD130 \uB8E9'\uC774\uB77C\uB294 \uBCF5\uACE0 \uC7A5\uC2DD\uC774 \uB418\uACE0, \uAC00\uB3C5\uC131\xB7\uC811\uADFC\uC131\uC744 \uD76C\uC0DD\uD558\uBA74\uC11C \uAD6C\uC870\uC801 \uC815\uB2F9\uC131\uC740 \uC5BB\uC9C0 \uBABB\uD55C\uB2E4
- "\uAE30\uB2A5\uC5D0\uC11C \uB3C4\uCD9C\uB41C \uD615\uD0DC"\uB77C\uB294 \uC218\uC0AC\uB97C \uC4F0\uBA74\uC11C **\uAE30\uB2A5 \uC815\uC758\uB97C \uAC74\uB108\uB6F0\uAE30** \u2014 \uAD6C\uC131\uC8FC\uC758\uB294 \uBAA9\uC801\uC758 \uBA85\uC2DC\uB97C \uC694\uAD6C\uD588\uACE0, \uADF8 \uB2E8\uACC4\uB97C \uBE80 \uBBF8\uB2C8\uBA40\uB9AC\uC998\uC740 \uAD6C\uC131\uC8FC\uC758\uAC00 \uC544\uB2C8\uB2E4

**\uC694\uC57D** \uC608\uC220\uAC00\uB294 \uC790\uC871\uC801 \uC791\uD488\uC758 \uC81C\uC791\uC790\uAC00 \uC544\uB2C8\uB77C \uC0AC\uD68C\uC801 \uBAA9\uC801\uC744 \uAC00\uC9C4 \uC0AC\uBB3C\uC758 \uC124\uACC4\uC790\uC5EC\uC57C \uD55C\uB2E4.`,summary:"\uC608\uC220\uAC00\uB294 \uC790\uC871\uC801 \uC791\uD488\uC758 \uC81C\uC791\uC790\uAC00 \uC544\uB2C8\uB77C \uC0AC\uD68C\uC801 \uBAA9\uC801\uC744 \uAC00\uC9C4 \uC0AC\uBB3C\uC758 \uC124\uACC4\uC790\uC5EC\uC57C \uD55C\uB2E4.",principles:["\uC608\uC220\uAC00\uB294 \uC0DD\uC0B0\uC790\uB2E4 \u2014 \uC791\uD488\uC744 \uB9CC\uB4DC\uB294 \uC0AC\uB78C\uC774 \uC544\uB2C8\uB77C \uC0AC\uD68C\uC801 \uC720\uC6A9\uC131\uC744 \uAC00\uC9C4 \uC0AC\uBB3C\uC744 \uC124\uACC4\uD558\uB294 \uAE30\uC220\uC790\uB85C \uC790\uAE30\uB97C \uC7AC\uC815\uC758\uD55C\uB2E4","\uC7AC\uB8CC\uC758 \uC815\uC9C1\uC131(faktura) \u2014 \uC7AC\uB8CC\uB294 \uB2E4\uB978 \uBB34\uC5C7\uCC98\uB7FC \uBCF4\uC774\uB3C4\uB85D \uC704\uC7A5\uB418\uC9C0 \uC54A\uACE0 \uBB3C\uC131\uACFC \uAC00\uACF5 \uD754\uC801\uC744 \uADF8\uB300\uB85C \uB4DC\uB7EC\uB0B8\uB2E4","\uAD6C\uCD95(konstruktsiia)\uC774 \uAD6C\uC131(composition)\uC744 \uB300\uCCB4\uD55C\uB2E4 \u2014 \uBCF4\uAE30 \uC88B\uAC8C \uBC30\uC5F4\uD558\uB294 \uAC83\uC774 \uC544\uB2C8\uB77C \uAD6C\uC870\uC801 \uD544\uC5F0\uC131\uC5D0 \uB530\uB77C \uC870\uB9BD\uD55C\uB2E4. \uC81C\uAC70\uD574\uB3C4 \uBB34\uB108\uC9C0\uC9C0 \uC54A\uB294 \uC694\uC18C\uB294 \uC789\uC5EC\uB2E4","\uBAA9\uC801\uC758\uC2DD\uC131(tektonika) \u2014 \uBAA8\uB4E0 \uC870\uD615 \uACB0\uC815\uC740 \uBAA9\uC801\uC5D0\uC11C \uC5F0\uC5ED\uB418\uC5B4\uC57C \uD558\uBA70, \uBAA9\uC801 \uC5C6\uB294 \uD615\uD0DC\uB294 \uC815\uB2F9\uD654\uB418\uC9C0 \uC54A\uB294\uB2E4","\uC608\uC220\uC758 \uC790\uC728\uC131 \uAC70\uBD80 \u2014 \uB300\uC911\uC774 \uC2E4\uC81C\uB85C \uB9CC\uB098\uB294 \uB9E4\uCCB4(\uD3EC\uC2A4\uD130\xB7\uCC45\xB7\uC9C1\uBB3C\xB7\uC601\uD654)\uB97C \uC77C\uCC28 \uBB34\uB300\uB85C \uC0BC\uB294\uB2E4"],take:["\uAD6C\uCD95 \uB17C\uB9AC\uB85C\uC11C\uC758 \uB514\uC790\uC778 \uC2DC\uC2A4\uD15C \u2014 \uCEF4\uD3EC\uB10C\uD2B8\uAC00 \uCDE8\uD5A5\uC774 \uC544\uB2C8\uB77C \uAD6C\uC870\uC801 \uD544\uC5F0\uC131\uC5D0\uC11C \uC815\uC758\uB418\uACE0, \uC81C\uAC70\uD574\uB3C4 \uBB34\uB108\uC9C0\uC9C0 \uC54A\uB294 \uC694\uC18C\uB294 \uC0AD\uC81C \uB300\uC0C1\uC73C\uB85C \uD310\uC815\uD558\uB294 \uADDC\uC728. \uB514\uC790\uC778 \uD1A0\uD070\xB7\uC544\uD1A0\uBBF9 \uB514\uC790\uC778\uC758 \uC0AC\uC0C1\uC801 \uC120\uC870","\uB9E4\uCCB4 \uBB3C\uC131\uC758 \uC815\uC9C1\uD55C \uB178\uCD9C \u2014 \uB514\uC9C0\uD138 \uC81C\uD488\uC744 \uC885\uC774\xB7\uBB3C\uCCB4\uB85C \uC704\uC7A5\uD558\uC9C0 \uC54A\uACE0 \uC2A4\uD06C\uB9B0\xB7\uC2A4\uD06C\uB864\xB7\uB85C\uB529\xB7\uC0C1\uD0DC \uBCC0\uD654\uB77C\uB294 \uB9E4\uCCB4 \uACE0\uC720 \uC18D\uC131\uC744 \uB4DC\uB7EC\uB0B8\uB2E4 (\uC2A4\uD050\uC5B4\uBAA8\uD53C\uC998\uC758 \uBC18\uB300\uD3B8)",'\uBAA9\uC801\uC5D0\uC11C \uC5F0\uC5ED\uD558\uB294 \uC870\uD615 \uACB0\uC815 \u2014 \uBAA8\uB4E0 \uC2DC\uAC01\uC801 \uC120\uD0DD\uC5D0 "\uC774 \uD654\uBA74\uC774 \uB2EC\uC131\uD574\uC57C \uD560 \uD589\uB3D9\uC740 \uBB34\uC5C7\uC778\uAC00"\uB97C \uC694\uAD6C\uD558\uB294 \uAC80\uC99D \uC2B5\uAD00'],leave:["\uC0AC\uC120\xB7\uC801\uD751\uBC31\xB7\uAD75\uC740 \uC0B0\uC138\uB9AC\uD504 \uD45C\uBA74 \u2014 \uD601\uBA85\uC801 \uC120\uB3D9\uC774\uB77C\uB294 \uD2B9\uC815 \uBAA9\uC801\uC758 \uC0B0\uBB3C\uC774\uB2E4. \uBAA9\uC801 \uC5C6\uC774 \uAC00\uC838\uC624\uBA74 '\uC18C\uBE44\uC5D0\uD2B8 \uD3EC\uC2A4\uD130 \uB8E9'\uC774\uB77C\uB294 \uBCF5\uACE0 \uC7A5\uC2DD\uC774 \uB418\uACE0, \uAC00\uB3C5\uC131\xB7\uC811\uADFC\uC131\uC744 \uD76C\uC0DD\uD558\uBA74\uC11C \uAD6C\uC870\uC801 \uC815\uB2F9\uC131\uC740 \uC5BB\uC9C0 \uBABB\uD55C\uB2E4",'"\uAE30\uB2A5\uC5D0\uC11C \uB3C4\uCD9C\uB41C \uD615\uD0DC"\uB77C\uB294 \uC218\uC0AC\uB97C \uC4F0\uBA74\uC11C \uAE30\uB2A5 \uC815\uC758\uB97C \uAC74\uB108\uB6F0\uAE30 \u2014 \uAD6C\uC131\uC8FC\uC758\uB294 \uBAA9\uC801\uC758 \uBA85\uC2DC\uB97C \uC694\uAD6C\uD588\uACE0, \uADF8 \uB2E8\uACC4\uB97C \uBE80 \uBBF8\uB2C8\uBA40\uB9AC\uC998\uC740 \uAD6C\uC131\uC8FC\uC758\uAC00 \uC544\uB2C8\uB2E4']},{id:"ISM-STIJL",family:"airplane",name:"\uB370 \uC2A4\uD2F8",card:`## \`ISM-STIJL\` \xB7 \uB370 \uC2A4\uD2F8 (De Stijl / Neoplasticism)

**1917\u20131931** \xB7 \uB124\uB35C\uB780\uB4DC \uB77C\uC774\uB374 \u2192 \uC704\uD2B8\uB808\uD750\uD2B8\xB7\uB85C\uD14C\uB974\uB2F4

**\uC778\uBB3C**: Piet Mondrian \xB7 Theo van Doesburg \xB7 Gerrit Rietveld \xB7 J.J.P. Oud \xB7 Vilmos Husz\xE1r

**\uC6D0\uB9AC**
- \uBCF4\uD3B8\uC801 \uC870\uD615\uB9CC\uC774 \uC608\uC220\uC758 \uBAA9\uC801\uC774\uB2E4 \u2014 \uAC1C\uBCC4\uC801\xB7\uC6B0\uC5F0\uC801 \uC678\uAD00\uC744 \uC81C\uAC70\uD558\uACE0 \uBAA8\uB4E0 \uAC83\uC5D0 \uACF5\uD1B5\uB41C \uC9C8\uC11C\uC5D0 \uB3C4\uB2EC\uD55C\uB2E4
- **\uD658\uC6D0\uB41C \uC694\uC18C\uB9CC\uC73C\uB85C \uBB34\uD55C\uD55C \uAD00\uACC4\uB97C \uB9CC\uB4E0\uB2E4** \u2014 \uC5B4\uD718\uB97C \uCD5C\uC18C\uB85C \uC81C\uD55C\uD560 \uB54C \uBE44\uB85C\uC18C **\uAD00\uACC4(relation)\uAC00 \uC720\uC77C\uD55C \uC870\uD615 \uBCC0\uC218**\uAC00 \uB41C\uB2E4
- **\uB3D9\uC801 \uADE0\uD615(dynamic equilibrium)** \u2014 \uB300\uCE6D\uC740 \uC815\uC9C0\uC774\uACE0 \uC8FD\uC74C\uC774\uBBC0\uB85C \uAC70\uBD80\uD558\uACE0, \uBE44\uB300\uCE6D \uC0C1\uD0DC\uC5D0\uC11C \uC131\uB9BD\uD558\uB294 \uAE34\uC7A5\uB41C \uD3C9\uD615\uC744 \uCD94\uAD6C\uD55C\uB2E4
- \uD68C\uD654\xB7\uAC74\uCD95\xB7\uAC00\uAD6C\xB7\uC778\uC1C4\uB294 \uD558\uB098\uC758 \uC6D0\uB9AC\uB97C \uACF5\uC720\uD558\uB294 \uB3D9\uC77C \uBB38\uC81C\uB2E4 \u2014 \uB9E4\uCCB4 \uACBD\uACC4\uB97C \uC778\uC815\uD558\uC9C0 \uC54A\uB294\uB2E4
- \uBA74\uACFC \uC120\uC740 \uC0AC\uBB3C\uC758 \uC724\uACFD\uC774 \uC544\uB2C8\uB77C **\uACF5\uAC04\uC744 \uAD6C\uC131\uD558\uB294 \uB3C5\uB9BD \uC694\uC18C**\uB2E4

**\uC2DC\uAC01** (\uCC38\uACE0\uC6A9) \uC218\uD3C9\xB7\uC218\uC9C1 \uC9C1\uC120\uB9CC / 3\uC6D0\uC0C9 + \uBB34\uCC44\uC0C9 / \uAD75\uC740 \uD751\uC0C9 \uACA9\uC790, \uC0C9\uBA74\uC740 \uACA9\uC790\uC640 \uB300\uB4F1\uD55C \uC694\uC18C / **\uC5B4\uB5A4 \uB450 \uC0C9\uBA74\uB3C4 \uAC19\uC740 \uD06C\uAE30\uAC00 \uC544\uB2D8** / \uD310\uACFC \uBD09\uC774 \uAD00\uD1B5\xB7\uAD50\uCC28\uD558\uBA70 \uB05D\uC774 \uC798\uB824 \uBD80\uC720

**\uB300\uD45C\uC791** \u300CComposition with Red, Blue and Yellow\u300D(Mondrian, 1930) \xB7 Red Blue Chair(Rietveld, 1918\u201323) \xB7 Rietveld Schr\xF6der House(1924, \uC720\uB124\uC2A4\uCF54 \uC138\uACC4\uC720\uC0B0) \xB7 \uC7A1\uC9C0 \u300EDe Stijl\u300F(1917\u201332)

**\uAC00\uC838\uC62C \uAC83**
- **\uC81C\uD55C\uB41C \uC5B4\uD718 + \uAD00\uACC4\uC758 \uBB34\uD55C\uD55C \uBCC0\uC8FC** \u2014 \uC0C9\xB7\uC11C\uCCB4\xB7\uAC04\uACA9 \uC2A4\uCF00\uC77C\uC744 \uC18C\uC218\uC758 \uD1A0\uD070\uC73C\uB85C \uBABB \uBC15\uACE0, \uD45C\uD604\uB825\uC740 \uADF8 \uD1A0\uD070\uB4E4\uC758 **\uC870\uD569 \uAD00\uACC4**\uC5D0\uC11C \uD655\uBCF4\uD55C\uB2E4. \uD604\uB300 \uB514\uC790\uC778 \uD1A0\uD070 \uCCB4\uACC4\uC758 \uC9C1\uACC4 \uC870\uC0C1 (\u2192 1U \uCCB4\uACC4)
- **\uB3D9\uC801 \uADE0\uD615\uC73C\uB85C\uC11C\uC758 \uB808\uC774\uC544\uC6C3** \u2014 \uC911\uC559 \uC815\uB82C\xB7\uB300\uCE6D\uC774 \uC544\uB2C8\uB77C **\uBE44\uB300\uCE6D \uBA74\uC801 \uBC30\uBD84**\uC73C\uB85C \uC2DC\uC120 \uC21C\uC11C\uC640 \uAE34\uC7A5\uC744 \uC124\uACC4. \uADF8\uB9AC\uB4DC\uB97C \uADE0\uB4F1 \uBD84\uD560\uC774 \uC544\uB2C8\uB77C \uBD88\uADE0\uB4F1 \uBE44\uB840\uB85C \uC4F0\uB294 \uADFC\uAC70
- \uB9E4\uCCB4\uB97C \uB118\uB294 \uB2E8\uC77C \uC6D0\uB9AC \u2014 \uC6F9\xB7\uC571\xB7\uC778\uC1C4\xB7\uACF5\uAC04\xB7\uBAA8\uC158\uC774 \uAC01\uAE30 \uB2E4\uB978 \uAC00\uC774\uB4DC\uB97C \uAC16\uB294 \uB300\uC2E0 \uD558\uB098\uC758 \uBE44\uB840 \uC6D0\uB9AC\uC5D0\uC11C \uD30C\uC0DD\uB418\uAC8C \uC124\uACC4

**\uB450\uACE0 \uC62C \uAC83**
- \uC801\xB7\uD669\xB7\uCCAD + \uD751\uC120\uC740 \uB370 \uC2A4\uD2F8\uC758 **\uACB0\uB860\uC774\uC9C0 \uC6D0\uB9AC\uAC00 \uC544\uB2C8\uB2E4.** \uADF8 \uC0C9\uC744 \uC4F0\uB294 \uC21C\uAC04 '\uBAAC\uB4DC\uB9AC\uC548 \uD328\uD134'\uC774\uB77C\uB294 \uC989\uC2DC \uC778\uC2DD\uB418\uB294 \uC778\uC6A9\uC774 \uB418\uC5B4 \uBE0C\uB79C\uB4DC \uACE0\uC720\uC131\uC774 \uC544\uB2C8\uB77C \uBBF8\uC220\uC0AC \uB808\uD37C\uB7F0\uC2A4\uB9CC \uC804\uB2EC\uD55C\uB2E4
- **\uACA9\uC790\uB97C \uADE0\uB4F1 \uBD84\uD560\uB85C \uC774\uD574\uD558\uB294 \uC624\uB3C5** \u2014 \uD575\uC2EC\uC740 \uACA9\uC790\uAC00 \uC544\uB2C8\uB77C \uBD88\uADE0\uB4F1\uD55C \uBA74\uC801 \uBE44\uC728\uC5D0\uC11C \uC131\uB9BD\uD558\uB294 \uAE34\uC7A5\uC774\uB2E4. \uADE0\uB4F1 \uADF8\uB9AC\uB4DC\uB294 Mondrian\uC774 \uAC70\uBD80\uD55C \uC815\uC9C0 \uC0C1\uD0DC\uB2E4

**\uC694\uC57D** \uCD5C\uC18C \uC5B4\uD718\uB9CC \uB0A8\uAE38 \uB54C \uC608\uC220\uC774 \uBCF4\uD3B8\uC801 \uC9C8\uC11C\uC5D0 \uB3C4\uB2EC\uD558\uBA70, \uADF8 \uC9C8\uC11C\uB294 \uD68C\uD654\xB7\uAC00\uAD6C\xB7\uAC74\uCD95\uC744 \uD558\uB098\uC758 \uBB38\uC81C\uB85C \uD1B5\uD569\uD55C\uB2E4.`,summary:"\uCD5C\uC18C \uC5B4\uD718\uB9CC \uB0A8\uAE38 \uB54C \uC608\uC220\uC774 \uBCF4\uD3B8\uC801 \uC9C8\uC11C\uC5D0 \uB3C4\uB2EC\uD558\uBA70, \uADF8 \uC9C8\uC11C\uB294 \uD68C\uD654\xB7\uAC00\uAD6C\xB7\uAC74\uCD95\uC744 \uD558\uB098\uC758 \uBB38\uC81C\uB85C \uD1B5\uD569\uD55C\uB2E4.",principles:["\uBCF4\uD3B8\uC801 \uC870\uD615\uB9CC\uC774 \uC608\uC220\uC758 \uBAA9\uC801\uC774\uB2E4 \u2014 \uAC1C\uBCC4\uC801\xB7\uC6B0\uC5F0\uC801 \uC678\uAD00\uC744 \uC81C\uAC70\uD558\uACE0 \uBAA8\uB4E0 \uAC83\uC5D0 \uACF5\uD1B5\uB41C \uC9C8\uC11C\uC5D0 \uB3C4\uB2EC\uD55C\uB2E4","\uD658\uC6D0\uB41C \uC694\uC18C\uB9CC\uC73C\uB85C \uBB34\uD55C\uD55C \uAD00\uACC4\uB97C \uB9CC\uB4E0\uB2E4 \u2014 \uC5B4\uD718\uB97C \uCD5C\uC18C\uB85C \uC81C\uD55C\uD560 \uB54C \uBE44\uB85C\uC18C \uAD00\uACC4(relation)\uAC00 \uC720\uC77C\uD55C \uC870\uD615 \uBCC0\uC218\uAC00 \uB41C\uB2E4","\uB3D9\uC801 \uADE0\uD615(dynamic equilibrium) \u2014 \uB300\uCE6D\uC740 \uC815\uC9C0\uC774\uACE0 \uC8FD\uC74C\uC774\uBBC0\uB85C \uAC70\uBD80\uD558\uACE0, \uBE44\uB300\uCE6D \uC0C1\uD0DC\uC5D0\uC11C \uC131\uB9BD\uD558\uB294 \uAE34\uC7A5\uB41C \uD3C9\uD615\uC744 \uCD94\uAD6C\uD55C\uB2E4","\uD68C\uD654\xB7\uAC74\uCD95\xB7\uAC00\uAD6C\xB7\uC778\uC1C4\uB294 \uD558\uB098\uC758 \uC6D0\uB9AC\uB97C \uACF5\uC720\uD558\uB294 \uB3D9\uC77C \uBB38\uC81C\uB2E4 \u2014 \uB9E4\uCCB4 \uACBD\uACC4\uB97C \uC778\uC815\uD558\uC9C0 \uC54A\uB294\uB2E4","\uBA74\uACFC \uC120\uC740 \uC0AC\uBB3C\uC758 \uC724\uACFD\uC774 \uC544\uB2C8\uB77C \uACF5\uAC04\uC744 \uAD6C\uC131\uD558\uB294 \uB3C5\uB9BD \uC694\uC18C\uB2E4"],take:["\uC81C\uD55C\uB41C \uC5B4\uD718 + \uAD00\uACC4\uC758 \uBB34\uD55C\uD55C \uBCC0\uC8FC \u2014 \uC0C9\xB7\uC11C\uCCB4\xB7\uAC04\uACA9 \uC2A4\uCF00\uC77C\uC744 \uC18C\uC218\uC758 \uD1A0\uD070\uC73C\uB85C \uBABB \uBC15\uACE0, \uD45C\uD604\uB825\uC740 \uADF8 \uD1A0\uD070\uB4E4\uC758 \uC870\uD569 \uAD00\uACC4\uC5D0\uC11C \uD655\uBCF4\uD55C\uB2E4. \uD604\uB300 \uB514\uC790\uC778 \uD1A0\uD070 \uCCB4\uACC4\uC758 \uC9C1\uACC4 \uC870\uC0C1","\uB3D9\uC801 \uADE0\uD615\uC73C\uB85C\uC11C\uC758 \uB808\uC774\uC544\uC6C3 \u2014 \uC911\uC559 \uC815\uB82C\xB7\uB300\uCE6D\uC774 \uC544\uB2C8\uB77C \uBE44\uB300\uCE6D \uBA74\uC801 \uBC30\uBD84\uC73C\uB85C \uC2DC\uC120 \uC21C\uC11C\uC640 \uAE34\uC7A5\uC744 \uC124\uACC4. \uADF8\uB9AC\uB4DC\uB97C \uADE0\uB4F1 \uBD84\uD560\uC774 \uC544\uB2C8\uB77C \uBD88\uADE0\uB4F1 \uBE44\uB840\uB85C \uC4F0\uB294 \uADFC\uAC70","\uB9E4\uCCB4\uB97C \uB118\uB294 \uB2E8\uC77C \uC6D0\uB9AC \u2014 \uC6F9\xB7\uC571\xB7\uC778\uC1C4\xB7\uACF5\uAC04\xB7\uBAA8\uC158\uC774 \uAC01\uAE30 \uB2E4\uB978 \uAC00\uC774\uB4DC\uB97C \uAC16\uB294 \uB300\uC2E0 \uD558\uB098\uC758 \uBE44\uB840 \uC6D0\uB9AC\uC5D0\uC11C \uD30C\uC0DD\uB418\uAC8C \uC124\uACC4"],leave:["\uC801\xB7\uD669\xB7\uCCAD + \uD751\uC120\uC740 \uB370 \uC2A4\uD2F8\uC758 \uACB0\uB860\uC774\uC9C0 \uC6D0\uB9AC\uAC00 \uC544\uB2C8\uB2E4. \uADF8 \uC0C9\uC744 \uC4F0\uB294 \uC21C\uAC04 '\uBAAC\uB4DC\uB9AC\uC548 \uD328\uD134'\uC774\uB77C\uB294 \uC989\uC2DC \uC778\uC2DD\uB418\uB294 \uC778\uC6A9\uC774 \uB418\uC5B4 \uBE0C\uB79C\uB4DC \uACE0\uC720\uC131\uC774 \uC544\uB2C8\uB77C \uBBF8\uC220\uC0AC \uB808\uD37C\uB7F0\uC2A4\uB9CC \uC804\uB2EC\uD55C\uB2E4","\uACA9\uC790\uB97C \uADE0\uB4F1 \uBD84\uD560\uB85C \uC774\uD574\uD558\uB294 \uC624\uB3C5 \u2014 \uD575\uC2EC\uC740 \uACA9\uC790\uAC00 \uC544\uB2C8\uB77C \uBD88\uADE0\uB4F1\uD55C \uBA74\uC801 \uBE44\uC728\uC5D0\uC11C \uC131\uB9BD\uD558\uB294 \uAE34\uC7A5\uC774\uB2E4. \uADE0\uB4F1 \uADF8\uB9AC\uB4DC\uB294 Mondrian\uC774 \uAC70\uBD80\uD55C \uC815\uC9C0 \uC0C1\uD0DC\uB2E4"]},{id:"ISM-BAUHAUS",family:"airplane",name:"\uBC14\uC6B0\uD558\uC6B0\uC2A4",card:`## \`ISM-BAUHAUS\` \xB7 \uBC14\uC6B0\uD558\uC6B0\uC2A4 (Bauhaus)
