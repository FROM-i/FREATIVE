<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: ct:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'self' ct:" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>THE FROM FREATIVE</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div class="shell">
    <nav class="rail" aria-label="주 메뉴">
      <div class="rail-mark" aria-hidden="true">F</div>
      <button class="rail-btn" data-nav="intake" title="새 미션" aria-label="새 미션">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>새 미션</span>
      </button>
      <button class="rail-btn" data-nav="projects" title="프로젝트" aria-label="프로젝트">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg><span>프로젝트</span>
      </button>
      <button class="rail-btn" data-nav="library" title="라이브러리" aria-label="라이브러리">
        <svg viewBox="0 0 24 24"><path d="M5 4h3v16H5zM10 4h3v16h-3z"/><path d="M15.5 4.8l2.9-.8 4 15.4-2.9.8z"/></svg><span>라이브러리</span>
      </button>
      <button class="rail-btn" data-nav="settings" title="설정" aria-label="설정">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span>설정</span>
      </button>
      <div class="rail-foot" id="railFoot"></div>
    </nav>
    <div class="main">
      <header class="topbar">
        <div class="brand"><b>THE FROM</b><span class="brand-sep"></span><span class="brand-name"><b>F</b>REATIVE</span><span class="brand-hint">FROM + CREATIVE</span></div>
        <div class="topbar-right" id="topbarRight"></div>
      </header>
      <section class="view" id="view"></section>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
