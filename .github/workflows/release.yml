# THE FROM FREATIVE — 설치 파일 빌드·배포
#
# 릴리스 방법: package.json 의 version 을 올려 main 에 push 한다.
#   → 그 버전의 Release(v<version>)가 아직 없으면 Windows(.exe)·macOS(.dmg/.zip)를 빌드해 Release 를 만든다.
#   → 설치된 앱이 electron-updater 로 자동 업데이트한다.
# 태그 v* push, 수동 실행(workflow_dispatch)으로도 돌릴 수 있다.
# 스킬 원본(방법론)은 빌드 때 FROM-i/thefrom_design_Skill 에서 가져와 내장한다.
name: release
on:
  push:
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
      names: ${{ steps.v.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 릴리스가 없거나, 있어도 설치 파일(Windows · Mac 두 가지)이 하나라도 빠졌으면 빌드한다
          NAMES=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" -q '.assets[].name' 2>/dev/null || true)
          MISSING=0
          for f in "THEFROM-FREATIVE-$VERSION-Windows-Setup.exe" "THEFROM-FREATIVE-$VERSION-arm64.dmg" "THEFROM-FREATIVE-$VERSION-x64.dmg" latest.yml latest-mac.yml; do
            echo "$NAMES" | grep -qx "$f" || { echo "빠짐: $f"; MISSING=1; }
          done
          echo "build=$([ $MISSING = 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "names<<EOF" >> "$GITHUB_OUTPUT"; echo "$NAMES" >> "$GITHUB_OUTPUT"; echo "EOF" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Windows 러너가 줄바꿈을 CRLF로 바꾸지 않게 — 지식 파일 파싱이 LF를 기대한다
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FROM-i/thefrom_design_Skill
          path: .skill
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build & publish
        env:
          SKILL_DIR: .skill
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAMES: ${{ needs.check.outputs.names }}
          # 서명 시크릿 — 비어 있으면 넘기지 않는다 (빈 CSC_LINK는 빌드를 멈춘다)
          S_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          S_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          S_APPLE_ID: ${{ secrets.APPLE_ID }}
          S_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          S_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -o pipefail
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$S_CSC_LINK" ]; then
            export CSC_LINK="$S_CSC_LINK" CSC_KEY_PASSWORD="$S_CSC_KEY_PASSWORD"
            [ -n "$S_APPLE_ID" ] && export APPLE_ID="$S_APPLE_ID" APPLE_APP_SPECIFIC_PASSWORD="$S_APPLE_APP_SPECIFIC_PASSWORD" APPLE_TEAM_ID="$S_APPLE_TEAM_ID"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          V=$(node -p "require('./package.json').version")
          # 이 OS의 설치 파일이 이미 올라가 있으면 건너뛴다 (다른 OS만 빠졌을 때 다시 돌린 경우)
          if [ "$RUNNER_OS" = "Windows" ]; then NEED="THEFROM-FREATIVE-$V-Windows-Setup.exe latest.yml"; else NEED="THEFROM-FREATIVE-$V-arm64.dmg THEFROM-FREATIVE-$V-x64.dmg latest-mac.yml"; fi
          HAVE=0; for f in $NEED; do printf '%s\n' "$NAMES" | grep -qx "$f" || HAVE=1; done
          if [ $HAVE = 0 ]; then echo "이 OS 설치 파일이 이미 있다 — 건너뜀" | tee build.log; exit 0; fi
          # 지난 실패에서 반쯤 올라간 이 OS 파일은 지우고 다시 올린다 (같은 이름 업로드 충돌 방지)
          if [ "$RUNNER_OS" = "Windows" ]; then PAT='Windows-Setup|^latest\.yml$'; else PAT='-(arm64|x64)\.|^latest-mac\.yml$'; fi
          RID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$V" -q .id 2>/dev/null || true)
          if [ -n "$RID" ]; then
            gh api "repos/$GITHUB_REPOSITORY/releases/$RID/assets" -q '.[] | "\(.id) \(.name)"' | grep -E "$PAT" | while read -r AID ANAME; do echo "지움: $ANAME"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$AID"; done
          fi
          # macOS 러너의 hdiutil(디스크 이미지) 오류는 간헐적이다 — 3번까지 다시
          for i in 1 2 3; do
            npm run release 2>&1 | tee build.log && exit 0
            echo "빌드 실패 ($i/3) — 다시 시도"; sleep 15
          done
          exit 1
      - name: Report failure
        if: failure()
        shell: bash
        run: |
          # 실패 원인을 Actions 주석(annotation)으로 남긴다 — 로그를 열지 않아도 보이게
          grep -E "⨯|Error|error|failed|Cannot|cannot" build.log | tail -n 15 | while IFS= read -r line; do echo "::error::${line:0:900}"; done || true
          echo "::error::$(tail -n 5 build.log | tr '\n' ' ' | cut -c1-900)"

  # 릴리스 설명에 설치 파일 바로 받기 링크를 단다 — 파일이 많아 목록에서 접혀도 바로 찾게
  notes:
    needs: [check, build]
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.check.outputs.version }}
        run: |
          B="https://github.com/$GITHUB_REPOSITORY/releases/download/v$V"
          BODY=$(printf '## 설치 파일\n\n| OS | 받기 |\n|---|---|\n| **Windows** | [THEFROM-FREATIVE-%s-Windows-Setup.exe](%s/THEFROM-FREATIVE-%s-Windows-Setup.exe) |\n| **macOS (Apple Silicon · M1~)** | [THEFROM-FREATIVE-%s-arm64.dmg](%s/THEFROM-FREATIVE-%s-arm64.dmg) |\n| **macOS (Intel)** | [THEFROM-FREATIVE-%s-x64.dmg](%s/THEFROM-FREATIVE-%s-x64.dmg) |\n\n이미 설치된 앱은 실행하면 자동으로 업데이트됩니다. 나머지 파일(.yml · .blockmap · .zip)은 자동 업데이트용입니다.\n' "$V" "$B" "$V" "$V" "$B" "$V" "$V" "$B" "$V")
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$V" -q .id)
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -f body="$BODY" >/dev/null
